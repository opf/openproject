  ldap_auth_sources:
    attribute_texts:
      admin_map_html: 'Opcional: A chave de atributo no LDAP que <strong>estando presente</strong> marca o utilizador do OpenProject como administrador. Deixe em branco se estiver na dúvida.'
      base_dn: |
        Digite a Base DN da subárvore no LDAP que deseja que o OpenProject procure para utilizadores e grupos.
        O OpenProject irá filtrar os nomes de utilizadores fornecidos apenas nesta subárvore.
        Exemplo: ou=users,dc=example,dc=com
      filter_string: |
        Adicione um filtro RFC4515 opcional para aplicar aos resultados devolvidos para utilizadores filtrados no LDAP.
        Isto pode ser usado para restringir o conjunto de utilizadores que são encontrados pelo OpenProject para autenticação e sincronização de grupo.
      filter_string_concat: |
        O OpenProject filtrará sempre para o atributo do início de sessão fornecido pelo utilizador para identificar o registo. Se fornecer um filtro aqui,
        será concatenado com AND. Por padrão, um catch-all (objectClass=*) será usado como filtro.
      generic_map: A chave de atributo no LDAP que é mapeada para o atributo `%{attribute}` do OpenProject
      host: Nome ou endereço IP do anfitrião LDAP
      login_map: A chave de atributo no LDAP que é usada para identificar o início de sessão único. Normalmente, será `uid` ou `samAccountName`.
      name: Nome arbitrário da ligação LDAP
      onthefly_register: |
        Se marcar esta caixa, o OpenProject irá automaticamente criar novos utilizadores a partir das suas entradas LDAP quando se autenticarem pela primeira vez com o OpenProject.
        Deixe desmarcado para permitir que só as contas existentes no OpenProject se possam autenticar através do LDAP!
      system_user_dn_html: |
        Digite o DN do utilizador do sistema usado para acesso só de leitura.
        <br>
        Exemplo: uid=openproject,ou=system,dc=example,dc=com
      system_user_password: Digite a palavra-passe de vinculação do utilizador do sistema
    back_to_index: Clique aqui para voltar para a lista de ligação.
    connection_encryption: Encriptação da ligação
    encryption_details: Opções LDAPS / STARTTLS
    ldap_auth_failed: Não foi possível autenticar com o servidor LDAP.
    ldap_details: Detalhes do LDAP
    ldap_error: 'Erro LDAP: %{error_message}'
    sync_failed: 'Não foi possível sincronizar a partir do LDAP: %{message}.'
    system_account: Conta do sistema
    system_account_legend: |
      OpenProject requer acesso só de leitura através de uma conta de sistema para procurar utilizadores e grupos na sua árvore LDAP.
      Por favor, especifique as credenciais para este utilizador do sistema na seguinte secção.
    technical_warning: |
      Este formulário LDAP requer conhecimento técnico sobre a sua configuração LDAP/Active Directory.
      [Consulte a nossa documentação para instruções detalhadas](docs_url).
    tls_mode:
      plain: nenhum
      plain_description: Abre uma ligação não encriptada ao servidor LDAP. Não recomendado para produção.
      section_more_info_link_html: 'Esta seção diz respeito à segurança de ligação desta fonte de autenticação LDAP. Para mais informações, visite a documentação <a href="%{link}">the Net::LDAP</a>.

        '
      simple_tls: LDAPS
      simple_tls_description: Use o LDAPS. Requer uma porta separada no servidor LDAP. Este modo é frequentemente obsoleto, recomendamos o uso de STARTTLS sempre que possível.
      start_tls: STARTTLS
      start_tls_description: Envia um comando STARTTLS depois de se ligar à porta LDAP padrão. Recomendado para conexões encriptadas.
    tls_options:
      tls_certificate_description: Se o certificado do servidor LDAP não estiver nas fontes de confiança deste sistema, poderá adicioná-lo manualmente. Digite uma string de certificado PEM X509.
      verify_peer: Verificar certificado SSL
      verify_peer_description_html: 'Permite a verificação SSL estrita da cadeia de confiança do certificado. <br> <strong>Aviso:</strong> Desmarcar esta opção desativa a verificação SSL do certificado do servidor LDAP, o que expõe a sua ligação a ataques man-in-the-middle.

        '
    user_settings: Mapeamento de atributo
    user_settings_legend: 'Os seguintes campos estão relacionados a como os utilizadores são criados no OpenProject a partir de entradas LDAP, e que atributos LDAP são usados para definir os atributos de um utilizador OpenProject (mapeamento de atributos).

      '
