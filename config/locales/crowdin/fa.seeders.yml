      welcome:
        title: به OpenProject خوش آمدید!
        text: |
          OpenProject یکی از نرم‌افزارهای پیشرو متن‌باز برای مدیریت پروژه است. مدیریت پروژهٔ کلاسیک، Agile و Hybrid را پشتیبانی می‌کند و کنترل کامل داده‌ها را در اختیار شما می‌گذارد.

          قابلیت‌ها و کاربردهای اصلی:

          * [مدیریت سبد پروژه](https://www.openproject.org/collaboration-software-features/project-portfolio-management/)
          * [برنامه‌ریزی و زمان‌بندی پروژه](https://www.openproject.org/collaboration-software-features/project-planning-scheduling/)
          * [مدیریت وظایف و پیگیری Issue](https://www.openproject.org/collaboration-software-features/task-management/)
          * [بردهای Agile (Scrum و Kanban)](https://www.openproject.org/collaboration-software-features/agile-project-management/)
          * [مدیریت نیازمندی‌ها و برنامه‌ریزی انتشار](https://www.openproject.org/collaboration-software-features/product-development/)
          * [ثبت زمان و هزینه، بودجه‌ها](https://www.openproject.org/collaboration-software-features/time-tracking/)
          * [همکاری تیمی و مستندسازی](https://www.openproject.org/collaboration-software-features/team-collaboration/)

          به آیندهٔ مدیریت پروژه خوش آمدید.

          برای مدیران: می‌توانید این متن خوش‌آمدگویی را [اینجا]({{opSetting:base_url}}/admin/settings/general) تغییر دهید.
