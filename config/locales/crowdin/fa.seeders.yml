            * ورودی: بک‌لاگ محصول
            * خروجی: بک‌لاگ اسپرینت

            * به دو بازهٔ زمانی ۴ ساعته تقسیم می‌شود:

                * مالک محصول [بک‌لاگ محصول]({{opSetting:base_url}}/projects/your-scrum-project/backlogs) و اولویت‌ها را به تیم ارائه می‌کند و هدف اسپرینت را توضیح می‌دهد؛ تیم باید با آن موافقت کند. سپس با هم موضوعات بک‌لاگ محصول را که تیم در اسپرینت بعدی انجام خواهد داد اولویت‌بندی می‌کنند. تیم نسبت به تحویل توافق‌شده متعهد می‌شود.
                * تیم به‌صورت مستقل (بدون مالک محصول) جزئیات را برنامه‌ریزی می‌کند و وظایف حاصل از نیازمندی‌های توافق‌شده را خرد می‌کند تا [بک‌لاگ اسپرینت]({{opSetting:base_url}}/projects/your-scrum-project/backlogs) شکل بگیرد.


            ### جلسهٔ اسکرام روزانه

            _موضوعات جلسهٔ اسکرام روزانه را اینجا مستند کنید_

            * جلسهٔ کوتاه روزانه برای بررسی وضعیت تیم.
            * زمان‌بندی محدود (حداکثر ۱۵ دقیقه).
            * جلسهٔ ایستاده برای بررسی موضوعات زیر از برد وظایف.
                * تا اسکرام روزانهٔ بعدی چه کاری انجام می‌دهم؟
                * چه چیزی مانع کار من شده است (موانع)؟
            * اسکرام مستر جلسه را هدایت کرده و موانع اسپرینت را ثبت می‌کند.
            * مالک محصول می‌تواند برای در جریان ماندن در جلسه شرکت کند.

            ### جلسهٔ بازبینی اسپرینت

            _موضوعات جلسهٔ بازبینی اسپرینت را اینجا مستند کنید_

            * زمان‌بندی محدود (۴ ساعت).
            * حداکثر یک ساعت زمان آماده‌سازی برای هر نفر.
            * تیم آنچه در این اسپرینت به دست آمده است را به مالک محصول و سایر افراد ذی‌نفع نشان می‌دهد.
            * مهم: بدون نمونهٔ نمایشی ساختگی و بدون PowerPoint! فقط قابلیت‌های تکمیل‌شدهٔ محصول (Incrementها) باید نمایش داده شوند.
            * بازخورد مالک محصول، ذی‌نفعان و سایر افراد مطلوب است و در کارهای بعدی لحاظ می‌شود.
            * بر اساس قابلیت‌های نمایش‌داده‌شده، مالک محصول تصمیم می‌گیرد این Increment منتشر شود یا توسعهٔ بیشتری پیدا کند. این امکان دستیابی زودهنگام به بازگشت سرمایه (ROI) را فراهم می‌کند.


            ### بازنگری اسپرینت

            _موضوعات جلسهٔ بازنگری اسپرینت را اینجا مستند کنید_

            * زمان‌بندی محدود (۳ ساعت).
            * پس از بازبینی اسپرینت و با هدایت اسکرام مستر برگزار می‌شود.
            * تیم دربارهٔ اسپرینت گفت‌وگو می‌کند: چه چیزهایی خوب پیش رفت، چه مواردی برای بهره‌وری بیشتر در اسپرینت بعدی باید بهبود یابد و چه چیزی می‌تواند کار را لذت‌بخش‌تر کند.
