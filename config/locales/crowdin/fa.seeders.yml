            _در این ویکی می‌توانید به‌صورت مشارکتی صفحه‌ها و زیرصفحه‌ها را ایجاد و ویرایش کنید و یک ویکی پروژه بسازید._

            **می‌توانید:**

            * متن و تصویر درج کنید؛ حتی با کپی و جای‌گذاری از اسناد دیگر
            * با صفحه‌های والد، سلسله‌مراتب صفحه ایجاد کنید
            * صفحه‌های ویکی را به منوی پروژه اضافه کنید
            * با ماکروها مواردی مانند فهرست مطالب، فهرست بسته‌های کاری یا نمودار گانت را درج کنید
            * صفحه‌های ویکی را در فیلدهای متنی دیگر، مانند صفحهٔ نمای کلی پروژه، قرار دهید
            * پیوند به اسناد دیگر اضافه کنید
            * تاریخچهٔ تغییرات را مشاهده کنید
            * محتوا را به‌شکل Markdown مشاهده کنید

            اطلاعات بیشتر: [https://www.openproject.org/docs/user-guide/wiki/](https://www.openproject.org/docs/user-guide/wiki/)
