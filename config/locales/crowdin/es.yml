        instructions_html: 'Seleccione la acción a realizar para los archivos en los que se ha detectado un virus: <br/> <ul> <li><strong>%{quarantine_option}</strong>: Poner en cuarentena el archivo, impidiendo que los usuarios accedan a él. Los administradores pueden revisar y eliminar los archivos en cuarentena en la administración.</li> <li><strong>%{delete_option}</strong>: Eliminar el archivo inmediatamente.</li> </ul>

          '
        quarantine: Ponga el archivo en cuarentena
      clamav_ping_failed: Ha fallado la conexión con el daemon ClamAV. Vuelva a comprobar la configuración e inténtelo de nuevo.
      modes:
        clamav_host_html: Introduzca el nombre de host y el puerto al daemon clamd separados por dos puntos. Por ejemplo, %{example}
        clamav_socket_html: Introduzca el socket al daemon clamd, por ejemplo, %{example}
        description_html: 'Seleccione el modo en el que debe funcionar la integración del escáner antivirus. <br/> <ul> <li><strong>%{disabled_option}</strong>: Los archivos cargados no se analizan en busca de virus.</li> <li><strong>%{socket_option}</strong>: Ha configurado ClamAV en el mismo servidor que OpenProject y el daemon de análisis clamd se está ejecutando en segundo plano.</li> <li><strong>%{host_option}</strong>: Está transmitiendo archivos a un host externo de análisis de virus.</li> </ul>

          '
      remaining_quarantined_files_html: 'Se ha desactivado el análisis de virus. %{file_count} permanecen en cuarentena. Para revisar los archivos en cuarentena, visite este enlace: %{link}

        '
      remaining_rescanned_files: 'El escaneado de virus se ha activado correctamente. Hay %{file_count} que se cargaron anteriormente y aún deben ser escaneados. Este proceso se ha programado en segundo plano. Los archivos permanecerán accesibles durante el escaneado.

        '
      remaining_scan_complete_html: 'Se han analizado los archivos restantes. Hay %{file_count} en cuarentena. Está siendo redirigido a la página de cuarentena. Utilice esta página para eliminar o sobreescribir los archivos en cuarentena.

        '
      title: Escaneado de virus
    attachments:
      show_work_package_attachments: 'Al desactivar esta opción se ocultará la lista de archivos adjuntos en la pestaña de archivos de los paquetes de trabajo para los nuevos proyectos. Los archivos adjuntos en la descripción de un paquete de trabajo seguirán cargándose en el almacenamiento interno de archivos adjuntos.

        '
