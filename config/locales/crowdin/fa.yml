  ldap_auth_sources:
    attribute_texts:
      admin_map_html: 'اختیاری: کلید ویژگی در LDAP که <strong>در صورت وجود</strong> کاربر OpenProject را به‌عنوان مدیر مشخص می‌کند. در صورت تردید خالی بگذارید.'
      base_dn: |
        Base DN زیرشاخه‌ای از LDAP را وارد کنید که می‌خواهید OpenProject در آن کاربران و گروه‌ها را جستجو کند.
        OpenProject فقط در همین زیرشاخه نام‌های کاربری ارائه‌شده را فیلتر می‌کند.
        نمونه: ou=users,dc=example,dc=com
      filter_string: |
        یک فیلتر اختیاری RFC4515 اضافه کنید تا روی نتایج کاربران فیلترشده در LDAP اعمال شود.
        از این فیلتر می‌توان برای محدودکردن مجموعه کاربرانی استفاده کرد که OpenProject برای احراز هویت و همگام‌سازی گروه‌ها پیدا می‌کند.
      filter_string_concat: |
        OpenProject برای شناسایی رکورد، همیشه براساس ویژگی ورود ارائه‌شده توسط کاربر فیلتر می‌کند. اگر اینجا فیلتری ارائه کنید،
        با AND به آن افزوده می‌شود. به‌طور پیش‌فرض فیلتر جامع (objectClass=*) استفاده خواهد شد.
      generic_map: کلید ویژگی در LDAP که به ویژگی `%{attribute}` در OpenProject نگاشت می‌شود
      host: نام میزبان یا نشانی IP مربوط به LDAP
      login_map: کلید ویژگی در LDAP که برای شناسایی نام کاربری یکتا استفاده می‌شود. معمولاً `uid` یا `samAccountName` خواهد بود.
      name: نام دلخواه برای اتصال LDAP
      onthefly_register: |
        اگر این گزینه را فعال کنید، OpenProject هنگام اولین احراز هویت کاربران، آن‌ها را به‌طور خودکار از ورودی LDAP ایجاد می‌کند.
        اگر می‌خواهید فقط حساب‌های موجود در OpenProject بتوانند از طریق LDAP احراز هویت کنند، این گزینه را فعال نکنید!
      system_user_dn_html: |
        DN کاربر سیستمی مورد استفاده برای دسترسی فقط‌خواندنی را وارد کنید.
        <br>
        نمونه: uid=openproject,ou=system,dc=example,dc=com
      system_user_password: گذرواژه Bind کاربر سیستمی را وارد کنید
