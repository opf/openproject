      OpenProject richiede accesso in sola lettura ad un account di sistema per cercare utenti e gruppi nell'albero LDAP.
      Per favore, specificare le credenziali associate per l'account di sistema nella sezione seguente.
    technical_warning: |
      Questo modulo LDAP richiede conoscenze tecniche sulla configurazione del tuo LDAP o Active Directory.
      [Consulta la nostra documentazione per istruzioni dettagliate](docs_url).
    tls_mode:
      plain: nessuno
      plain_description: Apre una connessione non cifrata al server LDAP. Non consigliata per la produzione.
      section_more_info_link_html: 'Questa sezione riguarda la sicurezza della connessione di questa fonte di autenticazione LDAP. Per ulteriori informazioni, visita <a href="%{link}">the Net::LDAP documentation</a>.

        '
      simple_tls: LDAPS
      simple_tls_description: Usa LDAPS. Richiede una porta separata sul server LDAP. Questa modalità è spesso deprecata, raccomandiamo di usare STARTTLS quando possibile.
      start_tls: STARTTLS
      start_tls_description: Invia un comando STARTTLS dopo la connessione alla porta LDAP standard. Consigliato per connessioni cifrate.
    tls_options:
