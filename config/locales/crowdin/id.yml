  ldap_auth_sources:
    attribute_texts:
      admin_map_html: 'Opsional: Kunci atribut pada LDAP yang <strong>jika ada</strong> akan menandai pengguna OpenProject sebagai admin. Biarkan kososng jika ragu.'
      base_dn: |
        Masukan Base DN dari subtree LDAP yang anda inginkan agar OpenProject dapat melihat pengguna dan grup.
        OpenProject akan memfilter username pada subtree saja.
        Contoh: users,dc=example,dc=com
      filter_string: 'Tambahkan filter RFC4515 opsional untuk diterapkan pada hasil yang dikembalikan untuk pengguna yang difilter di LDAP.  Ini dapat digunakan untuk membatasi kumpulan pengguna yang ditemukan oleh OpenProject untuk autentikasi dan sinkronisasi grup.

        '
      filter_string_concat: 'OpenProject akan selalu memfilter atribut login yang disediakan oleh pengguna untuk mengidentifikasi record.  Jika Anda memberikan filter di sini, itu akan digabungkan dengan DAN.  Secara default, catch-all (objectClass=*) akan digunakan sebagai filter.

        '
      generic_map: Kunci atribut pada LDAP dipetakan ke atribut '%{attribute}' OpenProject
      host: Nama host LDAP atau alamat IP
      login_map: Kunci atribut pada LDAP digunakan untuk mengidentifikasi pengguna unik yang masuk. Biasanya akan menjadi 'uid' atau 'samAccountName'.
      name: Nama arbitary koneksi LDAP
      onthefly_register: |
        Jika anda ceklis box ini, OpenProject akan secara otomatis membuat pengguna baru dari seluruh LDAP saat pertamakali autentikasi dengan OpenProject.
        Biarkan tidak terceklis untuk mengizinkan akun yang ada di OpenProject untuk mengautentikasi melalui LDAP!
      system_user_dn_html: |
        Enter the DN of the system user used for read-only access.
        <br>
        Example: uid=openproject,ou=system,dc=example,dc=com
      system_user_password: Masukan password yang terikat dengan pengguna sistem
