            item_2:
              name: Sprint 1
              wiki:
                title: Sprint 1
                content: |
                  ### Sprintplaneringsmöte

                  _Dokumentera ämnen för sprintplaneringsmötet här_

                  * Tidsbegränsat (8 tim)
                  * Indata: Produktbacklogg
                  * Utdata: Sprintbacklogg

                  * Uppdelat i ytterligare två tidsblock om 4 tim:

                      * Produktägaren presenterar [Produktbackloggen]({{opSetting:base_url}}/projects/your-scrum-project/backlogs) och prioriteringarna för teamet och förklarar sprintmålet, som teamet måste enas om. Tillsammans prioriterar de ämnen från produktbackloggen som teamet ska arbeta med under nästa sprint. Teamet förbinder sig till den diskuterade leveransen.
                      * Teamet planerar självständigt (utan produktägaren) i detalj och bryter ned uppgifterna från de diskuterade kraven för att sammanställa en [Sprintbacklogg]({{opSetting:base_url}}/projects/your-scrum-project/backlogs).


                  ### Dagligt Scrum-möte

                  _Dokumentera ämnen för det dagliga Scrum-mötet här_

                  * Kort, dagligt statusmöte för teamet.
                  * Tidsbegränsat (högst 15 min).
                  * Ståmöte för att diskutera följande ämnen från [uppgiftstavlan](##sprint:scrum_project__version__sprint_1).
                      * Vad planerar jag att göra till nästa Daily Scrum?
                      * Vad har hindrat mitt arbete (hinder)?
                  * Scrum Mastern modererar och antecknar [sprinthinder](##sprint:scrum_project__version__sprint_1).
                  * Produktägaren kan delta för att hålla sig informerad.

                  ### Sprintgranskningsmöte

                  _Dokumentera ämnen för sprintgranskningsmötet här_

                  * Tidsbegränsat (4 tim).
                  * Högst en timmes förberedelsetid per person.
                  * Teamet visar produktägaren och andra intresserade vad som har uppnåtts under sprinten.
                  * Viktigt: inga attrapper och ingen PowerPoint! Endast färdig produktfunktionalitet (inkrement) ska demonstreras.
                  * Feedback från produktägaren, intressenter och andra är önskvärd och tas med i det fortsatta arbetet.
                  * Utifrån de demonstrerade funktionerna beslutar produktägaren om inkrementet ska tas i drift eller utvecklas vidare. Denna möjlighet ger tidig avkastning på investeringen.


                  ### Sprintretrospektiv

                  _Dokumentera ämnen för sprintretrospektivet här_

                  * Tidsbegränsat (3 tim).
                  * Efter sprintgranskningen och modererat av Scrum Mastern.
                  * Teamet diskuterar sprinten: vad gick bra, vad behöver förbättras för att vara mer produktiva under nästa sprint eller till och med ha roligare.
            item_3:
              name: Sprint 2
