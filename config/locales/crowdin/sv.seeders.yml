            _I denna Wiki kan ni tillsammans skapa och redigera sidor och undersidor för att bygga en projekt-Wiki._

            **Du kan:**

            * Infoga text och bilder, även genom att kopiera och klistra in från andra dokument
            * Skapa en sidhierarki med överordnade sidor
            * Lägga till Wiki-sidor i projektmenyn
            * Använda makron för att till exempel infoga innehållsförteckningar, arbetspaketslistor eller Gantt-diagram
