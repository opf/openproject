      welcome:
        title: Välkommen till OpenProject!
        text: |
          OpenProject är den ledande programvaran med öppen källkod för projektledning. Den stöder klassisk, agil och hybrid projektledning och ger dig full kontroll över dina data.

          Centrala funktioner och användningsområden:

          * [Projektportföljhantering](https://www.openproject.org/collaboration-software-features/project-portfolio-management/)
          * [Projektplanering och schemaläggning](https://www.openproject.org/collaboration-software-features/project-planning-scheduling/)
          * [Uppgiftshantering och ärendeuppföljning](https://www.openproject.org/collaboration-software-features/task-management/)
          * [Agila tavlor (Scrum och Kanban)](https://www.openproject.org/collaboration-software-features/agile-project-management/)
          * [Kravhantering och versionsplanering](https://www.openproject.org/collaboration-software-features/product-development/)
          * [Tids- och kostnadsuppföljning, budgetar](https://www.openproject.org/collaboration-software-features/time-tracking/)
          * [Teamsamarbete och dokumentation](https://www.openproject.org/collaboration-software-features/team-collaboration/)

          Välkommen till framtidens projektledning.

          För administratörer: Du kan ändra den här välkomsttexten [här]({{opSetting:base_url}}/admin/settings/general).
