                  text: |
                    Vi är glada att du är med! Vi föreslår att du provar några saker för att komma igång med OpenProject.

                    Upptäck de viktigaste funktionerna med vår [guidade rundtur]({{opSetting:base_url}}/projects/demo-project/work_packages/?start_onboarding_tour=true).

                    _Prova följande steg:_

                    1. *Bjud in nya medlemmar till projektet*: &rightarrow; Gå till [Medlemmar]({{opSetting:base_url}}/projects/demo-project/members) i projektnavigeringen.
                    2. *Visa arbetet i projektet*: &rightarrow; Gå till [Arbetspaket]({{opSetting:base_url}}/projects/demo-project/work_packages) i projektnavigeringen.
                    3. *Skapa ett nytt arbetspaket*: &rightarrow; Gå till [Arbetspaket &rightarrow; Skapa]({{opSetting:base_url}}/projects/demo-project/work_packages/new).
                    4. *Skapa och uppdatera en projektplan*: &rightarrow; Gå till [Projektplan]({{opSetting:base_url}}/projects/demo-project/work_packages?query_id=##query.id:demo_project__query__project_plan) i projektnavigeringen.
                    5. *Aktivera fler moduler*: &rightarrow; Gå till [Projektinställningar &rightarrow; Moduler]({{opSetting:base_url}}/projects/demo-project/settings/modules).
                    6. *Slutför dina uppgifter i projektet*: &rightarrow; Gå till [Arbetspaket &rightarrow; Uppgifter]({{opSetting:base_url}}/projects/demo-project/work_packages/details/##wp.id:set_date_and_location_of_conference/overview?query_id=##query.id:demo_project__query__tasks).

                    Här hittar du våra [användarguider](https://www.openproject.org/docs/user-guide/).
                    Kontakta oss om du har frågor eller behöver support: [support[at]openproject.com](mailto:support@openproject.com).
