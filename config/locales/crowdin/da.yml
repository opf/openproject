  ldap_auth_sources:
    attribute_texts:
      admin_map_html: 'Valgfri: Attribut nøglen i LDAP, som <strong>, hvis nuværende</strong> markerer OpenProject brugeren en admin. Efterlad blank når du er i tvivl.'
      base_dn: |
        Indtast Base DN for undertræet i LDAP, du vil have OpenProject til at søge efter brugere og grupper.
        OpenProject vil kun filtrere for angivne brugernavne i dette undertræ.
        Eksempel: ou=users,dc=example,dc=com
      filter_string: |
        Tilføj et valgfrit RFC4515-filter, der anvendes på de resultater, der returneres for brugere filtreret i LDAP.
        Det kan bruges til at begrænse, hvilke brugere OpenProject finder til godkendelse og gruppesynkronisering.
      filter_string_concat: |
        OpenProject filtrerer altid efter den loginattribut, som brugeren har angivet, for at finde posten. Hvis du angiver et filter her,
        kombineres det med et AND. Som standard bruges et filter, der fanger alt (objectClass=*).
      generic_map: Attributten i LDAP, der er knyttet til attributten OpenProject `%{attribute}`
      host: LDAP værtsnavn eller IP-adresse
      login_map: Attributnøglen i LDAP, der bruges til at identificere det unikke bruger-login. Normalt vil dette være 'uid' eller 'samAccountName'.
      name: Vilkårlig navn på LDAP- forbindelsen
      onthefly_register: |
        Hvis du markerer dette felt, vil OpenProject automatisk oprette nye brugere fra deres LDAP-poster, når de først autentificerer med OpenProject.
        Undlad at markere dette for kun at tillade eksisterende konti i OpenProject at godkende via LDAP!
      system_user_dn_html: |
        Angiv DN for den systembruger, der bruges til skrivebeskyttet adgang.
        <br>
        Eksempel: uid=openproject,ou=system,dc=example,dc=com
      system_user_password: Indtast bind kodeordet for systembrugeren
    back_to_index: Klik her for at gå tilbage til listen over forbindelser.
