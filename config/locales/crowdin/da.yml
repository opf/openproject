      OpenProject kræver skrivebeskyttet adgang gennem en systemkonto for at slå brugere og grupper op i dit LDAP-træ.
      Angiv venligst de bind legitimationsoplysninger for denne systembruger i følgende afsnit.
    technical_warning: |
      Formularen til LDAP kræver teknisk kendskab til din opsætning af LDAP/Active Directory.
      [Se vores dokumentation for en detaljeret vejledning](docs_url).
    tls_mode:
      plain: ingen
      plain_description: Åbner en ukrypteret forbindelse til LDAP-serveren. Anbefales ikke i produktion.
      section_more_info_link_html: 'Dette afsnit vedrører forbindelsessikkerheden for denne LDAP-godkendelseskilde. For mere information kan du besøge <a href="%{link}">Net::LDAP dokumentationen</a>.

        '
      simple_tls: LDAPS
      simple_tls_description: Brug LDAPS. Kræver en separat port på LDAP-serveren. Tilstanden er ofte forældet; vi anbefaler at bruge STARTTLS, når det er muligt.
      start_tls: STARTTLS
      start_tls_description: Sender en STARTTLS-kommando efter forbindelse til standardporten for LDAP. Anbefales til krypterede forbindelser.
    tls_options:
      tls_certificate_description: Hvis LDAP-serverens certifikat ikke er blandt systemets betroede kilder, kan du tilføje det manuelt her. Angiv et PEM X509-certifikat som tekst.
      verify_peer: Kontrollér SSL-certifikat
      verify_peer_description_html: 'Aktiverer streng SSL-kontrol af certifikatkæden. <br> <strong>Advarsel:</strong> Hvis feltet ikke er markeret, deaktiveres SSL-kontrollen af LDAP-serverens certifikat. Det gør forbindelsen sårbar over for man-in-the-middle-angreb.

        '
    user_settings: Attribut kortlægning
