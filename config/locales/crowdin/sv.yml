  ldap_auth_sources:
    attribute_texts:
      admin_map_html: 'Valfritt: Attributnyckeln i LDAP som <strong>om den finns</strong> markerar OpenProject-användaren en administratör. Lämna tomt när du är osäker.'
      base_dn: |
        Ange bas-DN för underträdet i LDAP som du vill att OpenProject ska leta efter användare och grupper.
        OpenProject filtrerar endast angivna användarnamn i detta underträd.
        Exempel: ou=users,dc=exempel,dc=com
      filter_string: |
        Lägg till ett valfritt RFC4515-filter som ska tillämpas på resultaten för användare som filtreras i LDAP.
        Detta kan användas för att begränsa vilka användare OpenProject hittar för autentisering och gruppsynkronisering.
      filter_string_concat: |
        OpenProject filtrerar alltid på det inloggningsattribut som användaren anger för att identifiera posten. Om du anger ett filter här
        kopplas det samman med OCH. Som standard används ett filter som matchar allt (objectClass=*).
      generic_map: Attributnyckeln i LDAP som är mappad till attributet OpenProject `%{attribute}`
      host: LDAP-värdnamn eller IP-adress
      login_map: Attributnyckeln i LDAP som används för att identifiera den unika användarinloggningen. Vanligtvis kommer detta att vara `uid` eller `samAccountName`.
      name: Ett godtyckligt namn på LDAP-anslutningen
      onthefly_register: |
        Om du kryssar i den här rutan kommer OpenProject automatiskt att skapa nya användare från sina LDAP-poster
        när de först autentiserar med OpenProject.
        Lämna detta avmarkerat för att endast tillåta befintliga konton i OpenProject att autentisera via LDAP!
      system_user_dn_html: |
        Ange DN för systemanvändaren som används för skrivskyddad åtkomst.
        <br>
        Exempel: uid=openproject,ou=system,dc=example,dc=com
      system_user_password: Ange bindlösenord för systemanvändaren
    back_to_index: Klicka här för att gå tillbaka till listan över anslutningar.
    connection_encryption: Kryptering av anslutning
    encryption_details: LDAPS / STARTTLS alternativ
    ldap_auth_failed: Kunde inte autentisera på LDAP-servern.
    ldap_details: LDAP-detaljer
    ldap_error: 'LDAP-fel: %{error_message}'
    sync_failed: 'Synkronisering från LDAP misslyckades: %{message}.'
    system_account: Systemkonto
    system_account_legend: |
      OpenProject kräver skrivskyddad åtkomst via ett systemkonto för att söka upp användare och grupper i ditt LDAP-träd.
      Vänligen ange bindningsuppgifter för den systemanvändaren i följande avsnitt.
    technical_warning: |
      Det här LDAP-formuläret kräver teknisk kunskap om din LDAP-/Active Directory-konfiguration.
      [Besök vår dokumentation för detaljerade instruktioner](docs_url).
    tls_mode:
      plain: inga
      plain_description: Öppnar en okrypterad anslutning till LDAP-servern. Rekommenderas inte för produktion.
      section_more_info_link_html: 'Det här avsnittet gäller anslutningssäkerheten för denna LDAP-autentiseringskälla. För mer information, besök <a href="%{link}">Net:LDAP-dokumentation</a>.

        '
      simple_tls: LDAPS
      simple_tls_description: Använd LDAPS. Kräver en separat port på LDAP-servern. Detta läge är ofta föråldrat, vi rekommenderar att du använder STARTTLS när det är möjligt.
      start_tls: STARTTLS
      start_tls_description: Skickar ett STARTTLS-kommando efter anslutning till standard LDAP-port. Rekommenderas för krypterade anslutningar.
    tls_options:
      tls_certificate_description: Om LDAP-servercertifikatet inte finns i de betrodda källorna till detta system, kan du lägga till det manuellt här. Ange en PEM X509-certifierad sträng.
      verify_peer: Verifiera SSL-certifikat
      verify_peer_description_html: 'Aktiverar strikt SSL-verifiering av den betrodda certifikatkedjan. <br> <strong>Varning:</strong> Om du avmarkerar detta alternativ inaktiveras SSL-verifiering av LDAP-serverns certifikat. Det utsätter anslutningen för man-in-the-middle-attacker.

        '
    user_settings: Attributmappning
    user_settings_legend: |
      Följande fält är relaterade till hur användare skapas i OpenProject från LDAP-poster och
      vilka LDAP-attribut som används för att definiera attributen för en OpenProject-användare (attributmappning).
