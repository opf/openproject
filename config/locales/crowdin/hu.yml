    sync_failed: 'Sikertelen szinkronizálás az LDAP-ból: %{message}.'
    system_account: Rendszer fiók
    system_account_legend: |
      Az OpenProject csak olvasható hozzáférést igényel egy rendszerfiókon keresztül az LDAP-fában lévő felhasználók és csoportok kereséséhez.
      A következő szakaszban adja meg a rendszerfelhasználó bind hitelesítő adatait.
    technical_warning: |
      This LDAP form requires technical knowledge of your LDAP / Active Directory setup.
      [Please visit our documentation for detailed instructions](docs_url).
    tls_mode:
      plain: Egyik sem
      plain_description: Titkosítatlan kapcsolatot nyit az LDAP-kiszolgálóval. Éles környezetben nem ajánlott.
      section_more_info_link_html: 'Ez a szakasz az LDAP hitelesítési forrás kapcsolatbiztonságáról szól. További információért keresse fel a <a href="%{link}"> Net :: LDAP dokumentációt </a>

        '
      simple_tls: LDAPS
      simple_tls_description: Használjon LDAPS-t. Külön portot igényel az LDAP-kiszolgálón. Ez a mód gyakran elavult, javasoljuk a STARTTLS használatát, amikor csak lehetséges.
      start_tls: STARTTLS
      start_tls_description: STARTTLS parancs küldése a szabványos LDAP-porthoz való csatlakozás után. Titkosított kapcsolatokhoz ajánlott.
    tls_options:
      tls_certificate_description: Ha az LDAP-kiszolgáló tanúsítványa nem szerepel a rendszer megbízható forrásai között, itt manuálisan hozzáadhatja. Írja be a PEM X509 tanúsítvány karakterláncát.
      verify_peer: SSL tanúsítvány ellenőrzése
      verify_peer_description_html: 'Enables strict SSL verification of the certificate trusted chain. <br> <strong>Warning:</strong> Unchecking this option disables SSL verification of the LDAP server certificate. This exposes your connection to Man in the Middle attacks.

