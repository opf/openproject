          add_existing: بسته‌های کاری موجود را جستجو کرده و به برنامه‌ریز تیم بکشید تا فوراً به یکی از اعضای تیم تخصیص داده شوند و تاریخ شروع و پایان مشخص شود.
          calendar: تابلوی برنامه‌ریزی هفتگی یا دوهفته‌ای همه بسته‌های کاری تخصیص‌یافته به اعضای تیم را نمایش می‌دهد.
          card: بسته‌های کاری را افقی بکشید تا در زمان عقب یا جلو بروند، لبه‌ها را برای تغییر تاریخ شروع و پایان بکشید و حتی عمودی به سطر دیگری منتقل کنید تا به عضو دیگری تخصیص یابند.
          overview: برنامه‌ریز تیم امکان می‌دهد وظایف را به‌صورت بصری به اعضای تیم تخصیص دهید و ببینید چه کسی روی چه چیزی کار می‌کند.
        welcome: یک تور معرفی سه‌دقیقه‌ای را آغاز کنید تا با <b>مهم‌ترین قابلیت‌ها</b> آشنا شوید. <br> توصیه می‌کنیم مراحل را تا پایان انجام دهید. هر زمان می‌توانید تور را دوباره شروع کنید.
        wiki: در <b>Wiki</b> می‌توانید همراه تیم دانش را مستند و به اشتراک بگذارید.
        wp:
          back_button: برای خروج و بازگشت به فهرست بسته‌های کاری از پیکان بازگشت در گوشه بالا سمت چپ استفاده کنید.
          create_button: دکمه <b>+ ایجاد</b> یک بسته کاری جدید به پروژه شما اضافه می‌کند.
          full_view: نمای <b>جزئیات بسته کاری</b> همه اطلاعات مرتبط با یک بسته کاری، مانند توضیحات، وضعیت، اولویت، فعالیت‌ها، وابستگی‌ها و دیدگاه‌ها را ارائه می‌دهد.
          gantt_menu: با ماژول نمودار گانت، برنامه‌ها و خط‌های زمانی پروژه را به‌آسانی ایجاد کنید.
          list: این نمای کلی <b>کار</b> فهرستی از همه کارهای پروژه، مانند وظایف، نقاط عطف، مراحل و موارد دیگر ارائه می‌دهد. <br> بسته‌های کاری را می‌توان مستقیماً از این نما ایجاد و ویرایش کرد. برای مشاهده جزئیات یک بسته کاری، کافی است روی سطر آن دوبار کلیک کنید.
          timeline: اینجا می‌توانید <b>برنامه پروژه را ویرایش کنید</b>، بسته‌های کاری جدید مانند وظایف، نقاط عطف، مراحل و موارد دیگر بسازید و <b>وابستگی‌ها را اضافه کنید</b>. همه اعضای تیم هر زمان می‌توانند جدیدترین برنامه را ببینند و به‌روزرسانی کنند.
          toggler: حالا بخش <b>بسته کاری</b> را ببینیم که نمای دقیق‌تری از کار شما ارائه می‌دهد.
