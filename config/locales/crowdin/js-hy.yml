          add_existing: Որոնեք առկա աշխատանքային փաթեթներ և քարշ տարեք դրանք թիմային պլանավորիչ՝ ակնթարթորեն թիմի անդամին նշանակելու և սկզբի ու ավարտի ամսաթվերը սահմանելու համար։
          calendar: Շաբաթական կամ երկշաբաթյա պլանավորման տախտակը ցուցադրում է Ձեր թիմի անդամներին նշանակված բոլոր աշխատանքային փաթեթները։
          card: Քարշ տարեք աշխատանքային փաթեթները հորիզոնական՝ դրանք ժամանակի մեջ առաջ կամ հետ տեղափոխելու համար, քարշ տարեք եզրերը՝ սկզբի և ավարտի ամսաթվերը փոխելու համար, և նույնիսկ քարշ տարեք դրանք ուղղահայաց՝ այլ տող, մեկ այլ անդամի նշանակելու համար։
          overview: Թիմային պլանավորիչը թույլ է տալիս տեսողականորեն նշանակել առաջադրանքներ թիմի անդամներին և ընդհանուր պատկերացում կազմել, թե ով ինչի վրա է աշխատում։
        welcome: Անցեք երեքրոպեանոց ներածական շրջայցը՝ ծանոթանալու <b>ամենակարևոր հատկություններին</b>։ <br> Խորհուրդ ենք տալիս քայլերն ավարտին հասցնել։ Դուք կարող եք ցանկացած պահի վերսկսել շրջայցը։
        wiki: "<b>Վիքիում</b> Դուք կարող եք փաստագրել և Ձեր թիմի հետ միասին կիսվել գիտելիքներով։"
        wp:
          back_button: Օգտագործեք վերին ձախ անկյունում գտնվող վերադարձի սլաքը՝ դուրս գալու և աշխատանքային փաթեթների ցանկ վերադառնալու համար։
          create_button: "<b>+ Ստեղծել</b> կոճակը Ձեր նախագծին կավելացնի նոր աշխատանքային փաթեթ։"
          full_view: "<b>Աշխատանքային փաթեթի մանրամասների</b> տեսքը տրամադրում է տվյալ աշխատանքային փաթեթին վերաբերող ողջ տեղեկատվությունը՝ դրա նկարագրությունը, կարգավիճակը, առաջնահերթությունը, գործունեությունը, կախվածությունները և մեկնաբանությունները։"
          gantt_menu: Հեշտությամբ ստեղծեք նախագծի ժամանակացույցեր և ժամանակագծեր՝ Գանտի գծապատկերի մոդուլի միջոցով։
          list: "<b>Աշխատանքային</b> փաթեթների այս ընդհանուր տեսքը տրամադրում է Ձեր նախագծի ողջ աշխատանքի ցանկը՝ առաջադրանքներ, հանգրվաններ, փուլեր և այլն։ <br> Աշխատանքային փաթեթները կարող են ստեղծվել և խմբագրվել անմիջապես այս տեսքից։ Կոնկրետ աշխատանքային փաթեթի մանրամասներին հասնելու համար պարզապես կրկնակի սեղմեք դրա տողի վրա։"
          timeline: Այստեղ Դուք կարող եք <b>խմբագրել Ձեր նախագծի պլանը</b>, ստեղծել նոր աշխատանքային փաթեթներ՝ առաջադրանքներ, հանգրվաններ, փուլեր և այլն, ինչպես նաև <b>ավելացնել կախվածություններ</b>։ Թիմի բոլոր անդամները կարող են ցանկացած պահի տեսնել և թարմացնել վերջին պլանը։
          toggler: Այժմ դիտենք <b>աշխատանքային փաթեթների</b> բաժինը, որը Ձեզ տալիս է Ձեր աշխատանքի ավելի մանրամասն պատկերը։
