    system_account_legend: |
      OpenProject ඔබේ LDAP ගසෙහි පරිශීලකයින් සහ කණ්ඩායම් බලා ගැනීම සඳහා පද්ධති ගිණුමක් හරහා කියවිය හැකි ප්රවේශයක් අවශ්ය වේ.
      කරුණාකර පහත දැක්වෙන කොටසේ එම පද්ධති පරිශීලකයා සඳහා බැඳීමේ අක්තපත්ර සඳහන් කරන්න.
