    එකම OpenProject සහ ගබඩාව පරිශීලක නාමය හෝ විද්යුත් තැපෑල සහිත පරිශීලකයින් ස්වයංක්රීයව සිතියම් ගත කරනු ලැබේ.
  text_setup_mail_configuration: ඔබගේ විද්යුත් තැපැල් සපයන්නා සකසන්න
