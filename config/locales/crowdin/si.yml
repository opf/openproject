      නිධි මොඩියුල පිටුවට පිවිසීමේදී නිධි ස්වයංක්රීයව යාවත්කාලීන කිරීමට ඔබට අවශ්ය නම් මෙය පරීක්ෂා කරන්න.
      මෙම ගබඩාවෙන් සිදු කරන ලද පිටපත් නැවත ලබා ගැනීම සහ අවශ්ය තැටි ගබඩා කිරීම ප්රබෝධමත් කිරීම ඇතුළත් වේ.
    checkout:
      access:
        none: පිරික්සුම් ප්රවේශයක් නොමැත, ඔබට මෙම යෙදුම හරහා ගබඩාව නැරඹිය හැකිය.
        read: කියවීමට-පමණි
        readwrite: කියවන්න + ලියන්න
      access_permission: මෙම ගබඩාව පිළිබඳ ඔබගේ අවසරය
      base_url_text: |-
        පිරික්සුම් URL ජනනය කිරීම සඳහා භාවිතා කිරීමට මූලික URL (උදා: https://myserver.example.org/repos/).
        සටහන: මූලික URL එක භාවිතා කරන්නේ කළමනාකරණය කළ ගබඩාවලදී පිරික්සුම් URL නැවත ලිවීම සඳහා පමණි. වෙනත් ගබඩාවන් වෙනස් කර නැත.
      default_instructions:
        git: |-
          මෙම ගබඩාවේ අඩංගු දත්ත Git සමඟ ඔබේ පරිගණකයට බාගත කළ හැකිය.
          පිරික්සුම් ක්රියා පටිපාටිය සහ ලබා ගත හැකි සේවාදායකයින් පිළිබඳ වැඩි විස්තර අවශ්ය නම් කරුණාකර Git හි ප්රලේඛනය විමසන්න.
        subversion: |-
          මෙම ගබඩාවේ අඩංගු දත්ත Subversion සමඟ ඔබේ පරිගණකයට බාගත කර ගත හැකිය.
          ඔබට පිරික්සුම් ක්රියා පටිපාටිය සහ ලබා ගත හැකි සේවාදායකයින් පිළිබඳ වැඩි විස්තර අවශ්ය නම් කරුණාකර ඉදිරිපත් කිරීමේ ලියකියවිලි විමසන්න.
      enable_instructions_text: සියලුම ගබඩාවලට අදාළ පිටුවල පහත අර්ථ දක්වා ඇති පිරික්සුම් උපදෙස් පෙන්වයි.
      instructions: පිරික්සුම් උපදෙස්
      not_available: මෙම ගබඩාව සඳහා පිරික්සුම් උපදෙස් අර්ථ දක්වා නොමැත. පද්ධති සැකසුම් තුළ මෙම ගබඩාව සඳහා ඒවා සක්රීය කිරීමට ඔබේ පරිපාලකයාගෙන් විමසන්න.
      show_instructions: පිරික්සුම් උපදෙස් පෙන්වන්න
      text_instructions: මෙම පෙළ ගබඩාව පරීක්ෂා කරන්නේ කෙසේද යන්න පිළිබඳ මග පෙන්වීම සඳහා පිරික්සුම් URL එක සමඟ දර්ශනය වේ.
