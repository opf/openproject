  ldap_auth_sources:
    attribute_texts:
      admin_map_html: 'Valgfritt: Egenskapsnøkkelen i LDAP som, <strong>hvis denne finnes</strong>, markerer OpenProject-brukeren som en administrator. La stå tom når du er i tvil.'
      base_dn: |
        Skriv inn Base DN av undertreet i LDAP der du vil OpenProject skal se etter brukere og grupper.
        OpenProject vil bare filtrere etter gjeldende brukernavn i dette undertreet.
        Eksempel: ou=users,dc=example,dc=com
      filter_string: |
        Legg til et valgfritt RFC4515 filter som gjelder for resultatene returnert for brukere filtrert i LDAP.
        Dette kan brukes til å begrense settet med brukere som finnes av OpenProject for synkronisering i gruppe.
      filter_string_concat: |
        OpenProject vil alltid filtrere for påloggingsegenskapen som brukeren har gitt for å identifisere posten. Dersom du angir et filter her, vil
        det koples til en AND. Som standard vil en catch-all (objectClass=*) bli brukt som et filter.
