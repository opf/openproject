      host: LDAP-vertsnavn eller IP-adresse
      login_map: Egenskapsnøkkelen i LDAP som brukes til å identifisere den unike brukerinnloggingen. Vanligvis vil dette være `uid` eller `samAccountName`.
      name: Tabellnavn på LDAP-tilkoblingen
      onthefly_register: |
        Hvis du huker av denne boksen vil OpenProject automatisk opprette en ny bruker fra deres LDAP opplysninger når de første gang autentiseres med OpenProject.

        La denne stå åpen om du kun vil tillate eksisterende kontoer i OpenProject å autentisere via LDAP!
      system_user_dn_html: |
        Enter the DN of the system user used for read-only access.
        <br>
        Example: uid=openproject,ou=system,dc=example,dc=com
      system_user_password: Skriv inn bind passordet til system brukeren
