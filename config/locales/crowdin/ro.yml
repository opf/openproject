  ldap_auth_sources:
    attribute_texts:
      admin_map_html: 'Opțional: Cheia atributului în LDAP care, <strong>dacă este prezentă</strong>, marchează utilizatorul OpenProject ca fiind administrator. Lăsați gol dacă aveți îndoieli.'
      base_dn: |
        Introdu DN-ul de bază al subarborelui din LDAP în care vrei ca OpenProject să caute utilizatori și grupuri.
        OpenProject va filtra numai pentru numele de utilizator furnizate în acest subarbore.
        Exemplu: ou=users,dc=example,dc=com
      filter_string: |
        Adaugă un filtru RFC4515 opțional care să se aplice rezultatelor returnate pentru utilizatorii filtrați în LDAP.
        Acesta poate fi utilizat pentru a restricționa setul de utilizatori care sunt găsiți de OpenProject pentru autentificare și sincronizare de grup.
      filter_string_concat: |
        OpenProject va filtra întotdeauna pentru atributul de autentificare furnizat de utilizator pentru a identifica înregistrarea. Dacă furnizați un filtru aici,
        acesta va fi concatenat cu un AND. În mod implicit, ca filtru se va utiliza un "catch-all" (objectClass=*).
      generic_map: Cheia atributului din LDAP care este mapată pe atributul OpenProject `%{attribute}`
      host: Numele gazdei LDAP sau adresa IP
      login_map: Cheia atributului în LDAP care este utilizată pentru a identifica autentificarea unică a utilizatorului. De obicei, aceasta va fi `uid` sau `samAccountName`.
      name: Numele arbitrar al conexiunii LDAP
      onthefly_register: |
        Dacă bifezi această casetă, OpenProject va crea automat noi utilizatori din intrările LDAP ale acestora
        atunci când aceștia se autentifică pentru prima dată cu OpenProject.
        Lasă această casetă debifată pentru a permite doar conturilor existente în OpenProject să se autentifice prin LDAP!
      system_user_dn_html: |
        Enter the DN of the system user used for read-only access.
        <br>
        Example: uid=openproject,ou=system,dc=example,dc=com
      system_user_password: Introdu parola de legătură a utilizatorului de sistem
    back_to_index: Click here to go back to the list of connection.
    connection_encryption: Criptarea conexiunii
    encryption_details: Opțiuni LDAPS / STARTTLS
    ldap_auth_failed: Nu a putut fi realizată autentificarea pe serverul LDAP.
    ldap_details: Detalii LDAP
    ldap_error: 'Eroare LDAP: %{error_message}'
    sync_failed: 'Failed to synchronize from LDAP: %{message}.'
    system_account: Contul de sistem
    system_account_legend: |
      OpenProject necesită acces doar pentru citire printr-un cont de sistem pentru a căuta utilizatori și grupuri în arborele LDAP.
      Te rog să specifici acreditările de conectare pentru acest utilizator de sistem în secțiunea următoare.
    technical_warning: |
      This LDAP form requires technical knowledge of your LDAP / Active Directory setup.
      [Please visit our documentation for detailed instructions](docs_url).
    tls_mode:
      plain: niciuna
      plain_description: Deschide o conexiune necriptată la serverul LDAP. Nu se recomandă pentru producție.
      section_more_info_link_html: 'Această secțiune se referă la securitatea conexiunii acestei surse de autentificare LDAP. Pentru mai multe informații, consultați <a href="%{link}">documentația Net::LDAP</a>.

        '
      simple_tls: LDAPS
      simple_tls_description: Utilizează LDAPS. Necesită un port separat pe serverul LDAP. Acest mod este adesea depreciat, recomandăm utilizarea STARTTLS ori de câte ori este posibil.
      start_tls: STARTTLS
      start_tls_description: Trimite o comandă STARTTLS după conectarea la portul LDAP standard. Recomandată pentru conexiuni criptate.
    tls_options:
      tls_certificate_description: Dacă certificatul serverului LDAP nu se află în sursele de încredere ale acestui sistem, îl poți adăuga manual aici. Introdu un șir de certificate PEM X509.
      verify_peer: Verifică certificatul SSL
      verify_peer_description_html: 'Enables strict SSL verification of the certificate trusted chain. <br> <strong>Warning:</strong> Unchecking this option disables SSL verification of the LDAP server certificate. This exposes your connection to Man in the Middle attacks.

        '
    user_settings: Lista Mapare Atribute
