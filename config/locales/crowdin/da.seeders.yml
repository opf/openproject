      welcome:
        title: Velkommen til OpenProject!
        text: |
          OpenProject er det førende open source-program til projektstyring. Det understøtter klassisk, agil og hybrid projektstyring og giver dig fuld kontrol over dine data.

          Kernefunktioner og anvendelser:

          * [Styring af projektporteføljer](https://www.openproject.org/collaboration-software-features/project-portfolio-management/)
          * [Projektplanlægning og tidsplaner](https://www.openproject.org/collaboration-software-features/project-planning-scheduling/)
          * [Opgavestyring og sagsopfølgning](https://www.openproject.org/collaboration-software-features/task-management/)
          * [Agile tavler (Scrum og Kanban)](https://www.openproject.org/collaboration-software-features/agile-project-management/)
          * [Kravstyring og release-planlægning](https://www.openproject.org/collaboration-software-features/product-development/)
          * [Tids- og omkostningsregistrering, budgetter](https://www.openproject.org/collaboration-software-features/time-tracking/)
          * [Samarbejde og dokumentation i teams](https://www.openproject.org/collaboration-software-features/team-collaboration/)

          Velkommen til fremtidens projektstyring.

          Til administratorer: Du kan ændre denne velkomsttekst [her]({{opSetting:base_url}}/admin/settings/general).
