              name: Sprint 1
              wiki:
                title: Sprint 1
                content: |
                  ### Sprintplanlægningsmøde

                  _Dokumentér emnerne til sprintplanlægningsmødet her_

                  * Tidsafgrænset (8 t)
                  * Input: Product Backlog
                  * Output: Sprint Backlog

                  * Opdelt i to yderligere tidsrum på 4 t:

                      * Product Owner præsenterer [Product Backlog]({{opSetting:base_url}}/projects/your-scrum-project/backlogs) og prioriteterne for teamet og forklarer sprintmålet, som teamet skal være enigt i. Sammen prioriterer de de emner fra Product Backlog, som teamet tager sig af i den næste sprint. Teamet forpligter sig til den aftalte levering.
                      * Teamet planlægger selvstændigt (uden Product Owner) i detaljer og nedbryder opgaverne fra de aftalte krav til en samlet [Sprint Backlog]({{opSetting:base_url}}/projects/your-scrum-project/backlogs).


                  ### Daily Scrum-møde

                  _Dokumentér emnerne til Daily Scrum-mødet her_

                  * Kort, dagligt statusmøde i teamet.
                  * Tidsafgrænset (højst 15 min).
                  * Stand-up-møde, hvor følgende emner fra [opgavetavlen](##sprint:scrum_project__version__sprint_1) drøftes.
                      * Hvad planlægger jeg at gøre inden næste Daily Scrum?
                      * Hvad har blokeret mit arbejde (forhindringer)?
                  * Scrum Master leder mødet og noterer [forhindringer i sprinten](##sprint:scrum_project__version__sprint_1).
                  * Product Owner kan deltage for at holde sig orienteret.

                  ### Sprint Review-møde

                  _Dokumentér emnerne til Sprint Review-mødet her_

                  * Tidsafgrænset (4 t).
                  * Højst en times forberedelse pr. person.
                  * Teamet viser Product Owner og andre interesserede, hvad der er nået i denne sprint.
                  * Vigtigt: ingen attrapper og ingen PowerPoint! Kun færdig produktfunktionalitet (increments) skal demonstreres.
                  * Feedback fra Product Owner, interessenter og andre er ønsket og indgår i det videre arbejde.
                  * Ud fra de demonstrerede funktioner beslutter Product Owner, om dette increment skal i drift eller udvikles videre. Det giver mulighed for et tidligt ROI.


                  ### Sprint Retrospective

                  _Dokumentér emnerne til Sprint Retrospective-mødet her_

                  * Tidsafgrænset (3 t).
                  * Efter Sprint Review, ledes af Scrum Master.
                  * Teamet drøfter sprinten: hvad gik godt, og hvad skal forbedres for at være mere produktive i næste sprint eller have det endnu sjovere.
            item_3:
              name: Sprint 2
