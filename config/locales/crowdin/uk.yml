      data_consequences:
        other: Усі дані, які стосуються користувача, буде видалено. Дії користувача в спільних поданнях, таких як пакети робіт і наради, залишаться в системі, проте їх буде зв’язано із загальним «Видаленим користувачем», який ніяк не вказує на оригінальний обліковий запис.
        self: Усі дані, які стосуються користувача, буде видалено. Ваші дії в спільних поданнях, таких як пакети робіт і наради, залишаться в системі, проте їх буде зв’язано із загальним «Видаленим користувачем», який ніяк не вказує на ваш оригінальний обліковий запис.
      heading: Видалити обліковий запис, яким користується %{name}?
      login_consequences:
        other: Цей обліковий запис буде негайно видалено із системи, і користувач більше не зможе ввійти в неї за допомогою своїх облікових даних.
        self: Ваш обліковий запис буде негайно видалено із системи, і ви більше не зможете ввійти в неї за допомогою своїх облікових даних.
