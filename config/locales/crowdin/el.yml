  ldap_auth_sources:
    attribute_texts:
      admin_map_html: 'Προαιρετικό: Το κλειδί χαρακτηριστικού στο LDAP που <strong>αν υπάρχει</strong> επισημαίνει τον χρήστη OpenProject ως διαχειριστή. Αφήστε το κενό αν αμφιβάλλετε.'
      base_dn: |
        Εισάγετε το Base DN του υποδέντρου στο LDAP που θέλετε το OpenProject να αναζητήσει χρήστες και ομάδες.
        Το OpenProject θα φιλτράρει τα δοθέντα ονόματα χρηστών μόνο σε αυτό το υποδέντρο.
        Παράδειγμα: ou=users,dc=example,dc=com
      filter_string: 'Προσθέστε ένα προαιρετικό φίλτρο RFC4515 για εφαρμογή στα αποτελέσματα που επιστρέφονται για χρήστες που φιλτράρονται στο LDAP. Αυτό μπορεί να χρησιμοποιηθεί για τον περιορισμό του συνόλου των χρηστών που βρίσκονται στο OpenProject για έλεγχο ταυτότητας και συγχρονισμό ομάδας.

        '
      filter_string_concat: 'Το OpenProject θα φιλτράρει πάντα το χαρακτηριστικό σύνδεσης που παρέχεται από τον χρήστη για να αναγνωρίσει την εγγραφή. Εάν παρέχετε ένα φίλτρο εδώ, θα συνδυαστεί με ένα AND. Από προεπιλογή, ένα catch-all (objectClass = *) θα χρησιμοποιηθεί ως φίλτρο.

        '
      generic_map: Το κλειδί χαρακτηριστικού στο LDAP είναι χαρτογραφημένο στο χαρακτηριστικό του OpenProject `%{attribute}`
      host: Όνομα εξυπηρετητή LDAP ή διεύθυνση IP
      login_map: Το κλειδί χαρακτηριστικού στο LDAP που χρησιμοποιείται για να αναγνωριστεί η μοναδική σύνδεση χρήστη. Συνήθως, αυτό θα είναι το `uid` ή το `samAccountName`.
      name: Αυθαίρετο όνομα της σύνδεσης LDAP
      onthefly_register: |
        Αν επιλέξετε αυτό το κουτί, το OpenProject θα δημιουργεί αυτόματα καινούργιους χρήστες από τις καταχωρήσεις του LDAP όταν ταυτοποιούνται για πρώτη φορά στο OpenProject.
        Αφήστε το μη επιλεγμένο για να επιτρέψετε μόνο στους υπάρχοντες λογαριασμούς στο OpenProject να ταυτοποιηθούν μέσω LDAP!
      system_user_dn_html: |
        Enter the DN of the system user used for read-only access.
        <br>
        Example: uid=openproject,ou=system,dc=example,dc=com
      system_user_password: Εισάγετε τον δεσμευτικό κωδικό πρόσβασης του χρήστη συστήματος
    back_to_index: Click here to go back to the list of connection.
    connection_encryption: Κρυπτογράφηση σύνδεσης
    encryption_details: LDAPS / STARTTLS options
    ldap_auth_failed: Δεν ήταν δυνατή η ταυτοποίηση στον LDAP-Server.
    ldap_details: Λεπτομέρειες LDAP
    ldap_error: 'Σφάλμα-LDAP: %{error_message}'
    sync_failed: 'Failed to synchronize from LDAP: %{message}.'
    system_account: Λογαριασμός συστήματος
    system_account_legend: |
      Το OpenProject απαιτεί πρόσβαση ανάγνωσης-μόνο μέσω ενός λογαριασμού συστήματος για να αναζητά χρήστες και ομάδες στο LDAP δέντρο σας.
      Παρακαλούμε προσδιορίστε τα διαπιστευτήρια δέσμευσης για αυτόν τον χρήστη συστήματος στην παρακάτω ενότητα.
    technical_warning: |
      This LDAP form requires technical knowledge of your LDAP / Active Directory setup.
      [Please visit our documentation for detailed instructions](docs_url).
    tls_mode:
      plain: κανένα
      plain_description: Opens an unencrypted connection to the LDAP server. Not recommended for production.
      section_more_info_link_html: 'Αυτή η ενότητα αφορά την ασφάλεια σύνδεσης αυτής της πηγής ελέγχου ταυτότητας LDAP. Για περισσότερες πληροφορίες, επισκεφθείτε <a href="%{link}">the Net::LDAP documentation</a>.

        '
      simple_tls: LDAPS
      simple_tls_description: Use LDAPS. Requires a separate port on the LDAP server. This mode is often deprecated, we recommend using STARTTLS whenever possible.
      start_tls: STARTTLS
      start_tls_description: Sends a STARTTLS command after connecting to the standard LDAP port. Recommended for encrypted connections.
    tls_options:
      tls_certificate_description: If the LDAP server certificate is not in the trust sources of this system, you can add it manually here. Enter a PEM X509 certifiate string.
      verify_peer: Verify SSL certificate
      verify_peer_description_html: 'Enables strict SSL verification of the certificate trusted chain. <br> <strong>Warning:</strong> Unchecking this option disables SSL verification of the LDAP server certificate. This exposes your connection to Man in the Middle attacks.

        '
    user_settings: Χαρτογράφηση χαρακτηριστικού
    user_settings_legend: 'Τα ακόλουθα πεδία σχετίζονται με το πως οι χρήστες δημιουργούνται στο OpenProject από τις καταχωρήσεις LDAP και ποια χαρακτηριστικά LDAP χρησιμοποιούνται για να ορίσουν τα χαρακτηριστικά ενός χρήστη OpenProject (χαρτογράφηση χαρακτηριστικού).

      '
