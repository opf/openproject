                  text: |
                    Ուրախ ենք, որ միացել եք։ Առաջարկում ենք փորձել մի քանի բան՝ OpenProject-ում աշխատանքը սկսելու համար։

                    Բացահայտեք ամենակարևոր հնարավորությունները մեր [Ուղղորդված շրջայցի]({{opSetting:base_url}}/projects/demo-project/work_packages/?start_onboarding_tour=true) օգնությամբ։

                    _Փորձեք հետևյալ քայլերը՝_

                    1. *Հրավիրեք նոր անդամներ Ձեր նախագիծ*՝ &rightarrow; անցեք նախագծի նավիգացիայի [Անդամներ]({{opSetting:base_url}}/projects/demo-project/members) բաժին։
                    2. *Դիտեք Ձեր նախագծի աշխատանքը*՝ &rightarrow; անցեք նախագծի նավիգացիայի [Աշխատանքային փաթեթներ]({{opSetting:base_url}}/projects/demo-project/work_packages) բաժին։
                    3. *Ստեղծեք նոր աշխատանքային փաթեթ*՝ &rightarrow; անցեք [Աշխատանքային փաթեթներ &rightarrow; Ստեղծել]({{opSetting:base_url}}/projects/demo-project/work_packages/new)։
                    4. *Ստեղծեք և թարմացրեք նախագծի պլան*՝ &rightarrow; անցեք նախագծի նավիգացիայի [Նախագծի պլան]({{opSetting:base_url}}/projects/demo-project/work_packages?query_id=##query.id:demo_project__query__project_plan) բաժին։
                    5. *Ակտիվացրեք լրացուցիչ մոդուլներ*՝ &rightarrow; անցեք [Նախագծի կարգավորումներ &rightarrow; Մոդուլներ]({{opSetting:base_url}}/projects/demo-project/settings/modules)։
