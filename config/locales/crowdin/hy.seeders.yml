      welcome:
        title: Բարի գալուստ OpenProject
        text: |
          OpenProject-ը նախագծերի կառավարման առաջատար բաց ելակետային կոդով ծրագրաշար է։ Այն աջակցում է դասական, ճկուն, ինչպես նաև հիբրիդային նախագծերի կառավարմանը և Ձեզ տալիս է Ձեր տվյալների լիարժեք վերահսկողություն։

          Հիմնական հնարավորությունները և կիրառման դեպքերը՝

          * [Նախագծերի պորտֆոլիոյի կառավարում](https://www.openproject.org/collaboration-software-features/project-portfolio-management/)
          * [Նախագծերի պլանավորում և ժամանակացույցի կազմում](https://www.openproject.org/collaboration-software-features/project-planning-scheduling/)
          * [Առաջադրանքների կառավարում և խնդիրների հետագծում](https://www.openproject.org/collaboration-software-features/task-management/)
          * [Ճկուն տախտակներ (Scrum և Kanban)](https://www.openproject.org/collaboration-software-features/agile-project-management/)
          * [Պահանջների կառավարում և թողարկումների պլանավորում](https://www.openproject.org/collaboration-software-features/product-development/)
          * [Ժամանակի և ծախսերի հետագծում, բյուջեներ](https://www.openproject.org/collaboration-software-features/time-tracking/)
          * [Թիմային համագործակցություն և փաստագրում](https://www.openproject.org/collaboration-software-features/team-collaboration/)

          Բարի գալուստ նախագծերի կառավարման ապագա։

          Ադմինիստրատորների համար՝ Դուք կարող եք փոփոխել այս ողջույնի տեքստը [այստեղ]({{opSetting:base_url}}/admin/settings/general)։
