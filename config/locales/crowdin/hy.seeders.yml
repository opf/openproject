          wiki: |
            ### Սպրինտի պլանավորման հանդիպում

            _Խնդրում ենք այստեղ փաստագրել Սպրինտի պլանավորման հանդիպման թեմաները_

            * Ժամանակով սահմանափակված (8 ժ)
            * Մուտք՝ Արտադրանքի բեքլոգ
            * Ելք՝ Սպրինտի բեքլոգ

            * Բաժանված է 4-ժամյա երկու լրացուցիչ ժամանակահատվածի՝

                * Արտադրանքի սեփականատերը թիմին ներկայացնում է [Արտադրանքի բեքլոգը]({{opSetting:base_url}}/projects/your-scrum-project/backlogs) և առաջնահերթությունները, ինչպես նաև բացատրում է Սպրինտի նպատակը, որին թիմը պետք է համաձայնի։ Միասին նրանք առաջնահերթություն են տալիս Արտադրանքի բեքլոգի այն թեմաներին, որոնցով թիմը կզբաղվի հաջորդ սպրինտում։ Թիմը պարտավորվում է ապահովել քննարկված արդյունքը։
                * Թիմն ինքնուրույն (առանց Արտադրանքի սեփականատիրոջ) մանրամասն պլանավորում է և քննարկված պահանջները բաժանում է առաջադրանքների՝ [Սպրինտի բեքլոգը]({{opSetting:base_url}}/projects/your-scrum-project/backlogs) ձևավորելու համար։


            ### Ամենօրյա Scrum հանդիպում

            _Խնդրում ենք այստեղ փաստագրել Ամենօրյա Scrum հանդիպման թեմաները_

            * Թիմի կարճ, ամենօրյա կարգավիճակի հանդիպում։
            * Ժամանակով սահմանափակված (առավելագույնը 15 ր)։
            * Կանգնած անցկացվող հանդիպում՝ առաջադրանքների տախտակից հետևյալ թեմաները քննարկելու համար։
                * Ի՞նչ եմ պլանավորում անել մինչև հաջորդ Ամենօրյա Scrum հանդիպումը։
                * Ի՞նչն է խոչընդոտել իմ աշխատանքը (Խոչընդոտներ)։
            * Scrum Master-ը վարում է հանդիպումը և արձանագրում Սպրինտի խոչընդոտները։
            * Արտադրանքի սեփականատերը կարող է մասնակցել՝ տեղեկացված մնալու համար։

            ### Սպրինտի վերանայման հանդիպում

            _Խնդրում ենք այստեղ փաստագրել Սպրինտի վերանայման հանդիպման թեմաները_

            * Ժամանակով սահմանափակված (4 ժ)։
            * Յուրաքանչյուր անձի համար՝ առավելագույնը մեկ ժամ նախապատրաստման ժամանակ։
            * Թիմը արտադրանքի սեփականատիրոջ և այլ շահագրգիռ անձանց ցույց է տալիս, թե ինչ է ձեռք բերվել այս սպրինտում։
            * Կարևոր՝ ոչ մի մակետ և ոչ մի PowerPoint։ Պետք է ցուցադրվի միայն արտադրանքի ավարտված ֆունկցիոնալությունը (Ինկրեմենտներ)։
            * Ցանկալի է Արտադրանքի սեփականատիրոջ, շահագրգիռ կողմերի և այլոց արձագանքը, որը կներառվի հետագա աշխատանքում։
            * Ելնելով ցուցադրված ֆունկցիոնալությունից՝ Արտադրանքի սեփականատերը որոշում է կայացնում այս ինկրեմենտը գործարկել կամ շարունակել մշակել։ Այս հնարավորությունը թույլ է տալիս վաղ ROI ստանալ։


            ### Սպրինտի ռետրոսպեկտիվ

            _Խնդրում ենք այստեղ փաստագրել Սպրինտի ռետրոսպեկտիվ հանդիպման թեմաները_

            * Ժամանակով սահմանափակված (3 ժ)։
            * Սպրինտի վերանայումից հետո՝ կվարվի Scrum Master-ի կողմից։
            * Թիմը քննարկում է սպրինտը՝ ինչն է լավ ընթացել, ինչը պետք է բարելավել՝ հաջորդ սպրինտում ավելի արդյունավետ լինելու կամ նույնիսկ ավելի հաճելի աշխատելու համար։
