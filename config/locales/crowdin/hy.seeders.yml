          wiki: |
            _Այս վիքիում Դուք կարող եք համատեղ ստեղծել և խմբագրել էջեր և ենթաէջեր՝ նախագծի վիքի ստեղծելու համար։_

            **Դուք կարող եք՝**

            * Տեղադրել տեքստ և պատկերներ, նաև այլ փաստաթղթերից պատճենելու և տեղադրելու միջոցով
            * Ստեղծել էջերի հիերարխիա՝ ծնող էջերի միջոցով
            * Ներառել վիքի էջեր նախագծի ընտրացանկում
            * Օգտագործել մակրոներ՝ ներառելու համար, օր. բովանդակության ցանկ, աշխատանքային փաթեթների ցուցակներ կամ Գանտի գծապատկերներ
            * Ներառել վիքի էջեր այլ տեքստային դաշտերում, օր. նախագծի ընդհանուր տեսքի էջում
            * Ներառել հղումներ այլ փաստաթղթերի
            * Դիտել փոփոխությունների պատմությունը
            * Դիտել որպես Markdown

            Լրացուցիչ տեղեկություններ՝ [https://www.openproject.org/docs/user-guide/wiki/](https://www.openproject.org/docs/user-guide/wiki/)
