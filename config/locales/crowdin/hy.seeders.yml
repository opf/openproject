            item_2:
              name: Սպրինտ 1
              wiki:
                title: Սպրինտ 1
                content: |
                  ### Սպրինտի պլանավորման հանդիպում

                  _Խնդրում ենք այստեղ փաստագրել սպրինտի պլանավորման հանդիպման թեմաները_

                  * Ժամանակով սահմանափակված (8 ժ)
                  * Մուտք՝ Արտադրանքի բեքլոգ
                  * Ելք՝ Սպրինտի բեքլոգ

                  * Բաժանված է 4 ժ տևողությամբ երկու լրացուցիչ ժամանակահատվածի՝

                      * Product Owner-ը թիմին ներկայացնում է [Արտադրանքի բեքլոգը]({{opSetting:base_url}}/projects/your-scrum-project/backlogs) և առաջնահերթությունները և բացատրում է Սպրինտի նպատակը, որին թիմը պետք է համաձայնի։ Միասին նրանք ըստ առաջնահերթության դասավորում են Արտադրանքի բեքլոգի այն թեմաները, որոնցով թիմը կզբաղվի հաջորդ սպրինտում։ Թիմը պարտավորվում է կատարել քննարկված առաքումը։
                      * Թիմն ինքնուրույն (առանց Product Owner-ի) մանրամասն պլանավորում է և քննարկված պահանջներից առանձնացնում է առաջադրանքները՝ [Սպրինտի բեքլոգը]({{opSetting:base_url}}/projects/your-scrum-project/backlogs) ձևավորելու համար։


                  ### Ամենօրյա Scrum հանդիպում

                  _Խնդրում ենք այստեղ փաստագրել ամենօրյա Scrum հանդիպման թեմաները_

                  * Թիմի կարճ, ամենօրյա հանդիպում ընթացիկ վիճակի վերաբերյալ։
                  * Ժամանակով սահմանափակված (առավ. 15 ր)։
                  * Ոտքի վրա անցկացվող հանդիպում՝ [Առաջադրանքների տախտակից](##sprint:scrum_project__version__sprint_1) հետևյալ թեմաները քննարկելու համար։
                      * Ի՞նչ եմ պլանավորում անել մինչև հաջորդ ամենօրյա Scrum-ը։
                      * Ի՞նչն է խոչընդոտել իմ աշխատանքը (խոչընդոտներ)։
                  * Scrum Master-ը վարում է հանդիպումը և գրանցում [սպրինտի խոչընդոտները](##sprint:scrum_project__version__sprint_1)։
                  * Product Owner-ը կարող է մասնակցել՝ տեղեկացված մնալու համար։

                  ### Սպրինտի վերանայման հանդիպում

                  _Խնդրում ենք այստեղ փաստագրել սպրինտի վերանայման հանդիպման թեմաները_

                  * Ժամանակով սահմանափակված (4 ժ)։
                  * Յուրաքանչյուր մասնակցի համար առավելագույնը մեկ ժամ նախապատրաստման ժամանակ։
                  * Թիմը Product Owner-ին և այլ շահագրգիռ անձանց ցույց է տալիս, թե ինչ է ձեռք բերվել այս սպրինտում։
                  * Կարևոր՝ ոչ մի մակետ և ոչ մի PowerPoint։ Պետք է ցուցադրվի միայն ավարտված արտադրանքի ֆունկցիոնալությունը (ինկրեմենտներ)։
                  * Product Owner-ի, շահագրգիռ կողմերի և այլոց արձագանքը ցանկալի է և հաշվի կառնվի հետագա աշխատանքում։
                  * Ցուցադրված ֆունկցիոնալության հիման վրա Product Owner-ը որոշում է այս ինկրեմենտը գործարկել կամ շարունակել մշակել այն։ Այս հնարավորությունը թույլ է տալիս ապահովել վաղ ROI։


                  ### Սպրինտի ռետրոսպեկտիվ

                  _Խնդրում ենք այստեղ փաստագրել սպրինտի ռետրոսպեկտիվ հանդիպման թեմաները_

                  * Ժամանակով սահմանափակված (3 ժ)։
                  * Անցկացվում է Սպրինտի վերանայումից հետո, վարում է Scrum Master-ը։
                  * Թիմը քննարկում է սպրինտը՝ ինչն է լավ անցել, ինչը պետք է բարելավել, որպեսզի հաջորդ սպրինտում ավելի արդյունավետ լինի կամ նույնիսկ ավելի հաճելի անցնի։
