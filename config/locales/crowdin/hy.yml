              must_not_be_changed: 'չպետք է փոփոխվի ձեռքով։ Այն հատկացվում է ինքնաշխատ, նույնացուցիչի հետ միասին։ Եթե այս փոփոխությունը կանխամտածված է, պահպանեք `save(context: :%{context})`-ով։'
