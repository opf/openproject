            slug:
              undeducible: հնարավոր չէ ստանալ '%{title}' վերնագրից։
          error_conflict: Վիքի էջը թարմացվել է մեկ ուրիշի կողմից, մինչ Դուք խմբագրում էիք այն։
        work_package:
          attributes:
            assigned_to:
              format: "%{message}"
            category:
              does_not_exist: Նշված կատեգորիան գոյություն չունի։
              only_same_project_categories_allowed: Աշխատանքային փաթեթի կատեգորիան պետք է լինի նույն նախագծում, ինչ աշխատանքային փաթեթը։
            done_ratio:
              cannot_be_set_when_work_is_zero: հնարավոր չէ սահմանել, երբ Աշխատանքը 0ժ է
              does_not_match_work_and_remaining_work: չի համապատասխանում Աշխատանքին և Մնացած աշխատանքին
              inclusion: պետք է լինի 0-ի և 100-ի միջև։
              must_be_set_when_remaining_work_is_set: պարտադիր է, երբ սահմանված է Մնացած աշխատանքը։
              must_be_set_when_work_and_remaining_work_are_set: պարտադիր է, երբ սահմանված են Աշխատանքը և Մնացած աշխատանքը։
            due_date:
              cannot_be_null: հնարավոր չէ սահմանել դատարկ արժեք, քանի որ սկզբի ամսաթիվը և տևողությունը հայտնի են։
              not_start_date: չի համընկնում սկզբի ամսաթվի հետ, թեև դա պարտադիր է հանգրվանների համար։
            duration:
              cannot_be_null: հնարավոր չէ սահմանել դատարկ արժեք, քանի որ սկզբի և ավարտի ամսաթվերը հայտնի են։
              larger_than_dates: ավելի մեծ է, քան սկզբի և ավարտի ամսաթվերի միջև ընկած միջակայքը։
              not_an_integer: վավեր տևողություն չէ։
              not_available_for_milestones: հասանելի չէ հանգրվան տեսակի աշխատանքային փաթեթների համար։
              smaller_than_dates: փոքր է սկզբի և ավարտի ամսաթվերի միջև ընկած միջակայքից։
            estimated_hours:
              cant_be_inferior_to_remaining_work: չի կարող փոքր լինել Մնացած աշխատանքից։
              must_be_set_when_remaining_work_and_percent_complete_are_set: պարտադիր է, երբ սահմանված են Մնացած աշխատանքը և Կատարման %-ը։
              not_a_number: վավեր տևողություն չէ։
            id:
              blank: ID-ն չի կարող դատարկ լինել։
              cannot_add_child_because_of_lack_of_permission: Հնարավոր չէ ավելացնել ենթատարր, քանի որ Դուք չունեք ընտրված աշխատանքային փաթեթը խմբագրելու թույլտվություն։
              format: "%{message}"
            identifier:
              must_not_be_changed: 'չպետք է փոփոխվի ձեռքով։ Աշխատանքային փաթեթների նույնացուցիչները հատկացվում են ինքնաշխատ և որոշվում են alias աղյուսակի միջոցով, ուստի դրանք ձեռքով փոփոխելը խաթարում է հղումները և նույնացուցիչների պատմությունը։ Եթե այս փոփոխությունը կանխամտածված է, պահպանեք `save(context: :%{context})`-ով և ապահովեք work_package_semantic_aliases աղյուսակի համապատասխանությունը։'
              semantic_identifier_incomplete: և sequence_number-ը պետք է սահմանվեն միաժամանակ։
            parent:
              cannot_be_in_another_project: չի կարող լինել այլ նախագծում։
              cannot_be_milestone: չի կարող լինել հանգրվան։
              cannot_be_self_assigned: չի կարող նշանակվել ինքն իրեն։
              not_a_valid_parent: անվավեր է։
            priority_id:
              only_active_priorities_allowed: պետք է լինի ակտիվ։
            remaining_hours:
              cant_exceed_work: չի կարող մեծ լինել Աշխատանքից։
              must_be_empty_when_work_is_empty_and_percent_complete_is_100p: պետք է դատարկ լինի, երբ Աշխատանքը դատարկ է և Կատարման %-ը 100% է։
              must_be_set_to_zero_hours_when_work_is_set_and_percent_complete_is_100p: ">- պետք է լինի 0h, երբ Աշխատանքը սահմանված է և Կատարման %-ը 100% է։"
              must_be_set_when_work_and_percent_complete_are_set: պարտադիր է, երբ սահմանված են Աշխատանքը և Կատարման %-ը։
              must_be_set_when_work_is_set: պարտադիր է, երբ Աշխատանքը սահմանված է։
              not_a_number: վավեր տևողություն չէ։
            schedule_manually:
              cannot_be_automatically_scheduled: հնարավոր չէ սահմանել false (ավտոմատ ժամանակացույցով), քանի որ այն չունի նախորդողներ կամ ենթատարրեր։
            sequence_number:
              must_not_be_changed: 'չպետք է փոփոխվի ձեռքով։ Այն հատկացվում է ինքնաշխատ, նույնացուցիչի հետ միասին։ Եթե այս փոփոխությունը կանխամտածված է, պահպանեք `save(context: :%{context})`-ով։'
            start_date:
              cannot_be_null: չի կարող դատարկ սահմանվել, քանի որ ավարտի ամսաթիվը և տևողությունը հայտնի են։
              violates_relationships: կարող է սահմանվել միայն %{soonest_start} կամ ավելի ուշ, որպեսզի չխախտվեն աշխատանքային փաթեթի կապերը։
            status:
              status_invalid_in_type: is invalid because the current status does not exist in this type.
              status_transition_invalid: is invalid because no valid transition exists from old to new status for the current user's roles.
            status_id:
              status_invalid_in_type: անվավեր է, քանի որ ընթացիկ կարգավիճակը գոյություն չունի այս տեսակում։
              status_transition_invalid: անվավեր է, քանի որ ընթացիկ օգտատիրոջ դերերի համար հին կարգավիճակից նորին վավեր անցում գոյություն չունի։
            type:
              cannot_be_milestone_due_to_children: չի կարող լինել հանգրվան, քանի որ այս աշխատանքային փաթեթն ունի դուստր աշխատանքային փաթեթներ։
          is_not_a_valid_target_for_time_entries: "#%{id} աշխատանքային փաթեթը ժամանակի գրառումների վերանշանակման վավեր թիրախ չէ։"
          readonly_status: Աշխատանքային փաթեթը միայն ընթերցելի կարգավիճակում է, ուստի դրա հատկանիշները հնարավոր չէ փոփոխել։
          target_versions_only_allow_single_value: Նպատակային տարբերակները կարող են պարունակել միայն մեկ արժեք։
