  ldap_auth_sources:
    attribute_texts:
      admin_map_html: Ոչ պարտադիր՝ LDAP-ի հատկանիշի բանալին, որը <strong>առկայության դեպքում</strong> OpenProject-ի օգտատիրոջը նշում է որպես ադմինիստրատոր։ Կասկածի դեպքում թողեք դատարկ։
      base_dn: |
        Մուտքագրեք LDAP-ի այն ենթածառի Base DN-ը, որտեղ ցանկանում եք, որ OpenProject-ը որոնի օգտատերերին և խմբերին։
        OpenProject-ը կզտի տրամադրված օգտանունները միայն այս ենթածառում։
        Օրինակ՝ ou=users,dc=example,dc=com
      filter_string: |
        Ավելացրեք ոչ պարտադիր RFC4515 զտիչ, որը կկիրառվի LDAP-ում զտված օգտատերերի համար վերադարձված արդյունքների վրա։
        Այն կարող է օգտագործվել՝ սահմանափակելու օգտատերերի այն ցանկը, որոնք OpenProject-ի կողմից գտնվում են նույնականացման և խմբերի համաժամացման համար։
      filter_string_concat: |
        OpenProject-ը գրառումը նույնականացնելու համար միշտ կզտի օգտատիրոջ տրամադրած մուտքի հատկանիշով։ Եթե այստեղ զտիչ նշեք,
        այն կմիացվի AND-ով։ Կանխադրված կարգով որպես զտիչ կօգտագործվի ընդհանրական (objectClass=*) զտիչը։
      generic_map: LDAP-ի հատկանիշի բանալին, որը համապատասխանեցվում է OpenProject-ի `%{attribute}` հատկանիշին
      host: LDAP հոսթի անուն կամ IP հասցե
      login_map: LDAP-ի հատկանիշի բանալին, որն օգտագործվում է օգտատիրոջ եզակի մուտքանունը նույնականացնելու համար։ Սովորաբար դա կլինի `uid` կամ `samAccountName`։
      name: LDAP կապի կամայական անվանում
      onthefly_register: |
        Եթե նշեք այս վանդակը, OpenProject-ը ավտոմատ կերպով կստեղծի նոր օգտատերեր նրանց LDAP գրառումներից,
        երբ նրանք առաջին անգամ նույնականացվեն OpenProject-ում։
        Թողեք այս վանդակը չնշված, որպեսզի LDAP-ի միջոցով նույնականացվեն միայն OpenProject-ում առկա հաշիվները։
      system_user_dn_html: |
        Մուտքագրեք միայն ընթերցելի մուտքի համար օգտագործվող համակարգային օգտատիրոջ DN-ը։
        <br>
        Օրինակ՝ uid=openproject,ou=system,dc=example,dc=com
      system_user_password: Մուտքագրեք համակարգային օգտատիրոջ կապակցման գաղտնաբառը
    back_to_index: Սեղմեք այստեղ՝ կապերի ցանկին վերադառնալու համար։
    connection_encryption: Կապի գաղտնագրում
    encryption_details: LDAPS / STARTTLS ընտրանքներ
    ldap_auth_failed: Հնարավոր չեղավ նույնականացվել LDAP սերվերում։
    ldap_details: LDAP մանրամասներ
    ldap_error: LDAP սխալ՝ %{error_message}
    sync_failed: Չհաջողվեց համաժամացնել LDAP-ից՝ %{message}։
    system_account: Համակարգային հաշիվ
    system_account_legend: |
      OpenProject-ը պահանջում է միայն ընթերցելի մուտք համակարգային հաշվի միջոցով՝ Ձեր LDAP ծառում օգտատերերին և խմբերին որոնելու համար։
      Խնդրում ենք հետևյալ բաժնում նշել այդ համակարգային օգտատիրոջ կապակցման տվյալները։
    technical_warning: |
      Այս LDAP ձևը պահանջում է Ձեր LDAP / Active Directory կազմաձևման տեխնիկական իմացություն։
      [Մանրամասն ցուցումների համար խնդրում ենք դիմել մեր փաստաթղթերին](docs_url)։
    tls_mode:
      plain: ոչ մեկը
      plain_description: Բացում է չգաղտնագրված կապ LDAP սերվերի հետ։ Խորհուրդ չի տրվում արտադրական միջավայրի համար։
      section_more_info_link_html: 'Այս բաժինը վերաբերում է այս LDAP նույնականացման աղբյուրի կապի անվտանգությանը։ Լրացուցիչ տեղեկությունների համար այցելեք <a href="%{link}">Net::LDAP փաստաթղթերը</a>։

        '
      simple_tls: LDAPS
      simple_tls_description: Օգտագործել LDAPS։ Պահանջում է առանձին պորտ LDAP սերվերի վրա։ Այս ռեժիմը հաճախ հնացած է համարվում, խորհուրդ ենք տալիս հնարավորության դեպքում օգտագործել STARTTLS։
      start_tls: STARTTLS
      start_tls_description: Ուղարկում է STARTTLS հրաման՝ ստանդարտ LDAP պորտին միանալուց հետո։ Խորհուրդ է տրվում գաղտնագրված կապերի համար։
    tls_options:
      tls_certificate_description: Եթե LDAP սերվերի վկայագիրն այս համակարգի վստահության աղբյուրներում չէ, կարող եք այն ձեռքով ավելացնել այստեղ։ Մուտքագրեք PEM X509 վկայագրի տող։
      verify_peer: Ստուգել SSL վկայագիրը
      verify_peer_description_html: 'Միացնում է վկայագրի վստահված շղթայի խիստ SSL ստուգումը։ <br> <strong>Նախազգուշացում՝</strong> Այս ընտրանքի նշումը հանելը անջատում է LDAP սերվերի վկայագրի SSL ստուգումը։ Դա Ձեր կապը ենթարկում է Man in the Middle տիպի հարձակումների վտանգին։

        '
    user_settings: Հատկանիշների համապատասխանեցում
    user_settings_legend: |
      Հետևյալ դաշտերը վերաբերում են այն բանին, թե ինչպես են OpenProject-ում ստեղծվում օգտատերերը LDAP գրառումներից և
      ինչ LDAP հատկանիշներ են օգտագործվում OpenProject-ի օգտատիրոջ հատկանիշները սահմանելու համար (հատկանիշների համապատասխանեցում)։
