    sync_failed: Չհաջողվեց համաժամացնել LDAP-ից՝ %{message}։
    system_account: Համակարգային հաշիվ
    system_account_legend: |
      OpenProject-ը պահանջում է միայն ընթերցելի մուտք համակարգային հաշվի միջոցով՝ Ձեր LDAP ծառում օգտատերերին և խմբերին որոնելու համար։
      Խնդրում ենք հետևյալ բաժնում նշել այդ համակարգային օգտատիրոջ կապակցման տվյալները։
    technical_warning: |
      Այս LDAP ձևը պահանջում է Ձեր LDAP / Active Directory կազմաձևման տեխնիկական իմացություն։
      [Մանրամասն ցուցումների համար խնդրում ենք դիմել մեր փաստաթղթերին](docs_url)։
    tls_mode:
      plain: none
      plain_description: Opens an unencrypted connection to the LDAP server. Not recommended for production.
      section_more_info_link_html: 'Այս բաժինը վերաբերում է այս LDAP նույնականացման աղբյուրի կապի անվտանգությանը։ Լրացուցիչ տեղեկությունների համար այցելեք <a href="%{link}">Net::LDAP փաստաթղթերը</a>։

        '
      simple_tls: LDAPS
      simple_tls_description: Use LDAPS. Requires a separate port on the LDAP server. This mode is often deprecated, we recommend using STARTTLS whenever possible.
      start_tls: STARTTLS
      start_tls_description: Sends a STARTTLS command after connecting to the standard LDAP port. Recommended for encrypted connections.
    tls_options:
      tls_certificate_description: If the LDAP server certificate is not in the trust sources of this system, you can add it manually here. Enter a PEM X509 certifiate string.
      verify_peer: Verify SSL certificate
      verify_peer_description_html: 'Միացնում է վկայագրի վստահված շղթայի խիստ SSL ստուգումը։ <br> <strong>Նախազգուշացում՝</strong> Այս ընտրանքի նշումը հանելը անջատում է LDAP սերվերի վկայագրի SSL ստուգումը։ Դա Ձեր կապը ենթարկում է Man in the Middle տիպի հարձակումների վտանգին։

        '
    user_settings: Հատկանիշների համապատասխանեցում
    user_settings_legend: |
      Հետևյալ դաշտերը վերաբերում են այն բանին, թե ինչպես են OpenProject-ում ստեղծվում օգտատերերը LDAP գրառումներից և
      ինչ LDAP հատկանիշներ են օգտագործվում OpenProject-ի օգտատիրոջ հատկանիշները սահմանելու համար (հատկանիշների համապատասխանեցում)։
