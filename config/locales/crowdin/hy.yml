  setting_work_packages_identifier_semantic_caption: Յուրաքանչյուր նախագիծ ունի եզակի նախագծի նույնացուցիչ, որը նախադասվում է համարին (օրինակ՝ PROJ-11)։ Յուրաքանչյուր նախագծի համարակալումը սկսվում է 1-ից։ Եթե աշխատանքային փաթեթը տեղափոխվում է այլ նախագիծ, ստեղծվում է նոր նույնացուցիչ, սակայն հինը կշարունակի գործել։
  setting_work_packages_projects_export_limit: Աշխատանքային փաթեթների / նախագծերի արտահանման սահմանաչափ
  setting_work_packages_projects_export_limit_text: 'Մեկ արտահանման մեջ ներառվող աշխատանքային փաթեթների կամ նախագծերի առավելագույն քանակը։ Ավելի մեծ արտահանումները կրճատվում են մինչև այս սահմանաչափը։

