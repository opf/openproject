      heading_reset: Վերակայել պահուստավորման թոքենը
      implications: 'Պահուստավորումների միացումը թույլ կտա անհրաժեշտ թույլտվություններ և այս պահուստավորման թոքենն ունեցող ցանկացած օգտատիրոջ ներբեռնել պահուստային պատճեն, որը պարունակում է OpenProject-ի այս տեղակայման բոլոր տվյալները։ Այդ թվում՝ մյուս բոլոր օգտատերերի տվյալները։

        '
      info: 'Պահուստային պատճեն ստեղծելու համար Ձեզ անհրաժեշտ կլինի գեներացնել պահուստավորման թոքեն։ Ամեն անգամ պահուստային պատճեն պահանջելիս պետք է տրամադրեք այս թոքենը։ Կարող եք ջնջել պահուստավորման թոքենը՝ այս օգտատիրոջ համար պահուստավորումն անջատելու համար։

        '
      verification_html: 'Մուտքագրեք %{word}՝ հաստատելու, որ ցանկանում եք %{action} պահուստավորման թոքենը։

        '
