    move:
      bulk_current_type_not_available_in_target_project: 'Աշխատանքային փաթեթների կամ դրանց հետնորդների տեսակները միացված չեն նպատակային նախագծում։ Խնդրում ենք միացնել բացակայող տեսակները նպատակային նախագծում, եթե ցանկանում եք, որ դրանք մնան անփոփոխ։ Հակառակ դեպքում ցուցակից ընտրեք նպատակային նախագծում հասանելի տեսակ։

        '
      current_type_not_available_in_target_project: 'Այս աշխատանքային փաթեթի կամ դրա հետնորդներից մեկի տեսակը միացված չէ նպատակային նախագծում։ Խնդրում ենք միացնել բացակայող տեսակները նպատակային նախագծում, եթե ցանկանում եք, որ դրանք մնան անփոփոխ։ Հակառակ դեպքում ցուցակից ընտրեք նպատակային նախագծում հասանելի տեսակ։

        '
      no_common_statuses_exists: Բոլոր ընտրված աշխատանքային փաթեթների համար հասանելի կարգավիճակ չկա։ Դրանց կարգավիճակը հնարավոր չէ փոխել։
      unsupported_for_multiple_projects: Զանգվածային տեղափոխումը/պատճենումը չի աջակցվում մի քանի նախագծերի աշխատանքային փաթեթների համար
    sharing:
      missing_workflow_warning:
        link_message: Կազմաձևեք աշխատանքային հոսքերը ադմինիստրավորման բաժնում։
        message: "'Աշխատանքային փաթեթի խմբագրող' դերի համար աշխատանքային հոսք կազմաձևված չէ։ Առանց աշխատանքային հոսքի՝ համօգտագործված օգտատերը չի կարող փոփոխել աշխատանքային փաթեթի կարգավիճակը։ Աշխատանքային հոսքերը կարելի է պատճենել։ Ընտրեք աղբյուրի տեսակ (օր.՝ 'Առաջադրանք') և աղբյուրի դեր (օր.՝ 'Անդամ')։ Այնուհետև ընտրեք նպատակային տեսակները։ Սկզբում կարող եք որպես նպատակ ընտրել բոլոր տեսակները։ Վերջում ընտրեք 'Աշխատանքային փաթեթի խմբագրող' դերը որպես նպատակ և սեղմեք 'Պատճենել'։ Այսպիսով ստեղծելով կանխադրվածները՝ ճշգրտեք աշխատանքային հոսքերը այնպես, ինչպես անում եք ցանկացած այլ դերի համար։"
        title: Աշխատանքային հոսքը բացակայում է աշխատանքային փաթեթի համօգտագործման համար
