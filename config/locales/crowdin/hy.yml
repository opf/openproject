        description: OpenProject-ը կարող է ստեղծել քայլ առ քայլ օգնական, որը կօգնի նախագծերի կառավարիչներին լրացնել նախագծի նախաձեռնման հայտը։ Դուք կարող եք ընտրել, թե նախագծի որ հատկանիշները պետք է ներառվեն և ինչ անել ելքային փաստաթղթի հետ։ Միացրեք այն այստեղ՝ օգնականի կազմաձևումը սկսելու համար։
