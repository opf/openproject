        confirmation_message: Նախաձեռնման հայտի օգնականն այլևս հասանելի չի լինի այս ձևանմուշի հիման վրա ստեղծված նոր նախագծերի համար։ Նախագծերի կառավարիչները և նախագծերի սեփականատերերը պետք է ձեռքով կազմաձևեն և լրացնեն համապատասխան տեղեկությունները Նախագծի ընդհանուր տեսքում։
