  text_form_configuration: 'Դուք կարող եք հարմարեցնել, թե որ դաշտերը կցուցադրվեն աշխատանքային փաթեթի ձևերում։ Դուք կարող եք ազատորեն խմբավորել դաշտերը՝ Ձեր բնագավառի կարիքներն արտացոլելու համար։

