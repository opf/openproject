    experimental:
      feature_flags: Գործառույթների դրոշակներ
      save_confirmation: Ուշադրություն։ Տվյալների կորստի վտանգ։ Ակտիվացրեք փորձարարական գործառույթները միայն այն դեպքում, եթե դեմ չեք Ձեր OpenProject-ի տեղակայումը վնասելուն և դրա բոլոր տվյալները կորցնելուն։
      warning_toast: Գործառույթների դրոշակները կարգավորումներ են, որոնք ակտիվացնում են դեռևս մշակման փուլում գտնվող գործառույթներ։ Դրանք պետք է օգտագործվեն միայն փորձարկման նպատակով։ Դրանք երբեք չպետք է ակտիվացվեն կարևոր տվյալներ պարունակող OpenProject-ի տեղակայումներում։ Այս գործառույթները մեծ հավանականությամբ կվնասեն Ձեր տվյալները։ Օգտագործեք դրանք Ձեր իսկ պատասխանատվությամբ։
