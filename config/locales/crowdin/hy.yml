  text_custom_export_cover_instructions: 'Սա այն պատկերն է, որը հայտնվում է Ձեր PDF արտահանումների շապիկի էջի ֆոնին։ Այն պետք է լինի մոտավորապես 800px լայնությամբ և 500px բարձրությամբ PNG կամ JPEG պատկերի նիշք։

    '
  text_custom_export_font_bold_instructions: 'Սա թավ տեքստի տառատեսակի նիշքն է։ Այն պետք է լինի TTF ձևաչափով։

    '
  text_custom_export_font_bold_italic_instructions: 'Սա թավ և շեղ տեքստի տառատեսակի նիշքն է։ Այն պետք է լինի TTF ձևաչափով։

    '
  text_custom_export_font_italic_instructions: 'Սա շեղ տեքստի տառատեսակի նիշքն է։ Այն պետք է լինի TTF ձևաչափով։

    '
  text_custom_export_font_regular_instructions: 'Սա սովորական տեքստի տառատեսակի նիշքն է։ Այն պետք է լինի TTF ձևաչափով և պարտադիր է։

    '
  text_custom_export_footer_instructions: 'PDF արտահանումները կներառեն էջատակի ձախ մասում տեղադրված գրաֆիկական տարր։ Այս պատկերը պետք է լինի PNG կամ JPEG նիշք՝ մոտավորապես 200 պիքսել լայնությամբ։

    '
  text_custom_export_logo_instructions: 'Սա այն լոգոն է, որը հայտնվում է Ձեր PDF արտահանումներում։ Այն պետք է լինի PNG կամ JPEG պատկերի նիշք։ Խորհուրդ է տրվում սև կամ գունավոր լոգո՝ թափանցիկ կամ սպիտակ ֆոնի վրա։

    '
  text_custom_favicon_instructions: 'Սա այն փոքրիկ պատկերակն է, որը հայտնվում է Ձեր դիտարկիչի պատուհանում/ներդիրում՝ էջի վերնագրի կողքին։ Այն պետք է լինի քառակուսի՝ 32 առ 32 պիքսել չափի PNG պատկերի նիշք՝ թափանցիկ ֆոնով։

    '
  text_custom_field_hint_activate_per_project: 'Հատուկ դաշտեր օգտագործելիս՝ նկատի ունեցեք, որ հատուկ դաշտերը նույնպես պետք է ակտիվացվեն յուրաքանչյուր նախագծի համար։

    '
  text_custom_field_hint_activate_per_project_and_type: 'Հատուկ դաշտերը պետք է ակտիվացվեն յուրաքանչյուր աշխատանքային փաթեթի տեսակի և յուրաքանչյուր նախագծի համար։

    '
  text_custom_field_possible_values_info: Յուրաքանչյուր արժեքը՝ առանձին տողում
  text_custom_logo_instructions: 'Լոգոն ավտոմատ մասշտաբավորվում է՝ վերնագոտուն համապատասխանելու համար։ Լավագույն արդյունքի համար վերբեռնեք սպիտակ լոգո թափանցիկ 130×47px պատկերի վրա։ Այդ պատկերի ներսում կարող եք ավելացնել այնքան ազատ տարածք, որքան ցանկանում եք։

    '
  text_custom_logo_mobile_instructions: 'Լոգոն ավտոմատ մասշտաբավորվում է՝ վերնագոտուն համապատասխանելու համար։ Լավագույն արդյունքի համար վերբեռնեք սպիտակ լոգո թափանցիկ 130×33px պատկերի վրա։ Այդ պատկերի ներսում կարող եք ավելացնել այնքան ազատ տարածք, որքան ցանկանում եք։

    '
  text_custom_touch_icon_instructions: 'Սա այն պատկերակն է, որը հայտնվում է Ձեր բջջայինում կամ պլանշետում, երբ էջանիշ եք տեղադրում հիմնական էկրանին։ Այն պետք է լինի քառակուսի՝ 180 առ 180 պիքսել չափի PNG պատկերի նիշք։ Խնդրում ենք համոզվել, որ պատկերի ֆոնը թափանցիկ չէ, հակառակ դեպքում այն վատ տեսք կունենա iOS-ում։

    '
