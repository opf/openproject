  text_no_configuration_data: |-
    Դերերը, տեսակները, աշխատանքային փաթեթների կարգավիճակները և աշխատանքային հոսքը դեռ կազմաձևված չեն։
    Խիստ խորհուրդ է տրվում բեռնել կանխադրված կազմաձևումը։ Բեռնելուց հետո Դուք կկարողանաք փոփոխել այն։
  text_no_notes: Այս աշխատանքային փաթեթի համար մեկնաբանություններ չկան։
  text_no_roles_defined: Սահմանված դերեր չկան։
  text_notice_security_badge_displayed_html: 'Նշում՝ եթե միացված է, սա կցուցադրի Ձեր տեղակայման կարգավիճակի ազդագիրը <a href="%{information_panel_path}">%{information_panel_label}</a> ադմինիստրավորման վահանակում և գլխավոր էջում։ Այն ցուցադրվում է միայն ադմինիստրատորներին։ <br/> Ազդագիրը կստուգի Ձեր OpenProject-ի ընթացիկ տարբերակը OpenProject-ի թողարկումների պաշտոնական տվյալների բազայի հետ՝ Ձեզ ցանկացած թարմացման կամ հայտնի խոցելիության մասին ազդարարելու համար։ Ստուգման տրամադրած տեղեկությունների, հասանելի թարմացումները ցուցադրելու համար անհրաժեշտ տվյալների և այս ստուգումն անջատելու եղանակի մասին ավելին իմանալու համար խնդրում ենք այցելել <a href="%{more_info_url}">կազմաձևման փաստաթղթերը</a>։

    '
  text_notice_too_many_values_are_inperformant: Նշում՝ մեկ էջում ավելի քան 100 տարր ցուցադրելը կարող է մեծացնել էջի բեռնման ժամանակը։
