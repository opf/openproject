            line_2: Մի քանի ակտիվ սպրինտ առանց համօգտագործման (Basic փաթեթ)։
            line_3: Բարելավված բեքլոգ և սպրինտներ՝ բազմակի ընտրության զտիչներով, ավելի հարմար քարշ տալով և թողնելով, ինչպես նաև առկա աշխատանքային փաթեթներ ավելացնելու հնարավորությամբ։
            line_4: PM²/PMflex արտեֆակտների արտահանում և նոր վիջեթ՝ նախագծի փուլերի և դարպասների ընդհանուր տեսքի համար։
            line_5: Վիքի էջերի գլոբալ ցանկ և ավելի հարմար նավարկում կապակցված էջերի միջև։
          new_features_title: 'Թողարկումը պարունակում է տարբեր նոր հնարավորություններ և բարելավումներ, ինչպիսիք են՝

