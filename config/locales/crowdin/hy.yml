              format: "%{message}"
            identifier:
              must_not_be_changed: 'չպետք է փոփոխվի ձեռքով։ Աշխատանքային փաթեթների նույնացուցիչները հատկացվում են ինքնաշխատ և որոշվում են alias աղյուսակի միջոցով, ուստի դրանք ձեռքով փոփոխելը խաթարում է հղումները և նույնացուցիչների պատմությունը։ Եթե այս փոփոխությունը կանխամտածված է, պահպանեք `save(context: :%{context})`-ով և ապահովեք work_package_semantic_aliases աղյուսակի համապատասխանությունը։'
