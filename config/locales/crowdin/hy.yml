      homescreen_description: 'Enterprise փաթեթներն ընդլայնում են OpenProject-ի Community edition-ը լրացուցիչ [Enterprise հավելումներով](enterprise_url) և մասնագիտական աջակցությամբ, ինչն իդեալական է OpenProject-ը կրիտիկական նշանակության միջավայրում շահագործող կազմակերպությունների համար։

        '
      homescreen_subline: Փաթեթը բարելավելով՝ Դուք նաև կաջակցեք բաց կոդով նախագծին։
      internal_comments:
        description: Ներքին մեկնաբանությունները թույլ են տալիս ներքին թիմին մասնավոր կերպով շփվել միմյանց հետ։ Դրանք տեսանելի են միայն նախագծի որոշակի դերերին և երբեք չեն լինի հանրությանը տեսանելի։
