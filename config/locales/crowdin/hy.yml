        description_template: "**Այս աշխատանքային փաթեթն ինքնաշխատ ստեղծվել է %{wizard_name} աշխատանքային հոսքի ավարտից հետո։** Բոլոր ներկայացված տեղեկությունները պարունակող PDF արտեֆակտը ստեղծվել և կցվել է այս աշխատանքային փաթեթին՝ տեղեկատվական և աուդիտի նպատակներով։ Եթե անհրաժեշտ է թարմացնել կամ կրկին գործարկել նախաձեռնման քայլերը, կարող եք ցանկացած պահի կրկին բացել օգնականը՝ օգտագործելով ստորև բերված հղումը՝\n"
        send_confirmation_email: Ուղարկել հաստատման նամակ նախագծի նախաձեռնման հայտը ներկայացրած օգտատիրոջը
