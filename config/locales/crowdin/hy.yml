      mcp_server:
        description: Ներառեք OpenProject-ը Ձեր AI աշխատանքային հոսքերում՝ անվտանգ MCP սերվերի միջոցով։
      meeting_templates:
        description: Սահմանեք հանդիպումների ձևանմուշներ՝ օրակարգի որոշակի կառուցվածքով, և խնայեք ժամանակ՝ դրանք կրկին օգտագործելով նոր հանդիպումներ ստեղծելիս։
      nextcloud_sso:
        description: Ապահովեք Ձեր Nextcloud պահեստի անխափան և ապահով նույնականացումը Single Sign-On-ի միջոցով։ Պարզեցրեք հասանելիության կառավարումը և բարձրացրեք օգտատերերի հարմարավետությունը։
        title: Single Sign-On Nextcloud պահեստի համար
      placeholder_users:
        description: 'Տեղապահ օգտատերերը միջոց են աշխատանքային փաթեթներ նշանակելու այն օգտատերերին, որոնք Ձեր նախագծի մասը չեն։ Դրանք կարող են օգտակար լինել մի շարք դեպքերում; օրինակ, եթե Ձեզ անհրաժեշտ է հետագծել առաջադրանքներ այն ռեսուրսի համար, որը դեռ նշանակված կամ հասանելի չէ, կամ եթե չեք ցանկանում այդ անձին տալ OpenProject-ի հասանելիություն, բայց ցանկանում եք հետագծել իրեն նշանակված առաջադրանքները։

          '
        title: Տեղապահ օգտատերեր
      plan_name: "%{plan} enterprise փաթեթ"
      plan_text_html: Հասանելի է սկսած %{plan_name}-ից։
      plan_title: Enterprise %{plan} հավելում
      plans_title: Enterprise փաթեթներ
      portfolio_management:
        description: Համապատասխանեցրեք Ձեր նախագծերը Ձեր ռազմավարական նպատակներին՝ դրանք կազմակերպելով պորտֆոլիոների և ծրագրերի մեջ։
      project_creation_wizard:
        description: Ստեղծեք քայլ առ քայլ օգնական, որը կօգնի նախագծերի կառավարիչներին լրացնել նախագծի նախաձեռնման հայտը։
      project_list_sharing:
        description: Համօգտագործեք նախագծերի ցանկերն առանձին օգտատերերի հետ։
      readonly_work_packages:
        description: Նշեք աշխատանքային փաթեթները որպես միայն ընթերցելի որոշակի կարգավիճակների համար։
      scim_api:
        description: Ավտոմատացրեք օգտատերերի կառավարումը OpenProject-ում՝ մեր SCIM Server API-ի միջոցով անխափան ինտեգրելով արտաքին ինքնության ծառայությունները, ինչպիսիք են Microsoft Entra-ն կամ Keycloak-ը։ Հասանելի է Enterprise corporate փաթեթից սկսած։
        title: SCIM հաճախորդներ
      sso_auth_providers:
        description: Հնարավորություն տվեք օգտատերերին մտնել արտաքին SSO մատակարարների միջոցով՝ օգտագործելով SAML կամ OpenID Connect և ապահովելով անխափան հասանելիություն ու ինտեգրում առկա ինքնության համակարգերի հետ։
        title: Single Sign-On (SSO)
      title: Enterprise հավելում
      trial_text: Այս հնարավորությունը ներառված է Ձեր ակտիվ Enterprise փորձաշրջանում։
      unlimited: Անսահմանափակ
