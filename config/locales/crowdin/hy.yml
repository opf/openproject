      verification_word_reset: վերակայել
      warning: 'Նոր թոքեն ստեղծելիս Ձեզ թույլատրվելու է պահուստային պատճեն պահանջել միայն 24 ժամ անց։ Սա անվտանգության միջոց է։ Դրանից հետո կարող եք ցանկացած պահի պահանջել պահուստային պատճեն՝ օգտագործելով այդ թոքենը։

