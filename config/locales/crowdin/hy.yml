  ldap_auth_sources:
    attribute_texts:
      admin_map_html: Ոչ պարտադիր՝ LDAP-ի հատկանիշի բանալին, որը <strong>առկայության դեպքում</strong> OpenProject-ի օգտատիրոջը նշում է որպես ադմինիստրատոր։ Կասկածի դեպքում թողեք դատարկ։
      base_dn: |
        Մուտքագրեք LDAP-ի այն ենթածառի Base DN-ը, որտեղ ցանկանում եք, որ OpenProject-ը որոնի օգտատերերին և խմբերին։
        OpenProject-ը կզտի տրամադրված օգտանունները միայն այս ենթածառում։
        Օրինակ՝ ou=users,dc=example,dc=com
      filter_string: |
        Ավելացրեք ոչ պարտադիր RFC4515 զտիչ, որը կկիրառվի LDAP-ում զտված օգտատերերի համար վերադարձված արդյունքների վրա։
        Այն կարող է օգտագործվել՝ սահմանափակելու օգտատերերի այն ցանկը, որոնք OpenProject-ի կողմից գտնվում են նույնականացման և խմբերի համաժամացման համար։
      filter_string_concat: |
        OpenProject-ը գրառումը նույնականացնելու համար միշտ կզտի օգտատիրոջ տրամադրած մուտքի հատկանիշով։ Եթե այստեղ զտիչ նշեք,
        այն կմիացվի AND-ով։ Կանխադրված կարգով որպես զտիչ կօգտագործվի ընդհանրական (objectClass=*) զտիչը։
      generic_map: LDAP-ի հատկանիշի բանալին, որը համապատասխանեցվում է OpenProject-ի `%{attribute}` հատկանիշին
      host: LDAP հոսթի անուն կամ IP հասցե
      login_map: LDAP-ի հատկանիշի բանալին, որն օգտագործվում է օգտատիրոջ եզակի մուտքանունը նույնականացնելու համար։ Սովորաբար դա կլինի `uid` կամ `samAccountName`։
      name: LDAP կապի կամայական անվանում
      onthefly_register: |
        Եթե նշեք այս վանդակը, OpenProject-ը ավտոմատ կերպով կստեղծի նոր օգտատերեր նրանց LDAP գրառումներից,
        երբ նրանք առաջին անգամ նույնականացվեն OpenProject-ում։
        Թողեք այս վանդակը չնշված, որպեսզի LDAP-ի միջոցով նույնականացվեն միայն OpenProject-ում առկա հաշիվները։
      system_user_dn_html: |
        Մուտքագրեք միայն ընթերցելի մուտքի համար օգտագործվող համակարգային օգտատիրոջ DN-ը։
        <br>
        Օրինակ՝ uid=openproject,ou=system,dc=example,dc=com
      system_user_password: Մուտքագրեք համակարգային օգտատիրոջ կապակցման գաղտնաբառը
