  setting_working_days: Աշխատանքային օրեր
  settings:
    antivirus:
      actions:
        delete: Ջնջել նիշքը
        instructions_html: 'Ընտրեք այն գործողությունը, որը պետք է կատարվի այն նիշքերի համար, որոնցում վիրուս է հայտնաբերվել՝ <br/> <ul> <li><strong>%{quarantine_option}</strong>՝ մեկուսացնել նիշքը՝ արգելելով օգտատերերին հասանելիություն ունենալ դրան։ Ադմինիստրատորները կարող են վերանայել և ջնջել մեկուսացված նիշքերն ադմինիստրավորման բաժնում։</li> <li><strong>%{delete_option}</strong>՝ անմիջապես ջնջել նիշքը։</li> </ul>

          '
        quarantine: Մեկուսացնել նիշքը
      clamav_ping_failed: Չհաջողվեց միանալ ClamAV դեմոնին։ Ուշադիր ստուգեք կազմաձևումը և կրկին փորձեք։
      modes:
        clamav_host_html: Մուտքագրեք clamd դեմոնի հոսթի անունը և պորտը՝ բաժանված երկու կետով։ Օրինակ՝ %{example}
        clamav_socket_html: Մուտքագրեք clamd դեմոնի սոկետը, օրինակ՝ %{example}
        description_html: 'Ընտրեք այն ռեժիմը, որով պետք է աշխատի հակավիրուսային սկաների ինտեգրումը։ <br/> <ul> <li><strong>%{disabled_option}</strong>՝ վերբեռնված նիշքերը վիրուսների առկայության համար չեն սկանավորվում։</li> <li><strong>%{socket_option}</strong>՝ Դուք ClamAV-ը տեղակայել եք OpenProject-ի հետ նույն սերվերում, և clamd սկանավորման դեմոնն աշխատում է ֆոնային ռեժիմում</li> <li><strong>%{host_option}</strong>՝ Դուք նիշքերը հոսքով փոխանցում եք արտաքին վիրուսների սկանավորման հոսթին։</li> </ul>

          '
      remaining_quarantined_files_html: 'Վիրուսների սկանավորումն անջատվել է։ %{file_count} մնում են մեկուսացման մեջ։ Մեկուսացված նիշքերը վերանայելու համար խնդրում ենք այցելել այս հղումը՝ %{link}

        '
      remaining_rescanned_files: 'Վիրուսների սկանավորումը հաջողությամբ միացվել է։ Կան %{file_count}, որոնք վերբեռնվել են ավելի վաղ և դեռ պետք է սկանավորվեն։ Այս գործընթացը պլանավորվել է ֆոնային ռեժիմում։ Նիշքերը կմնան հասանելի սկանավորման ընթացքում։

        '
      remaining_scan_complete_html: 'Մնացած նիշքերը սկանավորվել են։ Մեկուսացման մեջ կան %{file_count}։ Դուք վերահղվում եք մեկուսացման էջ։ Օգտագործեք այս էջը՝ մեկուսացված նիշքերը ջնջելու կամ դրանց մեկուսացումը հեռացնելու համար։

        '
      title: Վիրուսների սկանավորում
    attachments:
      show_work_package_attachments: 'Այս ընտրանքն ապաակտիվացնելը կթաքցնի կցորդների ցուցակը նոր նախագծերի աշխատանքային փաթեթների նիշքերի ներդիրում։ Աշխատանքային փաթեթի նկարագրությանը կցված նիշքերը դեռևս կվերբեռնվեն կցորդների ներքին պահեստում։

        '
      whitelist_text_html: 'Սահմանեք վերբեռնվող նիշքերի վավեր ընդլայնումների և/կամ MIME տեսակների ցուցակը։ <br/> Մուտքագրեք նիշքի ընդլայնումներ (օրինակ՝ <code>%{ext_example}</code>) կամ MIME տեսակներ (օրինակ՝ <code>%{mime_example}</code>)։ <br/> Թողեք դատարկ՝ ցանկացած տեսակի նիշքի վերբեռնումը թույլատրելու համար։ Թույլատրվում են բազմաթիվ արժեքներ (յուրաքանչյուր արժեքի համար՝ մեկ տող)։

        '
    authentication:
      login: Մուտք
      omniauth_direct_login_hint_html: 'Եթե այս ընտրանքն ակտիվ է, մուտքի հարցումները կվերահղվեն դեպի կազմաձևված omniauth մատակարարը։ Մուտքի բացվող ցանկը և մուտքի էջն անջատված կլինեն։ <br/> <strong>Նշում՝</strong> եթե չանջատեք նաև գաղտնաբառով մուտքը, ապա այս ընտրանքը միացված վիճակում օգտատերերը դեռևս կկարողանան ներքին եղանակով մուտք գործել՝ այցելելով <code>%{internal_path}</code> մուտքի էջը։

        '
      password_login_bypass_principal_ids_hint: 'Even when password login in disabled, these users and groups will be able to use their password to sign in. This is useful, for example, if the identity provider becomes unavailable. If you include a group, access will be extended to all users in that group.

        '
      password_login_configured_by_environment: 'The following settings are configured through the environment and cannot be edited here:

        '
      password_login_requires_sso_provider: 'Password login restrictions are unavailable because no SSO provider is currently enabled. Configure and enable an SSO provider before changing these settings.

        '
      registration: Գրանցում
      remapping_existing_users_hint: 'Երբ միացված է, ցանկացած կազմաձևված ինքնության մատակարարին թույլ է տալիս մուտք գործել տալ առկա օգտատերերին՝ ըստ իրենց օգտանվան, նույնիսկ եթե օգտատերը երբեք չի մուտք գործել այդ մատակարարի միջոցով։ Սա կարող է օգտակար լինել OpenProject համակարգը նոր SSO մատակարարին տեղափոխելիս, սակայն խորհուրդ չի տրվում այնպիսի մատակարար օգտագործելիս, որին չեն վստահում Ձեր համակարգի բոլոր օգտատերերը։

        '
      sso: Single Sign-On (SSO)
    brute_force_prevention: Օգտատերերի ինքնաշխատ արգելափակում
    date_format:
      first_date_of_week_and_year_set: 'Եթե "%{day_of_week_setting_name}" կամ "%{first_week_setting_name}" ընտրանքներից որևէ մեկը սահմանված է, ապա մյուսը նույնպես պետք է սահմանվի՝ ինտերֆեյսում անհամապատասխանություններից խուսափելու համար։

        '
      first_week_of_year_text_html: 'Ընտրեք հունվարի այն ամսաթիվը, որը պարունակվում է տարվա առաջին շաբաթում։ Այս արժեքը շաբաթվա առաջին օրվա հետ միասին որոշում է տարվա շաբաթների ընդհանուր քանակը։ Լրացուցիչ տեղեկությունների համար խնդրում ենք տեսնել այս թեմայի վերաբերյալ մեր <a href="%{link}" target="_blank">փաստաթղթերը</a>։

