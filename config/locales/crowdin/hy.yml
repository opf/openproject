      confirmation_info: "%{date}-ին մենք %{email} հասցեին ուղարկել ենք էլ. նամակ՝ OpenProject Enterprise-ի անվճար փորձարկումը սկսելու համար անհրաժեշտ ողջ տեղեկությամբ։ Խնդրում ենք ստուգել Ձեր մուտքային արկղը և սեղմել տրամադրված հաստատման հղումը՝ Ձեր 14-օրյա անվճար փորձարկումը սկսելու համար։\n"
      confirmation_subline: 'Խնդրում ենք ստուգել Ձեր մուտքային արկղը և հետևել քայլերին՝ Ձեր 14-օրյա անվճար փորձարկումը սկսելու համար։

        '
      consent: Ես համաձայն եմ [ծառայությունների պայմանների](tos_url) և [գաղտնիության քաղաքականության](privacy_url) հետ։
      domain_caption: Թոքենը վավեր կլինի Ձեր ներկայումս կազմաձևված հոսթի անվան համար։
      not_found: Դուք հայցել եք փորձնական թոքեն, սակայն այդ հարցումն այլևս հասանելի չէ։ Խնդրում ենք փորձել կրկին։
      receive_newsletter: Ես ցանկանում եմ ստանալ OpenProject-ի [տեղեկագիրը](newsletter_url)։
      request_again: Կրկին հայցել
      resend_action: Կրկին ուղարկել հաստատման նամակը
      successfully_saved: Ձեր փորձնական Enterprise թոքենը հաջողությամբ ստացվել է։
      token_sent: Փորձնական թոքենը հայցվել է
      wait_for_confirmation: Մենք Ձեզ ուղարկել ենք էլ. նամակ՝ Ձեր հասցեն հաստատելու համար, որպեսզի կարողանաք ստանալ փորձնական թոքեն։
      welcome_description: Ստացեք նախագծերի կառավարման և թիմային համագործակցության արագ ակնարկ OpenProject Enterprise edition-ի հետ։
      welcome_title: Հնարավորությունների արագ ակնարկ
    upsell:
      already_have_token: 'Արդեն ունե՞ք թոքեն։ Ավելացրեք այն ստորև բերված կոճակի միջոցով՝ պատվիրված Enterprise փաթեթին անցնելու համար։

        '
      baseline_comparison:
        description: Ընդգծեք այս ցանկում անցյալի ցանկացած պահից ի վեր կատարված փոփոխությունները։
      benefits:
        description: Որո՞նք են Enterprise on-premises edition-ի առավելությունները։
        high_security: Անվտանգության հնարավորություններ
        high_security_text: Single sign on (SAML, OpenID Connect, CAS), LDAP խմբեր։
        installation: Տեղադրման աջակցություն
        installation_text: Փորձառու ծրագրային ապահովման ինժեներները Ձեզ կուղղորդեն տեղադրման և կարգավորման ողջ գործընթացում՝ Ձեր սեփական ենթակառուցվածքում։
        premium_features: Enterprise հավելումներ
        premium_features_text: Ճկուն տախտակներ, հատուկ թեմա և լոգո, գծապատկերներ, հատուկ գործողություններով խելացի աշխատանքային հոսքեր, աշխատանքային փաթեթների կցորդների ամբողջական տեքստի որոնում և բազմակի ընտրության հատուկ դաշտեր։
        professional_support: Մասնագիտական աջակցություն
        professional_support_text: Ստացեք հուսալի, անհատականացված աջակցություն աջակցման ծառայության ավագ ինժեներներից, որոնք փորձագիտական գիտելիքներ ունեն բիզնեսի համար կրիտիկական միջավայրերում OpenProject-ի շահագործման վերաբերյալ։
      buy_now_button: Գնել հիմա
      calculated_values:
        description: Հաշվարկվող արժեքները թույլ են տալիս Ձեզ ստեղծել մաթեմատիկական բանաձևի վրա հիմնված հատկանիշ՝ օգտագործելով թվային արժեքներ, նախագծի այլ հատկանիշներ և հատուկ դաշտեր։
      capture_external_links:
        description: Կանխեք սոցիալական ինժեներիայի հարձակումները՝ հայտնաբերելով արտաքին հղումները և նախազգուշացնելով դրանց մասին, նախքան օգտատերերն այցելեն դրանք։
      custom_actions:
        description: Հատուկ գործողությունները մեկ սեղմումով դյուրանցումներ են դեպի նախապես սահմանված գործողությունների խումբ, որոնք Դուք կարող եք հասանելի դարձնել որոշակի աշխատանքային փաթեթներում՝ ըստ կարգավիճակի, դերի, տեսակի կամ նախագծի։
        title: Հատուկ գործողություններ
      custom_field_hierarchies:
        description: Հիերարխիայի հատուկ դաշտերը թույլ են տալիս կազմակերպել հիերարխիկ կառուցվածքներ աշխատանքային փաթեթներում և նախագծերում՝ օգտագործելով բազմամակարդակ ընտրության ցանկեր։
      customize_life_cycle:
        description: Ստեղծեք և կազմակերպեք նախագծի փուլեր, որոնք տարբերվում են PM2 նախագծի ցիկլի պլանավորման կողմից տրամադրվածներից։
      date_alerts:
        description: Ամսաթվերի ազդանշանների միջոցով Դուք ծանուցում կստանաք մոտալուտ սկզբի կամ ավարտի ամսաթվերի մասին, որպեսզի երբեք բաց չթողնեք կամ չմոռանաք կարևոր վերջնաժամկետը։
      define_custom_style:
        description: Հարմարեցրեք Ձեր OpenProject-ի տեղակայումը սեփական լոգոյով և գույներով։
        more_info: Նշում՝ օգտագործվող լոգոն հանրությանը հասանելի կլինի։
        title: Հատուկ գունային թեմա և լոգո
      edit_attribute_groups:
        description: Հարմարեցրեք ձևի կազմաձևումն այս լրացուցիչ հավելումների միջոցով՝
        features:
