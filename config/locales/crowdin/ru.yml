    deletion_info:
      data_consequences:
        other: Все данные, относящиеся к конкретному пользователю, будут удалены. Активность пользователя в общих представлениях, таких как пакеты работ и совещания, не будет удалена, а будет связана с общим "Удаленным пользователем", который нельзя будет связать с исходной учетной записью.
        self: Все данные конкретного пользователя будут удалены. Ваша активность в общих представлениях, таких как пакеты работ и совещания, не будет удалена, а будет связана с общим "Удаленным пользователем", который нельзя будет связать с Вашей исходной учетной записью.
      heading: Удалить учетную запись %{name}?
      login_consequences:
        other: Эта учетная запись будет немедленно удалена из системы, и пользователь больше не сможет войти в систему с ее учетными данными.
        self: Ваша учетная запись будет немедленно удалена из системы, и Вы больше не сможете войти в систему, используя свои учетные данные.
