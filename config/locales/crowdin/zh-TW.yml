    attribute_texts:
      admin_map_html: 可選：LDAP 中的屬性金鑰，<strong>如果存在即</strong>標示 OpenProject 使用者為管理員。有疑問時請留空。
      base_dn: |
        輸入您希望 OpenProject 在 LDAP 中尋找使用者和群組的子目錄的基本 DN。
        OpenProject 將僅篩選此子目樹中所提供的使用者名稱。
        範例：ou=users,dc=example,dc=com
      filter_string: |
        新增選擇性的 RFC4515 過濾器，以套用至在 LDAP 中過濾使用者所傳回的結果。
        這可以用來限制 OpenProject 在驗證和群組同步化時找到的使用者集。
      filter_string_concat: |
        OpenProject 總是會篩選使用者提供的登入屬性來識別記錄。如果您在此提供篩選器，
        ，它將與 AND 連結。預設情況下，一個 catch-all (objectClass=*) 會被用作篩選器。
      generic_map: LDAP 的的屬性對應到 OpenProject的 `%{attribute}`
      host: LDAP 主機名稱或 IP 位址
      login_map: LDAP 中用於識別使用者登入的屬性。 通常是“uid”或“samAccountName”。
      name: LDAP 連線名稱
      onthefly_register: |
        如果勾選此方框，OpenProject 將在使用者"首次"登入時，自動根據 LDAP 資料創建新的使用者帳戶。

        保持此方框不勾選，則僅限於 OpenProject 已有帳戶可以使用 LDAP 驗證登入。
      system_user_dn_html: |
        輸入唯讀權限的系統使用者 DN。
        <br>
        範例：uid=openproject,ou=system,dc=example,dc=com
      system_user_password: 輸入該系統之使用者密碼
