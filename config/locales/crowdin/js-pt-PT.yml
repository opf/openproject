        team_planner:
          add_assignee: Para começar, adicione responsáveis ao planeador da equipa.
          add_existing: Pesquise pacotes de trabalho existentes e arraste-os para o planeador de equipa para atribuí-los instantaneamente a um membro da equipa e definir as datas de início e término.
          calendar: O quadro de planeamento semanal ou quinzenal apresenta todos os pacotes de trabalho atribuídos aos membros da sua equipa.
          card: Arraste os pacotes de trabalho horizontalmente para os mover para trás ou para frente no tempo, arraste as bordas para alterar as datas de início e término, e arraste verticalmente para uma linha diferente para atribuir a outro membro.
          overview: O planeador de equipa permite atribuir tarefas visualmente aos membros da equipa e obter uma visão geral de quem está a trabalhar e no quê (onde).
        welcome: Faça uma visita guiada de 3 minutos para conhecer as <b>funcionalidades mais importantes</b>.<br> Recomendamos que conclua as etapas até ao final. Pode reiniciar a visita a qualquer momento.
        wiki: Na <b>wiki</b> pode documentar e partilhar conhecimento com a sua equipa.
        wp:
          back_button: Utilize a seta de retorno no canto superior esquerdo para sair e regressar à lista de pacotes de trabalho.
          create_button: O botão <b>+ Criar</b> irá adicionar um novo pacote de trabalho ao seu projeto.
          full_view: A vista dos <b>detalhes do pacote de trabalho</b> fornece todas as informações relevantes relativas a um determinado pacote de trabalho, como descrição, estado, prioridade, atividades, dependências e comentários.
          gantt_menu: Crie calendários de projetos e cronogramas facilmente através do módulo de gráfico de Gantt.
          list: Esta síntese do pacote <b>de trabalho</b> fornece uma lista de todo o trabalho no seu projeto, como tarefas, marcos, fases e muito mais. <br> Os pacotes de trabalho podem ser criados e editados diretamente a partir desta vista. Para aceder aos detalhes de um determinado pacote de trabalho, basta clicar duas vezes na sua linha.
          timeline: Aqui pode <b>editar o plano do seu projeto</b>, criar novos pacotes de trabalho, como tarefas, marcos, fases e muito mais, bem como <b>adicionar dependências</b>. Todos os membros da equipa podem consultar e atualizar o plano mais recente a qualquer momento.
