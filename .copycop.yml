---
copyright: COPYRIGHT_short

ignore:
  # 3rd party
  - "**/node_modules/**/*"
  - "**/vendor/**/*"
  - "modules/gitlab_integration/**/*"
  - "lib_static/plugins/verification/**/*"
  - "lib/chronic_duration.rb"
  - "frontend/src/global_styles/content/_loading_indicator.sass"
  # render copyright_header themselves
  - "lib/open_project/plugins/frontend_linking/*.erb"
  # crowdin and generated
  - "modules/*/config/locales/crowdin/*.yml"
  - "config/locales/{crowdin,generated}/*.yml"
  # generated
  - "frontend/out-tsc/**/*"
  - "frontend/dist/**/*"
  - "frontend/.angular/**/*"
  - "public/assets/**/*"
  - "public/plugin_assets/**/*"
  - "bin/{brakeman,bundle,rails,rake,rspec,rubocop,setup,spring}"
  # other
  - ".git/**/*"
  - "tmp/**/*"
  - "log/**/*"
  - "files/**/*"
  # explicitly ignore
  - "**/*.{png,jpg,gif,webp,ico,svg,mp4}"
  - "**/*.{ttf,woff,woff2,eot}"
  - "**/*.{gz,xkt,ifc,bcf}"
  - "**/*.{json,csv,lock,patch,ldif,properties}"
  - "**/*.{pem,crt,pub,asc,token}"
  - "**/*.{md,rdoc,txt,apib}"
  - "lookbook/docs/**/*.md.erb"
  - "packaging/addons/*/templates"
  - "**/*.{eml,xml,xsd}"
  - "**/LICENSE*"
  - "COPYRIGHT{,_short}"
  - ".ruby-version"

styles:
  - comment: "#"
    include:
      - Rakefile
      - Guardfile
      - config.ru
      - "**/Gemfile"
      - "**/Dangerfile"
      - "**/.gitignore"
      - "**/*.rb{,.example}"
      - "**/*.rake"
      - "**/*.gemspec"
      - "**/*.atom.builder"
      - "**/*.yml{,.example}"
      - "**/*.sh"
  - comment: "//"
    alternative_comments:
      - ["/*", "*/"]
    include:
      - "**/*.{js,mjs,cjs}"
      - "**/*.{ts,tsx}{,.example}"
      - "**/*.{sass,scss}{,.example}"
  - comment: ["<%#", "#%>"]
    alternative_comments:
      - ["<%#", "%>"]
    include: "**/*.erb"
  - comment: ["/*", "*/"]
    include: "**/*.css"
  - comment: "--"
    alternative_comments:
      - ["/*", "*/"]
    include: "**/*.sql"
  # keep last for relevant styles above to win
  - comment: "#"
    include:
      - "{bin,docker,packaging,script}/**/*"
