---
copyright: COPYRIGHT_short

ignore:
  # 3rd party
  - "**/node_modules/**/*"
  - "**/vendor/**/*"
  - "modules/gitlab_integration/**/*"
  - "lib_static/plugins/verification/**/*"
  - "lib/chronic_duration.rb"
  # crowdin and generated
  - "modules/*/config/locales/crowdin/*.yml"
  - "config/locales/{crowdin,generated}/*.yml"
  # generated
  - "frontend/out-tsc/**/*"
  - "frontend/dist/**/*"
  - "frontend/.angular/**/*"
  - "public/assets/**/*"
  - "public/plugin_assets/**/*"
  # other
  - ".git/**/*"
  - "tmp/**/*"

styles:
  - comment: "#"
    include:
      - Rakefile
      - config.ru
      - "**/{Gemfile,.gitignore}"
      - "**/*.rb{,.example}"
      - "**/*.rake"
      - "**/*.atom.builder"
      - "**/*.yml{,.example}"
  - comment: "//"
    alternative_comments:
      - ["/*", "*/"]
    include:
      - "**/*.{js,mjs,cjs}"
      - "**/*.{ts,tsx}"
      - "**/*.{sass,scss}"
  - comment: ["<%#", "#%>"]
    alternative_comments:
      - ["<%#", "%>"]
    include: "**/*.{html,text,json,js,css}.erb"
  - comment: ["/*", "*/"]
    include: "**/*.css"
  - comment: "--"
    alternative_comments:
      - ["/*", "*/"]
    include: "**/*.sql"
