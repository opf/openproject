version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    groups:
      blocknote-minor-patch:
        patterns:
          - "@blocknote/*"
        update-types:
          - "minor"
          - "patch"
      other-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "@blocknote/*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 5