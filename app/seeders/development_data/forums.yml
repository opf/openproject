    - author: admin_de
      content: Will Quote also work on the first message?
    - author: project_admin
      content: Yes, every card gets the same menu. Only Delete stays off the opening post.
    - author: reader
      content: And when a topic is locked? Does the reply box just vanish?
    - author: admin
      content: It does, and Quote goes away too. Copy link still works.
    - author: work_packager
      content: Just tried the prototype on my phone. So much better than those squeezed tables.
    - author: member
      content: 'First part is up for review. No more pages: every link lands on its reply.'
    - author: admin_de
      content: Tried it on a 300-reply thread. It loads, but the page is very long. Looking forward to step two.
    - author: project_admin
      content: 'Step two is next: the first message, the latest replies, and a button to load the older ones.'
    - author: admin
      content: Great work, everyone. This goes into the next release. Thanks for all the input!
