services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    restart: no
    volumes:
      - gitlab-etc:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-opt:/var/opt/gitlab
      # Omnibus GitLab trusts every .crt in /etc/gitlab/trusted-certs during
      # reconfigure, so mounting the step-ca certs there lets webhooks reach the
      # TLS-encrypted OpenProject host without freezing a full CA bundle.
      - type: volume
        source: step
        target: /etc/gitlab/trusted-certs
        read_only: true
        volume:
          subpath: certs
    networks:
      - external
    extra_hosts:
      - "openproject.${OPENPROJECT_DOCKER_DEV_TLD:-local}:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gitlab.rule=Host(`gitlab.${OPENPROJECT_DOCKER_DEV_TLD:-local}`)"
      - "traefik.http.routers.gitlab.entrypoints=websecure"
      - "traefik.http.services.gitlab.loadbalancer.server.port=80"

volumes:
  gitlab-etc:
  gitlab-logs:
  gitlab-opt:
  step:
    name: tls_step
    external: true

networks:
  external:
    name: gateway
    external: true
