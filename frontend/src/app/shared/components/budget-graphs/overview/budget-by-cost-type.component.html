@if (hasChartData()) {
  <div class="position-relative mx-auto" style="height:60vh;max-height:500px">
    <p [id]="chartDescriptionId" hidden>{{ chartDescription() }}</p>
    <canvas
      baseChart
      role="img"
      [attr.aria-label]="chartLabel"
      [attr.aria-describedby]="chartDescriptionId"
      [data]="pieChartData()"
      [options]="pieChartOptions()"
      type="pie"
    >
      {{ chartDescription() }}
    </canvas>
    <div #tooltipHost></div>
  </div>
}
