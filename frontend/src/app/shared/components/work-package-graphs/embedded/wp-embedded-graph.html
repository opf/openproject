<div class="op-wp-embedded-graph work-packages-embedded-view--container loading-indicator--location" #graphContainer [style.height]="chartHeight">
  @if (hasDataToDisplay) {
    <p [id]="chartDescriptionId" hidden>
      {{ chartSummary }}
    </p>
    <canvas baseChart
      role="img"
      [attr.aria-label]="text.chartLabel"
      [attr.aria-describedby]="chartDescriptionId"
      [datasets]="chartData"
      [labels]="chartLabels"
      [type]="mappedChartType"
      [options]="internalChartOptions"
      [plugins]="plugins"
      >
      {{chartDescription}}
    </canvas>
  }
  @if (!hasDataToDisplay && initialized) {
    <op-no-results [title]="text.noResults" />
  }
</div>
