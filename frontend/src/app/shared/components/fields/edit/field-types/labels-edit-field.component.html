@if (url) {
  <op-labels-autocompleter #labelsAutocompleter class="inline-edit--field {{ handler.fieldName }}"
    [url]="url"
    [multiple]="true"
    [hideSelected]="true"
    [disabled]="inFlight"
    bindLabel="name"
    [ariaLabel]="schema.name"
    [focusDirectly]="!(handler.inEditMode || isNew)"
    [openDirectly]="!(handler.inEditMode || isNew)"
    appendTo="body"
    [model]="value"
    [id]="handler.htmlId"
    (change)="onModelChange($event)"
    (keydown)="handler.handleUserKeydown($event, true)"
    (cancel)="handler.handleUserCancel()"
    (remove)="labelsAutocompleter.repositionDropdown()"
   />

  @if (!handler.inEditMode) {
    <edit-field-controls [fieldController]="self"
      (onSave)="handler.handleUserSubmit()"
      (onCancel)="handler.handleUserCancel()"
      [saveTitle]="text.save"
      [cancelTitle]="text.cancel" />
  }
}
