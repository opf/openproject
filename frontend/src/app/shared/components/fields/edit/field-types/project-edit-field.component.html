@if (url) {
  <op-project-autocompleter #projectAutocompleter [ngClass]="'inline-edit--field ' + handler.fieldName"
    [model]="selection.model()"
    [compareWith]="selection.bridge.compareWith"
    [trackByFn]="selection.bridge.trackBy"
    [url]="url"
    [filters]="APIFilters"
    [focusDirectly]="!(handler.inEditMode || isNew)"
    [openDirectly]="!isNew"
    [isInlineContext]="true"
    appendTo=".op-wide-autocomplete-wrapper"
    [inputAttrs]="selection.state().kind === 'invalid' | selectionInputAttrs: handler.htmlId + '-selection-error'"
    (change)="selection.bridge.accept($event, projectAutocompleter)"
    (cancel)="handler.handleUserCancel()"
   />
  @if (selection.state().kind === 'invalid') {
    <op-selection-error [id]="handler.htmlId + '-selection-error'" />
  }
} @else {
  <op-content-loader
    class="project-edit-field--loading-indicator"
    viewBox="0 0 100 24"
    >
    <svg:rect x="0" y="0" width="100%" height="100%" rx="1" />
  </op-content-loader>
}
