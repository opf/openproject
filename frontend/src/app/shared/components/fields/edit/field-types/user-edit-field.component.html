@if (url) {
  <op-user-autocompleter class="inline-edit--field {{ handler.fieldName }}"
    [url]="url"
    [inviteUserToProject]="projectId"
    [focusDirectly]="!(handler.inEditMode || isNew)"
    [openDirectly]="!(handler.inEditMode || isNew)"
    appendTo="body"
    [model]="selection.bridge.model"
    [compareWith]="selection.bridge.compareWith"
    [trackByFn]="selection.bridge.trackBy"
    [id]="handler.htmlId"
    (change)="selection.bridge.accept($event)"
    (cancel)="handler.handleUserCancel()"
    (userInvited)="selection.bridge.accept($event)"
   />
  @if (selection.state.kind === 'invalid') {
    <op-selection-error />
  }
}
