<div class="inplace-edit--dashboard">
  <div class="inplace-edit--controls">
    <button
        type="button"
        class="inplace-edit--control inplace-edit--control--save"
        [disabled]="(field.required && field.isEmpty()) || undefined"
        opTooltip
        [label]="saveTitle"
        (click)="save()"
    >
      <op-icon icon-classes="icon-checkmark icon-no-color" />
    </button>
    <button
        type="button"
        class="inplace-edit--control inplace-edit--control--cancel"
        opTooltip
        [label]="cancelTitle"
        (click)="cancel()"
    >
      <op-icon icon-classes="icon-close icon-no-color" />
    </button>
</div>
</div>
