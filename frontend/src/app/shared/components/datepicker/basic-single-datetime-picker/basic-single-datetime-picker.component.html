<input
  #input
  type="text"
  autocomplete="off"
  class="spot-input"
  [ngClass]="inputClassNames()"
  [value]="currentValue()"
  [attr.data-value]="currentValue()"
  [id]="inputId()"
  [name]="name()"
  [attr.name]="name()"
  [required]="required()"
  [disabled]="isDisabled()"
  [placeholder]="placeholder()"
  />
