<input
  #input
  type="text"
  autocomplete="off"
  class="spot-input"
  [ngClass]="inputClassNames"
  [value]="value"
  [attr.data-value]="value"
  [attr.data-action]="dataAction"
  [id]="id"
  [name]="name"
  [attr.name]="name"
  [required]="required"
  [disabled]="disabled"
  [placeholder]="placeholder"
  />
