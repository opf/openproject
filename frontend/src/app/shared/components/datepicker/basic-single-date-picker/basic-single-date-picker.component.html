@if (!mobile) {
  <input
    #input
    type="text"
    autocomplete="off"
    class="spot-input"
    [ngClass]="inputClassNames()"
    [ngModel]="currentValue()"
    [attr.data-value]="currentValue()"
    [id]="inputId()"
    [name]="name()"
    [attr.name]="name()"
    [required]="required()"
    [disabled]="disabled()"
    [placeholder]="placeholder()"
    (input)="changeValueFromInput($event.target.value)"
    (focus)="showDatePicker()"
    (click)="sentCalendarToTopLayer()"
    [attr.data-remote-field-key]="remoteFieldKey()"
    />
}

@if (mobile) {
  <input
    type="date"
    class="spot-input"
    [ngClass]="inputClassNames()"
    [attr.data-value]="currentValue()"
    [id]="inputId()"
    [name]="name()"
    [attr.name]="name()"
    [required]="required()"
    [disabled]="disabled()"
    [placeholder]="placeholder()"
    [ngModel]="currentValue()"
    (ngModelChange)="changeValueFromInput($event)"
    />
}
