@if (exists) {
  <a
    class="Link op-attribute-help-text help-text--entry"
    [attr.id]="buttonId"
    [href]="helpTextPath"
    opTooltip
    [label]="text.open_dialog"
    tooltip-direction="sw"
    [attr.data-qa-help-text-for]="attribute"
    [attr.aria-disabled]="isLoading"
    (click)="handleClick($event)"
    >
    @if (additionalLabel) {
      <span [textContent]="additionalLabel"></span>
    }
    <svg question-icon size="xsmall"></svg>
  </a>
}
