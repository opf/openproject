<blankslate>
  @if (icon(); as icon) {
    <blankslate-icon [icon]="icon" />
  }
  <blankslate-heading [level]="headingLevel()">{{ title() }}</blankslate-heading>
  @if (message()) {
    <blankslate-description>{{ message() }}</blankslate-description>
  }
  <blankslate-action [hidden]="!action()"><ng-content select="[opNoResultsAction]" /></blankslate-action>
</blankslate>
