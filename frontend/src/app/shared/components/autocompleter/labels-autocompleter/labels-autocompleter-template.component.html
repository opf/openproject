<ng-template #optionTemplate let-item let-search="search">
  <span
    class="ng-option-label"
    [opSearchHighlight]="search"
  >{{ item.name }}</span>
</ng-template>

<ng-template #tagTemplate let-search="search">
  <span class="labels-autocompleter--create-option">{{ search }} <span class="color-fg-muted">{{ newLabelSuffix }}</span></span>
</ng-template>
