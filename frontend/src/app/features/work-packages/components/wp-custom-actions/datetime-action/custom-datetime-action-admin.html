<div class="form--field-container">
  <span class="form--select-container">
    <select class="form--select"
      [attr.id]="fieldId"
      [(ngModel)]="selectedOperatorKey"
      (change)="onOperatorChange()">
      @for (operator of operators; track operator.key) {
        <option
          [value]="operator.key"
          [textContent]="operator.label"
          >
        </option>
      }
    </select>
  </span>
  @if (fixedValueActive) {
    <span class="form--text-field-container -slim">
      <op-basic-single-datetime-picker [id]="fieldId + '_visible'"
        [name]="fieldId + '_input'"
        [value]="fieldValue"
        (valueChange)="updateFixedValue($event)"
        classes="form--text-field" />
    </span>
  }
  @if (relativeValueActive) {
    <span class="form--select-container">
      <select class="form--select"
        [attr.id]="fieldId + '_relation'"
        [(ngModel)]="selectedRelationKey"
        (change)="onRelativeChange()">
        @for (relation of relations; track relation.key) {
          <option
            [value]="relation.key"
            [textContent]="relation.label"
            >
          </option>
        }
      </select>
    </span>
    <span class="form--text-field-container -xslim">
      <input type="number"
        min="0"
        class="form--text-field"
        [attr.id]="fieldId + '_days'"
        [attr.aria-label]="daysLabel"
        [(ngModel)]="selectedDays"
        (change)="onRelativeChange()"/>
    </span>
    <span class="form--select-container">
      <select class="form--select"
        [attr.id]="fieldId + '_hours'"
        [(ngModel)]="selectedHours"
        (change)="onRelativeChange()">
        @for (hour of hours; track hour.key) {
          <option
            [value]="hour.key"
            [textContent]="hour.label"
            >
          </option>
        }
      </select>
    </span>
    <span class="form--select-container">
      <select class="form--select"
        [attr.id]="fieldId + '_minutes'"
        [(ngModel)]="selectedMinutes"
        (change)="onRelativeChange()">
        @for (minute of minutes; track minute.key) {
          <option
            [value]="minute.key"
            [textContent]="minute.label"
            >
          </option>
        }
      </select>
    </span>
  }
  <input type="hidden"
    [name]="fieldName"
    [value]="fieldValue"/>
</div>
