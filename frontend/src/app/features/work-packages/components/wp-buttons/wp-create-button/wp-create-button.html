<div class="wp-create-button">
  <button
    class="button -primary add-work-package"
    type="button"
    [disabled]="createPaneOpen"
    [attr.aria-disabled]="allowed === false || null"
    opTooltip
    [label]="text.explanation"
    tooltipWhenTruncated=".button--text"
    opTypesCreateDropdown
    [projectIdentifier]="projectIdentifier"
    [dropdownActive]="allowed"
    [fullView]="fullView"
  >
    <svg plus-icon size="small"/>
    <span class="button--text"
          [textContent]="text.createWithDropdown"
          aria-hidden="true"></span>
    <svg triangle-down-icon size="small"/>
  </button>
</div>
