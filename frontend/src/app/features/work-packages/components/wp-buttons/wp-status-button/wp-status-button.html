@if (status) {
  <div
    class="op-wp-status-button"
    [ngClass]="{'op-wp-status-button_small' : small}"
    data-test-selector="op-wp-status-button"
    >
    <button
      class="op-wp-status-button--button button"
      [ngClass]="statusHighlightClass"
      type="button"
      [attr.aria-disabled]="!allowed || null"
      title=""
      opTooltip
      [label]="text.status + ' ' + status.name"
      [description]="disabledReason ?? undefined"
      [tooltipWhenObscured]="disabledReason ? undefined : statusText"
      wpStatusDropdown
      [wpStatusDropdown-workPackage]="workPackage"
      >
      @if (isReadonly) {
        <span
          class="op-wp-status-button--text button--text"
          >
          <op-icon icon-classes="button--icon icon-locked" />
        </span>
      }
      <span #statusText class="op-wp-status-button--text button--text">
        <span class="sr-only">{{ text.status }} </span>
        <span [textContent]="status.name"></span>
      </span>
      <op-icon icon-classes="button--icon icon-small icon-pulldown" />
    </button>
  </div>
}
