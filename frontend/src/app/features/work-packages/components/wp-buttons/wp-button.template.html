<button class="button {{ buttonClass }}"
        type="button"
        [class.-active]="isActive"
        [disabled]="disabled || (!isToggle() && isActive)"
        [attr.id]="buttonId"
        opTooltip
        [label]="label"
        [attr.accesskey]="accessKey"
        (click)="performAction($event)">
  <svg octicon [icon]="icon" size="small" aria-hidden="true"></svg>
</button>
