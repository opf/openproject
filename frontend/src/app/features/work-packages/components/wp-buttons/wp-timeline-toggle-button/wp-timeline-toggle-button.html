<ul id="work-packages-timeline-mode-selection"
  class="toolbar-button-group work-packages-timeline-toggle-button">

  @if (isActive) {
    <li>
      <button id="work-packages-timeline-zoom-auto-button"
        class="button timeline-toolbar--button toolbar-icon"
        [ngClass]="getAutoZoomToggleClass()"
        opTooltip
        [label]="text.zoomAuto"
        (click)="enableAutoZoom()">
        <op-icon icon-classes="icon-zoom-auto button--icon" />
      </button>
    </li>
  }

  @if (isActive) {
    <li>
      <button id="work-packages-timeline-zoom-out-button"
        class="button timeline-toolbar--button toolbar-icon"
        type="button"
        opTooltip
        [label]="text.zoomOut"
        [attr.aria-disabled]="isMaxLevel || null"
        (click)="updateZoomWithDelta(1)">
        <op-icon icon-classes="icon-zoom-out button--icon" />
      </button>
    </li>
  }

  @if (isActive) {
    <li>
      <button id="work-packages-timeline-zoom-in-button"
        class="button timeline-toolbar--button toolbar-icon"
        type="button"
        opTooltip
        [label]="text.zoomIn"
        [attr.aria-disabled]="isMinLevel || null"
        (click)="updateZoomWithDelta(-1)">
        <op-icon icon-classes="icon-zoom-in button--icon" />
      </button>
    </li>
  }
</ul>
