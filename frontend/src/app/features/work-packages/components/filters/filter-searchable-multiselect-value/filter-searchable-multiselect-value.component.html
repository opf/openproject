<div class="inline-label ng-select-container"
     id="div-values-{{filter.id}}">

  <op-autocompleter #valuesAutocompleter
    class="advanced-filters--ng-select -multi-select"
    [id]="'values-' + filter.id"
    [getOptionsFn]="autocompleterFn"
    [groupBy]="groupByFn"
    [classes]="{'-required-highlighting' : filter.values.length === 0}"
    [virtualScroll]="false"
    [closeOnSelect]="false"
    [placeholder]="text.placeholder"
    [hideSelected]="true"
    [multiple]="true"
    [fetchDataDirectly]="true"
    [focusDirectly]="shouldFocus"
    [model]="selection.model()"
    [resource]="resourceType"
    [compareWith]="selection.bridge.compareWith"
    [trackByFn]="itemTracker"
    (change)="setValues($event, valuesAutocompleter)"
   />

  @if (selection.state().kind === 'invalid') {
    <op-selection-error />
  }
</div>
