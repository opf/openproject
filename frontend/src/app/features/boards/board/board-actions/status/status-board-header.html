@if (status) {
  <div class="op-status-board-header">
    <small [textContent]="text.status"></small>
    @if (canRename) {
      <editable-toolbar-title [title]="status.name"
        [smallHeader]="true"
        [inFlight]="inFlight"
        (onSave)="renameStatus($event)"
        [editable]="true"
        class="-small" />
    } @else {
      <h2 class="editable-toolbar-title--fixed">
        {{ status.name }}
      </h2>
    }
  </div>
}
