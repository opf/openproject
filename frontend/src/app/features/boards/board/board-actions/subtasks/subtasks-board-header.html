@if (resource) {
  <h2 class="op-subtask-board-header editable-toolbar-title--fixed">
    <small
      class="op-subtask-board-header--work-package-type"
      [ngClass]="typeHighlightingClass"
      [textContent]="resource.type.name"
    >
    </small>
    <br />
    <a
      [href]="pathHelper.workPackagePath(idFromLink(resource.href))"
      [textContent]="resource.subjectWithId(60)"
      target="_blank"
    >
    </a>
  </h2>
}
