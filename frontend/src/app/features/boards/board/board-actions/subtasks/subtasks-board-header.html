@if (resource) {
  <div class="op-subtask-board-header">
    <h2 class="editable-toolbar-title--fixed">
      <small class="op-subtask-board-header--work-package-type"
            [ngClass]="typeHighlightingClass"
            [textContent]="resource.type.name">
      </small>
      <br/>
      <a [href]="pathHelper.workPackagePath(idFromLink(resource.href))"
        [textContent]="resource.subjectWithId(55)"
        target="_blank">
      </a>
    </h2>
  </div>
}
