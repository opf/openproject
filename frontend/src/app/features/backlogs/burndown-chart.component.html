@if (hasChartData()) {
  <div class="position-relative mx-auto op-sprint-chart--canvas">
    <canvas
      baseChart
      role="img"
      [data]="lineChartData()"
      [options]="lineChartOptions()"
      [type]="'line'"
      [attr.aria-label]="chartLabel"
      [attr.aria-describedby]="chartDescriptionId"
    >
      <span [id]="chartDescriptionId">{{ chartDescription() }}</span>
    </canvas>
  </div>
} @else {
  <op-no-results />
}
