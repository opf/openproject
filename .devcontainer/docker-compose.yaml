x-cacert: &cacert
  volumes:
    - cacert:/etc/ssl/certs:ro
    - cacert:/etc/pki/tls/certs:ro
  environment:
    SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    SSL_CERT_DIR: /etc/ssl/certs
    REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
    NODE_EXTRA_CA_CERTS: /etc/ssl/certs/root_ca.crt
    CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
    GRPC_DEFAULT_SSL_ROOTS_FILE_PATH: /etc/ssl/certs/ca-certificates.crt
  depends_on:
    ca-bundle:
      condition: service_completed_successfully

services:
  openproject:
    <<: *cacert
    depends_on:
      postgresql:
        condition: service_healthy
      traefik:
        condition: service_healthy
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.openproject-assets.rule=Host(`openproject.${OPENPROJECT_DOCKER_DEV_TLD:-localhost}`) && PathPrefix(`/assets/frontend`)"
      - "traefik.http.routers.openproject-assets.entrypoints=websecure"
      - "traefik.http.routers.openproject-assets.service=openproject-assets"
      - "traefik.http.services.openproject-assets.loadbalancer.server.port=4200"

      - "traefik.http.routers.openproject.rule=Host(`openproject.${OPENPROJECT_DOCKER_DEV_TLD:-localhost}`)"
      - "traefik.http.routers.openproject.entrypoints=websecure"
      - "traefik.http.routers.openproject.service=openproject"
      - "traefik.http.services.openproject.loadbalancer.server.port=3000"
    build:
      context: ../
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    volumes:
      - ../:/home/dev/openproject
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      DISPLAY: ${DISPLAY}
      OPENPROJECT_DEV_EXTRA_HOSTS: openproject.${OPENPROJECT_DOCKER_DEV_TLD:-localhost}
      OPENPROJECT_FE_DOMAIN: openproject.${OPENPROJECT_DOCKER_DEV_TLD:-localhost}
      FE_HOST: 0.0.0.0
      NG_SERVE_EXTRA_ARGS: --allowed-hosts=openproject.${OPENPROJECT_DOCKER_DEV_TLD:-localhost}
      NG_ALLOWED_HOSTS: openproject.${OPENPROJECT_DOCKER_DEV_TLD:-localhost}
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: openproject.${OPENPROJECT_DOCKER_DEV_TLD:-localhost}
      OPENPROJECT_HOST__NAME: openproject.${OPENPROJECT_DOCKER_DEV_TLD:-localhost}
      OPENPROJECT_HTTPS: true
      OPENPROJECT_CLI_PROXY: "https://openproject.${OPENPROJECT_DOCKER_DEV_TLD:-localhost}"
      OPENPROJECT_DB_URL: postgres://openproject:openproject@postgresql:5432/openproject
  postgresql:
    image: postgres:17.11
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: openproject
      POSTGRES_PASSWORD: openproject
      POSTGRES_DB: openproject
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  traefik:
    image: traefik:latest
    depends_on:
      step:
        condition: service_healthy
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
      - "[::1]:80:80"
      - "[::1]:443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - acme:/acme
      - step:/step:ro
    restart: unless-stopped
    environment:
      TRAEFIK_LOG_LEVEL: INFO
      TRAEFIK_API_DISABLEDASHBOARDAD: true
      TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT: false
      TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: ":80"
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_TO: websecure
      TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS: ":443"
      TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_TLS_CERTRESOLVER: step
      TRAEFIK_CERTIFICATESRESOLVERS_STEP_ACME_CASERVER: https://step:9000/acme/acme/directory
      TRAEFIK_CERTIFICATESRESOLVERS_STEP_ACME_TLSCHALLENGE: true
      TRAEFIK_CERTIFICATESRESOLVERS_STEP_ACME_EMAIL: root@localhost
      TRAEFIK_CERTIFICATESRESOLVERS_STEP_ACME_STORAGE: /acme/acme.json
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_HTTPCHALLENGE_ENTRYPOINT: web
      TRAEFIK_ENTRYPOINTS_PING_ADDRESS: ":8080"
      TRAEFIK_PING: "true"
      TRAEFIK_PING_ENTRYPOINT: "ping"
      LEGO_CA_CERTIFICATES: /step/certs/root_ca.crt
    healthcheck:
      test:
      - "CMD"
      - "traefik"
      - "healthcheck"
      - "--ping"
      - "--entrypoints.ping.address=:8080"
      - "--ping.entrypoint=ping"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      default:
        aliases:
          - traefik.${OPENPROJECT_DOCKER_DEV_TLD:-localhost}
          - openproject.${OPENPROJECT_DOCKER_DEV_TLD:-localhost}
          - hocuspocus.${OPENPROJECT_DOCKER_DEV_TLD:-localhost}
    labels:
      - "traefik.http.routers.traefik.rule=Host(`traefik.${OPENPROJECT_DOCKER_DEV_TLD:-localhost}`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.entrypoints=websecure"

  step:
    image: smallstep/step-ca:latest
    restart: unless-stopped
    environment:
      - TZ=UTC
      - DOCKER_STEPCA_INIT_NAME=OpenProject Development
      - DOCKER_STEPCA_INIT_DNS_NAMES=step,localhost
      - DOCKER_STEPCA_INIT_PROVISIONER_NAME=openproject
      - DOCKER_STEPCA_INIT_PASSWORD=openproject
      - DOCKER_STEPCA_INIT_ACME=true
    volumes:
      - step:/home/step
    healthcheck:
      test:
      - "CMD-SHELL"
      - "step ca health 2>/dev/null | grep -q '^ok'"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  ca-bundle:
    image: alpine
    depends_on:
      step:
        condition: service_healthy
    volumes:
      - step:/step:ro
      - cacert:/cacert
      - ./create-ca-bundle.sh:/create-ca-bundle.sh
    command:
      - /create-ca-bundle.sh

volumes:
  step:
  acme:
  cacert:
