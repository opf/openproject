volumes:
  bundle:
  tmp:
  pgdata:

services:
  workspace:
    build:
      context: ..
      dockerfile: docker/dev/backend/Dockerfile
      target: develop
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql://openproject:openproject@db:5432/openproject?pool=100
      OPENPROJECT_CACHE__MEMCACHE__SERVER: cache:11211
      OPENPROJECT_EDITION: standard
      OPENPROJECT_RAILS__CACHE__STORE: file_store
      OPENPROJECT_COLLABORATIVE__EDITING__HOCUSPOCUS__URL: ws://localhost:1234
      OPENPROJECT_COLLABORATIVE__EDITING__HOCUSPOCUS__SECRET: secret12345
      PORT: 3000
      RAILS_ENV: development
    volumes:
      - "..:/home/dev/openproject:cached"
      - "bundle:/usr/local/bundle"
      - "tmp:/home/dev/openproject/tmp"
    depends_on:
      - db
      - cache

  db:
    image: pgvector/pgvector:pg17-trixie
    restart: unless-stopped
    stop_grace_period: "3s"
    volumes:
      - "pgdata:/var/lib/postgresql/data"
    environment:
      POSTGRES_USER: openproject
      POSTGRES_PASSWORD: openproject
      POSTGRES_DB: openproject

  cache:
    image: memcached
    restart: unless-stopped
