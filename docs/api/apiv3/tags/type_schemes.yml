---
description: |-
  A type scheme limits, orders and defaults the work package types that can be chosen when a work package is created
  or its type is changed in the projects the scheme is assigned to. Existing work packages are never modified.

  ## Actions

  | Link   | Description                              | Condition                    |
  | :----: | ---------------------------------------- | ---------------------------- |
  | create | Create a type scheme                     | **Permission**: administrator |
  | update | Update a type scheme                     | **Permission**: administrator |
  | delete | Delete a type scheme not used by projects | **Permission**: administrator |

  ## Local Properties

  | Property    | Description                                          | Type    | Constraints | Supported operations |
  | :---------: | ---------------------------------------------------- | ------- | ----------- | -------------------- |
  | id          | Type scheme id                                       | Integer | x > 0       | READ                 |
  | name        | Unique name                                          | String  | not null    | READ / WRITE         |
  | description |                                                      | String  |             | READ / WRITE         |
  | active      | Inactive schemes do not filter types                 | Boolean |             | READ                 |
  | isDefault   | Assigned automatically to newly created projects     | Boolean |             | READ                 |
  | typeItems   | Ordered types with exactly one `default: true` entry | Array   |             | READ / WRITE         |
  | createdAt   | Time of creation                                     | DateTime |            | READ                 |
  | updatedAt   | Time of the most recent change                       | DateTime |            | READ                 |
name: Type Schemes
