description: |-
  Represents an individual page in a project's wiki.

  ## Actions

  | Link                | Description                              | Condition                          |
  |:-------------------:|------------------------------------------|------------------------------------|
  | update              | Validate an update                       | **Permission**: edit wiki pages    |
  | updateImmediately   | Update the wiki page                     | **Permission**: edit wiki pages    |
  | delete              | Delete the wiki page                     | **Permission**: edit wiki pages    |
  | addAttachment       | Attach a file to the wiki page           | **Permission**: edit wiki pages    |

  ## Linked Properties

  | Property         | Description                                            | Type        | Constraints    | Supported operations |
  | :--------------: | ------------------------------------------------------ | ----------- | -------------- | -------------------- |
  | self             | This wiki page                                         | WikiPage    | not null       | READ                 |
  | attachments      | The files attached to this wiki page                   | Collection  |                | READ                 |
  | project          | The project the wiki page belongs to                   | Project     | not null       | READ                 |

  ## Local Properties

  | Property         | Description                                 | Type                  | Constraints                          | Supported operations |
  | :--------------: | ------------------------------------------- | -----------           | ------------------------------------ | -------------------- |
  | id               | Identifier of this wiki page                | Integer               | x > 0                                | READ                 |
  | title            | The wiki page's title                       | String                | not null                             | READ / WRITE         |
  | slug             | URL-friendly title                          | String                | not null                             | READ                 |
  | text             | Formattable wiki content                    | Formattable           |                                      | READ / WRITE         |
  | lockVersion      | Optimistic locking version                  | Integer               |                                      | READ / WRITE         |
  | version          | Journal version                             | Integer               |                                      | READ                 |
  | protected        | Whether only wiki managers may edit         | Boolean               |                                      | READ / WRITE         |
name: Wiki Pages
