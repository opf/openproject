get:
  summary: View configuration group
  operationId: View_test_management_configuration_group
  tags:
  - Test Management
  parameters:
  - name: id
    in: path
    required: true
    description: Configuration group id
    example: 4
    schema:
      type: integer
  responses:
    '200':
      description: OK
      content:
        application/hal+json:
          schema:
            "$ref": "../components/schemas/test_management_configuration_group_model.yml"
    '404':
      description: |-
        Returned if the group does not exist or the client may not see it.

        **Required permission:** view test cases
