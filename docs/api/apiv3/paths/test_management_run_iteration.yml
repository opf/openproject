---
get:
  summary: View test run iteration
  operationId: View_test_management_run_iteration
  tags:
  - Test Management
  parameters:
  - name: id
    in: path
    required: true
    description: Test run id
    example: 42
    schema:
      type: integer
  - name: number
    in: path
    required: true
    description: Iteration number
    example: 2
    schema:
      type: integer
  responses:
    '200':
      description: OK
      content:
        application/hal+json:
          schema:
            $ref: ../components/schemas/test_management_run_iteration_model.yml
          examples:
            response:
              value:
                _type: TestManagementRunIteration
                id: 52
                number: 2
                name: 'E2E #129 · main@8a1b2c3'
                source: automation
                current: true
                externalRef: github:my-org/shop:9876543211:1
                ci:
                  provider: github
                  repository: my-org/shop
                  branch: main
                  runNumber: '129'
                statusCounts:
                  untested: 1
                  passed: 20
                  failed: 2
                  blocked: 0
                  retest: 0
                  skipped: 0
                totalCases: 23
                passRate: 86
                createdAt: '2026-10-31T09:02:11.000Z'
                _links:
                  self:
                    href: /api/v3/test_management/runs/42/iterations/2
                    title: 'E2E #129 · main@8a1b2c3'
                  run:
                    href: /api/v3/test_management/runs/42
                  connection:
                    href: /api/v3/test_management/ci_connections/3
    '404':
      description: 'Returned if the run or iteration does not exist or the client may not see it.


        **Required permission:** view test runs or upload test results'
      content:
        application/hal+json:
          schema:
            $ref: ../components/schemas/error_response.yml
          examples:
            response:
              value:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                message: The requested resource could not be found.
