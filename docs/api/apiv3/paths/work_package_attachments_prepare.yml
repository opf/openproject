# /api/v3/work_packages/{id}/attachments/prepare
---
post:
  summary: Prepare a direct attachment upload for a work package
  operationId: prepare_work_package_attachment_upload
  tags:
    - Attachments
    - Work packages
  description: |-
    Prepares a direct upload of an attachment for the given work package, to be performed by the
    client without the file content passing through the OpenProject server. See
    `POST /api/v3/attachments/prepare` for a detailed description of the three-step flow this
    endpoint is the first step of.

    Unlike `POST /api/v3/attachments/prepare`, the resulting pending attachment is immediately
    associated with this work package as its container.
  parameters:
    - name: id
      description: ID of the work package to receive the attachment
      example: 1
      in: path
      required: true
      schema:
        type: integer
  requestBody:
    content:
      multipart/form-data:
        schema:
          type: object
          required:
            - metadata
          properties:
            metadata:
              type: string
              contentMediaType: application/json
              contentSchema:
                $ref: '../components/schemas/attachment_prepare_upload_write_model.yml'
              description: |-
                A **single** part, named `metadata`, whose value is a *JSON-encoded string*
                conforming to the schema referenced above (see the *Model* tab for its
                properties) - it must **not** be split into separate `fileName`, `fileSize`, ...
                form fields. No file content is sent with this request.
              example: '{"fileName":"cat.png","fileSize":24,"contentType":"image/png"}'
        encoding:
          metadata:
            contentType: application/json
  responses:
    '201':
      description: OK
      content:
        application/hal+json:
          schema:
            $ref: '../components/schemas/attachment_upload_model.yml'
    '400':
      content:
        application/hal+json:
          schema:
            $ref: '../components/schemas/error_response.yml'
          example:
            _type: Error
            errorIdentifier: urn:openproject-org:api:v3:errors:InvalidRequestBody
            message: The request could not be parsed as JSON.
      description: |-
        Returned if the client sends a not understandable request. Reasons include:

        * Omitting the `metadata` part

        * sending unparsable JSON in the metadata part
    '403':
      content:
        application/hal+json:
          schema:
            $ref: '../components/schemas/error_response.yml'
          example:
            _type: Error
            errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
            message: You are not allowed to add attachments to this work package.
      description: |-
        Returned if the client does not have sufficient permissions.

        **Required permission:** edit work package or add work package

        *Note that you will only receive this error, if you are at least allowed to see the work package.*
    '404':
      content:
        application/hal+json:
          schema:
            $ref: '../components/schemas/error_response.yml'
          example:
            _type: Error
            errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
            message: The specified work package does not exist.
      description: |-
        Returned if the work package does not exist or the client does not have sufficient permissions
        to see it.

        **Required permission:** view work package

        *Note: A client without sufficient permissions shall not be able to test for the existence of a work package.
        That's why a 404 is returned here, even if a 403 might be more appropriate.*
    '406':
      $ref: '../components/responses/missing_content_type.yml'
    '415':
      $ref: '../components/responses/unsupported_media_type.yml'
    '422':
      content:
        application/hal+json:
          schema:
            $ref: '../components/schemas/error_response.yml'
          examples:
            'direct uploads not available':
              description: |-
                Returned if the OpenProject instance is not configured for direct uploads.
              value:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:PropertyConstraintViolation
                message: Direct file upload is not available due to a system configuration issue. Please contact your administrator.
            'missing file name':
              value:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:PropertyConstraintViolation
                message: "File can't be blank."
      description: |-
        Returned if the client tries to prepare an invalid attachment upload.
        Reasons are:

        * Omitting the file name (`fileName` property of metadata part)

        * Omitting the file size (`fileSize` property of metadata part)

        * The instance is not configured for direct uploads
