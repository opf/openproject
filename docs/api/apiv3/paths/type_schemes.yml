# /api/v3/type_schemes
---
get:
  summary: List type schemes
  operationId: list_type_schemes
  tags:
    - Type Schemes
  description: Lists all type schemes. Requires an authenticated user.
  responses:
    '200':
      description: OK
      content:
        application/hal+json:
          schema:
            $ref: '../components/schemas/type_scheme_collection_model.yml'
post:
  summary: Create a type scheme
  operationId: create_type_scheme
  tags:
    - Type Schemes
  description: |-
    Creates a type scheme. The body needs a `name` and exactly one item marked `default`.

    Types are referenced through `typeItems` (existing types) and/or `newTypeNames`.
    Each name in `newTypeNames` creates a new work package type available in the whole
    instance and adds it to the scheme; a name matching an existing type (regardless of
    case) reuses that type. When no item is marked `default`, the first item becomes the
    default. Colors are set per item through `colorId` or `colorHex`; new types start
    without a color.

    **Required permission:** administrator
  requestBody:
    content:
      application/json:
        schema:
          type: object
          required:
            - name
          properties:
            name:
              type: string
            description:
              type: string
            typeItems:
              type: array
              items:
                type: object
                properties:
                  _links:
                    type: object
                    properties:
                      type:
                        type: object
                        properties:
                          href:
                            type: string
                  position:
                    type: integer
                  default:
                    type: boolean
                  colorId:
                    type:
                      - integer
                      - "null"
                    description: ID of the color of this type in the scheme. Send null to remove it.
                  colorHex:
                    type: string
                    description: Custom color hexcode for this type (e.g. "#a1b2c3"). Takes precedence over colorId and creates the color if none matches.
            newTypeNames:
              type: array
              description: Names of work package types to create and add to the scheme.
              items:
                type: string
  responses:
    '201':
      description: Created
      content:
        application/hal+json:
          schema:
            $ref: '../components/schemas/type_scheme_model.yml'
    '403':
      description: Returned if the user is not an administrator.
    '422':
      description: Returned if the scheme is invalid, e.g. without exactly one default type.
