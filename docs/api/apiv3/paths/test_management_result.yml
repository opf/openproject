---
get:
  summary: View test result
  operationId: View_test_management_result
  tags:
  - Test Management
  description: One result of a run case with its error message, stack trace and step results.
  parameters:
  - name: id
    in: path
    required: true
    description: Result id
    example: 42
    schema:
      type: integer
  responses:
    '200':
      description: OK
      content:
        application/hal+json:
          schema:
            $ref: ../components/schemas/test_management_result_model.yml
    '404':
      description: 'Returned if the result does not exist or the client may not see it.


        **Required permission:** view test runs or upload test results'
      content:
        application/hal+json:
          schema:
            $ref: ../components/schemas/error_response.yml
