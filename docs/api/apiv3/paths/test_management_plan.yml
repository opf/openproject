# /api/v3/test_management/plans/{id}
---
get:
  summary: View test plan
  operationId: View_test_management_plan
  tags:
  - Test Management
  parameters:
  - name: id
    in: path
    required: true
    description: Test plan id
    example: 12
    schema:
      type: integer
  responses:
    '200':
      description: OK
      content:
        application/hal+json:
          schema:
            "$ref": "../components/schemas/test_management_plan_model.yml"
    '404':
      description: |-
        Returned if the plan does not exist, the client may not see it or test plans are disabled in the project.

        **Required permission:** view test plans
      content:
        application/hal+json:
          schema:
            "$ref": "../components/schemas/error_response.yml"
          examples:
            response:
              value:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                message: The requested resource could not be found.
patch:
  summary: Update test plan
  operationId: Update_test_management_plan
  tags:
  - Test Management
  description: Only the attributes sent are changed. State changes with complete and reopen.
  parameters:
  - name: id
    in: path
    required: true
    description: Test plan id
    example: 12
    schema:
      type: integer
  requestBody:
    required: false
    content:
      application/json:
        schema:
          "$ref": "../components/schemas/test_management_plan_write_model.yml"
  responses:
    '200':
      description: OK
      content:
        application/hal+json:
          schema:
            "$ref": "../components/schemas/test_management_plan_model.yml"
    '403':
      description: "**Required permission:** manage test plans"
      content:
        application/hal+json:
          schema:
            "$ref": "../components/schemas/error_response.yml"
          examples:
            response:
              value:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                message: You are not authorized to access this resource.
    '404':
      description: |-
        Returned if the plan does not exist, the client may not see it or test plans are disabled in the project.

        **Required permission:** view test plans
      content:
        application/hal+json:
          schema:
            "$ref": "../components/schemas/error_response.yml"
          examples:
            response:
              value:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                message: The requested resource could not be found.
    '422':
      description: The request body is invalid.
      content:
        application/hal+json:
          schema:
            "$ref": "../components/schemas/error_response.yml"
          examples:
            response:
              value:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:UnprocessableContent
                message: Name can't be blank.
delete:
  summary: Delete test plan
  operationId: Delete_test_management_plan
  tags:
  - Test Management
  description: Deletes the plan. Linked runs are kept.
  parameters:
  - name: id
    in: path
    required: true
    description: Test plan id
    example: 12
    schema:
      type: integer
  responses:
    '204':
      description: Deleted.
    '403':
      description: "**Required permission:** manage test plans"
      content:
        application/hal+json:
          schema:
            "$ref": "../components/schemas/error_response.yml"
          examples:
            response:
              value:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                message: You are not authorized to access this resource.
    '404':
      description: |-
        Returned if the plan does not exist, the client may not see it or test plans are disabled in the project.

        **Required permission:** view test plans
      content:
        application/hal+json:
          schema:
            "$ref": "../components/schemas/error_response.yml"
          examples:
            response:
              value:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                message: The requested resource could not be found.
