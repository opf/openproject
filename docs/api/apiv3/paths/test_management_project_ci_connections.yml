# /api/v3/projects/{id}/test_management/ci_connections
---
get:
  summary: List CI connections of a project
  operationId: List_test_management_ci_connections
  tags:
  - Test Management
  description: CI connections configured in Project settings › Test management or
    with POST. Access tokens are never returned (`tokenSet` only).
  parameters:
  - name: id
    in: path
    required: true
    description: Project id
    example: 42
    schema:
      type: integer
  responses:
    '200':
      description: OK
      content:
        application/hal+json:
          schema:
            "$ref": "../components/schemas/test_management_ci_connection_collection_model.yml"
    '403':
      description: |-
        The client may see the project but has none of the required permissions.

        **Required permission:** manage CI connections, upload test results or add test runs
      content:
        application/hal+json:
          schema:
            "$ref": "../components/schemas/error_response.yml"
          examples:
            response:
              value:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                message: You are not authorized to access this resource.
    '404':
      description: |-
        Returned if the project does not exist or the client may not see it.

        **Required permission:** view project
      content:
        application/hal+json:
          schema:
            "$ref": "../components/schemas/error_response.yml"
          examples:
            response:
              value:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                message: The requested resource could not be found.
post:
  summary: Create CI connection
  operationId: Create_test_management_ci_connection
  tags:
  - Test Management
  description: Same rules as Project settings › Test management › CI connections.
    Tokens are write-only and never returned. The same provider and repository may
    exist once per server (`serverUrl`).
  parameters:
  - name: id
    in: path
    required: true
    description: Project id
    example: 42
    schema:
      type: integer
  requestBody:
    required: true
    content:
      application/json:
        schema:
          "$ref": "../components/schemas/test_management_ci_connection_write_model.yml"
        examples:
          self_hosted_gitlab:
            value:
              name: Shop (internal GitLab)
              provider: gitlab
              repository: qa/web/shop
              baseUrl: https://gitlab.example.com
              token: glpat-…
              triggerToken: glptt-…
              caCertificate: |-
                -----BEGIN CERTIFICATE-----
                …
                -----END CERTIFICATE-----
              referenceName: shop
              e2eTests: auto
          inbound_only:
            value:
              name: Shop (CI → OpenProject only)
              provider: gitlab
              repository: qa/web/shop
              baseUrl: https://git.internal.example.com
              inboundOnly: true
          rotate_token:
            value:
              token: ghp_new…
  responses:
    '201':
      description: The connection was created.
      content:
        application/hal+json:
          schema:
            "$ref": "../components/schemas/test_management_ci_connection_model.yml"
          examples:
            response:
              value:
                _type: TestManagementCiConnection
                id: 3
                name: Shop (GitHub)
                provider: github
                repository: my-org/shop
                baseUrl: https://github.com
                ingestMode: new_iteration
                targetRunName: Smoke
                active: true
                tokenSet: true
                checkStatus: ok
                serverUrl: https://github.com
                referenceName:
                referenceQualifier: shop
                e2eTests: auto
                scmRepositoryId:
                checkedAt: '2026-10-31T08:00:00.000Z'
                createdAt: '2026-10-30T15:20:00.000Z'
                updatedAt: '2026-10-31T08:00:00.000Z'
                _links:
                  self:
                    href: "/api/v3/test_management/ci_connections/3"
                    title: Shop (GitHub)
                  project:
                    href: "/api/v3/projects/3"
                  repository:
                    href: https://github.com/my-org/shop
    '403':
      description: |-
        The client may see the connection or project but not manage CI connections.

        **Required permission:** manage test CI
      content:
        application/hal+json:
          schema:
            "$ref": "../components/schemas/error_response.yml"
          examples:
            response:
              value:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                message: You are not authorized to access this resource.
    '404':
      description: |-
        Returned if the project does not exist or the client may not see it.

        **Required permission:** view project
      content:
        application/hal+json:
          schema:
            "$ref": "../components/schemas/error_response.yml"
          examples:
            response:
              value:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                message: The requested resource could not be found.
    '422':
      description: The body is invalid, e.g. a missing name, an http:// base URL,
        a duplicate repository on the same server or a token that must be entered
        again.
      content:
        application/hal+json:
          schema:
            "$ref": "../components/schemas/error_response.yml"
          examples:
            response:
              value:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:PropertyConstraintViolation
                message: Repository already has a connection of this provider on this
                  server.
