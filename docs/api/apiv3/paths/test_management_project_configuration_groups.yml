# /api/v3/projects/{id}/test_management/configuration_groups
---
get:
  summary: List configuration groups of a project
  operationId: List_test_management_configuration_groups
  tags:
  - Test Management
  parameters:
  - name: id
    in: path
    required: true
    description: Project id
    example: 3
    schema:
      type: integer
  responses:
    '200':
      description: OK
      content:
        application/hal+json:
          schema:
            "$ref": "../components/schemas/test_management_configuration_group_collection_model.yml"
    '403':
      description: "**Required permission:** view test cases"
      content:
        application/hal+json:
          schema:
            "$ref": "../components/schemas/error_response.yml"
          examples:
            response:
              value:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                message: You are not authorized to access this resource.
    '404':
      description: Returned if the project does not exist or the client may not see it.
      content:
        application/hal+json:
          schema:
            "$ref": "../components/schemas/error_response.yml"
          examples:
            response:
              value:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                message: The requested resource could not be found.
post:
  summary: Create configuration group
  operationId: Create_test_management_configuration_group
  tags:
  - Test Management
  parameters:
  - name: id
    in: path
    required: true
    description: Project id
    example: 3
    schema:
      type: integer
  requestBody:
    required: true
    content:
      application/json:
        schema:
          "$ref": "../components/schemas/test_management_configuration_group_write_model.yml"
        example:
          name: Browsers
  responses:
    '201':
      description: Created
      content:
        application/hal+json:
          schema:
            "$ref": "../components/schemas/test_management_configuration_group_model.yml"
    '403':
      description: "**Required permission:** manage test management"
      content:
        application/hal+json:
          schema:
            "$ref": "../components/schemas/error_response.yml"
          examples:
            response:
              value:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                message: You are not authorized to access this resource.
    '404':
      description: Returned if the project does not exist or the client may not see it.
      content:
        application/hal+json:
          schema:
            "$ref": "../components/schemas/error_response.yml"
          examples:
            response:
              value:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                message: The requested resource could not be found.
    '422':
      description: The request body is invalid.
      content:
        application/hal+json:
          schema:
            "$ref": "../components/schemas/error_response.yml"
          examples:
            response:
              value:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:UnprocessableContent
                message: Name can't be blank.
