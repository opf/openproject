# /api/v3/notifications/summary
---
get:
  summary: Get the unread notification summary
  operationId: get_notification_summary
  tags:
    - Notifications
  description: |-
    Returns a compact summary of the authenticated user's unread notifications, grouped by work package.

    The summary is meant for clients that want to show a short overview of what is new without loading the full
    notification collection, for example a system notification, a badge or a small preview list. It contains the total
    number of unread notifications and the five work packages with the most recent unread activity. Each of them comes
    with a title, a body and a link that are ready to display, translated into the language of the user. If more work
    packages have unread notifications, the summary reports how many are not listed.

    Use the [notification collection](https://www.openproject.org/docs/api/endpoints/notifications/) instead to list,
    filter or page through individual notifications.
  responses:
    '200':
      description: OK
      headers:
        Cache-Control:
          description: Always `no-store`; the summary must not be cached.
          schema:
            type: string
      content:
        application/hal+json:
          schema:
            $ref: '../components/schemas/notification_summary_model.yml'
    '401':
      description: |-
        Returned if the request is not made by an active, signed-in user, for example because the browser session has
        expired.
      content:
        application/hal+json:
          schema:
            $ref: '../components/schemas/error_response.yml'
    '404':
      description: Returned if the notification summary is not available on the instance.
      content:
        application/hal+json:
          schema:
            $ref: '../components/schemas/error_response.yml'
