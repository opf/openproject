# Schema: DocumentModel
---
type: object
properties:
  id:
    type: integer
    description: Document's id
    readOnly: true
    exclusiveMinimum: 0
  title:
    type: string
    description: The title chosen for the document
  description:
    allOf:
      - $ref: './formattable.yml'
      - description: A text describing the document
  # content_binary:
  #  type: string
  #  description: The binary content of the document, base64 encoded
  createdAt:
    type: string
    format: date-time
    description: The time the document was created at
    readOnly: true
  _links:
    type: object
    required:
    - self
    - project
    - attachments
    properties:
      self:
        allOf:
        - "$ref": "./link.yml"
        - description: |-
            This document

            **Resource**: Document
          readOnly: true
      project:
        allOf:
        - "$ref": "./link.yml"
        - description: |-
            The project the document is in

            **Resource**: Project
      attachments:
        allOf:
        - "$ref": "./link.yml"
        - description: |-
            The attachments belonging to the document

            **Resource**: []Attachment
