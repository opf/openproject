    minimum: 1
  name:
    type: string
  startGate:
    type: boolean
  startGateName:
    type:
      - "string"
      - "null"
  finishGate:
    type: boolean
  finishGateName:
    type:
      - "string"
      - "null"
  createdAt:
    type: string
    format: date-time
    description: Time of creation
  updatedAt:
    type: string
