    description: Time of the most recent change to the project phase definition
  _links:
    type: object
    required:
      - self
    properties:
      self:
        allOf:
          - $ref: './link.yml'
          - description: |-
              This project phase definition.

              **Resource**: ProjectPhaseDefinition
