            readOnly: true
      pipelines:
        allOf:
          - "$ref": "./link.yml"
          - description: |-
              All of the CI pipelines that ran for this merge request

              **Resource**: RepositoryPipelineCollectionModel
            readOnly: true
      latestPipeline:
