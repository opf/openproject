# Schema: TestManagementNativeTest
type: object
description: One test in the native report format. Needs `status` and one of `reference`, `caseId` or
  `title`.
required:
- status
properties:
  reference:
    type: string
    example: api/users#creates a user
  caseId:
    oneOf:
    - type: integer
    - type: string
  title:
    type: string
  file:
    type: string
  status:
    type: string
    description: passed, failed, skipped, blocked, flaky, … (see statusMap)
  durationMs:
    type: integer
  message:
    type: string
  stack:
    type: string
  tags:
    type: array
    items:
      type: string
  properties:
    type: object
    additionalProperties: true
  projectName:
    type: string
  steps:
    type: array
    maxItems: 200
    description: 'Reported steps (0020), nested up to 5 levels. A step maps to a case step by `step` (or
      a

      `[step:N]` title marker), then by position when the counts match, then by title.'
    items:
      type: object
      properties:
        title:
          type: string
        step:
          type: integer
          description: Number of the case step (1-based).
        status:
          type: string
        durationMs:
          type: integer
        message:
          type: string
        stack:
          type: string
        steps:
          type: array
          items:
            type: object
