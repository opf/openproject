      lastModifiedByName: Anakin Skywalker
      _links:
        self:
          href: 'urn:openproject-org:api:v3:storages:storage_file:no_link_provided'
  parent:
    id: "41"
    name: '/'
    _type: StorageFile
    location: '/'
    mimeType: 'application/x-op-directory'
