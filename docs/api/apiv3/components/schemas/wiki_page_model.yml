# Schema: Wiki_PageModel
---
type: object
required:
- title
properties:
  id:
    type: integer
    description: Identifier of this wiki page
    readOnly: true
    exclusiveMinimum: 0
  title:
    type: string
    description: The wiki page's title
  slug:
    type: string
    readOnly: true
  text:
    "$ref": "./formattable.yml"
  lockVersion:
    type: integer
    description: |-
      Optimistic locking token (ActiveRecord `lock_version`).
      Required on update; stale values yield an UpdateConflict error.
      Distinct from `version`, which is the journal/history revision.
  version:
    type: integer
    description: Journal history revision number (read-only). Distinct from lockVersion.
    readOnly: true
  protected:
    type: boolean
    description: When true, editing requires manage wiki permission
  createdAt:
    type: string
    format: date-time
    readOnly: true
  updatedAt:
    type: string
    format: date-time
    readOnly: true
  _links:
    type: object
    properties:
      addAttachment:
        allOf:
        - "$ref": "./link.yml"
        - description: |-
            Attach a file to the wiki page

            # Conditions

            **Permission**: edit wiki page
          readOnly: true
example:
  _type: WikiPage
  id: 72
  title: A wiki page with a name
  _embedded:
    project:
      _type: Project...
      id: 12
  _links:
    self:
      href: "/api/v3/wiki_pages/72"
    attachments:
      href: "/api/v3/wiki_pages/72/attachments"
    addAttachment:
      href: "/api/v3/wiki_pages/72/attachments"
      method: post
    project:
      href: "/api/v3/projects/12"
      title: some project
