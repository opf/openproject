# Schema: CustomFieldModel
---
type: object
required:
- id
- name
- fieldFormat
- isRequired
- isMultiValue
- createdAt
- updatedAt
- _links
properties:
  id:
    type: integer
    description: The custom field ID.
    readOnly: true
  name:
    type: string
    description: The human-readable name of the custom field.
  fieldFormat:
    type: string
    description: Defines which kind of values are allowed in the custom field.
    enum:
    - bool
    - date
    - float
    - hierarchy
    - int
    - link
    - list
    - string
    - text
    - user
    - version
    - weighted_item_list
  isRequired:
    type: boolean
    description: Whether the custom field must be filled out to save an object using it.
  isMultiValue:
    type: boolean
    description: Whether the custom field accepts more than one value.
  displayAs:
    type: string
    description: |-
      How forms present the options of a list custom field. Only present for custom fields of the `list` format.
      `checkboxes` only applies to multi-select fields and `radio_buttons` only to single-select fields; forms fall
      back to a dropdown otherwise.
    enum:
    - dropdown
    - checkboxes
    - radio_buttons
  createdAt:
    type: string
    format: date-time
    description: Time of creation.
    readOnly: true
  updatedAt:
    type: string
    format: date-time
    description: Time of the most recent change to the custom field.
    readOnly: true
  _links:
    type: object
    required:
    - self
    properties:
      self:
        allOf:
        - $ref: "./link.yml"
        - description: APIv3 self-reference of the custom field.

example:
  id: 42
  name: Celestial Body
  fieldFormat: hierarchy
  isRequired: false
  isMultiValue: false
  createdAt: "2026-07-20T13:37:00Z"
  updatedAt: "2026-07-20T20:13:37Z"
  _links:
    self:
      href: "/api/v3/custom_fields/42"
      title: "Celestial Body"
