# Schema: NotificationSummaryModel
---
type: object
required:
  - _type
  - count
  - _links
properties:
  _type:
    type: string
    enum:
      - NotificationSummary
  count:
    type: integer
    description: The total number of unread notifications of the authenticated user.
    example: 3
  groups:
    type: array
    description: |-
      The work packages with the most recent unread activity, at most five, newest first.

      Omitted if there are no unread notifications.
    items:
      type: object
      required:
        - tag
        - count
        - revision
        - title
        - body
        - url
      properties:
        tag:
          type: string
          description: |-
            Identifier of the group. It stays the same for a work package and user, so a client can use it to update
            or replace an entry it already shows.
        count:
          type: integer
          description: The number of unread notifications for the work package.
        revision:
          type: string
          description: |-
            Version marker of the group. It changes whenever the work package receives new unread activity, so a
            client can tell whether an entry it already shows is out of date.
        title:
          type: string
          description: |-
            Display title in the language of the user. It names the latest activity, or the number of unread
            notifications if there are several.
        body:
          type: string
          description: Display text in the language of the user, identifying the work package.
        url:
          type: string
          description: |-
            Path of the page showing the unread activity of the work package, including any configured sub path.
  more:
    type: object
    required:
      - count
      - title
      - url
    description: |-
      Describes the work packages with unread notifications that are not listed in `groups`.

      Omitted if every work package is listed.
    properties:
      count:
        type: integer
        description: The number of work packages not listed in `groups`.
      title:
        type: string
        description: Display title in the language of the user, stating how many more work packages are affected.
      url:
        type: string
        description: Path of the notification center, including any configured sub path.
  _links:
    type: object
    required:
      - self
    properties:
      self:
        allOf:
          - $ref: './link.yml'
          - description: This summary.
