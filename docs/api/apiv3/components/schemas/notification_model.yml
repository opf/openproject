# Schema: NotificationModel
---
type: object
properties:
  _type:
    type: string
    enum:
      - Notification
  id:
    type: integer
    description: Notification id
    minimum: 1
  reason:
    type: string
    description: The reason for the notification
    enum:
      - assigned
      - commented
      - created
      - dateAlert
      - mentioned
      - prioritized
      - processed
      - responsible
      - subscribed
      - scheduled
      - watched
  readIAN:
    type: boolean
    description: Whether the notification is marked as read
  details:
    type: array
    items:
      oneOf:
        - $ref: './values_property_model.yml'
    description: A list of objects including detailed information about the notification.
  createdAt:
    type: string
    format: date-time
    description: The time the notification was created at
  updatedAt:
    type: string
    format: date-time
    description: The time the notification was last updated
  _embedded:
    type: object
    required:
      - project
    properties:
      actor:
        $ref: './user_model.yml'
      project:
        oneOf:
          - $ref: './project_model.yml'
          - $ref: './program_model.yml'
          - $ref: './portfolio_model.yml'
      activity:
        $ref: './activity_model.yml'
      resource:
        description: |-
          The resource of the notification. Only embedded for work packages.
          Documents are only linked via `_links.resource`.
        oneOf:
          - $ref: './work_package_model.yml'
  _links:
    type: object
    required:
      - self
      - project
      - actor
      - resource
    properties:
      self:
        allOf:
          - "$ref": "./link.yml"
          - description: |-
              This notification

              **Resource**: Notification
      readIAN:
        allOf:
          - "$ref": "./link.yml"
          - description: |-
              Request to mark the notification as read. Only available if the notification is currently unread.
      unreadIAN:
        allOf:
          - "$ref": "./link.yml"
          - description: |-
              Request to mark the notification as unread. Only available if the notification is currently read.
      project:
        allOf:
          - "$ref": "./link.yml"
          - description: |-
              The workspace the notification originated in

              **Resource**: Workspace
      actor:
        allOf:
          - "$ref": "./link.yml"
          - description: |-
              The user that caused the notification. This might be null in
              case no user triggered the notification.

              **Resource**: User
      resource:
        allOf:
          - "$ref": "./link.yml"
          - description: |-
              The resource the notification is about. This can be either a work package or a document.
              The link's title is the work package's subject or the document's title respectively.

              **Resource**: WorkPackage or Document
      activity:
        allOf:
          - "$ref": "./link.yml"
          - description: |-
              The journal activity, if the notification originated from a journal entry. Only present
              if the notification was triggered by an activity, e.g. not for date alerts or mentions in documents.

              **Resource**: Activity
