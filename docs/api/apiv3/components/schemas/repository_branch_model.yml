    workPackage:
      href: "/api/v3/work_packages/1234"
      title: Crash when saving
  id: 1
  name: bug/1234-crash-when-saving
  projectName: my-group/my-project
  webUrl: https://gitlab.example.com/my-group/my-project/-/tree/bug/1234-crash-when-saving
  author:
    name: Jane Doe
    username: jdoe
    avatarUrl: https://gitlab.example.com/uploads/user/avatar/1/avatar.png
  createdAt: '2026-10-01T12:00:00.000Z'
  updatedAt: '2026-10-01T12:00:00.000Z'
