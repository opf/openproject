# Schema: EmojiReactionsModel
---
type: object
properties:
  _type:
    type: string
    enum:
      - "Collection"
  total:
    type: integer
    description: Total number of emoji reactions
    minimum: 0
  count:
    type: integer
    description: Number of emoji reactions in this response
    minimum: 0
  _embedded:
    type: object
    properties:
      elements:
        type: array
        items:
          $ref: './emoji_reaction_model.yml'
  _links:
    type: object
    properties:
      self:
        allOf:
          - $ref: './link.yml'
          - description: This collection
example:
  _type: "Collection"
  total: 2
  count: 2
  _embedded:
    elements:
      - _type: "EmojiReaction"
        id: "1-thumbs_up"
        reaction: "thumbs_up"
        emoji: "👍"
        reactionsCount: 3
        firstReactionAt: "2024-04-08T15:37:19.275Z"
        _links:
          self:
            href: "/api/v3/emoji_reactions/1-thumbs_up"
          reactable:
            href: "/api/v3/activities/1"
          reactingUsers:
            - href: "/api/v3/users/435"
              title: "John Doe"
            - href: "/api/v3/users/436"
              title: "Jane Smith"
            - href: "/api/v3/users/437"
              title: "Bob Johnson"
      - _type: "EmojiReaction"
        id: "1-heart"
        reaction: "heart"
