# Schema: PrincipalModel
---
type: object
required:
  - _type
  - id
  - name
  - _links
properties:
  _type:
    type: string
    enum:
      - User
      - Group
      - PlaceholderUser
  id:
    type: integer
    description: The principal's unique identifier.
    minimum: 1
  name:
    type: string
    description: The principal's display name, layout depends on instance settings.
  avatarColor:
    type:
      - 'string'
      - 'null'
    description: |-
      A custom hex color (e.g. "#AABBCC") used as the background of the principal's
      fallback avatar when no avatar image is uploaded. Only ever set for users;
      absent or `null` otherwise, in which case a color is generated from the name.
  createdAt:
    type: string
    format: date-time
    description: Time of creation
  updatedAt:
    type: string
    format: date-time
    description: Time of the most recent change to the principal
  _links:
    type: object
    required:
      - self
    properties:
      self:
        allOf:
          - $ref: './link.yml'
          - description: |-
              This principal resource.

              **Resource**: User|Group|PlaceholderUser
      memberships:
        allOf:
          - $ref: './link.yml'
          - description: |-
              An href to the collection of the principal's memberships.
              
              # Conditions:
              
              - user has permission `view_members` or `manage_members` in any project
              
              **Resource**: Collection
