# Schema: UserPreferencesModel
---
type: object
properties:
  dailyRemindersEnabled:
    type: boolean
    description: Whether the user receives daily email reminders.
  dailyRemindersTimes:
    type: array
    items:
      type: string
      format: time
    description: |-
      The full hours (in the user's time zone) at which daily email reminders are sent.
      Accepts `HH:MM` and `HH:MM:SS+00:00`; rendered as `HH:MM`.
  immediateRemindersMentioned:
    type: boolean
    description: Whether the user receives an email immediately when mentioned.
  immediateRemindersPersonalReminder:
    type: boolean
    description: Whether the user receives an email immediately for personal reminders.
  pauseRemindersEnabled:
    type: boolean
    description: Whether email reminders are paused between `pauseRemindersFirstDay` and `pauseRemindersLastDay`.
  pauseRemindersFirstDay:
    type:
      - 'string'
      - 'null'
    format: date
    description: The first day email reminders are paused.
  pauseRemindersLastDay:
    type:
      - 'string'
      - 'null'
    format: date
    description: The last day email reminders are paused.
  dailyReminders:
    type: object
    deprecated: true
    description: |-
      **Deprecated:** Use `dailyRemindersEnabled` and `dailyRemindersTimes` instead.
    properties:
      enabled:
        type: boolean
      times:
        type: array
        items:
          type: string
          format: time
  immediateReminders:
    type: object
    deprecated: true
    description: |-
      **Deprecated:** Use `immediateRemindersMentioned` and `immediateRemindersPersonalReminder` instead.
    properties:
      mentioned:
        type: boolean
      personalReminder:
        type: boolean
  pauseReminders:
    type: object
    deprecated: true
    description: |-
      **Deprecated:** Use `pauseRemindersEnabled`, `pauseRemindersFirstDay` and `pauseRemindersLastDay` instead.
    properties:
      enabled:
        type: boolean
      firstDay:
        type: string
        format: date
      lastDay:
        type: string
        format: date
example:
  _links:
    self:
      href: "/api/v3/my_preferences"
    user:
      href: "/api/v3/users/1"
      title: John Sheppard
    updateImmediately:
      href: "/api/v3/users/3/preferences"
      method: "patch"
  _type: UserPreferences
  commentSortDescending: true
  disableKeyboardShortcuts: false
  timeZone: "Europe/Berlin"
  dateFormat: "%Y-%m-%d"
  timeFormat: "%H:%M"
  warnOnLeavingUnsaved: true
  dailyRemindersEnabled: true
  dailyRemindersTimes:
    - "08:00"
  immediateRemindersMentioned: true
  immediateRemindersPersonalReminder: true
  pauseRemindersEnabled: false
  pauseRemindersFirstDay: null
  pauseRemindersLastDay: null
  notifications:
    - watched: false
      involved: true
      mentioned: false
      shared: true
      newsAdded: false,
      newsCommented: false
      documentAdded: false
      forumMessages: false
      wikiPageAdded: false
      wikiPageUpdated: false
      membershipAdded: false
      membershipUpdated: false
      workPackageCommented: false
      workPackageProcessed: false
      workPackagePrioritized: false
      workPackageScheduled: false
      _links:
        project:
          href: null
