# Schema: RepositoryCommitModel
---
type: object
properties:
  id:
    type: integer
    description: Identifier of the resource within OpenProject
    readOnly: true
  sha:
    type: string
    description: SHA of the commit
    readOnly: true
  message:
    allOf:
      - $ref: "./formattable.yml"
      - description: Commit message
        readOnly: true
  authorName:
    type: string
    description: Author name as recorded in the commit
    readOnly: true
  authoredAt:
    type: string
    format: date-time
    description: Time the commit was authored
    readOnly: true
  projectName:
    type: string
    description: Name of the project on the provider, e.g. `my-group/my-project`
    readOnly: true
  webUrl:
    type: string
    format: uri
    description: URL of the resource on the provider's website
    readOnly: true
  author:
    description: The user on the provider who created the resource. Null if unknown.
    oneOf:
      - $ref: "./repository_user_model.yml"
      - type: "null"
  createdAt:
    type: string
    format: date-time
    description: Time the resource was first synchronized into OpenProject
    readOnly: true
  updatedAt:
    type: string
    format: date-time
    description: Time the resource was last synchronized into OpenProject
    readOnly: true
  _links:
    type: object
    required:
      - self
    properties:
      self:
        allOf:
          - "$ref": "./link.yml"
          - description: |-
              This commit

              **Resource**: RepositoryCommit
            readOnly: true
examples:
  - _type: RepositoryCommit
    _links:
      self:
        href: "/api/v3/repository_commits/1"
        title: Fix crash when saving
    id: 1
    sha: 0a1b2c3d4e5f60718293a4b5c6d7e8f901234567
    message:
      format: plain
      raw: "Fix crash when saving\n\nOP#1234"
      html: "<p>Fix crash when saving</p><p>OP#1234</p>"
    authorName: Jane Doe
    authoredAt: '2026-10-01T12:00:00.000Z'
    projectName: my-group/my-project
    webUrl: https://gitlab.example.com/my-group/my-project/-/commit/0a1b2c3d4e5f60718293a4b5c6d7e8f901234567
    author:
      name: Jane Doe
      username: jdoe
      avatarUrl: https://gitlab.example.com/uploads/user/avatar/1/avatar.png
    createdAt: '2026-10-01T12:00:00.000Z'
    updatedAt: '2026-10-01T12:00:00.000Z'
