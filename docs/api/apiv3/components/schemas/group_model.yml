# Schema: GroupModel
---
allOf:
  - $ref: './principal_model.yml'
  - $ref: "./custom_field_properties.yml"
  - type: object
    required:
      - _type
      - _embedded
    properties:
      _type:
        type: string
        enum:
          - Group
      _embedded:
        type: object
        properties:
          members:
            type: array
            description: Embedded list of members.
            items:
              $ref: './user_model.yml'
      _links:
        type: object
        properties:
          self:
            allOf:
              - $ref: './link.yml'
              - description: |-
                  This group resource

                  **Resource**: Group
          members:
            type: array
            items:
              allOf:
                - $ref: './link.yml'
                - description: |-
                    A member of the group

                    # Conditions:

                    - user has permission `manage_members` in any project

                    **Resource**: User
          memberships:
            allOf:
              - $ref: './link.yml'
              - description: |-
                  An collection of all memberships of the group.

                  **Resource**: MembershipCollection
          delete:
            allOf:
              - $ref: './link.yml'
              - description: |-
                  An href to delete the group.

                  # Conditions:

                  - `admin`
          updateImmediately:
            allOf:
              - $ref: './link.yml'
              - description: |-
                  An href to update the group.

                  # Conditions:

                  - `admin`

                  **Resource**: Group
