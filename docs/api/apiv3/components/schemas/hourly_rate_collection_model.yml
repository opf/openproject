# Schema: HourlyRateCollectionModel
---
allOf:
  - $ref: './collection_model.yml'
  - type: object
    required:
      - _links
      - _embedded
    properties:
      _links:
        type: object
        required:
          - self
        properties:
          self:
            allOf:
              - $ref: './link.yml'
              - description: |-
                  This collection of hourly rates.
                  **Resource**: HourlyRateCollectionModel
      _embedded:
        type: object
        required:
          - elements
        properties:
          elements:
            type: array
            description: |-
              The array of hourly rates visible to the requesting user, ordered by `validFrom` descending.
              Project rates and default rates are told apart by the presence of the `project` link.
            items:
              $ref: './hourly_rate_model.yml'

example:
