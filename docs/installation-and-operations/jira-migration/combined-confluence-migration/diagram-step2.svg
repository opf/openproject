<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <text x="380" y="30" text-anchor="middle" fill="#333" font-size="16" font-weight="700">Step 2: the two integrations talk directly to resolve final links</text>

  <!-- OpenProject box with nested XWiki integration -->
  <rect x="60" y="55" width="260" height="110" rx="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="190" y="80" text-anchor="middle" fill="#333" font-size="16" font-weight="700">OpenProject</text>
  <rect x="80" y="95" width="220" height="50" rx="8" fill="#eaf4ec" stroke="#4a9c59" stroke-width="1.5"/>
  <text x="190" y="126" text-anchor="middle" fill="#357a42" font-size="13" font-weight="600">XWiki integration</text>

  <!-- XWiki box with nested OpenProject plug-in -->
  <rect x="440" y="55" width="260" height="110" rx="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="570" y="80" text-anchor="middle" fill="#333" font-size="16" font-weight="700">XWiki</text>
  <rect x="460" y="95" width="220" height="50" rx="8" fill="#eaf4ec" stroke="#4a9c59" stroke-width="1.5"/>
  <text x="570" y="126" text-anchor="middle" fill="#357a42" font-size="13" font-weight="600">OpenProject plug-in</text>

  <!-- direct connection between the two integrations -->
  <line x1="300" y1="120" x2="460" y2="120" stroke="#4a9c59" stroke-width="2.5" marker-start="url(#arrGreenL)" marker-end="url(#arrGreenR)"/>

  <!-- divider -->
  <line x1="20" y1="190" x2="740" y2="190" stroke="#dddddd" stroke-width="1.5"/>

  <text x="380" y="215" text-anchor="middle" fill="#333" font-size="14" font-weight="600">Example: a link on an OpenProject work package</text>

  <!-- Before pill -->
  <text x="190" y="245" text-anchor="middle" fill="#999" font-size="12" font-weight="600">BEFORE</text>
  <rect x="70" y="255" width="240" height="42" rx="21" fill="#f2f2f2" stroke="#cccccc" stroke-width="1.5"/>
  <text x="190" y="281" text-anchor="middle" fill="#999" font-size="13" font-family="monospace" text-decoration="line-through">confluence.com/pages/65538</text>

  <!-- arrow between before/after -->
  <line x1="310" y1="276" x2="380" y2="276" stroke="#4a9c59" stroke-width="2.5" marker-end="url(#arrGreenR)"/>
  <text x="345" y="264" text-anchor="middle" fill="#4a9c59" font-size="11" font-style="italic">rewritten</text>

  <!-- After pill -->
  <text x="530" y="245" text-anchor="middle" fill="#357a42" font-size="12" font-weight="600">AFTER</text>
  <rect x="390" y="255" width="280" height="42" rx="21" fill="#eaf4ec" stroke="#4a9c59" stroke-width="1.5"/>
  <text x="530" y="281" text-anchor="middle" fill="#357a42" font-size="13" font-family="monospace" font-weight="600">xwiki.com/Space/Page</text>

  <!-- link up to the integration that resolved it -->
  <line x1="190" y1="255" x2="190" y2="220" stroke="#999" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="530" y1="255" x2="190" y2="220" stroke="#999" stroke-width="0" />
  <text x="380" y="330" text-anchor="middle" fill="#666" font-size="13">OpenProject asked its XWiki integration, got the final URL, and rewrote the link.</text>

  <defs>
    <marker id="arrGreenR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a9c59"/></marker>
    <marker id="arrGreenL" markerWidth="9" markerHeight="9" refX="2" refY="4.5" orient="auto"><path d="M9,0 L0,4.5 L9,9 Z" fill="#4a9c59"/></marker>
  </defs>
</svg>
