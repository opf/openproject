<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Source group -->
  <rect x="40" y="20" width="560" height="120" rx="14" fill="none" stroke="#2c5aa0" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="60" y="10" font-size="15" fill="#2c5aa0" font-weight="600">Source (today)</text>

  <rect x="90" y="45" width="180" height="70" rx="10" fill="#ffffff" stroke="#2c5aa0" stroke-width="2"/>
  <text x="180" y="86" font-size="17" fill="#2c5aa0" text-anchor="middle" font-weight="600">Confluence</text>

  <rect x="370" y="45" width="180" height="70" rx="10" fill="#ffffff" stroke="#2c5aa0" stroke-width="2"/>
  <text x="460" y="86" font-size="17" fill="#2c5aa0" text-anchor="middle" font-weight="600">Jira</text>

  <line x1="270" y1="80" x2="370" y2="80" stroke="#2c5aa0" stroke-width="2" marker-end="url(#arrowBlue)" marker-start="url(#arrowBlueStart)"/>

  <!-- Down arrow -->
  <line x1="320" y1="150" x2="320" y2="200" stroke="#4a9c59" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <!-- Target group -->
  <rect x="40" y="210" width="560" height="120" rx="14" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="60" y="200" font-size="15" fill="#333333" font-weight="600">Target (after migration)</text>

  <rect x="90" y="235" width="180" height="70" rx="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="180" y="276" font-size="17" fill="#333333" text-anchor="middle" font-weight="600">XWiki</text>

  <rect x="370" y="235" width="180" height="70" rx="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="460" y="276" font-size="17" fill="#333333" text-anchor="middle" font-weight="600">OpenProject</text>

  <line x1="270" y1="270" x2="370" y2="270" stroke="#333333" stroke-width="2" marker-end="url(#arrowBlack)" marker-start="url(#arrowBlackStart)"/>

  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2c5aa0"/></marker>
    <marker id="arrowBlueStart" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#2c5aa0"/></marker>
    <marker id="arrowBlack" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#333333"/></marker>
    <marker id="arrowBlackStart" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#333333"/></marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a9c59"/></marker>
  </defs>
</svg>
