<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Confluence address -->
  <rect x="40" y="20" width="220" height="55" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="150" y="53" text-anchor="middle" fill="#333">confluence.yourcompany.com</text>

  <!-- Jira address -->
  <rect x="460" y="20" width="220" height="55" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="570" y="53" text-anchor="middle" fill="#333">jira.yourcompany.com</text>

  <!-- routing arrows from confluence address -->
  <line x1="120" y1="75" x2="100" y2="150" stroke="#333" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="180" y1="75" x2="240" y2="150" stroke="#333" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- routing arrows from jira address -->
  <line x1="540" y1="75" x2="490" y2="150" stroke="#333" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="600" y1="75" x2="640" y2="150" stroke="#333" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- Confluence (legacy, blue) -->
  <rect x="40" y="150" width="140" height="60" rx="8" fill="#ffffff" stroke="#2c5aa0" stroke-width="2"/>
  <text x="110" y="186" text-anchor="middle" fill="#2c5aa0" font-weight="600">Confluence</text>

  <!-- XWiki (new) with Jira plugin -->
  <rect x="210" y="150" width="150" height="80" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="285" y="172" text-anchor="middle" fill="#333" font-weight="600">XWiki</text>
  <rect x="222" y="182" width="126" height="36" rx="6" fill="#f2f2f2" stroke="#333" stroke-width="1"/>
  <text x="285" y="205" text-anchor="middle" fill="#333" font-size="12">Jira plug-in</text>

  <!-- Jira (legacy, blue) -->
  <rect x="410" y="150" width="140" height="60" rx="8" fill="#ffffff" stroke="#2c5aa0" stroke-width="2"/>
  <text x="480" y="186" text-anchor="middle" fill="#2c5aa0" font-weight="600">Jira</text>

  <!-- OpenProject (new) with Confluence integration -->
  <rect x="580" y="150" width="150" height="80" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="655" y="172" text-anchor="middle" fill="#333" font-weight="600">OpenProject</text>
  <rect x="592" y="182" width="126" height="36" rx="6" fill="#f2f2f2" stroke="#333" stroke-width="1"/>
  <text x="655" y="205" text-anchor="middle" fill="#333" font-size="12">Confluence integration</text>

  <text x="360" y="300" text-anchor="middle" fill="#4a9c59" font-weight="600">
    Each address automatically routes to the old or new system, per item
  </text>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#333"/></marker>
  </defs>
</svg>
