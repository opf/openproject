version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/frontend"
      - "/extensions/op-blocknote-hocuspocus"
    schedule:
      interval: "daily"
    target-branch: "dev"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 5
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@angular-builders/*'
      angular-eslint:
        patterns:
          - 'angular-eslint'
          - '@angular-eslint/*'
      appsignal:
        patterns:
          - '@appsignal/*'
      blocknote:
        patterns:
          - '@blocknote/*'
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-plugin-*'
          - '@eslint/*'
          - '@stylistic/eslint-plugin'
          - 'globals'
      fullcalendar:
        patterns:
          - '@fullcalendar/*'
      hocuspocus:
        patterns:
          - '@hocuspocus/*'
      hotwired:
        patterns:
          - '@hotwired/turbo'
          - '@hotwired/turbo-rails'
      html-eslint:
        patterns:
          - '@html-eslint/*'
      jquery:
        patterns:
          - 'jquery'
          - 'jquery-migrate'
      mantine:
        patterns:
          - '@mantine/*'
      ng-select:
        patterns:
          - '@ng-select/*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      testing-library:
        patterns:
          - '@testing-library/*'
      typescript-eslint:
        patterns:
          - 'typescript-eslint'
          - '@typescript-eslint/*'
      uirouter:
        patterns:
          - '@uirouter/*'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      yjs:
        # Keep the shared Yjs CRDT/sync layer aligned between the
        # collab client (/frontend) and server (the extension). These
        # are pinned as direct deps in both manifests so Dependabot
        # tracks them; group-by: dependency-name merges each into a
        # single cross-directory PR rather than one PR per directory.
        group-by: dependency-name
        patterns:
          - 'yjs'
          - 'y-protocols'
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-builders/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "angular-eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-eslint/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@openproject/octicons"
      - dependency-name: "@openproject/primer-view-components"
      - dependency-name: "@primer/primitives"
      - dependency-name: "@primer/css"

  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: "dev"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 5
    groups:
      aws-gems:
        patterns:
          - "aws-*"
    ignore:
      - dependency-name: "openproject-octicons"
      - dependency-name: "openproject-octicons_helper"
      - dependency-name: "openproject-primer_view_components"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    cooldown:
      default-days: 7
