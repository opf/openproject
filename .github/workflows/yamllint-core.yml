name: Yamllint

on:
  pull_request:
    paths:
      - '.yamllint.yml'
      - 'config/locales/en.yml'
      - 'config/locales/js-en.yml'
      - 'docs/api/apiv3'
      - 'modules/*/config/locales/en.yml'
      - 'modules/*/config/locales/js-en.yml'

jobs:
  yamllint:
    name: Yamllint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Yamllint
        uses: reviewdog/action-yamllint@8f84f0fb670d777d3e584ef50faf60eb61605b2a # v1.25.3
        with:
          reporter: github-pr-annotations
          fail_level: any
          yamllint_flags: >
            .yamllint.yml
            config/locales/en.yml
            config/locales/js-en.yml
            docs/api/apiv3
            modules/*/config/locales/en.yml
            modules/*/config/locales/js-en.yml
