name: "BlockNote extensions / Publish to npm"

on:
  push:
    branches:
      - release-blocknote-extensions
    paths:
      - 'extensions/blocknote-extensions/package.json'

permissions:
  contents: read

defaults:
  run:
    working-directory: ./extensions/blocknote-extensions

jobs:
  publish:
    name: Publish
    if: github.repository == 'opf/openproject'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Check whether version is already published
        id: check
        run: |
          NAME=$(jq -r .name package.json)
          VERSION=$(jq -r .version package.json)
          if [ -n "$(npm view "$NAME@$VERSION" version 2>/dev/null)" ]; then
            echo "$NAME@$VERSION is already published, skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Dependencies
        if: steps.check.outputs.publish == 'true'
        run: npm ci

      - name: build
        if: steps.check.outputs.publish == 'true'
        run: npm run build

      - name: publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish
