name: Package
on:
  push:
    tags:
      - v*
    branches:
      - packaging/*
      - release/*
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package (e.g. v17.5.2). Empty builds the selected branch."
        required: false
        type: string
  schedule:
    - cron: '0 3 * * *' # Daily at 03:00

jobs:
  build:
    if: github.repository == 'opf/openproject'
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16-trixie
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: p4ssw0rd
        ports:
          - 5432:5432
    strategy:
      fail-fast: false
      matrix:
        target:
          - debian:11
          - debian:12
          - ubuntu:22.04
          - el:9
          - sles:15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup
        id: setup
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(ruby -r ./lib/open_project/version.rb -e "puts OpenProject::VERSION")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [[ "${GITHUB_REF_TYPE}" == "tag" || -n "$INPUT_TAG" ]]; then
            MAJOR=$(ruby -r ./lib/open_project/version.rb -e "puts OpenProject::VERSION::MAJOR")
            echo "channel=stable/${MAJOR}" >> $GITHUB_OUTPUT
          else
            echo "channel=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi
      - name: Package
        uses: pkgr/action/package@v1
        id: package
        with:
          target: ${{ matrix.target }}
          version: ${{ steps.setup.outputs.version }}
          pkgr_version: acc46f88dd24241e118139cb0e1f38ea948bb8c5
          debug: true
          cache_prefix: ${{ inputs.tag || github.ref_name }}
          env: |
            DATABASE_URL=postgres://app:p4ssw0rd@127.0.0.1:5432/app
      - name: Publish
        uses: pkgr/action/publish@v1
        with:
          target: ${{ matrix.target }}
          token: ${{ secrets.PACKAGER_PUBLISH_TOKEN }}
          repository: opf/openproject
          channel: ${{ steps.setup.outputs.channel }}
          file: ${{ steps.package.outputs.package_path }}
