name: RuboCop

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "extensions/blocknote-extensions/**"
      - "extensions/op-blocknote-hocuspocus/**"

jobs:
  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      - name: Run RuboCop
        uses: reviewdog/action-rubocop@b6d5e953a5fc0bf3ab65254e77730ea2174d6d6d # v2
        with:
          reporter: github-pr-annotations
          fail_level: any
          rubocop_version: gemfile
          rubocop_extensions: >
            rubocop-capybara:gemfile
            rubocop-factory_bot:gemfile
            rubocop-openproject:gemfile
            rubocop-performance:gemfile
            rubocop-rails:gemfile
            rubocop-rspec:gemfile
            rubocop-rspec_rails:gemfile
          only_changed: true
