name: Check work package version and Enterprise plan

on:
  pull_request:
    types:
      - opened
      - labeled
      - synchronize
      - ready_for_review

permissions:
  contents: read # to fetch code (actions/checkout)
  pull-requests: write # to comment on the PR

jobs:
  work-package-check:
    # Skip automation PRs (dependabot, copilot, the release merge PRs opened by
    # openprojectci) as they never link a work package.
    if: >-
      github.event.pull_request.draft == false
      && github.event.pull_request.user.type != 'Bot'
      && github.event.pull_request.user.login != 'openprojectci'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.336.0

      - name: Verify work package fields are set (linked version matches core version and Enterprise field is set)
        id: work-package-check
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
          UNFROZEN_RELEASE_BRANCHES: ${{ vars.UNFROZEN_RELEASE_BRANCHES }}
        run: ./script/ci/work_package_check.sh

      - name: Add comment if no work package is linked
        if: steps.work-package-check.outputs.no_ticket == 'true'
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: version-mismatch-comment
          message: |
            > [!WARNING]
            > This pull request does not link an OpenProject work package.

            Please add a link to the work package in the description, or reference it in the
            title in square brackets, e.g. `[SLUG-123] My title here`.

      - name: Add comment if versions differ (single work package)
        if: steps.work-package-check.outputs.version_mismatch == 'true' && steps.work-package-check.outputs.single_wp == 'true'
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: version-mismatch-comment
          message: |
            > [!CAUTION]
            > The provided work package version does not match the core version

            Details:

             - Work package URL: ${{ steps.work-package-check.outputs.wp_url }}
             - Work package version: ${{steps.work-package-check.outputs.wp_version}}
             - Core version: ${{steps.work-package-check.outputs.core_version}}

            Please make sure that:

             - The work package version OR your pull request target branch is correct

      - name: Add comment if versions differ (multiple work packages)
        if: steps.work-package-check.outputs.version_mismatch == 'true' && steps.work-package-check.outputs.single_wp != 'true'
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: version-mismatch-comment
          message: |
            > [!CAUTION]
            > One or more linked work packages have a version that does not match the core version

            Core version: `${{ steps.work-package-check.outputs.core_version }}`

            Affected work packages:

            ${{ steps.work-package-check.outputs.version_mismatch_details }}

            Please make sure that:

             - Each work package version OR your pull request target branch is correct

      - name: Add comment if Enterprise Plan is missing (single work package)
        if: steps.work-package-check.outputs.enterprise_plan_missing == 'true' && steps.work-package-check.outputs.single_wp == 'true'
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: enterprise-plan-missing-comment
          message: |
            > [!CAUTION]
            > The Enterprise plan field is not set on the work package

            Details:

             - Work package URL: ${{ steps.work-package-check.outputs.wp_url }}

            Please make sure that:

             - The work package Enterprise plan field is set

      - name: Add comment if Enterprise Plan is missing (multiple work packages)
        if: steps.work-package-check.outputs.enterprise_plan_missing == 'true' && steps.work-package-check.outputs.single_wp != 'true'
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: enterprise-plan-missing-comment
          message: |
            > [!CAUTION]
            > The Enterprise plan field is not set on one or more work packages

            Affected work packages:

            ${{ steps.work-package-check.outputs.enterprise_missing_details }}

            Please make sure that:

             - The Enterprise plan field is set on each work package

      - name: Add comment if a feature targets a frozen release branch
        if: steps.work-package-check.outputs.frozen_release_feature == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3
        with:
          header: frozen-release-feature-comment
          message: |
            > [!WARNING]
            > `${{ github.base_ref }}` is frozen for features.

            This pull request links features:

            ${{ steps.work-package-check.outputs.frozen_release_feature_details }}

            Please talk to a release manager and/or @opf/devops before you merge it.

      - name: Version check passed
        if: |
          steps.work-package-check.outputs.behind_feature_flag == 'true' ||
          (steps.work-package-check.outputs.version_mismatch != 'true' && steps.work-package-check.outputs.no_ticket != 'true')
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: version-mismatch-comment
          delete: true

      - name: Enterprise plan check passed
        if: |
          steps.work-package-check.outputs.enterprise_plan_missing != 'true'
          && steps.work-package-check.outputs.no_ticket != 'true'
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: enterprise-plan-missing-comment
          delete: true

      - name: Frozen release branch check passed
        if: steps.work-package-check.outputs.frozen_release_feature != 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3
        with:
          header: frozen-release-feature-comment
          delete: true
