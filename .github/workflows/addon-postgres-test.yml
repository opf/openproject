name: addon-postgres tests
on:
  pull_request:
    paths:
      - 'packaging/addons/addon-postgres/**'
      - '.github/workflows/addon-postgres-test.yml'
  push:
    branches:
      - dev
      - release/*
    paths:
      - 'packaging/addons/addon-postgres/**'
      - '.github/workflows/addon-postgres-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: provision
            dockerfile: tests/Dockerfile
            script: provision.sh
          - name: package
            dockerfile: tests/package.Dockerfile
            script: package.sh
    defaults:
      run:
        working-directory: packaging/addons/addon-postgres
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build test image
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE: addon-postgres-${{ matrix.name }}
        run: docker build -f "$DOCKERFILE" -t "$IMAGE" tests
      - name: Run test
        env:
          IMAGE: addon-postgres-${{ matrix.name }}
          SCRIPT: ${{ matrix.script }}
        run: docker run --rm -v "$PWD:/source:ro" "$IMAGE" "/source/tests/$SCRIPT"
