name: ERB lint

on:
  pull_request:
    paths:
      - "**/*.erb"
      - ".erb_lint.yml"
      - ".erb_linters/**"
      - ".herb.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/erb-lint-core.yml"

jobs:
  erb-lint:
    name: ERB lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.336.0
        with:
          bundler-cache: true
      - name: Run ERB lint
        uses: opf/action-erblint@main
        with:
          reporter: github-pr-annotations
          fail_level: any
          use_bundler: true

  herb-lint:
    name: Herb lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
          cache: npm
      - name: Install packages
        run: npm ci --ignore-scripts
      - name: Run Herb lint
        run: npm run herb:lint -- --github
