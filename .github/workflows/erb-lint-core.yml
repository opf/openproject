name: ERB lint

on:
  pull_request:
    paths:
      - "**/*.erb"
      - ".erb_lint.yml"
      - ".erb_linters/**"

jobs:
  erb-lint:
    name: ERB lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          bundler-cache: true
      - name: Run ERB lint
        uses: opf/action-erblint@49c54b56c60d0c50885065468cf149b61d5c2a60 # main
        with:
          reporter: github-pr-annotations
          fail_level: any
          use_bundler: true
