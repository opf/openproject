name: ERB lint

on:
  pull_request:
    paths:
      - "**/*.erb"
      - ".erb_lint.yml"
      - ".erb_linters/**"
      - ".herb.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/erb-lint-core.yml"

jobs:
  erb-lint:
    name: ERB lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          bundler-cache: true
      - name: Run ERB lint
        uses: opf/action-erblint@49c54b56c60d0c50885065468cf149b61d5c2a60 # main
        with:
          reporter: github-pr-annotations
          fail_level: any
          use_bundler: true

  herb-lint:
    name: Herb lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
          cache: npm
      - name: Install packages
        run: npm ci --ignore-scripts
      - name: Run Herb lint
        run: npm run herb:lint -- --github
