name: "BlockNote extensions / Tests"
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'extensions/op-blocknote-extensions/**'
      - '.github/workflows/op-blocknote-extensions-test.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: ./extensions/op-blocknote-extensions

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
          cache: npm
          cache-dependency-path: extensions/op-blocknote-extensions/package-lock.json

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: lint
        id: npm-lint
        run: npm run lint

  tests:
    name: Unit and browser tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
          cache: npm
          cache-dependency-path: extensions/op-blocknote-extensions/package-lock.json

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Install Playwright Browsers
        id: install-playwright
        run: npx playwright install --with-deps chromium

      - name: build
        id: npm-build
        run: npm run build

      - name: verify ESM bundle has no raw require of externals
        id: verify-bundle
        run: |
          externals=$(jq -r '.buildExternals | join("|")' package.json)
          pattern="\(\"($externals)(/[^\"]*)?\"\)"
          if grep -qE "$pattern" dist/op-blocknote-extensions.es.js; then
            echo "::error::ESM bundle contains a raw require() of an externalized module"
            grep -nE "$pattern" dist/op-blocknote-extensions.es.js
            exit 1
          fi

      - name: run tests
        id: npm-test
        run: CI=1 npm test
