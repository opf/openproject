name: Dangerfile

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - "docs/**"
      - "help/**"
      - "packaging/**"
      - ".pkgr.yml"
      - "extensions/blocknote-extensions/**"
      - "extensions/op-blocknote-hocuspocus/**"

jobs:
  danger:
    if: github.repository_owner == 'opf'
    runs-on: [ubuntu-latest]
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      BUNDLE_ONLY: danger
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ruby/setup-ruby@v1.336.0
        with:
          bundler-cache: true

      - name: Run inconsistent translations check
        env:
          DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bundle exec danger --verbose
