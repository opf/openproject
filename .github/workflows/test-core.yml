name: "Test suite"
# https://securitylab.github.com/research/github-actions-preventing-pwn-requests
on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - release/*
    paths-ignore:
      - 'docs/**'
      - 'help/**'
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - 'docs/**'
      - 'help/**'
      - 'packaging/**'
      - '.pkgr.yml'
      - '.github/workflows/packager.yml'

permissions:
  contents: read

# github.head_ref is only availabe in PR context and if it is absent then github.run_id
# is used . And github.run_id is unique for each workflow run. So, this option makes
# sure that there is only one build running for a pull request and the build is attached
# to the last commit of the PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup
    if: github.repository_owner == 'opf'
    runs-on: &runs-on
      labels: "runs-on=${{ github.run_id }}/image=ubuntu24-full-x64/family=m8azn+m8+m7+i7+r8/ram=128+256/cpu=24+32/volume=50gb"
    timeout-minutes: 10
    outputs:
      docker-hash: ${{ steps.constants.outputs.docker-hash }}
      gem-hash: ${{ steps.constants.outputs.gem-hash }}
      database-hash: ${{ steps.constants.outputs.database-hash }}
      assets-hash: ${{ steps.constants.outputs.assets-hash }}
      hocuspocus-hash: ${{ steps.constants.outputs.hocuspocus-hash }}
    steps:
    - uses: runs-on/action@efac073ea2507ec18797de3a81704201ade11d9d # v2.3.1
    - &checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout: |
          /*
          !docs
          /docs/api
          /docs/installation-and-operations
        sparse-checkout-cone-mode: false
    - name: Constants
      id: constants
      run: |
        cat << EOF >> "$GITHUB_OUTPUT"
        docker-hash=${{ runner.os }}-${{ hashFiles('docker-compose.ci.yml', 'docker/ci/*', '.ruby-version', 'bin/ci') }}
        frontend-hash=${{ hashFiles('package.json', 'frontend/package-lock.json') }}
        gem-hash=${{ runner.os }}-${{ hashFiles('.ruby-version') }}-${{ hashFiles('Gemfile.lock') }}
        database-hash=${{ hashFiles('db/migrate/**', 'modules/*/db/migrate/**', 'Gemfile.lock', 'docker/ci/database.yml') }}
        assets-hash=${{ github.sha }}
        hocuspocus-hash=${{ hashFiles('extensions/op-blocknote-hocuspocus/package-lock.json') }}
        EOF
    - name: Cache DOCKER
      id: cache_docker
      uses: runs-on/cache@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
      with:
        path: tmp/ci-cache/docker
        # Note: no restore keys since whenever the files below change, we want to rebuild the full image from scratch
        key: docker-${{ steps.constants.outputs.docker-hash }}
    - name: Restore CI image from cache
      if: steps.cache_docker.outputs.cache-hit == 'true'
      run: docker load -i tmp/ci-cache/docker/image.tar
    - name: Build and cache CI image
      if: steps.cache_docker.outputs.cache-hit != 'true'
      run: |
        bin/ci ruby -v
        mkdir -p tmp/ci-cache/docker
        docker save openproject-ci -o tmp/ci-cache/docker/image.tar
    - name: Cache GEM
      uses: runs-on/cache@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
      with:
        path: tmp/ci-cache/bundle
        key: gem-${{ steps.constants.outputs.gem-hash }}
        restore-keys: |
          gem-${{ runner.os }}-${{ hashFiles('.ruby-version') }}-
    - name: Cache NPM
      uses: runs-on/cache@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
      with:
        path: tmp/ci-cache/node
        key: node-${{ steps.constants.outputs.frontend-hash }}
        restore-keys: |
          node-
    - name: Cache ANGULAR
      uses: runs-on/cache@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
      with:
        path: tmp/ci-cache/angular
        key: angular-${{ steps.constants.outputs.frontend-hash }}
        restore-keys: |
          angular-
    - name: Cache DATABASE
      uses: runs-on/cache@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
      with:
        path: |
          db/structure.sql
          config/database.yml
        key: database-${{ steps.constants.outputs.database-hash }}
    - name: Cache ASSETS
      uses: runs-on/cache@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
      with:
        path: |
          public/assets
          config/frontend_assets.manifest.json
        key: assets-${{ steps.constants.outputs.assets-hash }}
    - name: Cache HOCUSPOCUS
      uses: runs-on/cache@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
      with:
        path: extensions/op-blocknote-hocuspocus/node_modules
        key: hocuspocus-${{ steps.constants.outputs.hocuspocus-hash }}
        restore-keys: |
          hocuspocus-
    - name: Cache SELENIUM
      uses: runs-on/cache@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
      with:
        path: tmp/ci-cache/selenium
        key: selenium-${{ steps.constants.outputs.docker-hash }}
    - name: Build
      run: bin/ci setup-tests
    - name: APIv3 specification (OpenAPI 3.0)
      run: bin/ci ./script/api/validate_spec
    - name: Report cache info
      if: ${{ always() }}
      run: |
        ls -al tmp/ci-cache/ || true
        du -sh tmp/ci-cache/* || true

  units:
    name: Units
    needs: setup
    if: github.repository_owner == 'opf'
    runs-on: *runs-on
    timeout-minutes: 10
    steps:
    - uses: runs-on/action@efac073ea2507ec18797de3a81704201ade11d9d # v2.3.1
    - *checkout
    - &restore-docker-cache
      name: Restore DOCKER cache
      uses: runs-on/cache/restore@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
      with:
        path: tmp/ci-cache/docker
        key: docker-${{ needs.setup.outputs.docker-hash }}
        fail-on-cache-miss: true
    - &restore-gem-cache
      name: Restore GEM cache
      uses: runs-on/cache/restore@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
      with:
        path: tmp/ci-cache/bundle
        key: gem-${{ needs.setup.outputs.gem-hash }}
        fail-on-cache-miss: true
    - &restore-database-cache
      name: Restore DATABASE cache
      uses: runs-on/cache/restore@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
      with:
        path: |
          db/structure.sql
          config/database.yml
        key: database-${{ needs.setup.outputs.database-hash }}
        fail-on-cache-miss: true
    - name: Cache TEST RUNTIME
      uses: runs-on/cache@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
      with:
        path: tmp/ci-cache/runtime-logs
        key: runtime-logs-units-${{ github.head_ref || github.ref }}-${{ github.sha }}
        restore-keys: |
          runtime-logs-units-${{ github.head_ref || github.ref }}-
          runtime-logs-units-
    - name: Restore CI image from cache
      run: docker load -i tmp/ci-cache/docker/image.tar
    - name: Unit tests
      run: bin/ci run-units
    - name: Report cache info
      if: ${{ always() }}
      run: |
        ls -al tmp/ci-cache/runtime-logs || true

  features:
    name: Features
    needs: setup
    if: github.repository_owner == 'opf'
    permissions:
      contents: read
      pull-requests: write
    runs-on: *runs-on
    timeout-minutes: 30
    steps:
    - uses: runs-on/action@efac073ea2507ec18797de3a81704201ade11d9d # v2.3.1
    - *checkout
    - *restore-docker-cache
    - *restore-gem-cache
    - *restore-database-cache
    - name: Restore ASSETS cache
      uses: runs-on/cache/restore@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
      with:
        path: |
          public/assets
          config/frontend_assets.manifest.json
        key: assets-${{ needs.setup.outputs.assets-hash }}
        fail-on-cache-miss: true
    - name: Restore HOCUSPOCUS cache
      uses: runs-on/cache/restore@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
      with:
        path: extensions/op-blocknote-hocuspocus/node_modules
        key: hocuspocus-${{ needs.setup.outputs.hocuspocus-hash }}
        fail-on-cache-miss: true
    - name: Restore SELENIUM cache
      uses: runs-on/cache/restore@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
      with:
        path: tmp/ci-cache/selenium
        key: selenium-${{ needs.setup.outputs.docker-hash }}
        fail-on-cache-miss: true
    - name: Cache TEST RUNTIME
      uses: runs-on/cache@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
      with:
        path: tmp/ci-cache/runtime-logs
        key: runtime-logs-features-${{ github.head_ref || github.ref }}-${{ github.sha }}
        restore-keys: |
          runtime-logs-features-${{ github.head_ref || github.ref }}-
          runtime-logs-features-
    - name: Restore CI image from cache
      run: docker load -i tmp/ci-cache/docker/image.tar
    - name: Feature tests
      env:
        CAPYBARA_DOWNLOADED_FILE_DIR: /tmp/ci/downloads
        CAPYBARA_AWS_ACCESS_KEY_ID: "${{ secrets.CAPYBARA_AWS_ACCESS_KEY_ID }}"
        CAPYBARA_AWS_SECRET_ACCESS_KEY: "${{ secrets.CAPYBARA_AWS_SECRET_ACCESS_KEY }}"
      run: bin/ci run-features
    - name: Report flaky specs
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        if [ -f tmp/retried_specs.txt ]; then
          echo "## Flaky specs" >> "$GITHUB_STEP_SUMMARY"
          cat tmp/retried_specs.txt >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR_NUMBER" ]; then
            SPECS="$(cat tmp/retried_specs.txt)" \
              envsubst '$SPECS $PR_NUMBER $PR_AUTHOR' \
              < .github/flaky-spec-copilot-comment.md > tmp/flaky_comment.md
            if [ "$PR_HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
              echo "::warning::Flaky specs detected in this PR - see job summary for details"
              cat tmp/flaky_comment.md
            else
              gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file tmp/flaky_comment.md
            fi
          fi
        fi
    - name: Report cache info
      if: ${{ always() }}
      run: |
        ls -al tmp/ci-cache/runtime-logs || true
