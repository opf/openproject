---
hy:
  js:
    github_integration:
      github_actions: Գործողություններ
      pull_requests:
        merged_message: "%{repository_link} պահոցի #%{pr_number} ձգման հարցումը %{pr_link} %{github_user_link}-ի կողմից %{pr_state}։"
        message: "%{repository_link} պահոցի #%{pr_number} ձգման հարցումը %{pr_link}, որի հեղինակն է %{github_user_link}-ը, %{pr_state}։"
        referenced_message: "%{repository_link} պահոցի #%{pr_number} ձգման հարցումը %{pr_link}, որի հեղինակն է %{github_user_link}-ը, հղում է կատարել այս աշխատանքային փաթեթին։"
        states:
          closed: փակ
          draft: սևագրվել է
          merged: միաձուլվել է
          opened: բացվել է
          ready_for_review: նշվել է որպես վերանայման պատրաստ
      tab_header:
        copy_menu:
          description: Պատճենել git-ի հատվածները փոխանակման բուֆեր
          label: Git-ի հատվածներ
        git_actions:
          branch_name: Ճյուղի անվանում
          cmd: Ստեղծել ճյուղ դատարկ կոմիտով
          commit_message: Կոմիտի հաղորդագրություն
          copy_error: "❌ Պատճենումը ձախողվեց։"
          copy_success: "✅ Պատճենվեց։"
          title: Git-ի արագ հատվածներ
        title: Ձգման հարցումներ
      tab_prs:
        empty: Դեռևս կապակցված ձգման հարցումներ չկան։ Կապակցեք գոյություն ունեցող PR՝ PR-ի նկարագրության մեջ օգտագործելով <code>OP#%{wp_id}</code> կոդը, կամ ստեղծեք նոր PR։
      work_packages:
        tab_name: GitHub
    work_packages:
      tabs:
        github: GitHub
