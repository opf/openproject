    '
  text_github_comment_user_info: 'Пользователь OpenProject, чей API-ключ должен использоваться для аутентификации входящих запросов к вебхукам. Если этот параметр установлен, запросы, аутентифицированные с помощью учетных данных любого другого пользователя, будут отклонены. Этот пользователь также публикует автоматические комментарии к рабочим пакетам о статусе развертывания. Если значение не установлено, по умолчанию используется системный пользователь.

    '
  text_github_webhook_secret_info: 'Секретный токен, передаваемый GitHub при настройке вебхука. Если установлено, OpenProject проверяет заголовок X-Hub-Signature-256 в каждом входящем запросе, отклоняя полезную нагрузку, которая не соответствует. Оставьте значение пустым, чтобы пропустить проверку (не рекомендуется).

    '
  text_github_webhook_secret_missing_warning: 'Секрет вебхука не настроен. Любой запрос к конечной точке GitHub webhook будет принят без проверки, что может позволить неавторизованным участникам подделывать события. Настоятельно рекомендуется установить секрет.

