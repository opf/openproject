    '
  text_github_comment_user_info: 'Den OpenProject-bruger, hvis API-nøgle skal bruges til at godkende indgående webhook-forespørgsler. Når den er angivet, afvises forespørgsler, der er godkendt med andre brugeres legitimationsoplysninger. Brugeren skriver også de automatiske kommentarer om udrulningsstatus på arbejdspakker. Er der ikke angivet nogen, bruges systembrugeren.

    '
  text_github_webhook_secret_info: 'Et hemmeligt token, der deles med GitHub, når webhooken sættes op. Når det er angivet, kontrollerer OpenProject headeren X-Hub-Signature-256 i hver indgående forespørgsel og afviser payloads, der ikke stemmer. Lad feltet stå tomt for at springe kontrollen over (anbefales ikke).

    '
  text_github_webhook_secret_missing_warning: 'Der er ikke konfigureret nogen webhook-hemmelighed. Alle forespørgsler til GitHubs webhook-endepunkt accepteres uden kontrol, så uautoriserede aktører kan forfalske hændelser. Det anbefales kraftigt at angive en hemmelighed.

    '
  text_pull_request_deployed_to: "%{pr_link} udrullet til %{deploy_target_link}"
