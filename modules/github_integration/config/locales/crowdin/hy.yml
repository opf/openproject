  project_module_github: GitHub
  text_deploy_target_api_key_info: 'OpenProject-ի [API բանալի](docs_url), որը պատկանում է համընդհանուր ինտրոսպեկցիայի թույլտվություն ունեցող օգտատիրոջը։

    '
  text_deploy_target_type_info: 'Առայժմ մենք աջակցում ենք միայն հենց OpenProject-ին։

    '
  text_github_comment_user_info: 'OpenProject-ի օգտատերը, որի API բանալին պետք է օգտագործվի մուտքային վեբհուկի հարցումները նույնականացնելու համար։ Երբ սահմանված է, ցանկացած այլ օգտատիրոջ հավատարմագրերով նույնականացված հարցումները մերժվում են։ Այս օգտատերը նաև տեղակայման կարգավիճակի ավտոմատ մեկնաբանություններ է հրապարակում աշխատանքային փաթեթներում։ Երբ սահմանված չէ, կանխադրված կիրառվում է համակարգային օգտատերը։

    '
  text_github_webhook_secret_info: 'Գաղտնի թոքեն, որը համօգտագործվում է GitHub-ի հետ վեբհուկը կազմաձևելիս։ Երբ սահմանված է, OpenProject-ը ստուգում է X-Hub-Signature-256 վերնագիրը յուրաքանչյուր մուտքային հարցումում՝ մերժելով չհամապատասխանող տվյալները։ Թողեք դատարկ՝ ստուգումը բաց թողնելու համար (խորհուրդ չի տրվում)։

    '
  text_github_webhook_secret_missing_warning: 'Վեբհուկի գաղտնիք կազմաձևված չէ։ GitHub-ի վեբհուկի վերջնակետին ուղղված ցանկացած հարցում կընդունվի առանց ստուգման, ինչը կարող է թույլ տալ չլիազորված անձանց կեղծել իրադարձությունները։ Խստորեն խորհուրդ է տրվում սահմանել գաղտնիք։

    '
  text_pull_request_deployed_to: "%{pr_link} տեղակայվել է %{deploy_target_link}-ում"
