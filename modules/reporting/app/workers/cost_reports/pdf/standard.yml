page:
  page_size: "A4"
  margin_top: 60
  margin_bottom: 60
  margin_left: 36
  margin_right: 36
  page_break_threshold: 200
  link_color: "175A8E"

page_header:
  offset: 20
  size: 8

page_footer:
  offset: -30
  size: 8
  spacing: 6

page_logo:
  height: 20
  align: "right"

page_heading:
  size: 14
  styles: [ "bold" ]
  margin_bottom: 10

cover:
  header:
    logo_height: 25
    border:
      color: 'd3dee3'
      height: 1
      offset: 6
  footer:
    size: 10
    color: '414d5f'
    offset: 30
  hero:
    padding_right: 144
    padding_top: 120
    title:
      max_height: 30
      spacing: 10
      font: 'SpaceMono'
      color: '414d5f'
      size: 10
    heading:
      spacing: 14
      color: '414d5f'
      styles:
        - bold
      size: 16
    dates:
      spacing: 4
      max_height: 16
      color: '414d5f'
      size: 10
      styles:
        - bold
    subheading:
      max_height: 30
      color: '414d5f'
      size: 10
