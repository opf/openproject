      match_preview_dialog_component:
        description: Սա թույլ է տալիս փորձարկել Ձեր կանոնավոր արտահայտության կաղապարը նմուշային տվյալների վրա՝ ստուգելու համար, որ Ձեր ուզած խմբերի անվանումներն իրոք ճիշտ են դուրս բերվում։ Դուք կարող եք փոփոխել Ձեր կաղապարն այստեղ, սակայն փորձնական տողը և համընկնումները չեն պահպանվի կազմաձևման հետ։
