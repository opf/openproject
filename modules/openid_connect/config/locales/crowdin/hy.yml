      group_regexes: Յուրաքանչյուր տողում՝ մեկ կանոնավոր արտահայտության կաղապար։ Խնդրում ենք կարդալ [փաստաթղթերը](docs_url)՝ դա անելու մասին լրացուցիչ տեղեկությունների համար։
      group_regexes_detail: Ըստ ցանկության սահմանեք կաղապարներ՝ կանոնավոր արտահայտությունների միջոցով խմբերի պնդումից խմբերի անվանումները համապատասխանեցնելու համար։ Օրինակ՝ <code>^Level1/Level2/([\w/]+)$</code> կաղապարի մուտքագրումը “Level1/Level2/GroupName/SubGroup” պարունակող պատասխանից դուրս կբերի “Groupname/SubGroup” խումբը։ Եթե ոչ մի կաղապար չի համապատասխանում, խումբն անտեսվում է։ Թողեք դատարկ՝ բոլոր խմբերն իրենց ամբողջական անվանումով համաժամացնելու համար։
      group_regexes_testing: Սեղմեք 'Փորձարկել կաղապարը'՝ Ձեր կանոնավոր արտահայտության կաղապարը նմուշային OIDC userinfo-ի վրա փորձարկելու համար։
      group_sync: Ավտոմատ կերպով դուրս բերել և համաժամացնել խմբերի անդամակցության տեղեկությունները ինքնության մատակարարից։
      groups_claim: Նշեք այն պնդման անվանումը, որը պետք է ցույց տա այն խմբերի անվանումները, որոնց անդամ է օգտատերը։
      limit_self_registration: Եթե միացված է, օգտատերերը կարող են այս մատակարարի միջոցով գրանցվել միայն այն դեպքում, երբ մատակարարի կողմում կազմաձևումը դա թույլ է տալիս։
