        '
      claims: 'Դուք կարող եք հայցել լրացուցիչ պնդումներ userinfo և id token վերջնակետերի համար։ Լրացուցիչ տեղեկությունների համար խնդրում ենք դիտել [OpenID Connect-ի վերաբերյալ մեր փաստաթղթերը](docs_url)։

        '
      client_id: Սա հաճախորդի ID-ն է, որը Ձեզ տրամադրել է Ձեր OpenID Connect մատակարարը
      client_secret: Սա հաճախորդի գաղտնիքն է, որը Ձեզ տրամադրել է Ձեր OpenID Connect մատակարարը
      display_name: Մատակարարի անվանումը։ Այն կցուցադրվի որպես մուտքի կոճակ և մատակարարների ցանկում։
