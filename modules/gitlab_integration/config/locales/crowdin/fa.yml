  gitlab_integration:
    issue_closed_referenced_comment: "**Issue بسته شد:** Issue شماره %{issue_number} با عنوان [%{issue_title}](%{issue_url}) برای [%{repository}](%{repository_url}) توسط [%{gitlab_user}](%{gitlab_user_url}) بسته شد.\n"
    issue_opened_referenced_comment: "**Issue باز شد:** Issue شماره %{issue_number} با عنوان [%{issue_title}](%{issue_url}) برای [%{repository}](%{repository_url}) توسط [%{gitlab_user}](%{gitlab_user_url}) باز شد.\n"
    issue_reopened_referenced_comment: "**Issue دوباره باز شد:** Issue شماره %{issue_number} با عنوان [%{issue_title}](%{issue_url}) برای [%{repository}](%{repository_url}) توسط [%{gitlab_user}](%{gitlab_user_url}) دوباره باز شد.\n"
    merge_request_closed_comment: "**MR بسته شد:** Merge Request شماره %{mr_number} با عنوان [%{mr_title}](%{mr_url}) برای [%{repository}](%{repository_url}) توسط [%{gitlab_user}](%{gitlab_user_url}) بسته شد.\n"
    merge_request_merged_comment: "**MR ادغام شد:** Merge Request شماره %{mr_number} با عنوان [%{mr_title}](%{mr_url}) برای [%{repository}](%{repository_url}) توسط [%{gitlab_user}](%{gitlab_user_url}) ادغام شد.\n"
    merge_request_opened_comment: "**MR باز شد:** Merge Request شماره %{mr_number} با عنوان [%{mr_title}](%{mr_url}) برای [%{repository}](%{repository_url}) توسط [%{gitlab_user}](%{gitlab_user_url}) باز شد.\n"
    merge_request_reopened_comment: "**MR دوباره باز شد:** Merge Request شماره %{mr_number} با عنوان [%{mr_title}](%{mr_url}) برای [%{repository}](%{repository_url}) توسط [%{gitlab_user}](%{gitlab_user_url}) دوباره باز شد.\n"
    note_commit_referenced_comment: "**ارجاع در Commit:** [%{gitlab_user}](%{gitlab_user_url}) در یادداشت Commit با شناسهٔ [%{commit_id}](%{commit_url}) روی [%{repository}](%{repository_url}) به این بسته کاری ارجاع داد: %{commit_note}\n"
    note_issue_commented_comment: "**دیدگاه در Issue:** [%{gitlab_user}](%{gitlab_user_url}) دربارهٔ این بسته کاری در Issue شماره %{issue_number} با عنوان [%{issue_title}](%{issue_url}) روی [%{repository}](%{repository_url}) دیدگاه ثبت کرد: %{issue_note}\n"
    note_issue_referenced_comment: "**ارجاع در Issue:** [%{gitlab_user}](%{gitlab_user_url}) در Issue شماره %{issue_number} با عنوان [%{issue_title}](%{issue_url}) روی [%{repository}](%{repository_url}) به این بسته کاری ارجاع داد: %{issue_note}\n"
    note_mr_commented_comment: "**دیدگاه در MR:** [%{gitlab_user}](%{gitlab_user_url}) دربارهٔ این بسته کاری در Merge Request شماره %{mr_number} با عنوان [%{mr_title}](%{mr_url}) روی [%{repository}](%{repository_url}) دیدگاه ثبت کرد: %{mr_note}\n"
    note_mr_referenced_comment: "**ارجاع در MR:** [%{gitlab_user}](%{gitlab_user_url}) در Merge Request شماره %{mr_number} با عنوان [%{mr_title}](%{mr_url}) روی [%{repository}](%{repository_url}) به این بسته کاری ارجاع داد: %{mr_note}\n"
    note_snippet_referenced_comment: "**ارجاع در Snippet:** [%{gitlab_user}](%{gitlab_user_url}) در Snippet شماره %{snippet_number} با عنوان [%{snippet_title}](%{snippet_url}) روی [%{repository}](%{repository_url}) به این بسته کاری ارجاع داد: %{snippet_note}\n"
    push_multiple_commits_comment: "**Push در MR:** [%{gitlab_user}](%{gitlab_user_url}) چند commit را با [%{commit_number}](%{commit_url}) در %{commit_timestamp} به [%{repository}](%{repository_url}) push کرد: %{commit_note}\n"
    push_single_commit_comment: "**Push در MR:** [%{gitlab_user}](%{gitlab_user_url})، [%{commit_number}](%{commit_url}) را در %{commit_timestamp} به [%{repository}](%{repository_url}) push کرد: %{commit_note}\n"
    push_single_commit_comment_with_ref: "**Push در %{reference}:** [%{gitlab_user}](%{gitlab_user_url})، [%{commit_number}](%{commit_url}) را در %{commit_timestamp} به [%{repository}](%{repository_url}) push کرد: %{commit_note}\n"
  label_gitlab_actor: عامل GitLab
  label_gitlab_integration: یکپارچه‌سازی GitLab
  label_gitlab_webhook_secret: رمز Webhook
  permission_show_gitlab_content: نمایش محتوای GitLab
  project_module_gitlab: GitLab
  text_gitlab_actor_info: 'کاربر OpenProject که API key او باید برای احراز هویت درخواست‌های webhook ورودی استفاده شود. در صورت تنظیم، درخواست‌هایی با اطلاعات سایر کاربران رد می‌شوند. این کاربر دیدگاه‌های خودکار را نیز روی بسته‌های کاری ثبت می‌کند. در نبود تنظیم، کاربر سامانه استفاده می‌شود.

    '
  text_gitlab_webhook_secret_info: 'یک توکن محرمانه هنگام پیکربندی webhook با GitLab به اشتراک گذاشته می‌شود. در صورت تنظیم، OpenProject هدر X-Gitlab-Token همهٔ درخواست‌های ورودی را بررسی و موارد نامطابق را رد می‌کند. خالی‌گذاشتن یعنی بدون بررسی (توصیه نمی‌شود).

    '
  text_gitlab_webhook_secret_missing_warning: 'هیچ رمز webhook پیکربندی نشده است. هر درخواست به endpoint وب‌هوک GitLab بدون تأیید پذیرفته می‌شود و ممکن است مهاجمان بتوانند رویداد جعلی ایجاد کنند. تنظیم یک رمز اکیداً توصیه می‌شود.

    '
