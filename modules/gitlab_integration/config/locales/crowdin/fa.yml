    '
  text_gitlab_webhook_secret_missing_warning: 'هیچ رمز webhook پیکربندی نشده است. هر درخواست به endpoint وب‌هوک GitLab بدون تأیید پذیرفته می‌شود و ممکن است مهاجمان بتوانند رویداد جعلی ایجاد کنند. تنظیم یک رمز اکیداً توصیه می‌شود.

    '
