    issue_reopened_referenced_comment: "**Խնդիրը վերաբացված է՝** [%{repository}](%{repository_url}) պահոցի %{issue_number} խնդիրը [%{issue_title}](%{issue_url}) վերաբացվել է [%{gitlab_user}](%{gitlab_user_url})-ի կողմից։\n"
    merge_request_closed_comment: "**MR-ը փակված է՝** [%{repository}](%{repository_url}) պահոցի %{mr_number} միաձուլման հարցումը [%{mr_title}](%{mr_url}) փակվել է [%{gitlab_user}](%{gitlab_user_url})-ի կողմից։\n"
    merge_request_merged_comment: "**MR-ը միաձուլված է՝** [%{repository}](%{repository_url}) պահոցի %{mr_number} միաձուլման հարցումը [%{mr_title}](%{mr_url}) միաձուլվել է [%{gitlab_user}](%{gitlab_user_url})-ի կողմից։\n"
    merge_request_opened_comment: "**MR-ը բացված է՝** [%{repository}](%{repository_url}) պահոցի %{mr_number} միաձուլման հարցումը [%{mr_title}](%{mr_url}) բացվել է [%{gitlab_user}](%{gitlab_user_url})-ի կողմից։\n"
    merge_request_reopened_comment: "**MR-ը վերաբացված է՝** [%{repository}](%{repository_url}) պահոցի %{mr_number} միաձուլման հարցումը [%{mr_title}](%{mr_url}) վերաբացվել է [%{gitlab_user}](%{gitlab_user_url})-ի կողմից։\n"
    note_commit_referenced_comment: "**Հղված է կոմիտում՝** [%{gitlab_user}](%{gitlab_user_url})-ն հղում է կատարել այս աշխատանքային փաթեթին [%{repository}](%{repository_url})-ի [%{commit_id}](%{commit_url}) կոմիտի նշման մեջ՝ %{commit_note}\n"
    note_issue_commented_comment: "**Մեկնաբանված է խնդրում՝** [%{gitlab_user}](%{gitlab_user_url})-ն մեկնաբանել է այս աշխատանքային փաթեթը [%{repository}](%{repository_url})-ի %{issue_number} խնդրում [%{issue_title}](%{issue_url})՝ %{issue_note}\n"
    note_issue_referenced_comment: "**Հղված է խնդրում՝** [%{gitlab_user}](%{gitlab_user_url})-ն հղում է կատարել այս աշխատանքային փաթեթին [%{repository}](%{repository_url})-ի %{issue_number} խնդրում [%{issue_title}](%{issue_url})՝ %{issue_note}\n"
    note_mr_commented_comment: "**Մեկնաբանված է MR-ում՝** [%{gitlab_user}](%{gitlab_user_url})-ն մեկնաբանել է այս աշխատանքային փաթեթը [%{repository}](%{repository_url})-ի %{mr_number} միաձուլման հարցումում [%{mr_title}](%{mr_url})՝ %{mr_note}\n"
    note_mr_referenced_comment: "**Հղված է MR-ում՝** [%{gitlab_user}](%{gitlab_user_url})-ն հղում է կատարել այս աշխատանքային փաթեթին [%{repository}](%{repository_url})-ի %{mr_number} միաձուլման հարցումում [%{mr_title}](%{mr_url})՝ %{mr_note}\n"
    note_snippet_referenced_comment: "**Հղված է հատվածում՝** [%{gitlab_user}](%{gitlab_user_url})-ն հղում է կատարել այս աշխատանքային փաթեթին [%{repository}](%{repository_url})-ի %{snippet_number} հատվածում [%{snippet_title}](%{snippet_url})՝ %{snippet_note}\n"
    push_multiple_commits_comment: "**Ուղարկված է MR-ում՝** [%{gitlab_user}](%{gitlab_user_url})-ն %{commit_timestamp}-ին մի քանի կոմիտ [%{commit_number}](%{commit_url}) ուղարկեց դեպի [%{repository}](%{repository_url})՝ %{commit_note}\n"
    push_single_commit_comment: "**Ուղարկված է MR-ում՝** [%{gitlab_user}](%{gitlab_user_url})-ն %{commit_timestamp}-ին ուղարկեց [%{commit_number}](%{commit_url}) կոմիտը դեպի [%{repository}](%{repository_url})՝ %{commit_note}\n"
    push_single_commit_comment_with_ref: "**Ուղարկված է %{reference}-ում՝** [%{gitlab_user}](%{gitlab_user_url})-ն %{commit_timestamp}-ին ուղարկեց [%{commit_number}](%{commit_url}) կոմիտը դեպի [%{repository}](%{repository_url})՝ %{commit_note}\n"
  label_gitlab_actor: GitLab-ի կատարող
  label_gitlab_integration: GitLab-ի ինտեգրացիա
  label_gitlab_webhook_secret: Վեբհուկի գաղտնիք
  permission_show_gitlab_content: Ցուցադրել GitLab-ի բովանդակությունը
  project_module_gitlab: GitLab
  text_gitlab_actor_info: 'OpenProject-ի օգտատերը, որի API բանալին պետք է օգտագործվի մուտքային վեբհուկի հարցումները նույնականացնելու համար։ Երբ սահմանված է, ցանկացած այլ օգտատիրոջ հավատարմագրերով նույնականացված հարցումները մերժվում են։ Այս օգտատերը նաև ավտոմատ մեկնաբանություններ է հրապարակում աշխատանքային փաթեթներում։ Երբ սահմանված չէ, կանխադրված կիրառվում է համակարգային օգտատերը։

    '
  text_gitlab_webhook_secret_info: 'Գաղտնի թոքեն, որը համօգտագործվում է GitLab-ի հետ վեբհուկը կազմաձևելիս։ Երբ սահմանված է, OpenProject-ը ստուգում է X-Gitlab-Token վերնագիրը յուրաքանչյուր մուտքային հարցումում՝ մերժելով չհամապատասխանող տվյալները։ Թողեք դատարկ՝ ստուգումը բաց թողնելու համար (խորհուրդ չի տրվում)։

    '
  text_gitlab_webhook_secret_missing_warning: 'Վեբհուկի գաղտնիք կազմաձևված չէ։ GitLab-ի վեբհուկի վերջնակետին ուղղված ցանկացած հարցում կընդունվի առանց ստուգման, ինչը կարող է թույլ տալ չլիազորված անձանց կեղծել իրադարձությունները։ Խստորեն խորհուրդ է տրվում սահմանել գաղտնիք։

    '
