    '
  text_gitlab_webhook_secret_info: 'Секретный токен, переданный GitLab при настройке вебхука. Если установлено, OpenProject проверяет заголовок X-Gitlab-Token в каждом входящем запросе, отклоняя полезную нагрузку, которая не совпадает. Оставьте значение пустым, чтобы пропустить проверку (не рекомендуется).

    '
  text_gitlab_webhook_secret_missing_warning: 'Секрет вебхука не настроен. Любой запрос к конечной точке GitLab webhook будет принят без проверки, что может позволить неавторизованным участникам подделывать события. Настоятельно рекомендуется установить секрет.

    '
