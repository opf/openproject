    issue_closed_referenced_comment: "**Issue lukket:** Issue %{issue_number} [%{issue_title}](%{issue_url}) i [%{repository}](%{repository_url}) er lukket af [%{gitlab_user}](%{gitlab_user_url}).\n"
    issue_opened_referenced_comment: "**Issue åbnet:** Issue %{issue_number} [%{issue_title}](%{issue_url}) i [%{repository}](%{repository_url}) er åbnet af [%{gitlab_user}](%{gitlab_user_url}).\n"
    issue_reopened_referenced_comment: "**Issue genåbnet:** Issue %{issue_number} [%{issue_title}](%{issue_url}) i [%{repository}](%{repository_url}) er genåbnet af [%{gitlab_user}](%{gitlab_user_url}).\n"
    merge_request_closed_comment: "**MR lukket:** Merge request %{mr_number} [%{mr_title}](%{mr_url}) i [%{repository}](%{repository_url}) er lukket af [%{gitlab_user}](%{gitlab_user_url}).\n"
    merge_request_merged_comment: "**MR flettet:** Merge request %{mr_number} [%{mr_title}](%{mr_url}) i [%{repository}](%{repository_url}) er flettet af [%{gitlab_user}](%{gitlab_user_url}).\n"
    merge_request_opened_comment: "**MR åbnet:** Merge request %{mr_number} [%{mr_title}](%{mr_url}) i [%{repository}](%{repository_url}) er åbnet af [%{gitlab_user}](%{gitlab_user_url}).\n"
    merge_request_reopened_comment: "**MR genåbnet:** Merge request %{mr_number} [%{mr_title}](%{mr_url}) i [%{repository}](%{repository_url}) er genåbnet af [%{gitlab_user}](%{gitlab_user_url}).\n"
    note_commit_referenced_comment: "**Henvist til i commit:** [%{gitlab_user}](%{gitlab_user_url}) henviste til denne arbejdspakke i en commit-note [%{commit_id}](%{commit_url}) i [%{repository}](%{repository_url}): %{commit_note}\n"
    note_issue_commented_comment: "**Kommenteret i issue:** [%{gitlab_user}](%{gitlab_user_url}) kommenterede denne arbejdspakke i issue %{issue_number} [%{issue_title}](%{issue_url}) i [%{repository}](%{repository_url}): %{issue_note}\n"
    note_issue_referenced_comment: "**Henvist til i issue:** [%{gitlab_user}](%{gitlab_user_url}) henviste til denne arbejdspakke i issue %{issue_number} [%{issue_title}](%{issue_url}) i [%{repository}](%{repository_url}): %{issue_note}\n"
    note_mr_commented_comment: "**Kommenteret i MR:** [%{gitlab_user}](%{gitlab_user_url}) kommenterede denne arbejdspakke i merge request %{mr_number} [%{mr_title}](%{mr_url}) i [%{repository}](%{repository_url}): %{mr_note}\n"
    note_mr_referenced_comment: "**Henvist til i MR:** [%{gitlab_user}](%{gitlab_user_url}) henviste til denne arbejdspakke i merge request %{mr_number} [%{mr_title}](%{mr_url}) i [%{repository}](%{repository_url}): %{mr_note}\n"
    note_snippet_referenced_comment: "**Henvist til i snippet:** [%{gitlab_user}](%{gitlab_user_url}) henviste til denne arbejdspakke i snippet %{snippet_number} [%{snippet_title}](%{snippet_url}) i [%{repository}](%{repository_url}): %{snippet_note}\n"
    push_multiple_commits_comment: "**Pushet i MR:** [%{gitlab_user}](%{gitlab_user_url}) pushede flere commits [%{commit_number}](%{commit_url}) til [%{repository}](%{repository_url}) %{commit_timestamp}: %{commit_note}\n"
    push_single_commit_comment: "**Pushet i MR:** [%{gitlab_user}](%{gitlab_user_url}) pushede [%{commit_number}](%{commit_url}) til [%{repository}](%{repository_url}) %{commit_timestamp}: %{commit_note}\n"
    push_single_commit_comment_with_ref: "**Pushet i %{reference}:** [%{gitlab_user}](%{gitlab_user_url}) pushede [%{commit_number}](%{commit_url}) til [%{repository}](%{repository_url}) %{commit_timestamp}: %{commit_note}\n"
  label_gitlab_actor: GitLab-aktør
  label_gitlab_integration: GitLab-integration
  label_gitlab_webhook_secret: Webhook-hemmelighed
  permission_show_gitlab_content: Vis GitLab-indhold
  project_module_gitlab: GitLab
  text_gitlab_actor_info: 'Den OpenProject-bruger, hvis API-nøgle skal bruges til at godkende indgående webhook-forespørgsler. Når den er angivet, afvises forespørgsler, der er godkendt med andre brugeres legitimationsoplysninger. Brugeren skriver også de automatiske kommentarer på arbejdspakker. Er der ikke angivet nogen, bruges systembrugeren.

    '
  text_gitlab_webhook_secret_info: 'Et hemmeligt token, der deles med GitLab, når webhooken sættes op. Når det er angivet, kontrollerer OpenProject headeren X-Gitlab-Token i hver indgående forespørgsel og afviser payloads, der ikke stemmer. Lad feltet stå tomt for at springe kontrollen over (anbefales ikke).

    '
  text_gitlab_webhook_secret_missing_warning: 'Der er ikke konfigureret nogen webhook-hemmelighed. Alle forespørgsler til GitLabs webhook-endepunkt accepteres uden kontrol, så uautoriserede aktører kan forfalske hændelser. Det anbefales kraftigt at angive en hemmelighed.

    '
