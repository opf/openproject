    '
  text_gitlab_webhook_secret_info: 'Et hemmeligt token, der deles med GitLab, når webhooken sættes op. Når det er angivet, kontrollerer OpenProject headeren X-Gitlab-Token i hver indgående forespørgsel og afviser payloads, der ikke stemmer. Lad feltet stå tomt for at springe kontrollen over (anbefales ikke).

    '
  text_gitlab_webhook_secret_missing_warning: 'Der er ikke konfigureret nogen webhook-hemmelighed. Alle forespørgsler til GitLabs webhook-endepunkt accepteres uden kontrol, så uautoriserede aktører kan forfalske hændelser. Det anbefales kraftigt at angive en hemmelighed.

    '
