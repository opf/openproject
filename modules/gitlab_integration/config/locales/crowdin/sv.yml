    push_single_commit_comment: "**Pushad i MR:** [%{gitlab_user}](%{gitlab_user_url}) pushade [%{commit_number}](%{commit_url}) till [%{repository}](%{repository_url}) %{commit_timestamp}: %{commit_note}\n"
