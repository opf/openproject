  label_gitlab_actor: GitLab-aktör
  label_gitlab_integration: GitLab-integration
  label_gitlab_webhook_secret: Webhook-hemlighet
  permission_show_gitlab_content: Visa GitLab-innehåll
  project_module_gitlab: GitLab
  text_gitlab_actor_info: 'OpenProject-användaren vars API-nyckel ska användas för att autentisera inkommande webhook-begäranden. När den anges avvisas begäranden som autentiserats med någon annan användares uppgifter. Den här användaren publicerar även automatiska kommentarer på arbetspaket. Om den inte anges används systemanvändaren som standard.

    '
  text_gitlab_webhook_secret_info: 'En hemlig token som delas med GitLab när webhooken konfigureras. När den anges verifierar OpenProject X-Gitlab-Token-huvudet för varje inkommande begäran och avvisar nyttolaster som inte matchar. Lämna tomt för att hoppa över verifieringen (rekommenderas inte).

    '
  text_gitlab_webhook_secret_missing_warning: 'Ingen webhook-hemlighet är konfigurerad. Alla begäranden till GitLab-webhookens slutpunkt accepteras utan verifiering, vilket kan göra det möjligt för obehöriga aktörer att förfalska händelser. Det rekommenderas starkt att ange en hemlighet.

    '
