                one: 1 work package is still linked to a SquashTM requirement. Remove its link to unlink the project.
                other: "%{count} work packages are still linked to SquashTM requirements. Remove their links to unlink the project."
        squashtm_integration/server:
          attributes:
            base:
              api_token_rejected: The SquashTM server rejected the API token.
              base_url_cannot_be_connected_to: The SquashTM server at %{url} could not be reached. Please ensure it is running and reachable from OpenProject.
              base_url_invalid: The SquashTM URL %{url} is not a valid URL.
              base_url_not_squashtm: The server at %{url} did not answer like a SquashTM server. Please check that the URL includes the SquashTM context path (for example https://squashtm.example.com/squash).
              base_url_request_timed_out: The SquashTM server at %{url} did not respond in time. Please ensure it is reachable and not overloaded.
              base_url_server_error: The SquashTM server at %{url} responded with an error (HTTP %{status}). Please ensure it is running and healthy.
              base_url_ssl_error: The SquashTM server at %{url} could not be reached over a secure connection. Please check its TLS certificate.
              base_url_ssrf_filtered: The SquashTM URL %{url} resolves to a blocked address. If the server runs on an internal network, allow its IP via the %{env_name} environment variable.
              singleton: Only one SquashTM server can be configured.
              squashtm_version_unsupported: The SquashTM server runs version %{version}, but version %{minimum} or newer is required.
        squashtm_integration/work_package_link:
          attributes:
            base:
              squashtm_project_not_linked: This project is not linked to a SquashTM project.
              squashtm_requirement_not_found: The SquashTM requirement %{squashtm_requirement_id} does not exist or is not visible to the SquashTM account used by OpenProject.
              squashtm_requirement_not_in_linked_project: The SquashTM requirement %{squashtm_requirement_id} does not belong to the SquashTM project linked to this project.
              squashtm_requirement_unavailable: The SquashTM requirement %{squashtm_requirement_id} could not be verified because the SquashTM server is not reachable. Please try again later.
              squashtm_server_not_configured: No SquashTM server is configured. Please contact your instance administrator.
              work_package_already_linked: The work package is already linked to a SquashTM requirement.
