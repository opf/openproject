          '
        guid_attribute_text: 'Valgfrit. Den LDAP-attribut, der indeholder et stabilt, entydigt id (fx "objectGUID" eller "entryUUID"). Når den er angivet, bevares afdelingerne, selvom OU''er omdøbes eller flyttes. Lad feltet stå tomt for at matche på DN.

          '
