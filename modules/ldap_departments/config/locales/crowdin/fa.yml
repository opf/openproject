          '
        guid_attribute_text: 'اختیاری. مشخصهٔ LDAP حاوی شناسهٔ یکتای پایدار (مانند "objectGUID" یا "entryUUID"). با تنظیم آن، دپارتمان‌ها پس از تغییر نام یا جابه‌جایی OU حفظ می‌شوند. برای تطبیق بر اساس DN خالی بگذارید.

          '
        ou_name_attribute_text: Attribute در LDAP که برای نام‌گذاری واحد سازمانی استفاده می‌شود (مثلاً «ou»).
        sections:
          connection: اتصال LDAP
          structure: واحدهای سازمانی
          users: کاربران
        structure_filter_string_text: فیلتر LDAP مطابق RFC4515 برای شناسایی ورودی‌های واحد سازمانی.
        sync_users_text: 'اگر فعال باشد، کاربرانی که زیر base DN پیدا شوند نیز در OpenProject ایجاد می‌شوند. در غیر این صورت فقط حساب‌های موجود به دپارتمان‌ها اختصاص می‌یابند.

          '
        user_filter_string_text: 'فیلتر اختیاری LDAP مطابق RFC4515 برای شناسایی ورودی‌های کاربر. برای استفاده از فیلتر اتصال، یا در نبود آن یک فیلتر عمومی person، این فیلد را خالی بگذارید.

          '
      help_text: 'این ماژول ساختار واحد سازمانی (OU) دایرکتوری LDAP را در سلسله‌مراتب دپارتمان‌های OpenProject بازتاب می‌دهد. هر OU زیر base DN پیکربندی‌شده به دپارتمان تبدیل می‌شود و کاربران به دپارتمان OU محل خود اختصاص می‌یابند. همگام‌سازی منظم از طریق cron job انجام می‌شود.

        '
      no_results: هنوز هیچ همگام‌سازی واحد سازمانی LDAP پیکربندی نشده است.
