        info: Los departamentos y sus miembros se mantienen y pasan a ser departamentos fijos. Puedes editarlos o eliminarlos más tarde de forma manual en Administración → Usuarios y permisos → Organización.
        title: Eliminar la sincronización de %{name}
      form:
        auth_source_text: Selecciona la conexión LDAP que debe usarse.
        base_dn_text: 'Introduce el DN base cuyas unidades organizativas (OU) se deben sincronizar. Sus OU directas se convertirán en departamentos de primer nivel. Debe estar por debajo del DN base de la conexión LDAP seleccionada.

          '
        guid_attribute_text: 'Opcional. El atributo LDAP que contiene un identificador único y estable (por ejemplo, «objectGUID» o «entryUUID»). Si se configura, los departamentos se mantendrán aunque se cambie el nombre o se mueva la unidad organizativa (OU). Déjalo en blanco para que la búsqueda se haga por DN.

          '
        ou_name_attribute_text: El atributo LDAP que se usa para nombrar el departamento (por ejemplo, «ou»).
        sections:
          connection: Conexión LDAP
          structure: Unidades organizativas
          users: Usuarios
        structure_filter_string_text: Filtro LDAP según RFC 4515 para identificar entradas de unidades organizativas.
        sync_users_text: 'Si se habilita esta opción, los usuarios que se encuentren por debajo del DN base también se crearán en OpenProject. Si no se habilita, solo se asignarán a los departamentos las cuentas que ya existan.

          '
        user_filter_string_text: 'Filtro LDAP opcional según RFC4515 para identificar las entradas de usuario. Déjalo en blanco para usar el filtro de conexión o un filtro genérico de personas si no se ha configurado ninguno.

          '
      help_text: 'Este módulo reproduce la estructura de unidades organizativas (OU) de tu directorio LDAP en la jerarquía de departamentos de OpenProject. Cada OU situada por debajo del DN base configurado se convierte en un departamento, y los usuarios se asignan al departamento de la OU en la que se encuentran. Los departamentos se sincronizan periódicamente mediante una tarea cron.

        '
      no_results: Aún no se ha configurado una sincronización de departamentos mediante LDAP.
