      destroy:
        confirmation_message:
          one: Si continúas, se eliminará la sincronización %{name} y LDAP dejará de gestionar %{count} departamento suyo.
          other: Si continúas, se eliminará la sincronización %{name} y LDAP dejará de gestionar %{count} departamentos suyos.
