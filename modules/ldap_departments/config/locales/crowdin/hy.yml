        info: Ստորաբաժանումները և դրանց անդամները պահպանվում են և դառնում սովորական ստորաբաժանումներ։ Այնուհետև կարող եք դրանք ձեռքով խմբագրել կամ ջնջել Ադմինիստրավորում → Օգտատերեր և թույլտվություններ → Կազմակերպություն բաժնում։
        title: Հեռացնել %{name} համաժամացումը
      form:
        auth_source_text: Ընտրեք, թե որ LDAP կապը պետք է օգտագործվի։
        base_dn_text: 'Մուտքագրեք այն base DN-ը, որի կազմակերպական միավորները պետք է համաժամացվեն։ Դրա անմիջական դուստր OU-ները դառնում են վերին մակարդակի ստորաբաժանումներ։ Այն պետք է լինի ընտրված LDAP կապի base DN-ից ներքև։

          '
        guid_attribute_text: 'Ոչ պարտադիր։ LDAP-ի հատկանիշ, որը պարունակում է կայուն եզակի նույնացուցիչ (օրինակ՝ "objectGUID" կամ "entryUUID")։ Երբ սահմանված է, ստորաբաժանումները պահպանվում են OU-ների վերանվանման և տեղափոխման դեպքում։ Թողեք դատարկ՝ ըստ DN-ի համապատասխանեցնելու համար։

          '
        ou_name_attribute_text: LDAP-ի հատկանիշը, որն օգտագործվում է ստորաբաժանումն անվանելու համար (օրինակ՝ "ou")։
        sections:
          connection: LDAP կապ
          structure: Կազմակերպական միավորներ
          users: Օգտատերեր
        structure_filter_string_text: RFC4515 LDAP զտիչ, որը նույնականացնում է կազմակերպական միավորների գրառումները։
        sync_users_text: 'Եթե միացված է, base DN-ից ներքև գտնված օգտատերերը նույնպես ստեղծվում են OpenProject-ում։ Առանց դրա ստորաբաժանումներին նշանակվում են միայն առկա հաշիվները։

          '
        user_filter_string_text: 'Ոչ պարտադիր RFC4515 LDAP զտիչ, որը նույնականացնում է օգտատերերի գրառումները։ Թողեք դատարկ՝ կապի զտիչն օգտագործելու համար, իսկ եթե այն սահմանված չէ՝ անձի ընդհանուր զտիչը։

          '
      help_text: 'Այս մոդուլն արտացոլում է Ձեր LDAP-ի կազմակերպական միավորների (OU) կառուցվածքը OpenProject-ի ստորաբաժանումների հիերարխիայում։ Կազմաձևված base DN-ից ներքև գտնվող յուրաքանչյուր OU դառնում է ստորաբաժանում, իսկ օգտատերերը նշանակվում են այն OU-ի ստորաբաժանմանը, որտեղ գտնվում են։ Ստորաբաժանումները պարբերաբար համաժամացվում են cron աշխատանքի միջոցով։

        '
      no_results: Դեռ ոչ մի LDAP ստորաբաժանումների համաժամացում կազմաձևված չէ։
      plural: LDAP ստորաբաժանումների համաժամացումներ
      singular: LDAP ստորաբաժանումների համաժամացում
      synchronization_started: Համաժամացումը սկսվել է ֆոնային ռեժիմում։ Ստորաբաժանումները կհայտնվեն այն ավարտվելուց հետո։
