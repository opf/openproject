        auth_source_text: Välj vilken LDAP-uppkoppling som ska användas
        base_dn_text: 'Ange det bas-DN vars organisationsenheter ska synkroniseras. Dess direkta underordnade OU:er blir avdelningar på högsta nivån. Det måste ligga under bas-DN för den valda LDAP-anslutningen.

          '
        guid_attribute_text: 'Valfritt. LDAP-attributet som innehåller en stabil unik identifierare (t.ex. "objectGUID" eller "entryUUID"). När det anges behålls avdelningar även om OU:er byter namn eller flyttas. Lämna tomt för matchning efter DN.

          '
        ou_name_attribute_text: LDAP-attributet som används för att namnge avdelningen (t.ex. "ou").
        sections:
          connection: LDAP-anslutning
          structure: Organisationsenheter
          users: Användare
