          '
        user_filter_string_text: 'Valfritt RFC4515 LDAP-filter som identifierar användarposter. Lämna tomt för att använda anslutningsfiltret eller ett generiskt personfilter om inget sådant är angivet.

          '
      help_text: 'Den här modulen speglar organisationsenhetsstrukturen (OU) i din LDAP-katalog till OpenProjects avdelningshierarki. Varje OU under det konfigurerade bas-DN blir en avdelning och användare tilldelas avdelningen för den OU där de finns. Avdelningarna synkroniseras regelbundet via ett cron-jobb.

        '
