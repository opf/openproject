        heading: Удалить синхронизацию %{name}?
        info: Подразделения и их члены останутся и станут штатными подразделениями. Вы можете редактировать или удалять их вручную в разделе Администрирование → Пользователи и разрешения → Организация.
        title: Удаление синхронизации %{name}
      form:
        auth_source_text: Выберите, какое соединение LDAP должно использоваться.
        base_dn_text: 'Введите базовый DN, организационные единицы которого должны быть синхронизированы. Его прямые потомки OU станут подразделениями верхнего уровня. Он должен быть ниже базового DN выбранного LDAP соединения.

          '
        guid_attribute_text: 'Необязательно. Атрибут LDAP со стабильным уникальным идентификатором (например "objectGUID" или "entryUID"). Когда установлено, департаменты переживут переименования OU и их перемещения. Оставьте пустым, если совпадает с DN.

          '
        ou_name_attribute_text: Атрибут LDAP, используемый для обозначения подразделения (например, «ou»).
        sections:
          connection: LDAP-подключение
          structure: Организационные единицы
          users: Пользователи
        structure_filter_string_text: Фильтр RFC4515 LDAP определяет организационные единицы.
        sync_users_text: 'Если эта опция включена, пользователи, расположенные ниже базового DN, также создаются в OpenProject. Если же она отключена, в подразделения назначаются только существующие учетные записи.

          '
        user_filter_string_text: 'Необязательный фильтр RFC4515 LDAP идентифицирующий записи пользователя. Оставьте пустым, чтобы использовать фильтр подключения, или обычный фильтр человека, когда ничего не установлено.

          '
      help_text: 'Данный модуль зеркалирует организационную структуру (OU) вашего каталога LDAP в иерархию подразделений OpenProject. Каждая организационная единица, расположенная ниже настроенного базового DN, становится подразделением, а пользователи зачисляются в тот отдел, в котором находится их организационная единица. Синхронизация подразделений осуществляется на регулярной основе с помощью задания cron.

        '
      no_results: Синхронизация подразделений через LDAP пока не настроена.
