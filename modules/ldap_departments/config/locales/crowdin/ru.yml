          few: Если вы продолжите, синхронизация %{name} будет удалена, и управление %{count} подразделениями больше не будет осуществляться через LDAP.
          many: Если вы продолжите, синхронизация %{name} будет удалена, и управление %{count} подразделениями больше не будет осуществляться через LDAP.
