      form:
        auth_source_text: Wählen Sie aus, welche LDAP-Verbindung verwendet werden soll.
        base_dn_text: 'Geben Sie den Basis-DN ein, unterhalb derer Organisationseinheiten synchronisiert werden sollen. Die direkt untergeordneten Organisationseinheiten werden zu Abteilungen der obersten Ebene. Der Basis-DN muss unterhalb des Basis-DN der ausgewählten LDAP-Verbindung liegen.

          '
        guid_attribute_text: 'Optional. Das LDAP-Attribut, das eine stabile, eindeutige Kennung enthält (z. B. „objectGUID“ oder „entryUUID“). Wenn dieses Feld gesetzt ist, bleiben Abteilungen auch bei Umbenennungen und Verschiebungen von Organisationseinheiten (OU) erhalten. Lassen Sie das Feld leer, um nach DN abzugleichen.

          '
        ou_name_attribute_text: Das LDAP-Attribut, das zur Bezeichnung der Abteilung verwendet wird (z. B. „ou“).
        sections:
          connection: LDAP-Verbindung
          structure: Organisationseinheiten
          users: Benutzer
        structure_filter_string_text: 'RFC 4515: LDAP-Filter zur Identifizierung von Einträgen für Organisationseinheiten.'
        sync_users_text: 'Wenn diese Option aktiviert ist, werden auch Benutzer, die unterhalb des Basis-DN liegen, in OpenProject angelegt. Ist sie deaktiviert, werden nur bereits vorhandene Konten den Abteilungen zugeordnet.

          '
        user_filter_string_text: 'Optionaler RFC4515-LDAP-Filter zur Identifizierung von Benutzereinträgen. Lassen Sie das Feld leer, um den Verbindungsfilter oder - falls kein Filter festgelegt ist - einen generischen Personenfilter zu verwenden.

          '
      help_text: 'Dieses Modul bildet die Struktur der Organisationseinheiten (OU) Ihres LDAP-Verzeichnisses als Abteilungen von OpenProject ab. Jede OU unterhalb des konfigurierten Basis-DN wird zu einer Abteilung, und die Benutzer werden der Abteilung der OU zugeordnet, in der sie sich befinden. Die Abteilungen werden regelmäßig über einen Hintergrund-Job synchronisiert.

        '
      no_results: Es wurden noch keine synchronisierten Abteilungen konfiguriert.
