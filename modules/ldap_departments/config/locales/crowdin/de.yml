        heading: Synchronisierung %{name} aufheben?
        info: Die Abteilungen und ihre Mitglieder bleiben erhalten und werden zu regulären Abteilungen. Sie können diese anschließend manuell unter „Administration“ → „Benutzer und Berechtigungen“ → „Organisation“ bearbeiten oder löschen.
