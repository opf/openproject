      text_configuration: 'Նշում՝ այս արժեքները ներկայացնում են ամբողջ հավելվածի ընթացիկ կազմաձևումը։ Դուք չեք կարող անջատել կազմաձևման կողմից պարտադրված կարգավորումները կամ փոփոխել ընթացիկ ակտիվ ռազմավարությունները, քանի որ դրանք պահանջում են սերվերի վերագործարկում։

