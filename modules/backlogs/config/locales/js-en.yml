---
en:
  js:
    backlogs:
      action_menu:
        # `one` names a single card's menu, never a selection of one.
        menu_label:
          one: "Work package actions"
          other: "Actions for %{count} selected work packages"
      announcements:
        batch_too_large: "Cannot move %{count} work packages at once. Select no more than %{max}."
        fallback_item_label: "Work package"
        fallback_list_name: "another list"
        menu_scope_changed: "The menu selection has changed. Reopen the menu before moving work packages."
        move_failed_check_position: "Move failed. Check the work package's current position."
        # The batch keys are plural hashes so translators can add the plural
        # categories their locale needs; the one: branch is unreachable (a
        # one-card move announces through the singular keys).
        move_failed_check_positions_batch:
          other: "Move failed. Check the work packages' current positions."
        move_failed_rolled_back: "Move failed. %{label} returned to its previous position."
        move_failed_rolled_back_batch:
          other: "Move failed. %{count} work packages returned to their previous positions."
        moved: "%{label} moved to position %{position} of %{total}"
        moved_batch:
          other: "%{count} work packages moved to positions %{first} through %{last} of %{total}"
        moved_batch_to_list:
          other: "%{count} work packages moved to %{list}, positions %{first} through %{last} of %{total}"
        moved_to_list: "%{label} moved to %{list}, position %{position} of %{total}"
      selection:
        card_state: "Selected"
        cleared: "Selection cleared."
        not_selectable: "Selection unchanged. This work package takes no part in this list's ordering."
        range_blocked: "Selection unchanged. That range contains a work package that takes no part in this list's ordering."
        range_restarted:
          one: "Could not extend the range. %{count} work package selected."
          other: "Could not extend the range. %{count} work packages selected."
        range_unavailable: "Selection unchanged. Expand this list to select that range."
        selected:
          one: "%{count} work package selected."
          other: "%{count} work packages selected."
    burndown_chart:
      chart_label: "Burndown chart"
    burnup_chart:
      chart_label: "Burnup chart"
    created_resolved_chart:
      chart_label: "Created vs. resolved chart"
      work_packages: "Work packages"
    sprint_charts:
      description_summary: "%{from} – %{to}. %{values}."
      description_value: "%{label}: %{value}"
      # Shared by every sprint chart that paints the non-working-days plugin's bands.
      non_working_day: "Non-working day"
      y_axis_title:
        story_points: "Story points"
        time: "Estimated time"
    sprint_work_package_graph:
      chart_label: "Work packages by status chart"
      count_column: "Work packages"
      status_column: "Status"
    velocity_chart:
      chart_label: "Velocity chart"
      sprint_column: "Sprint"
    work_packages:
      properties:
        storyPoints: "Story Points"
