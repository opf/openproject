      models:
        project:
          attributes:
            allow_multiple_active_sprints:
              locked_by_multiple_active_sprints: não pode ser alterado enquanto vários sprints ativos estiverem em andamento.
              requires_no_sharing: só pode ser ativado quando o compartilhamento de sprints estiver definido como "Não compartilhar".
            sprint_sharing:
              active_or_borrowed_sprint_blocks_receiving: não pode ser definido para receber porque o projeto tem uma sprint ativa ou emprestada. Primeiro, feche ou desatribua os pacotes de trabalho.
