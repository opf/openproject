              share_all_projects_already_taken_anonymous: não pode ser definido, pois outro projeto já está compartilhando com todos os projetos.
              work_packages_still_linked_to_shared_sprints: não pode ser alterado porque ainda há pacotes de trabalho vinculados a sprints compartilhadas. Primeiro, desassocie-os.
