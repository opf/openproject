          many: Actions for %{count} selected work packages
          other: Actions for %{count} selected work packages
      announcements:
        batch_too_large: Nie można przenieść %{count} pakietów roboczych naraz. Wybierz nie więcej niż %{max}.
        fallback_item_label: Pakiet roboczy
        fallback_list_name: inna lista
        menu_scope_changed: The menu selection has changed. Reopen the menu before moving work packages.
        move_failed_check_position: Przeniesienie nie powiodło się. Sprawdź bieżącą pozycję pakietu roboczego.
        move_failed_check_positions_batch:
          other: Przeniesienie nie powiodło się. Sprawdź bieżące pozycje pakietów roboczych.
        move_failed_rolled_back: Przeniesienie nie powiodło się. Przywrócono poprzednią pozycję %{label}.
        move_failed_rolled_back_batch:
