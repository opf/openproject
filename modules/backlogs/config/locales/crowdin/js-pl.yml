        moved_to_list: "%{label} przeniesiono do %{list}, pozycja %{position} z %{total}"
      selection:
        card_state: Wybrana
        cleared: Wyczyszczono wybór.
        not_selectable: Wybór pozostaje bez zmian. Ten pakiet roboczy nie ma wpływu na kolejność pozycji na tej liście.
        range_blocked: Wybór pozostaje bez zmian. Ten zakres zawiera pakiet roboczy, który nie ma wpływu na kolejność pozycji na tej liście.
        range_restarted:
          one: Could not extend the range. %{count} work package selected.
          few: Nie można rozszerzyć zakresu. Wybrano %{count} pakiety robocze.
          many: Nie można rozszerzyć zakresu. Wybrano %{count} pakietów roboczych.
          other: Nie można rozszerzyć zakresu. Wybrano %{count} pakietu roboczego.
        range_unavailable: Wybór pozostaje bez zmian. Rozwiń tę listę, aby wybrać ten zakres.
