          other: No se pudo trasladar. Compruebe las posiciones actuales de los paquetes de trabajo.
        move_failed_rolled_back: No se pudo trasladar. %{label} regresó a su posición anterior.
        move_failed_rolled_back_batch:
          other: No se pudo trasladar. %{count} paquetes de trabajo regresaron a sus posiciones anteriores.
        moved: "%{label} se trasladó a la posición %{position} de %{total}"
        moved_batch:
