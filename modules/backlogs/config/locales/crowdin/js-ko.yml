ko:
  js:
    backlogs:
      announcements:
        batch_too_large: Cannot move %{count} work packages at once. Select no more than %{max}.
        fallback_item_label: 작업 패키지
        fallback_list_name: 다른 목록
        move_failed_check_position: 이동하지 못했습니다. 작업 패키지의 현재 위치를 확인하세요.
        move_failed_check_positions_batch:
          other: 이동하지 못했습니다. 작업 패키지의 현재 위치를 확인하세요.
        move_failed_rolled_back: 이동하지 못했습니다. %{label}이(가) 이전 위치로 돌아갔습니다.
        move_failed_rolled_back_batch:
          other: 이동하지 못했습니다. %{count}개 작업 패키지가 이전 위치로 돌아갔습니다.
        moved: "%{label} moved to position %{position} of %{total}"
        moved_batch:
          other: "%{count} work packages moved to positions %{first} through %{last} of %{total}"
        moved_batch_to_list:
          other: "%{count} work packages moved to %{list}, positions %{first} through %{last} of %{total}"
        moved_to_list: "%{label} moved to %{list}, position %{position} of %{total}"
      selection:
        card_state: Selected
        cleared: Selection cleared.
        not_selectable: Selection unchanged. This work package takes no part in this list's ordering.
        range_blocked: Selection unchanged. That range contains a work package that takes no part in this list's ordering.
        range_restarted:
          other: Could not extend the range. %{count} work packages selected.
        range_unavailable: Selection unchanged. Expand this list to select that range.
        selected:
          other: "%{count} work packages selected."
    burndown:
      day: 일
      points: 포인트
    work_packages:
      properties:
        storyPoints: 스토리 포인트
