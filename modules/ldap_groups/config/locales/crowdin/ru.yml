          '
      help_text_html: |
        Данный модуль позволяет настроить синхронизацию между группами LDAP и OpenProject.
        <br/>
        По умолчанию OpenProject использует <strong>реверсивный поиск</strong>: он ищет пользователей, у которых атрибут <em>memberOf</em> совпадает с DN группы.
        Для этого необходимо, чтобы атрибут <em>memberOf</em> присутствовал в записях пользователей (Active Directory, OpenLDAP с оверлеем memberOf).
        <br/>
        Если ваш LDAP-сервер не поддерживает <em>атрибут memberOf</em> в записях пользователей (например, он использует <em>groupOfUniqueNames</em> с <em>uniqueMember</em>),
        вы можете настроить <strong>прямой поиск</strong>, указав <em>атрибут «Член группы»</em> в фильтре синхронизации.
        <br/>
        Группы синхронизируются ежечасно с помощью задания cron.
        [Ознакомьтесь с нашей документацией по данной теме](docs_url).
