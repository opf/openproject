          '
      help_text_html: 'Den här modulen gör det möjligt att konfigurera synkronisering mellan LDAP- och OpenProject-grupper.\n<br/>\nSom standard använder OpenProject <strong>omvänd sökning</strong>: systemet söker efter användare vars <em>memberOf</em>-attribut matchar gruppens DN.\nDetta kräver att <em>memberOf</em>-attributet finns i användarposterna (Active Directory, OpenLDAP med memberof-overlay).\n<br/>\nOm LDAP-servern inte upprätthåller <em>memberOf</em> i användarposterna (t.ex. om den använder <em>groupOfUniqueNames</em> med <em>uniqueMember</em>) kan du konfigurera <strong>framåtriktad sökning</strong> genom att ange <em>Attribut för gruppmedlem</em> i synkroniseringsfiltret.\n<br/>\nGrupper synkroniseras varje timme via ett cron-jobb.\n[Läs vår dokumentation om detta ämne](docs_url).

