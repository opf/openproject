        sync_users_text: 'با فعال کردن این گزینه، کاربران یافت شده به صورت خودکار در اپن پروجکت ساخته می شوند. در غیر این صورت، تنها حساب های موجود در اپن پروجکت به گروه ها اضافه می شوند.

          '
      help_text_html: |
        این ماژول به شما اجازه می‌دهد بین گروه‌های LDAP و OpenProject همگام‌سازی برقرار کنید.
        <br/>
        به‌طور پیش‌فرض، OpenProject از <strong>جست‌وجوی معکوس</strong> استفاده می‌کند: کاربرانی را جست‌وجو می‌کند که ویژگی <em>memberOf</em> آن‌ها با DN گروه مطابقت دارد.
        برای این روش، ویژگی <em>memberOf</em> باید روی رکوردهای کاربر وجود داشته باشد (Active Directory یا OpenLDAP با memberof overlay).
        <br/>
        اگر سرور LDAP شما <em>memberOf</em> را روی رکوردهای کاربر نگه نمی‌دارد (برای مثال از <em>groupOfUniqueNames</em> با <em>uniqueMember</em> استفاده می‌کند)،
        می‌توانید <strong>جست‌وجوی رو‌به‌جلو</strong> را با تنظیم <em>ویژگی عضو گروه</em> در فیلتر همگام‌سازی پیکربندی کنید.
        <br/>
        گروه‌ها هر ساعت از طریق یک cron job همگام می‌شوند.
        [لطفاً مستندات ما درباره این موضوع را ببینید](docs_url).
      no_members: این گروه هنوز عضو همگام‌شده‌ای ندارد.
      no_results: گروه همگام‌شده‌ای پیدا نشد.
      plural: گروه‌های LDAP همگام‌شده
      singular: گروه LDAP همگام‌شده
      upsell:
