          '
      help_text_html: |
        Цей модуль дозволяє налаштувати синхронізацію між групами LDAP й OpenProject.
        <br/>
        За замовчуванням OpenProject використовує <strong>зворотний</strong> пошук: знаходить користувачів, атрибут <em>memberOf</em> яких збігається з DN групи.
        Для цього потрібно, щоб атрибут <em>memberOf</em> був у записах користувачів (Active Directory, OpenLDAP з накладанням memberof).
        <br/>
        Якщо ваш LDAP-сервер не підтримує атрибут <em>memberOf</em> у записах користувачів (наприклад, використовує <em>groupOfUniqueNames</em> із <em>uniqueMember</em>), ви можете налаштувати <strong>прямий пошук</strong>, указавши <em>атрибут учасника групи</em> у фільтрі синхронізації.
        <br/>
        Групи синхронізуються щогодини за допомогою запланованого завдання (cron).
        [Перегляньте документацію на цю тему](docs_url).
      no_members: У цієї групи поки немає синхронізованих учасників.
