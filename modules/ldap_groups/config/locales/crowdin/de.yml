          '
        filter_string_text: Geben Sie den RFC4515 LDAP-Filter ein, der Gruppen in Ihrem LDAP zur Synchronisierung mit OpenProject zurückgibt.
        group_name_attribute_text: Geben Sie das Attribut der LDAP-Gruppe ein, die für das Setzen des Namens der zugehörigen OpenProject-Gruppe verwendet wird.
        member_lookup_attribute_text: 'Lassen Sie diese Option leer, um standardmäßig die Rückwärtssuche zu verwenden: OpenProject sucht nach Benutzern, deren memberOf-Attribut mit dem DN der Gruppe übereinstimmt. Dazu muss das Attribut memberOf in den Benutzereinträgen vorhanden sein (Active Directory, OpenLDAP mit memberof overlay). Setzen Sie dies auf den Attributnamen in Gruppeneinträgen, die Mitglieder-DNs auflisten, um stattdessen Forward Lookup zu verwenden. Beispiele: "uniqueMember" (groupOfUniqueNames), "member" (groupOfNames). Verwenden Sie dies für LDAP-Server, die das Attribut memberOf nicht für Benutzereinträge pflegen.

          '
