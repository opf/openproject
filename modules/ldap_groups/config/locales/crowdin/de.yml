        heading: Synchronisierte Gruppe %{name} entfernen?
        info: 'Hinweis: Die OpenProject Gruppe selbst und die Mitglieder, die außerhalb dieser LDAP-Synchronisation hinzugefügt wurden, werden nicht entfernt.'
        title: Synchronisierte Gruppe %{name} entfernen
      form:
        auth_source_text: Wählen der zu verwendenden LDAP-Verbindung.
        dn_text: Geben Sie den vollständigen DN der Gruppe im LDAP ein
        group_text: Wählen Sie eine bestehende OpenProject-Gruppe aus, in die Mitglieder der LDAP-Gruppe synchronisiert werden sollen
        sync_users_text: 'Wenn Sie diese Option aktivieren, werden auch gefundene Benutzer automatisch in OpenProject erstellt. Ohne diese Option werden nur existierende Konten in OpenProject zu Gruppen hinzugefügt.

          '
      help_text_html: |
        Mit diesem Modul können Sie eine Synchronisierung für Gruppen zwischen LDAP und OpenProject einrichten.
        <br/>
        Standardmäßig verwendet OpenProject die <strong>umgekehrte Suche</strong>: Es sucht nach Benutzern, deren <em>memberOf-Attribut</em> mit dem DN der Gruppe übereinstimmt.
        Dazu muss das Attribut <em>memberOf</em> in den Benutzereinträgen vorhanden sein (Active Directory, OpenLDAP mit memberof overlay).
        <br/>
        Wenn Ihr LDAP-Server das <em>Attribut memberOf</em> für Benutzereinträge nicht enthält (er verwendet z.B. <em>groupOfUniqueNames</em> mit <em>uniqueMember</em>),
        können Sie die <strong>Vorwärtssuche</strong> konfigurieren, indem Sie das <em>Attribut Gruppenmitglied</em> im Synchronisationsfilter setzen.
        <br/>
        Die Gruppen werden stündlich über einen Cron-Job synchronisiert.
        [Bitte lesen Sie unsere Dokumentation zu diesem Thema](docs_url).
