      destroy:
        confirmation: Se continuar, o grupo sincronizado %{name} e todos os utilizadores sincronizados com %{users_count} serão removidos.
        heading: Remover grupo sincronizado %{name}?
        info: O próprio grupo OpenProject e membros adicionados fora desta sincronização LDAP não serão removidos.
        title: Remover grupo sincronizado %{name}
      form:
        auth_source_text: Selecione a ligação LDAP a ser usada.
        dn_text: Inserir todo o ND do grupo no LDAP
        group_text: Selecione um grupo OpenProject existente com que os membros do grupo LDAP serão sincronizados
        sync_users_text: 'Se ativar esta opção, os utilizadores encontrados também serão criados automaticamente no OpenProject. Sem isso, só as contas existentes no OpenProject serão adicionadas aos grupos.

          '
      help_text_html: |
        Este módulo permite configurar uma sincronização entre grupos LDAP e grupos do OpenProject.
        <br/>
        Por predefinição, o OpenProject utiliza a <strong>pesquisa inversa</strong>: procura utilizadores cujo atributo <em>memberOf</em> corresponde ao DN do grupo.
        Isto requer que o atributo <em>memberOf</em> esteja presente nas entradas de utilizador (Active Directory, OpenLDAP com overlay memberof).
        <br/>
        Se o seu servidor LDAP não mantiver o atributo <em>memberOf</em> nas entradas de utilizador (por exemplo, se utilizar <em>groupOfUniqueNames</em> com <em>uniqueMember</em>),
        pode configurar a <strong>pesquisa direta</strong> definindo o <em>Atributo de membro do grupo</em> no filtro de sincronização.
        <br/>
        Os grupos são sincronizados de hora a hora através de uma tarefa cron.
        [Consulte a nossa documentação sobre este tema](docs_url).
      no_members: Este grupo ainda não tem membros sincronizados.
