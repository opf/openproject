          '
        filter_string_text: Insira o filtro RFC4515 LDAP que devolve grupos no seu LDAP para sincronizar com o OpenProject.
        group_name_attribute_text: Insira o atributo de grupo LDAP usado para configurações do nome de grupo do OpenProject.
        member_lookup_attribute_text: 'Deixe em branco para utilizar a pesquisa inversa predefinida: o OpenProject procura utilizadores cujo atributo memberOf corresponde ao DN do grupo. Isto requer que o atributo memberOf esteja presente nas entradas de utilizador (Active Directory, OpenLDAP com overlay memberof). Defina este campo com o nome do atributo nas entradas de grupo que lista os DNs dos membros para utilizar a pesquisa direta. Exemplos: "uniqueMember" (groupOfUniqueNames), "member" (groupOfNames). Utilize esta opção para servidores LDAP que não mantêm o atributo memberOf nas entradas de utilizador.

          '
      label_n_groups_found:
