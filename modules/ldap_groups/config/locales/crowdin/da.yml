          '
      help_text_html: |
        Modulet gør det muligt at sætte en synkronisering op mellem grupper i LDAP og OpenProject.
        <br/>
        Som standard bruger OpenProject <strong>opslag baglæns</strong>: Det søger efter brugere, hvis <em>memberOf</em>-attribut svarer til gruppens DN.
        Det kræver, at brugerposterne har attributten <em>memberOf</em> (Active Directory, OpenLDAP med memberof-overlay).
        <br/>
        Hvis din LDAP-server ikke vedligeholder <em>memberOf</em> på brugerposterne (fx fordi den bruger <em>groupOfUniqueNames</em> med <em>uniqueMember</em>),
        kan du konfigurere <strong>opslag forlæns</strong> ved at angive <em>Attribut for gruppemedlemmer</em> i synkroniseringsfilteret.
        <br/>
        Grupperne synkroniseres hver time via et cron-job.
        [Læs vores dokumentation om emnet](docs_url).
