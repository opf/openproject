        heading: Հեռացնե՞լ %{name} համաժամացված խումբը։
        info: OpenProject-ի խումբը և այս LDAP համաժամացումից դուրս ավելացված անդամները չեն հեռացվի։
        title: Հեռացնել %{name} համաժամացված խումբը
      form:
        auth_source_text: Ընտրեք, թե որ LDAP կապը պետք է օգտագործվի։
        dn_text: Մուտքագրեք LDAP-ում խմբի ամբողջական DN-ը
        group_text: Ընտրեք OpenProject-ի առկա խումբը, որի հետ պետք է համաժամացվեն LDAP խմբի անդամները
        sync_users_text: 'Եթե միացնեք այս ընտրանքը, գտնված օգտատերերը նույնպես ավտոմատ կստեղծվեն OpenProject-ում։ Առանց դրա խմբերում կավելացվեն միայն OpenProject-ում առկա հաշիվները։

          '
      help_text_html: |
        Այս մոդուլը թույլ է տալիս կարգավորել համաժամացում LDAP-ի և OpenProject-ի խմբերի միջև։
        <br/>
        Ըստ կանխադրման՝ OpenProject-ն օգտագործում է <strong>հակադարձ որոնում</strong>՝ այն որոնում է այն օգտատերերին, որոնց <em>memberOf</em> հատկանիշը համապատասխանում է խմբի DN-ին։
        Դրա համար անհրաժեշտ է, որ <em>memberOf</em> հատկանիշն առկա լինի օգտատերերի գրառումներում (Active Directory, OpenLDAP՝ memberof overlay-ով)։
        <br/>
        Եթե Ձեր LDAP սերվերը չի պահպանում <em>memberOf</em>-ը օգտատերերի գրառումներում (օրինակ՝ օգտագործում է <em>groupOfUniqueNames</em>՝ <em>uniqueMember</em>-ով),
        Դուք կարող եք կազմաձևել <strong>ուղիղ որոնում</strong>՝ համաժամացման զտիչում սահմանելով <em>Խմբի անդամի հատկանիշ</em> դաշտը։
        <br/>
        Խմբերը համաժամացվում են ամեն ժամ՝ cron աշխատանքի միջոցով։
        [Խնդրում ենք դիտել այս թեմայի վերաբերյալ մեր փաստաթղթերը](docs_url)։
      no_members: Այս խումբը դեռ չունի համաժամացված անդամներ։
      no_results: Համաժամացված խմբեր չեն գտնվել։
      plural: Համաժամացված LDAP խմբեր
      singular: Համաժամացված LDAP խումբ
      upsell:
        description: Օգտվեք համաժամացված LDAP խմբերի առավելություններից՝ օգտատերերին կառավարելու, նրանց թույլտվությունները փոփոխելու և խմբերի միջև օգտատերերի կառավարումը հեշտացնելու համար։
