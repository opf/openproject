      form:
        base_dn_text: 'Մուտքագրեք որոնման base DN-ը, որը պետք է օգտագործվի այս զտիչի համար։ Այն պետք է լինի ընտրված LDAP կապի base DN-ից ներքև։ Թողեք այս ընտրանքը դատարկ՝ կապի base DN-ը կրկին օգտագործելու համար

          '
        filter_string_text: Մուտքագրեք RFC4515 LDAP զտիչը, որը վերադարձնում է Ձեր LDAP-ի այն խմբերը, որոնք պետք է համաժամացվեն OpenProject-ի հետ։
        group_name_attribute_text: Մուտքագրեք LDAP խմբի այն հատկանիշը, որն օգտագործվում է OpenProject-ի խմբի անվանումը սահմանելու համար։
        member_lookup_attribute_text: 'Թողեք դատարկ՝ կանխադրված հակադարձ որոնումն օգտագործելու համար՝ OpenProject-ը որոնում է այն օգտատերերին, որոնց memberOf հատկանիշը համապատասխանում է խմբի DN-ին։ Դրա համար անհրաժեշտ է, որ memberOf հատկանիշն առկա լինի օգտատերերի գրառումներում (Active Directory, OpenLDAP՝ memberof overlay-ով)։ Ուղիղ որոնում օգտագործելու համար այստեղ նշեք խմբերի գրառումների այն հատկանիշի անվանումը, որը թվարկում է անդամների DN-երը։ Օրինակներ՝ "uniqueMember" (groupOfUniqueNames), "member" (groupOfNames)։ Օգտագործեք սա այն LDAP սերվերների համար, որոնք օգտատերերի գրառումներում memberOf հատկանիշ չեն պահպանում։

          '
      label_n_groups_found:
