---
ru:
  plugin_openproject_recaptcha:
    description: Этот модуль обеспечивает проверку рекапчи во время входа в систему.
    name: OpenProject ReCaptcha
  recaptcha:
    button_please_wait: Пожалуйста, подождите...
    error_captcha: Невозможно подтвердить учетную запись. Пожалуйста, свяжитесь с администратором.
    label_recaptcha: reCAPTCHA
    settings:
      captcha_description_html: 'reCAPTCHA - это бесплатный сервис Google, который можно подключить в OpenProject. Если эта функция включена, то при входе в систему будет выводиться форма с капчей для всех пользователей, которые еще не верифицированы. <br/> Более подробно о reCAPTCHA и их версиях, а также о том, как создать сайт и секретные ключи, читайте по следующей ссылке: %{recaptcha_link} <br/> HCaptcha - это бесплатная альтернатива Google, которую Вы можете использовать, если не хотите применять reCAPTCHA. Смотрите эту ссылку для получения дополнительной информации: %{hcaptcha_link} <br/> Cloudflare Turnstile™ - еще одна альтернатива, которая более удобна для пользователей и при этом обеспечивает тот же уровень безопасности. См. эту ссылку для получения дополнительной информации: %{turnstile_link}

        '
      response_limit: Ограничение ответа для HCaptcha
