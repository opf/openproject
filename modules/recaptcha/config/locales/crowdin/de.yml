de:
  plugin_openproject_recaptcha:
    description: Dieses Modul stellt Recaptcha-Prüfungen während der Anmeldung bereit.
    name: OpenProject ReCaptcha
  recaptcha:
    button_please_wait: Bitte warten ...
    error_captcha: Ihr Account konnte nicht verifiziert werden. Bitte kontaktieren Sie einen Administrator.
    label_recaptcha: reCAPTCHA
    settings:
      captcha_description_html: 'reCAPTCHA ist ein kostenloser Dienst von Google, der für Ihre OpenProject Instanz aktiviert werden kann. Wenn aktiviert, wird bei Anmeldung ein Captcha-Formular für alle Benutzer gerendert, die noch kein Captcha verifiziert haben. <br/> Bitte sehen Sie den folgenden Link für weitere Details zu reCAPTCHA und deren Versionen, und wie die Webseite und die geheimen Schlüssel erstellt werden: %{recaptcha_link} <br/> HCaptcha ist eine Google-freie Alternative, die Sie verwenden können, wenn Sie reCAPTCHA nicht verwenden möchten. Siehe diesen Link für weitere Informationen: %{hcaptcha_link} <br/>Cloudflare Turnstile™ is eine weitere Alternative für Nutzer von CloudFlare. Sie diesen Link für weitere Informationen: %{turnstile_link}

        '
      response_limit: Antwortlimit für HCaptcha
      response_limit_text: Die maximale Anzahl an Zeichen, um eine HCaptcha-Antwort als gültig zu werten.
      secret_key: Geheimer Schlüssel
