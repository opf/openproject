      type: reCAPTCHA verwenden
      type_disabled: reCAPTCHA deaktivieren
      type_hcaptcha: HCaptcha
      type_turnstile: Cloudflare Turnstile™
      type_v2: reCAPTCHA V2
      type_v3: reCAPTCHA V3
      website_key: Website-Schlüssel (auch "Site-Schlüssel" genannt)
