  text_onetime_meeting_template_banner: Obecnie edytujesz szablon spotkania. Możesz użyć tego szablonu do tworzenia jednorazowych spotkań z predefiniowanym planem spotkania. Zmiany nie będą miały wpływu na już utworzone spotkania.
  text_onetime_meeting_template_empty_description: Dodaj punkty planu spotkania, sekcje i załączniki tutaj. Będą one dołączane do każdego spotkania utworzonego przy użyciu tego szablonu.
  text_onetime_meeting_template_empty_heading: Ten szablon spotkania jest pusty
  text_outcome_cannot_be_added: Nie można już dodać wyniku.
  text_outcome_not_editable_anymore: Tego wyniku nie można już edytować.
  text_series_backlog: 'Backlog jest współdzielony z wszystkimi wystąpieniami tej serii. Możesz przeciągać elementy, aby dodawać lub usuwać je z określonego spotkania.

    '
  text_series_backlog_clear_description: 'Spowoduje to usunięcie z backlogu serii wszystkich elementów, które są współdzielone z wszystkimi spotkaniami w serii. Czy na pewno chcesz kontynuować? To działanie jest nieodwracalne.

    '
  text_work_package_add_to_meeting_hint: Użyj przycisku „Dodaj do spotkania”, aby dodać ten pakiet roboczy do nadchodzącego spotkania.
  text_work_package_has_no_past_meeting_agenda_items: Ten pakiet roboczy nie został dodany jako pozycja planu spotkania w poprzednim spotkaniu.
  text_work_package_has_no_upcoming_meeting_agenda_items: Ten pakiet roboczy nie został jeszcze zaplanowany w planie nadchodzącego spotkania.
