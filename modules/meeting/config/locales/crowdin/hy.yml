    planned:
      blankslate:
        desc: 'Այս շարքում լրացուցիչ հանդիպումներ պլանավորված չեն։ Լրացուցիչ հանդիպումներ պլանավորելու կամ շարքը երկարաձգելու համար անցեք ձևանմուշին և խմբագրեք հանդիպման մանրամասները՝ ավարտի ամսաթիվը, պարբերականությունը կամ միջակայքը փոխելու համար։

          '
