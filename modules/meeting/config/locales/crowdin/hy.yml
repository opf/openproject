      subtitle: 'Հետևյալ հանդիպումները պլանավորված են կրկնվող հանդիպումների ժամանակացույցում, սակայն դեռ բաց չեն։ Ամեն անգամ, երբ պլանավորված հանդիպումը սկսվում է, հաջորդն ավտոմատ կերպով կբացվի Ձեզ համար։ Դուք կարող եք նաև ձեռքով բացել պլանավորված հանդիպումները՝ ձևանմուշը ներմուծելու և օրակարգի խմբագրումը սկսելու համար։

