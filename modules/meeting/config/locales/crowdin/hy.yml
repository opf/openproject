  text_meeting_draft_description: Պատրաստեք Ձեր օրակարգը սևագրի ռեժիմում։ Այս հանդիպումը չի ուղարկի որևէ օրացուցային թարմացում կամ հրավեր, նույնիսկ եթե փոփոխեք հանդիպման մանրամասները կամ ավելացնեք/հեռացնեք մասնակիցներ։
  text_meeting_empty_description1: Սկսեք՝ ստորև ավելացնելով օրակարգի կետեր։ Յուրաքանչյուր կետ կարող է լինել պարզապես վերնագիր, սակայն Դուք կարող եք ավելացնել նաև լրացուցիչ մանրամասներ, ինչպիսիք են տևողությունը և նշումները։
  text_meeting_empty_description2: Դուք կարող եք նաև ավելացնել հղումներ առկա աշխատանքային փաթեթներին։ Այդ դեպքում կապակցված նշումներն ավտոմատ կերպով տեսանելի կլինեն աշխատանքային փաթեթի "Հանդիպումներ" ներդիրում։
  text_meeting_empty_heading: Ձեր հանդիպումը դատարկ է
  text_meeting_ics_description: Հանդիպման հղում՝ %{url}
  text_meeting_ics_meeting_series_description: Հանդիպումների շարքի հղում՝ %{url}
  text_meeting_in_progress_description: Դուք կարող եք փոփոխել օրակարգը, փաստագրել յուրաքանչյուր կետի արդյունքները և հետևել մասնակիցների ներկայությանը։ Հանդիպումն ավարտվելուց հետո կարող եք այն նշել որպես փակված՝ կողպելու համար։
  text_meeting_in_progress_dropdown_description: Փաստագրեք արդյունքները, օրինակ՝ տեղեկատվական կարիքները կամ հանդիպման ընթացքում կայացված որոշումները։
  text_meeting_minutes_for_meeting: '"%{meeting}" հանդիպման արձանագրություն'
  text_meeting_not_editable_anymore: Այս հանդիպումն այլևս խմբագրելի չէ։
  text_meeting_not_present_anymore: Այս հանդիպումը ջնջվել է։ Խնդրում ենք ընտրել մեկ այլ հանդիպում։
  text_meeting_occurrence_ics_description: Հանդիպման կրկնության հղում՝ %{url} Հանդիպումների շարքի հղում՝ %{series_url}
  text_meeting_open_description: Դուք կարող եք ավելացնել/հեռացնել օրակարգի կետեր և մասնակիցներ։ Երբ օրակարգը պատրաստ լինի, նշեք այն որպես ընթացքի մեջ՝ արդյունքները փաստագրելու համար։
  text_meeting_open_dropdown_description: Առկա արդյունքները կմնան, սակայն օգտատերերը չեն կարողանա նոր արդյունքներ ավելացնել։
  text_meeting_series_end_early: Շարքի ավարտը կջնջի ապագա բոլոր բաց կամ պլանավորված հանդիպումների կրկնությունները
  text_meeting_series_end_early_heading: Ջնջե՞լ ապագա կրկնությունները։
  text_meeting_template_blank_slate: Դուք կարող եք ստեղծել նոր ձևանմուշ մեկանգամյա հանդիպումների համար
  text_meeting_template_blank_slate_heading: Ցուցադրելու ձևանմուշներ չկան
  text_meeting_template_sharing_description: Այս ձևանմուշը կարող է համօգտագործվել ենթանախագծերի կամ այս համակարգի այլ նախագծերի հետ։ Կպատճենվեն միայն օրակարգի կետերը և կցորդները։
  text_notificiation_invited: Այս նամակը պարունակում է ստորև նշված հանդիպման ics գրառումը՝
  text_onetime_meeting_template_banner: Դուք ներկայումս խմբագրում եք հանդիպման ձևանմուշը։ Դուք կարող եք օգտագործել այս ձևանմուշը՝ նախապես սահմանված օրակարգով մեկանգամյա հանդիպումներ ստեղծելու համար։ Փոփոխությունները չեն ազդի արդեն ստեղծված հանդիպումների վրա։
  text_onetime_meeting_template_empty_description: Այստեղ ավելացրեք օրակարգի կետեր, բաժիններ և կցորդներ։ Դրանք կներառվեն այս ձևանմուշով ստեղծված յուրաքանչյուր հանդիպումում։
  text_onetime_meeting_template_empty_heading: Հանդիպման այս ձևանմուշը դատարկ է
  text_outcome_cannot_be_added: Արդյունք այլևս հնարավոր չէ ավելացնել։
  text_outcome_not_editable_anymore: Այս արդյունքն այլևս խմբագրելի չէ։
  text_series_backlog: 'Բեքլոգը համօգտագործվում է այս շարքի բոլոր կրկնությունների հետ։ Դուք կարող եք քաշել տարրերը ներս և դուրս՝ դրանք որոշակի հանդիպմանն ավելացնելու կամ դրանից հեռացնելու համար։

    '
  text_series_backlog_clear_description: 'Սա կհեռացնի շարքի բեքլոգի բոլոր տարրերը, որը համօգտագործվում է շարքի բոլոր հանդիպումների հետ։ Համոզվա՞ծ եք, որ ցանկանում եք շարունակել։ Այս գործողությունն անշրջելի է։

    '
  text_work_package_add_to_meeting_hint: Օգտագործեք "Ավելացնել հանդիպմանը" կոճակը՝ այս աշխատանքային փաթեթն առաջիկա հանդիպմանն ավելացնելու համար։
  text_work_package_has_no_past_meeting_agenda_items: Այս աշխատանքային փաթեթը որևէ անցյալ հանդիպումում որպես օրակարգի կետ չի ավելացվել։
  text_work_package_has_no_upcoming_meeting_agenda_items: Այս աշխատանքային փաթեթը դեռ պլանավորված չէ որևէ առաջիկա հանդիպման օրակարգում։
