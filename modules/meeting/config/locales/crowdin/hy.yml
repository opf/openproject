        title: Այս պահին բաց հանդիպումներ չկան
      subtitle: 'Բաց հանդիպումներն ունեն օրակարգեր, որոնք կարելի է խմբագրել և որոնք հայտնվում են առանձին օգտատերերի ‘Իմ հանդիպումները’ բաժնում։ Հանդիպումների շարքի ձևանմուշի փոփոխությունները չեն ազդում արդեն բաց հանդիպումների կրկնությունների վրա։

        '
