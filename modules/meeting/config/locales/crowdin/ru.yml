  text_meeting_closing_are_you_sure: Вы уверены, что хотите закрыть повестку дня собрания?
  text_meeting_draft_banner: В настоящее время Вы находитесь в режиме черновика. Это совещание не будет рассылать никаких обновлений календаря или приглашений, даже если Вы измените детали совещания или добавите/удалите участников.
  text_meeting_draft_description: Подготовьте повестку дня в режиме черновика. Это совещание не будет рассылать никаких обновлений календаря или приглашений, даже если Вы измените детали совещания или добавите/удалите участников.
  text_meeting_empty_description1: Начните с добавления пунктов повестки ниже. Каждый пункт может быть простым, как заголовок, но вы также можете добавить дополнительные сведения, такие как продолжительность и примечания.
  text_meeting_empty_description2: Вы также можете добавить ссылки на существующие пакеты работ. Когда вы это сделаете, соответствующие заметки будут автоматически отображаться на вкладке «Совещания» пакета работ.
  text_meeting_empty_heading: Совещание пусто
  text_meeting_ics_description: 'Ссылка на совещание: %{url}'
  text_meeting_ics_meeting_series_description: 'Ссылка на серию совещаний: %{url}'
  text_meeting_in_progress_description: Можно редактировать повестку, фиксировать результаты по каждому пункту и отмечать присутствие участников. По завершении встречи пометьте её как «Закрыта», чтобы заблокировать изменения.
  text_meeting_in_progress_dropdown_description: Итоги совещания, такие как информация или решения, принятые в ходе совещания.
  text_meeting_minutes_for_meeting: Протокол совещания «%{meeting}»
  text_meeting_not_editable_anymore: Это совещание больше нельзя редактировать.
  text_meeting_not_present_anymore: Это совещание было удалено. Пожалуйста, выберите другое.
  text_meeting_occurrence_ics_description: 'Ссылка на совещание: %{url} Ссылка на серию совещаний: %{series_url}'
  text_meeting_open_description: Можно добавлять и удалять пункты повестки и участников. Когда повестка готова, переведите её в статус «В процессе», чтобы фиксировать результаты.
  text_meeting_open_dropdown_description: Любые существующие результаты останутся, но пользователи не смогут добавлять новые результаты.
  text_meeting_series_end_early: Завершение серии удалит любые будущие открытые или запланированные события совещания
  text_meeting_series_end_early_heading: Удалить будущие события?
  text_meeting_template_blank_slate: Вы можете создать новый шаблон для одноразовых встреч
  text_meeting_template_blank_slate_heading: Нет шаблонов для отображения
  text_meeting_template_sharing_description: Этот шаблон можно использовать совместно с подпроектами или другими проектами. Будут скопированы только пункты повестки дня и вложения.
  text_notificiation_invited: 'Это сообщение содержит запись ics для совещания ниже:'
  text_onetime_meeting_template_banner: В данный момент Вы редактируете шаблон совещания. Вы можете использовать этот шаблон для создания одноразовых совещаний с заранее определенной повесткой дня. Изменения не повлияют на уже созданные совещания.
  text_onetime_meeting_template_empty_description: Добавьте сюда пункты повестки дня, разделы и вложения. Они будут включены в каждое совещание, созданное с помощью этого шаблона.
  text_onetime_meeting_template_empty_heading: Этот шаблон совещания пуст
  text_outcome_cannot_be_added: Итог больше нельзя добавить.
  text_outcome_not_editable_anymore: Этот итог недоступен для редактирования.
  text_series_backlog: 'Общий бэклог для всех совещаний серии. Вы можете добавлять и удалять элементы в конкретное совещание при помощи перетаскивания.

    '
  text_series_backlog_clear_description: 'Это приведет к удалению всех элементов в бэклоге серии, который разделен со всеми встречами в этой серии. Вы уверены, что хотите продолжить? Это действие необратимо.

    '
  text_work_package_add_to_meeting_hint: Используйте кнопку "Добавить к совещанию", чтобы добавить этот пакет работ к предстоящему совещанию.
  text_work_package_has_no_past_meeting_agenda_items: Этот пакет работ не был добавлен в качестве пункта повестки дня на прошлом совещании.
  text_work_package_has_no_upcoming_meeting_agenda_items: Этот пакет работ пока не включен в повестку предстоящего совещания.
