        features_incapable: "%{features} cannot run, because the chosen model does not provide: %{capabilities}."
        features_model_missing: "%{features} point at a model the server no longer offers."
        features_unbound: "%{features} have no model chosen yet."
        invalid_api_key: The server rejected the stored API key.
        model_not_served: The server has no route for %{model} (404). Check that the model is still offered to your account and that the host URL includes the API version segment.
        models_endpoint_missing: The server has no model list at this address, so the API key could not be verified either. Check that the URL includes the API version segment (for example https://example.com/v1).
        no_model_to_test: No model is available to test with. Add a model or choose a default first.
        no_models: The server does not publish a model list. Either it does not offer one, or the endpoint is missing its API version segment. Models can be added manually; the inference check is what proves the endpoint is right.
        no_models_endpoint: The server does not offer a model list, so the API key could not be verified. Run the inference check to verify it.
        not_configured: No endpoint has been configured.
        not_openai_compatible: The endpoint did not return a valid model list. Please ensure it points at an OpenAI-API-compatible endpoint, including the API version segment.
        request_timed_out: The server did not respond in time.
        semantic_index_model_missing: The active semantic index "%{title}" was built with %{model}, which the server no longer offers. Activate another semantic index to keep search by meaning working.
        server_error: The server responded with status %{status}.
        ssrf_filtered: The endpoint resolves to a blocked address.
        unsupported_api_format: "%{api_format} needs credentials that OpenProject cannot store."
