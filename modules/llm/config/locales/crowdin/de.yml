        env_pending: Environment variables configure this connection but have not been applied yet. The next database seed replaces the values below and locks this page.
        label_connecting: Contacting the LLM server…
        llm_features_enabled_caption: When turned off, all LLM-backed AI features stop working. The connection settings are kept.
        server_description: Connect OpenProject to a server that speaks the %{api_format} API, so AI features can use it. The host URL below decides which server that is.
