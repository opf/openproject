        description: OpenProject will stop using the LLM server. AI features will be unavailable until you connect again.
        heading: Disconnect from the LLM server?
        keeps_bindings: 'The model chosen for each feature is kept: %{features}.'
        keeps_models: The model list, including any models you added manually, is kept.
        keeps_settings: The endpoint and API format are kept. Only the stored API key is removed.
        menu_label: Trennen
