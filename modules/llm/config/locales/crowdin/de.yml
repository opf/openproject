        context_window_known: Leer lassen, um %{value}, %{source} zu verwenden.
        display_name_caption: An optional friendly name shown instead of the model id.
        external_id_caption: Der Modellname genau so, wie er vom Server erwartet wird.
        model_type: Modelltyp
