---
de:
  activerecord:
    attributes:
      llm_capability_verdict:
        capability: Fähigkeit
        model_id: Modell
        state: Status
      llm_connection:
        api_format: API-Format
        api_key: API-Schlüssel
        base_url: Host-URL
        default_chat_model: Standardmäßiges Chat-Modell
        default_embedding_model: Default embedding model
        env_fingerprint: Applied environment configuration
        env_provisioned_at: Applied from the environment
        llm_features_enabled: LLMs für diese Instanz aktivieren
      llm_feature_binding:
        dimensions: Dimensions
        feature_key: Feature
        model: Modell
      llm_model:
        admin_context_window: Kontextfenster
        display_name: Anzeigename
        external: Modellname
    errors:
      models:
        llm_connection:
          attributes:
            api_format:
              not_supported: needs credentials that OpenProject cannot store, such as a separate secret key or region.
            api_key:
              invalid_api_key: wurde vom LLM-Server abgelehnt.
            base:
              singleton: Es kann nur eine LLM-Verbindung aktiv sein.
            base_url:
              cannot_be_connected_to: could not be reached. Please ensure the LLM server is running and reachable from OpenProject.
              models_endpoint_missing: has no model list at this address, so the API key could not be verified either. Please check the URL, in particular that it includes the API version segment (for example https://example.com/v1).
              not_openai_compatible: did not return a valid model list. Please ensure the URL points at an OpenAI-API-compatible endpoint, including the API version segment (for example https://example.com/v1).
              request_timed_out: did not respond in time. Please ensure the LLM server is reachable and not overloaded.
              ssl_error: could not be reached over a secure connection. Please check the LLM server's TLS certificate, or use an http:// URL if the server does not offer TLS.
              ssrf_filtered: resolves to a blocked address. If the LLM server runs on an internal network, allow its IP via the %{env_name} environment variable.
            custom_headers:
              invalid: must map header names to plain text values.
            default_chat_model_id:
              cannot_chat: is an embedding model, according to the LLM server, and cannot be used for chat.
              not_available: is not offered by the configured LLM server.
            default_embedding_model_id:
              cannot_embed: is known not to create embeddings, according to the LLM server.
              not_available: is not offered by the configured LLM server.
            llm_features_enabled:
              requires_connection: cannot be turned on before a connection has been configured.
        llm_feature_binding:
          attributes:
            dimensions:
              locked: cannot be changed while data indexed with it still exists. Re-index to change it.
              not_for_chat_feature: only applies to features that create embeddings.
            feature_key:
              not_registered: does not belong to a known AI feature.
            model_id:
              locked: cannot be changed while data indexed with it still exists. Re-index to switch models.
              not_available: is not offered by the configured LLM server.
        llm_model:
          attributes:
            external_id:
              conflicting_capabilities: has capability assertions stored under it that conflict with those of this model.
  admin:
    llm_connections:
      delete_api_key:
        configured_from_env: This connection is configured through the environment and cannot be changed here.
        description: OpenProject will stop sending an API key with its requests. Features will keep working only if the server requires no authentication. You can enter a new key at any time.
        heading: Gespeicherten API-Schlüssel löschen?
        menu_label: API-Schlüssel entfernen
        success: Der API-Schlüssel wurde entfernt.
        title: API-Schlüssel entfernen
      disabled_notice: LLM features are switched off for this instance. Switch them on here first.
      disconnect:
        configured_from_env: This connection is configured through the environment and cannot be changed here.
        description: OpenProject will stop using the LLM server. AI features will be unavailable until you connect again.
        heading: Disconnect from the LLM server?
        keeps_bindings: 'The model chosen for each feature is kept: %{features}.'
        keeps_models: The model list, including any models you added manually, is kept.
        keeps_settings: The endpoint and API format are kept. Only the stored API key is removed.
        menu_label: Trennen
        success: OpenProject has disconnected from the LLM server.
        title: Trennen
      form:
        api_format_caption: Which API the server speaks. Choose OpenAI for most gateways and self-hosted servers.
        api_key_caption: The key OpenProject authenticates with. Leave blank if the server requires no authentication.
        api_key_caption_discarded: The key you entered was not saved and is not shown again. Enter it once more to save it, or leave blank to keep the stored key.
        api_key_caption_env: The key comes from the environment.
        api_key_caption_stored: A key is stored. Leave blank to keep the current key, or enter a new one to replace it.
        api_key_placeholder_stored: API-Schlüssel gespeichert
        api_key_remove: Schlüssel entfernen
        base_url_caption: The base URL of the server, for example https://example.com/v1.
        env_applied: Applied from the environment on %{time}. Changed variables take effect the next time the database is seeded.
        env_changed: The environment variables have changed since they were applied on %{time}. The values below stay in use until the database is seeded again.
        env_pending: Environment variables configure this connection but have not been applied yet. The next database seed replaces the values below and locks this page.
        label_connecting: Contacting the LLM server…
        llm_features_enabled_caption: When turned off, all LLM-backed AI features stop working. The connection settings are kept.
        server_description: Connect OpenProject to a server that speaks the %{api_format} API, so AI features can use it. The host URL below decides which server that is.
        server_group: Server
      show:
        description: Connect OpenProject to an LLM server so that AI features can use it.
        description_enabled: Once connected, review the models offered by the server on the [Models](models_url) tab.
      tabs:
        connection: Verbindung
        features: Feature configuration
        models: Modelle
      update:
        disabled: Gespeichert. Die LLM-Funktionen sind für diese Instanz deaktiviert.
        no_models: Saved, but no models are stored yet. Either the server offers no model list, or the endpoint is missing its API version segment (for example /v1). Refresh the list on the Models tab.
        success: Successfully connected to the LLM server.
    llm_feature_bindings:
      dangling: "%{model} is no longer offered by the LLM server. This feature will not run until another model is selected."
      form:
        dimensions_caption: How many numbers each vector has. Leave blank to use whatever the server returns.
        dimensions_caption_probed: The server returned %{dimensions}-dimension vectors for this model. Leave blank to use whatever it returns at index time.
        model_caption_embedding: Only models known to create embeddings are offered. [Read more](docs_url) about model types.
        model_caption_ruled_out: Models known to lack a capability this feature needs are not offered.
      index:
        description: Choose which model each AI feature uses. Features without a choice use the default models set on the [Models](models_url) tab.
      inherit_with_default: Use the default (%{model})
      inherit_without_default: Use the default (none set)
      locked: "%{model} is in use by indexed data and cannot be changed here. Re-index to switch models."
      locked_values_heading: Values fixed by the existing index
      option_unqualified: "%{model} (no longer eligible for this feature)"
      update:
        model_incapable: The model for %{feature} has been saved, but the server just reported that it does not support %{capability}. Pick a different model, or assert the capability on the model if you know better.
        success: The model for %{feature} has been saved.
    llm_health_status:
      create:
        success: 'The checks have run: %{passed} passed, %{warnings} warnings, %{failures} failed.'
      create_health_status_report:
        success: The checks have run.
      show:
        blankslate_description: Run the checks to find out whether OpenProject can reach the LLM server, whether it accepts the API key, and whether every AI feature has a usable model.
        blankslate_heading: This connection has not been checked yet
        download: Download report
        last_check: Last checked %{datetime}.
        run_checks: Run checks
        running: Running checks...
        summary: "%{passed} passed, %{warnings} warnings, %{failures} failed."
        title: Verbindungsstatus
    llm_models:
      configured_from_env: The environment configures this model as a default, so it cannot be removed or renamed here.
      create:
        success: "%{model} wurde hinzugefügt."
      defaults:
        chat_caption: Embedding models are not offered.
        description: Used by AI features that do not choose a model themselves.
        embedding_caption: Only models known to create embeddings are offered. [Read more](docs_url) about model types.
        embedding_none: No model is known to create embeddings. If you know one does, open it in the list below and set its type to Embedding model.
        embedding_option_unqualified: "%{model} (not known to create embeddings)"
        heading: Default models
        success: The default models have been saved.
      destroy:
        description: Das Modell wird nicht mehr für KI-Funktionen angeboten.
        description_bound: Dieses Modell wird derzeit von %{features} verwendet. Diese Funktionen stehen nicht mehr zur Verfügung, bis ein anderes Modell ausgewählt wird.
        heading: "%{model} entfernen?"
        success: "%{model} wurde entfernt."
        title: Modell entfernen
      edit:
        description: Bearbeiten, wie OpenProject dieses Modell verwendet.
      form:
        context_window: Kontextfenster
