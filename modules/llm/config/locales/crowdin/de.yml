        source_withdrawn: Zurückgezogen
        source_withdrawn_description: Wird vom Server nicht mehr gemeldet
        stale_warning: The connection settings changed after the model list was last refreshed, so the list may be out of date. Refresh the models to be sure.
      new:
        description: Nennen Sie ein Modell, das dieser Server verwenden kann, das er jedoch nicht bekannt gibt, und beschreiben Sie, wozu es in der Lage ist.
        title: Modell hinzufügen
      refresh:
        failure: The model list could not be refreshed. Please check that the LLM server is still reachable.
        success: The model list has been refreshed.
      update:
        success: "%{model} wurde aktualisiert."
  llm:
    api_formats:
      anthropic: Anthropic
      azure: Azure OpenAI
      bedrock: AWS Bedrock
