        description: The semantic index and its settings will be removed. This cannot be undone.
        heading: Delete %{title}?
        title: Delete semantic index
      dialog:
        edit_title: Edit "%{title}"
        new_title: New semantic index
      form:
        context_token_length_caption: Maximum number of tokens embedded per work package.
