    errors:
      models:
        llm_connection:
          attributes:
            api_format:
              not_supported: kræver legitimationsoplysninger, som OpenProject ikke kan gemme, fx en separat hemmelig nøgle eller region.
            api_key:
              invalid_api_key: blev afvist af LLM-serveren.
            base:
              singleton: Der kan kun være én aktiv LLM-forbindelse.
            base_url:
              cannot_be_connected_to: kunne ikke nås. Sørg for, at LLM-serveren kører og kan nås fra OpenProject.
              models_endpoint_missing: har ingen modelliste på denne adresse, så API-nøglen kunne heller ikke kontrolleres. Tjek URL'en, især at den indeholder segmentet med API-versionen (fx https://example.com/v1).
              not_openai_compatible: returnerede ikke en gyldig modelliste. Sørg for, at URL'en peger på et endepunkt, der er kompatibelt med OpenAI's API, inklusive segmentet med API-versionen (fx https://example.com/v1).
