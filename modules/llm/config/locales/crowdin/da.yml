              ssl_error: kunne ikke nås via en sikker forbindelse. Tjek LLM-serverens TLS-certifikat, eller brug en http://-URL, hvis serveren ikke tilbyder TLS.
              ssrf_filtered: peger på en blokeret adresse. Hvis LLM-serveren kører på et internt netværk, så tillad dens IP-adresse via miljøvariablen %{env_name}.
