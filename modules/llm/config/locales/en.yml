              request_timed_out: "did not respond in time. Please ensure the LLM server is reachable and not overloaded."
              ssl_error: "could not be reached over a secure connection. Please check the LLM server's TLS certificate, or use an http:// URL if the server does not offer TLS."
              ssrf_filtered: "resolves to a blocked address. If the LLM server runs on an internal network, allow its IP via the %{env_name} environment variable."
            custom_headers:
              invalid: "must map header names to plain text values."
            default_chat_model_id:
              cannot_chat: "is an embedding model, according to the LLM server, and cannot be used for chat."
              not_available: "is not offered by the configured LLM server."
            default_embedding_model_id:
              cannot_embed: "is known not to create embeddings, according to the LLM server."
              not_available: "is not offered by the configured LLM server."
            llm_features_enabled:
              requires_connection: "cannot be turned on before a connection has been configured."
        llm_feature_binding:
          attributes:
            dimensions:
              locked: "cannot be changed while data indexed with it still exists. Re-index to change it."
              not_for_chat_feature: "only applies to features that create embeddings."
            feature_key:
              not_registered: "does not belong to a known AI feature."
            model_id:
              locked: "cannot be changed while data indexed with it still exists. Re-index to switch models."
              not_available: "is not offered by the configured LLM server."
        llm_model:
          attributes:
            external_id:
              conflicting_capabilities: "has capability assertions stored under it that conflict with those of this model."
