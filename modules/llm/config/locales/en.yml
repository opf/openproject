    errors:
      models:
        llm_connection:
          attributes:
            api_format:
              not_supported: "needs credentials that OpenProject cannot store, such as a separate secret key or region."
            api_key:
              invalid_api_key: "was rejected by the LLM server."
            base:
              singleton: "Only one LLM connection can be active."
            base_url:
              cannot_be_connected_to: "could not be reached. Please ensure the LLM server is running and reachable from OpenProject."
