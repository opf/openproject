        demo-bim-project:
          name: "(Ցուցադրական) BIM նախագիծ"
          status_explanation: Բոլոր առաջադրանքներն ու ենթանախագծերն ընթանում են ըստ ժամանակացույցի։ Ներգրավված անձինք գիտեն իրենց առաջադրանքները։ Համակարգը լիովին կարգավորված է։
