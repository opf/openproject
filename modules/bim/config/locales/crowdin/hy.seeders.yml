                    *   Արտաքին մոդելի օգտագործում ներքին մոդելը մշակելու համար

                    # Նկարագրություն

                    *   Արտաքին մոդելը կհղվի BIM հարթակում և այդպիսով կօգտագործվի ներքին մոդելի մոդելավորման համար
