              item_1:
                options:
                  name: Ինչպես սկսել
                  text: |
                    Ուրախ ենք, որ միացել եք։ Առաջարկում ենք փորձել մի քանի բան՝ OpenProject-ում աշխատանքը սկսելու համար։

                    Սակայն նախքան անմիջապես գործին անցնելը, պետք է իմանաք, որ այս ցուցադրական նախագիծը բաժանված է երկու տարբեր նախագծի՝

                    1.  [Շինարարական նախագիծ]({{opSetting:base_url}}/projects/demo-planning-constructing-project)՝ այստեղ կգտնեք դասական դերերը, որոշ աշխատանքային հոսքեր և աշխատանքային փաթեթներ Ձեր շինարարական նախագծի համար։
                    2.  [BIM մոդելի ստեղծում]({{opSetting:base_url}}/projects/demo-bim-project)՝ այս նախագիծը նույնպես առաջարկում է դերեր, աշխատանքային հոսքեր և աշխատանքային փաթեթներ, սակայն հատկապես BIM համատեքստում։

                    _Փորձեք հետևյալ քայլերը՝_

                    1.  _Հրավիրեք նոր անդամներ Ձեր նախագիծ_՝ → անցեք նախագծի նավիգացիայի [Անդամներ]({{opSetting:base_url}}/projects/demo-construction-project/members) բաժին։
                    2.  _Դիտեք Ձեր նախագծերի աշխատանքը_՝ → անցեք նախագծի նավիգացիայի [Աշխատանքային փաթեթներ]({{opSetting:base_url}}/projects/demo-construction-project/work_packages?query_props=%7B%22c%22%3A%5B%22type%22%2C%22id%22%2C%22subject%22%2C%22status%22%2C%22assignee%22%2C%22priority%22%5D%2C%22hl%22%3A%22priority%22%2C%22hi%22%3Atrue%2C%22g%22%3A%22%22%2C%22t%22%3A%22startDate%3Aasc%22%2C%22f%22%3A%5B%7B%22n%22%3A%22bcfIssueAssociated%22%2C%22o%22%3A%22%3D%22%2C%22v%22%3A%5B%22f%22%5D%7D%5D%2C%22pa%22%3A1%2C%22pp%22%3A100%2C%22dr%22%3A%22list%22%7D) բաժին։
                    3.  _Ստեղծեք նոր աշխատանքային փաթեթ_՝ → անցեք [Աշխատանքային փաթեթներ → Ստեղծել]({{opSetting:base_url}}/projects/demo-construction-project/work_packages/new?query_props=%7B%22c%22%3A%5B%22type%22%2C%22id%22%2C%22subject%22%2C%22status%22%2C%22assignee%22%2C%22priority%22%5D%2C%22hl%22%3A%22priority%22%2C%22hi%22%3Atrue%2C%22g%22%3A%22%22%2C%22t%22%3A%22startDate%3Aasc%22%2C%22f%22%3A%5B%7B%22n%22%3A%22bcfIssueAssociated%22%2C%22o%22%3A%22%3D%22%2C%22v%22%3A%5B%22f%22%5D%7D%5D%2C%22pa%22%3A1%2C%22pp%22%3A100%2C%22dr%22%3A%22list%22%7D&type=11)։
                    4.  _Ստեղծեք և թարմացրեք Գանտի գծապատկեր_՝ → անցեք նախագծի նավիգացիայի [Գանտի գծապատկեր]({{opSetting:base_url}}/projects/demo-construction-project/work_packages?query_props=%7B%22c%22%3A%5B%22type%22%2C%22id%22%2C%22subject%22%2C%22assignee%22%2C%22responsible%22%5D%2C%22tv%22%3Atrue%2C%22tzl%22%3A%22weeks%22%2C%22hl%22%3A%22priority%22%2C%22hi%22%3Atrue%2C%22g%22%3A%22%22%2C%22t%22%3A%22startDate%3Aasc%22%2C%22f%22%3A%5B%5D%2C%22pa%22%3A1%2C%22pp%22%3A100%2C%22dr%22%3A%22list%22%7D) բաժին։
                    5.  _Ակտիվացրեք լրացուցիչ մոդուլներ_՝ → անցեք [Նախագծի կարգավորումներ → Մոդուլներ]({{opSetting:base_url}}/projects/demo-construction-project/settings/modules)։
                    6.  _Ձեր BCF խնդիրների ընդհանուր պատկերը ստանալու համար ծանոթացեք սալիկային տեսքին՝_ → անցեք [Աշխատանքային փաթեթներ]({{opSetting:base_url}}/projects/demo-construction-project/work_packages?query_props=%7B%22c%22%3A%5B%22type%22%2C%22id%22%2C%22subject%22%2C%22status%22%2C%22assignee%22%2C%22priority%22%5D%2C%22hl%22%3A%22priority%22%2C%22hi%22%3Atrue%2C%22g%22%3A%22%22%2C%22t%22%3A%22id%3Aasc%22%2C%22f%22%3A%5B%5D%2C%22pa%22%3A1%2C%22pp%22%3A100%2C%22dr%22%3A%22card%22%7D)
                    7.  _Ճկո՞ւն մեթոդաբանությամբ եք աշխատում։ Ծանոթացեք մեր բոլորովին նոր տախտակներին՝_ → անցեք [Տախտակներ]({{opSetting:base_url}}/projects/demo-construction-project/boards)

                    Այստեղ կգտնեք մեր [Օգտատերի ուղեցույցները](https://www.openproject.org/docs/user-guide/)։
                    Խնդրում ենք տեղեկացնել մեզ, եթե հարցեր ունեք կամ աջակցության կարիք։ Կապվեք մեզ հետ՝ [support\[at\]openproject.com](mailto:support@openproject.com)։
