          work_packages:
            item_0:
              subject: BIM մոդելի ստեղծման նախագծի մեկնարկ
              description: |-
                Նախագծի մեկնարկը սկիզբ է դնում Ձեր ընկերությունում նախագծի իրականացմանը։ Ողջ նախագծային թիմը պետք է հրավիրվի մեկնարկային հանդիպմանը՝ առաջին տեղեկատվական քննարկման համար։

                Հաջորդ քայլը կարող է լինել ժամանակացույցի ուսումնասիրումը և հանդիպումների ժամերի ճշգրտումը՝ դիտելով [Գանտի գծապատկերը]({{opSetting:base_url}}/projects/demo-bim-project/work_packages?query_props=%7B%22c%22%3A%5B%22id%22%2C%22subject%22%2C%22startDate%22%2C%22dueDate%22%5D%2C%22tv%22%3Atrue%2C%22tzl%22%3A%22weeks%22%2C%22hi%22%3Atrue%2C%22g%22%3A%22%22%2C%22t%22%3A%22startDate%3Aasc%22%2C%22f%22%3A%5B%7B%22n%22%3A%22status%22%2C%22o%22%3A%22o%22%2C%22v%22%3A%5B%5D%7D%5D%2C%22pa%22%3A1%2C%22pp%22%3A100%7D)։
            item_1:
              subject: Նախագծի նախապատրաստում
              description: Այս տեսակը հիերարխիկորեն "Բախում" և "Հարցում" տեսակների ծնողն է, հետևաբար ներկայացնում է ընդհանուր նշում։
              children:
                item_0:
                  subject: BIM մոդելի համար նախագծին առնչվող տվյալների և տեղեկությունների հավաքագրում
                  description: |-
                    ## Նպատակ

                    *   Բացահայտել պատվիրատուի տեղեկատվական ռազմավարությունը (օր. պարզ լեզվով հարցերի միջոցով)
                    *   Առկայության դեպքում վերլուծել BIM մոդելի վերաբերյալ պատվիրատուի տեղեկատվական պահանջները
                    *   Սահմանել տեղեկատվության տրամադրման ռազմավարություն՝ ըստ պատվիրատուի կարիքների

                    ## Նկարագրություն

                    *   BIM մեթոդաբանության կիրառման համար պատվիրատուի կարիքների և նպատակների վերլուծություն
                    *   Այս առաջադրանքի արդյունքները պետք է լինեն՝
                    *   Նախագծի պահանջները
                    *   Հանձնման փուլի ռազմավարություն
                    *   ...
                item_1:
                  subject: BIM իրականացման պլանի ստեղծում
                  description: |-
                    # Նպատակ

                    *   BIM իրականացման պլանը կսահմանվի ըստ փոխանակման պահանջների բնութագրերի (ERS)
                    *   Թիմի բոլոր անդամներն ու գործընկերները ունեն պլան, թե ինչպես հասնել նախագծի յուրաքանչյուր նպատակին

                    # Նկարագրություն

                    *   Կախված բացահայտված կիրառման դեպքերից՝ կսահմանվեն տեղեկատվության տրամադրման առանձին ձեռնարկները
                    *   Տեխնոլոգիական միջերեսները կառավարելու համար կսահմանվի ծրագրային տոպոլոգիա, որը կվերլուծվի և կստուգվի
                    *   ...
