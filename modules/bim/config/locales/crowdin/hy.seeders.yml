          project-overview:
            widgets:
              item_0:
                options:
                  name: Բարի գալուստ
              item_1:
                options:
                  name: Ինչպես սկսել
                  text: |
                    Ուրա՜խ ենք, որ միացել եք։ Առաջարկում ենք փորձել մի քանի բան, որպեսզի սկսեք աշխատել OpenProject-ում։

                    Այս ցուցադրական նախագիծը առաջարկում է դերեր, աշխատանքային հոսքեր և աշխատանքային փաթեթներ, որոնք մասնագիտացված են BIM-ի համար։

                    _Փորձեք հետևյալ քայլերը՝_

                    1.  _Հրավիրեք նոր անդամներ ձեր նախագիծ՝_ → Նախագծի նավիգացիայում անցեք [Անդամներ]({{opSetting:base_url}}/projects/demo-bim-project/members)։
                    2.  _Վերբեռնեք և դիտեք 3D-մոդելներ IFC ձևաչափով՝_ → Նախագծի նավիգացիայում անցեք [BCF]({{opSetting:base_url}}/projects/demo-bim-project/bcf)։
                    3.  _Ստեղծեք և կառավարեք ուղղակիորեն IFC մոդելին կապված BCF խնդիրներ՝_ → Անցեք [BCF]({{opSetting:base_url}}/projects/demo-bim-project/bcf) → Ստեղծել։
                    4.  _Դիտեք աշխատանքը ձեր նախագծերում՝_ → Նախագծի նավիգացիայում անցեք [Աշխատանքային փաթեթներ]({{opSetting:base_url}}/projects/demo-bim-project/work_packages?query_props=%7B%22c%22%3A%5B%22type%22%2C%22id%22%2C%22subject%22%2C%22status%22%2C%22assignee%22%2C%22priority%22%5D%2C%22hl%22%3A%22priority%22%2C%22hi%22%3Atrue%2C%22g%22%3A%22%22%2C%22t%22%3A%22startDate%3Aasc%22%2C%22f%22%3A%5B%7B%22n%22%3A%22bcfIssueAssociated%22%2C%22o%22%3A%22%3D%22%2C%22v%22%3A%5B%22f%22%5D%7D%5D%2C%22pa%22%3A1%2C%22pp%22%3A100%2C%22dr%22%3A%22list%22%7D)։
                    5.  _Ստեղծեք նոր աշխատանքային փաթեթ՝_ → Անցեք [Աշխատանքային փաթեթներ → Ստեղծել]({{opSetting:base_url}}/projects/demo-bim-project/work_packages/new?query_props=%7B%22c%22%3A%5B%22type%22%2C%22id%22%2C%22subject%22%2C%22status%22%2C%22assignee%22%2C%22priority%22%5D%2C%22hl%22%3A%22priority%22%2C%22hi%22%3Atrue%2C%22g%22%3A%22%22%2C%22t%22%3A%22startDate%3Aasc%22%2C%22f%22%3A%5B%7B%22n%22%3A%22bcfIssueAssociated%22%2C%22o%22%3A%22%3D%22%2C%22v%22%3A%5B%22f%22%5D%7D%5D%2C%22pa%22%3A1%2C%22pp%22%3A100%2C%22dr%22%3A%22list%22%7D&type=11)։
                    6.  _Ստեղծեք և թարմացրեք Գանտի գծապատկեր՝_ → Նախագծի նավիգացիայում անցեք [Գանտի գծապատկեր]({{opSetting:base_url}}/projects/demo-bim-project/work_packages?query_props=%7B%22c%22%3A%5B%22type%22%2C%22id%22%2C%22subject%22%2C%22assignee%22%2C%22responsible%22%5D%2C%22tv%22%3Atrue%2C%22tzl%22%3A%22weeks%22%2C%22hl%22%3A%22priority%22%2C%22hi%22%3Atrue%2C%22g%22%3A%22%22%2C%22t%22%3A%22startDate%3Aasc%22%2C%22f%22%3A%5B%5D%2C%22pa%22%3A1%2C%22pp%22%3A100%2C%22dr%22%3A%22list%22%7D)։
                    7.  _Ակտիվացրեք լրացուցիչ մոդուլներ՝_ → Անցեք [Նախագծի կարգավորումներ → Մոդուլներ]({{opSetting:base_url}}/projects/demo-bim-project/settings/modules)։
                    8.  _Ձեր BCF խնդիրների ընդհանուր պատկերը ստանալու համար դիտեք սալիկային տեսքը՝_ → Նախագծի նավիգացիայում անցեք [Աշխատանքային փաթեթներ]({{opSetting:base_url}}/projects/demo-bim-project/work_packages?query_props=%7B%22c%22%3A%5B%22type%22%2C%22id%22%2C%22subject%22%2C%22status%22%2C%22assignee%22%2C%22priority%22%5D%2C%22hl%22%3A%22priority%22%2C%22hi%22%3Atrue%2C%22g%22%3A%22%22%2C%22t%22%3A%22id%3Aasc%22%2C%22f%22%3A%5B%5D%2C%22pa%22%3A1%2C%22pp%22%3A100%2C%22dr%22%3A%22card%22%7D)
                    9.  _Աշխատու՞մ եք ճկուն մեթոդաբանությամբ։ Ստեղծեք նոր տախտակ՝_ → Անցեք [Տախտակներ]({{opSetting:base_url}}/projects/demo-bim-project/boards)

                    Այստեղ Դուք կգտնեք մեր [Օգտատիրոջ ուղեցույցները](https://www.openproject.org/docs/user-guide/)։
                    Խնդրում ենք տեղեկացնել մեզ, եթե ունեք հարցեր կամ աջակցության կարիք։ Կապվեք մեզ հետ՝ [support\[at\]openproject.com](mailto:support@openproject.com)։
