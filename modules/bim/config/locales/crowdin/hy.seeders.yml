                *   BIM մոդելը կօգտագործվի օբյեկտի կառավարման համար
                *   Մոդելը տրամադրում է շենքը շահագործման հանձնելու և շահագործելու համար անհրաժեշտ ողջ տեղեկությունը
                *   ...

                ## Նկարագրություն

                *   Մոդելը պարունակում է օբյեկտի կառավարչի համար անհրաժեշտ տեղեկությունը
                *   Մոդելը կարող է օգտագործվել շենքի շահագործման համակարգի համար
                *   ...
