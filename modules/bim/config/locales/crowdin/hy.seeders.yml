                  subject: Առաջին ցիկլ, ներքին մոդելի ստուգում և վերանայում
                  description: |-
                    # Նպատակ

                    *   BIM մոդելի ներկայացում՝ ըստ սահմանված ստանդարտների

                    # Նկարագրություն

                    *   Մոդելը պետք է ստուգվի ըստ սահմանված ստանդարտների (պայմանավորվածություններ, LOD, ...) և վերանայվի։
                    *   ...
                item_3:
                  subject: BIM մոդելի ներկայացում
                  description: Այս տեսակը հիերարխիկորեն "Բախում" և "Հարցում" տեսակների ծնողն է, հետևաբար ներկայացնում է ընդհանուր նշում։
            item_5:
              subject: Համակարգում, առաջին ցիկլ
              description: Այս տեսակը հիերարխիկորեն "Բախում" և "Հարցում" տեսակների ծնողն է, հետևաբար ներկայացնում է ընդհանուր նշում։
              children:
                item_0:
                  subject: Համակարգել տարբեր BIM մոդելները
                  description: |-
                    # Նպատակ

                    *   Համատեղել ողջ նախագծային թիմի տարբեր BIM մոդելները
                    *   Համակարգել բացահայտված խնդիրները

                    # Նկարագրություն

                    *   Տարբեր BIM մոդելները կհամատեղվեն և կստուգվեն
                    *   Մոդելին առնչվող բացահայտված խնդիրները կհաղորդվեն BCF նիշքերի միջոցով
                    *   ...
