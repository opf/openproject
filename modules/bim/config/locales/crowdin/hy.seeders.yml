      welcome:
        title: Բարի գալուստ OpenProject BIM edition։
        text: |
          Ծանոթացեք ցուցադրական նախագծերին՝ որոշ օրինակներով աշխատանքը սկսելու համար։

          * [(Ցուցադրական) Շինարարական նախագիծ]({{opSetting:base_url}}/projects/demo-construction-project)՝ պլանավորում, BIM գործընթաց, BCF կառավարում և շինարարություն՝ ամբողջը մեկ հայացքով։
              * [(Ցուցադրական) Պլանավորում և շինարարություն]({{opSetting:base_url}}/projects/demo-planning-constructing-project)՝ դասական պլանավորում և շինարարության կառավարում։
              * [(Ցուցադրական) BIM նախագիծ]({{opSetting:base_url}}/projects/demo-bim-project)՝ BIM գործընթաց և համակարգում։
                  * [(Ցուցադրական) BCF կառավարում]({{opSetting:base_url}}/projects/demo-bcf-management-project)՝ BCF կառավարում։

          Կարող եք նաև ստեղծել դատարկ [նոր նախագիծ]({{opSetting:base_url}}/projects/new)։

          Երբեք չդադարեք համագործակցել։ Բաց ելակետային կոդով և բաց մտածելակերպով։

          Այս ողջույնի տեքստը կարող եք փոփոխել [այստեղ]({{opSetting:base_url}}/admin/settings/general)։
      projects:
        demo-construction-project:
          name: "(Ցուցադրական) Շինարարական նախագիծ"
          status_explanation: Բոլոր առաջադրանքները և ենթանախագծերը ընթանում են ըստ ժամանակացույցի։ Ներգրավված անձինք գիտեն իրենց առաջադրանքները։ Համակարգը լիովին կարգավորված է։
          description: Սա այս ցուցադրական շինարարական նախագծի նպատակների համառոտ ամփոփումն է։
          news:
