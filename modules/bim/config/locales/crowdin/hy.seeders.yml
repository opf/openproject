          work_packages:
            item_0:
              subject: Շինարարական նախագծի մեկնարկ
              description: |-
                Նախագծի մեկնարկը սկիզբ է դնում Ձեր ընկերությունում նախագծի իրականացմանը։ Այս նախագծի բոլոր մասնակիցները պետք է հրավիրվեն մեկնարկային հանդիպմանը՝ առաջին տեղեկատվական քննարկման համար։

                Հաջորդ քայլը կարող է լինել ժամանակացույցի ուսումնասիրումը և հանդիպումների ժամերի ճշգրտումը՝ դիտելով [Գանտի գծապատկերը]({{opSetting:base_url}}/projects/demo-construction-project/work_packages?query_props=%7B%22c%22%3A%5B%22id%22%2C%22subject%22%2C%22startDate%22%2C%22dueDate%22%5D%2C%22tv%22%3Atrue%2C%22tzl%22%3A%22weeks%22%2C%22hi%22%3Atrue%2C%22g%22%3A%22%22%2C%22t%22%3A%22startDate%3Aasc%22%2C%22f%22%3A%5B%7B%22n%22%3A%22status%22%2C%22o%22%3A%22o%22%2C%22v%22%3A%5B%5D%7D%5D%2C%22pa%22%3A1%2C%22pp%22%3A100%7D)։
            item_1:
              subject: Հիմնական գնահատում
              description: Այս տեսակը հիերարխիկորեն "Բախում" և "Հարցում" տեսակների ծնողն է, հետևաբար ներկայացնում է ընդհանուր նշում։
              children:
                item_0:
                  subject: Նախագծի առաջին տեղեկությունների հավաքագրում
                  description: |-
                    ## Նպատակ

                    *   Սահմանել առաջադրանքները՝ ելնելով պատվիրատուի կարիքներից
                    *   Պետք է սահմանվեն ժամանակային շրջանակը և ծախսերի գնահատականը

                    ## Նկարագրություն

                    *   Բացահայտել պատվիրատուի կարիքները՝ նրա հետ աշխատաժողով անցկացնելով
                    *   Յուրաքանչյուր կարիք պետք է ներկայացնի առաջադրանք՝ իր համապատասխան աշխատանքային փաթեթներով
                    *   Դուրս բերել ծախսերի գնահատականը և ժամանակային շրջանակը
                item_1:
                  subject: Ամփոփել արդյունքները
                  description: |-
                    ## Նպատակ

                    *   Ստեղծել արդյունքների օգտակար ընդհանուր պատկեր
                    *   Ստուգել կատարվածը և ամփոփել արդյունքները
                    *   Բոլոր համապատասխան արդյունքները հաղորդել պատվիրատուին
                    *   Բացահայտել նախագծի հիմնարար սահմանային պայմանները

                    ## Նկարագրություն

                    *   Յուրաքանչյուր թեմա ստանում է իր ընդհանուր պատկերը, որը կօգտագործվի որպես արդյունքների կատալոգ
                    *   Այս ընդհանուր պատկերը տեղեկացնում է բոլոր մասնակիցներին ընդունված որոշումների մասին
