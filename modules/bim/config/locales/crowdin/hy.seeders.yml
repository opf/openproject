              description: Այս տեսակը հիերարխիկորեն "Բախում" և "Հարցում" տեսակների ծնողն է, հետևաբար ներկայացնում է ընդհանուր նշում։
            item_11:
              subject: Մոդելի օգտագործում շինարարության փուլում
              children:
                item_0:
                  subject: Մոդելի հանձնում շինարարական խմբին
                  description: |-
                    ## Նպատակ

                    *   Բոլորը գիտեն մոդելը և իրենց առաջադրանքները
                    *   Բոլորը ստանում են ողջ համապատասխան տեղեկությունը՝ մոդելի հիմքով
                    *   ...

                    ## Նկարագրություն

                    *   Շինհրապարակում կայացող մեկնարկային հանդիպումը ներառում է մոդելի ներկայացումը
                    *   Բոլոր օբյեկտները պետք է ունենան նշանակված առաջադրանքների համար անհրաժեշտ տեղեկությունը։ Հակառակ դեպքում անհրաժեշտ է իրականացնել մոդելի տվյալների հարստացում
                    *   ...
                item_1:
                  subject: Կառուցել շենքը
                  description: |-
                    ## Նպատակ

                    *   Շինհրապարակում ի հայտ եկած նոր խնդիրները կլուծվեն մոդելի հիմքով
                    *   Խնդիրները կփաստագրվեն BCF նիշքերի և BIM մոդելի միջոցով

                    ## Նկարագրություն

                    *   Նոր խնդիրները կփաստագրվեն BCF նիշքերի միջոցով՝ որպես մոդելի կպչուն նշումներ
                    *   BCF նիշքերը կօգտագործվեն խնդիրները նշանակելու, հետագծելու և ուղղելու համար
                    *   ...
                item_2:
                  subject: Շինարարության ավարտ
            item_12:
              subject: Խնդիրների կառավարում, շինարարության փուլ
