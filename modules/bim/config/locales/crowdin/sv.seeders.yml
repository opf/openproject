          work_packages:
            item_0:
              subject: Projektstart för att skapa BIM-modell
              description: |-
                Projektstarten initierar projektet i ditt företag. Hela projektteamet bör bjudas in till projektstarten för en första genomgång.

                Nästa steg kan vara att kontrollera tidsplanen och justera tiderna genom att titta på [Gantt-diagrammet]({{opSetting:base_url}}/projects/demo-bim-project/work_packages?query_props=%7B%22c%22%3A%5B%22id%22%2C%22subject%22%2C%22startDate%22%2C%22dueDate%22%5D%2C%22tv%22%3Atrue%2C%22tzl%22%3A%22weeks%22%2C%22hi%22%3Atrue%2C%22g%22%3A%22%22%2C%22t%22%3A%22startDate%3Aasc%22%2C%22f%22%3A%5B%7B%22n%22%3A%22status%22%2C%22o%22%3A%22o%22%2C%22v%22%3A%5B%5D%7D%5D%2C%22pa%22%3A1%2C%22pp%22%3A100%7D).
            item_1:
              subject: Projektförberedelser
              description: Denna typ är hierarkiskt överordnad typerna &quot;Clash&quot; och &quot;Request&quot;, och utgör således en allmän anmärkning.
              children:
                item_0:
                  subject: Samla in projektspecifika data och information för BIM-modellen
                  description: |-
                    ## Mål

                    *   Identifiera kundens informationsstrategi (t.ex. genom frågor på klarspråk)
                    *   Om sådana finns, analysera kundens informationskrav för BIM-modellen
                    *   Definiera en strategi för informationsleverans utifrån kundens behov

                    ## Beskrivning

                    *   Analysera kundens behov och mål med BIM-metodiken
                    *   Resultatet av dessa uppgifter bör vara:
                    *   Projektkraven
                    *   En strategi för leveransfasen
                    *   ...
                item_1:
                  subject: Skapa BIM-genomförandeplanen
                  description: |-
                    # Mål

                    *   En BIM-genomförandeplan definieras enligt specifikationerna för informationsutbyte (ERS)
                    *   Alla teammedlemmar och partner har en plan för hur vart och ett av projektmålen ska nås

                    # Beskrivning

                    *   Beroende på identifierade användningsfall definieras de individuella handböckerna för informationsleverans
                    *   För att hantera de tekniska gränssnitten definieras, analyseras och verifieras en programvarutopologi
                    *   ...
                item_2:
                  subject: Slutför BIM-genomförandeplanen
                  description: Denna typ är hierarkiskt överordnad typerna &quot;Clash&quot; och &quot;Request&quot;, och utgör således en allmän anmärkning.
            item_2:
              subject: Förberedelsefasens slut
              description: Denna typ är hierarkiskt överordnad typerna &quot;Clash&quot; och &quot;Request&quot;, och utgör således en allmän anmärkning.
            item_3:
              subject: Skapa inledande BIM-modell
              description: Denna typ är hierarkiskt överordnad typerna &quot;Clash&quot; och &quot;Request&quot;, och utgör således en allmän anmärkning.
              children:
                item_0:
                  subject: Modellera inledande BIM-modell
                  description: |-
                    # Mål

                    *   Modellera den inledande BIM-modellen
                    *   Skapa en BIM-modell för hela projektteamet

                    # Beskrivning

                    *   Utifrån insamlade kunddata modelleras den inledande modellen
                    *   Modellen ska utformas enligt LOD-matriserna och innehålla nödvändig information
                    *   ...
                item_1:
                  subject: Inledande intern modellkontroll och revidering
                  description: |-
                    # Mål

                    *   Leverera en BIM-modell enligt de definierade standarderna

                    # Beskrivning

                    *   Modellen ska kontrolleras mot de definierade standarderna (konventioner, LOD, ...) och revideras
                    *   ...
                item_2:
                  subject: Skicka inledande BIM-modell
                  description: Denna typ är hierarkiskt överordnad typerna &quot;Clash&quot; och &quot;Request&quot;, och utgör således en allmän anmärkning.
            item_4:
              subject: Modellering, första cykeln
              description: Denna typ är hierarkiskt överordnad typerna &quot;Clash&quot; och &quot;Request&quot;, och utgör således en allmän anmärkning.
              children:
                item_0:
                  subject: Referera externa BIM-modeller
                  description: |-
                    # Mål

                    *   Ha en grund för att utveckla den interna modellen/ge svar
                    *   Använda den externa modellen för att utveckla den interna modellen

                    # Beskrivning

                    *   Den externa modellen refereras i BIM-plattformen och används därmed för att modellera den interna modellen
                    *   ...
                item_1:
                  subject: Modellera BIM-modellen
                  description: |-
                    # Mål

                    *   Skapa en BIM-modell för projektet
                    *   Skapa en BIM-modell för hela projektteamet

                    # Beskrivning

                    *   Modellen skapas enligt BIM-genomförandeplanen
                    *   ...
                item_2:
                  subject: Första cykeln, intern modellkontroll och revidering
                  description: |-
                    # Mål

                    *   Leverera en BIM-modell enligt de definierade standarderna

                    # Beskrivning

                    *   Modellen ska kontrolleras mot de definierade standarderna (konventioner, LOD, ...) och revideras.
                    *   ...
                item_3:
                  subject: Skicka BIM-modell
                  description: Denna typ är hierarkiskt överordnad typerna &quot;Clash&quot; och &quot;Request&quot;, och utgör således en allmän anmärkning.
            item_5:
              subject: Samordning, första cykeln
              description: Denna typ är hierarkiskt överordnad typerna &quot;Clash&quot; och &quot;Request&quot;, och utgör således en allmän anmärkning.
              children:
                item_0:
                  subject: Samordna de olika BIM-modellerna
                  description: |-
                    # Mål

                    *   Sammanställa de olika BIM-modellerna från hela projektteamet
                    *   Samordna identifierade problem

                    # Beskrivning

                    *   De olika BIM-modellerna sammanställs och kontrolleras
                    *   Identifierade modellspecifika problem kommuniceras via BCF-filer
                    *   ...
                item_1:
                  subject: Ärendehantering, första cykeln
                item_2:
                  subject: Koordinering av slutbearbetning, första cykeln
                  description: Denna typ är hierarkiskt överordnad typerna &quot;Clash&quot; och &quot;Request&quot;, och utgör således en allmän anmärkning.
            item_6:
              subject: Modellering och samordning, andra cykeln
              description: "## Mål\r\n\r\n* ...\r\n\r\n## Beskrivning\r\n\r\n* \\ ..."
            item_7:
              subject: Modellering och samordning, ... cykel
              description: Denna typ är hierarkiskt överordnad typerna &quot;Clash&quot; och &quot;Request&quot;, och utgör således en allmän anmärkning.
            item_8:
              subject: Modellering och samordning, (n-te minus 1) cykel
              description: "## Mål\r\n\r\n* ...\r\n\r\n## Beskrivning\r\n\r\n* \\ ..."
            item_9:
              subject: Modellering & koordinering av n-te cykel
              description: Denna typ är hierarkiskt överordnad typerna &quot;Clash&quot; och &quot;Request&quot;, och utgör således en allmän anmärkning.
            item_10:
              subject: Slutför modellering och samordning, n:te cykeln
              description: Denna typ är hierarkiskt överordnad typerna &quot;Clash&quot; och &quot;Request&quot;, och utgör således en allmän anmärkning.
            item_11:
              subject: Använd modellen för byggfasen
              children:
                item_0:
                  subject: Överlämna modellen till byggteamet
                  description: |-
                    ## Mål

                    *   Alla känner till modellen och sina uppgifter
                    *   Alla får all relevant information baserad på modellen
                    *   ...

                    ## Beskrivning

                    *   Projektstarten på byggarbetsplatsen omfattar en introduktion till modellen
                    *   Alla objekt bör innehålla den information som behövs för de tilldelade uppgifterna. Om inte behöver modellen kompletteras med data
                    *   ...
                item_1:
                  subject: Uppför byggnaden
                  description: |-
                    ## Mål

                    *   Nya problem som upptäcks på byggarbetsplatsen hanteras modellbaserat
                    *   Problem dokumenteras med BCF-filer och BIM-modellen

                    ## Beskrivning

                    *   Nya problem dokumenteras med BCF-filer som digitala notiser i modellen
                    *   BCF-filerna används för att tilldela, följa upp och korrigera problem
                    *   ...
                item_2:
                  subject: Slutför byggnationen
            item_12:
              subject: Ärendehantering, byggfas
            item_13:
              subject: Överlämning till fastighetsförvaltning
              description: |-
                ## Mål

                *   BIM-modellen används för fastighetsförvaltning
                *   Modellen tillhandahåller all relevant information för driftsättning och drift av byggnaden
                *   ...

                ## Beskrivning

                *   Modellen innehåller relevant information för fastighetsförvaltaren
                *   Modellen kan användas för byggnadens driftsystem
                *   ...
            item_14:
              subject: Tillgångsförvaltning
              description: Njut av din byggnad :)
