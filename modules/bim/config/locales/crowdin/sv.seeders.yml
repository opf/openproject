              item_1:
                options:
                  name: Komma igång
                  text: |
                    Vi är glada att du är med! Vi föreslår att du provar några saker för att komma igång med OpenProject.

                    Detta demoprojekt visar funktioner för BCF-hantering.

                    _Prova följande steg:_

                    1.  _Bjud in nya medlemmar till projektet:_ → Gå till [Medlemmar]({{opSetting:base_url}}/projects/demo-bcf-management-project/members?show_add_members=true) i projektnavigeringen.
                    2.  _Ladda upp och visa 3D-modeller i IFC-format:_ → Gå till [BCF]({{opSetting:base_url}}/projects/demo-bim-project/bcf) i projektnavigeringen.
                    3.  _Skapa och hantera BCF-ärenden som är direkt länkade i IFC-modellen:_ → Gå till [BCF]({{opSetting:base_url}}/projects/demo-bim-project/bcf) → Skapa.
                    4.  _Visa BCF-filerna i projektet:_ → Gå till [BCF]({{opSetting:base_url}}/projects/demo-bcf-management-project/work_packages?query_props=%7B%22c%22%3A%5B%22type%22%2C%22id%22%2C%22subject%22%2C%22status%22%2C%22assignee%22%2C%22priority%22%5D%2C%22hl%22%3A%22status%22%2C%22hi%22%3Atrue%2C%22g%22%3A%22%22%2C%22t%22%3A%22id%3Aasc%22%2C%22f%22%3A%5B%5D%2C%22pa%22%3A1%2C%22pp%22%3A100%2C%22dr%22%3A%22card%22%7D) i projektnavigeringen.
                    5.  _Läs in BCF-filer:_ → Gå till [BCF → Importera]({{opSetting:base_url}}/projects/demo-bcf-management-project/issues/upload)
                    6.  _Skapa och uppdatera ett Gantt-diagram:_ → Gå till [Gantt-diagram]({{opSetting:base_url}}/projects/demo-bcf-management-project/work_packages?query_props=%7B%22c%22%3A%5B%22id%22%2C%22subject%22%2C%22startDate%22%2C%22dueDate%22%5D%2C%22tv%22%3Atrue%2C%22tzl%22%3A%22days%22%2C%22hi%22%3Atrue%2C%22g%22%3A%22%22%2C%22t%22%3A%22startDate%3Aasc%22%2C%22f%22%3A%5B%7B%22n%22%3A%22status%22%2C%22o%22%3A%22o%22%2C%22v%22%3A%5B%5D%7D%5D%2C%22pa%22%3A1%2C%22pp%22%3A100%7D) i projektnavigeringen.
                    7.  _Aktivera fler moduler:_ → Gå till [Projektinställningar → Moduler]({{opSetting:base_url}}/projects/demo-bcf-management-project/settings/modules)
                    8.  _Gillar du agila arbetssätt? Skapa en tavla:_ → Gå till [Tavlor]({{opSetting:base_url}}/projects/demo-bcf-management-project/boards).

