          work_packages:
            item_0:
              subject: Proyek Kickoff untuk pembuatan model BIM
              description: |-
                Proyek Kickoff menandai dimulainya proyek di perusahaan Anda. Seluruh tim proyek harus diundang ke Kickoff untuk briefing awal.

                Langkah selanjutnya dapat berupa memeriksa jadwal dan menyesuaikan janji temu dengan melihat [Gantt chart]({{opSetting:base_url}}/projects/demo-bim-project/work_packages?query_props=%7B%22c%22%3A%5B%22id%22%2C%22subject%22%2C%22startDate%22%2C%22dueDate%22%5D%2C%22tv%22%3Atrue%2C%22tzl%22%3A%22weeks%22%2C%22hi%22%3Atrue%2C%22g%22%3A%22%22%2C%22t%22%3A%22startDate%3Aasc%22%2C%22f%22%3A%5B%7B%22n%22%3A%22status%22%2C%22o%22%3A%22o%22%2C%22v%22%3A%5B%5D%7D%5D%2C%22pa%22%3A1%2C%22pp%22%3A100%7D).
            item_1:
              subject: Persiapan proyek
              description: Jenis ini secara hierarkis merupakan induk dari jenis &quot;Clash&quot; dan &quot;Request&quot;, sehingga mewakili catatan umum.
              children:
                item_0:
                  subject: Mengumpulkan data dan informasi yang spesifik untuk proyek guna pembuatan model BIM
                  description: |-
                    ## Tujuan

                    *   Mengidentifikasi strategi informasi untuk pelanggan (misalnya dengan menggunakan pertanyaan dalam bahasa yang mudah dipahami)
                    *   Menganalisis persyaratan informasi pelanggan untuk model BIM jika tersedia
                    *   Menentukan strategi pengiriman informasi sesuai dengan kebutuhan pelanggan

                    ## Deskripsi

                    *   Menganalisis kebutuhan dan tujuan pelanggan dalam menggunakan metodologi BIM
                    *   Hasil dari tugas ini harus mencakup:
                    *   Persyaratan proyek
                    *   Strategi untuk fase pengiriman
                    *   ...
                item_1:
                  subject: Membuat rencana pelaksanaan BIM
                  description: |-
                    # Tujuan

                    *   Rencana pelaksanaan BIM akan ditetapkan sesuai dengan spesifikasi persyaratan pertukaran data (ERS)
                    *   Semua anggota tim dan mitra memiliki rencana untuk mencapai setiap tujuan proyek

                    # Deskripsi

                    *   Berdasarkan kasus penggunaan yang diidentifikasi, Manual Pengiriman Informasi individu akan ditetapkan
                    *   Untuk menangani antarmuka teknologi, topologi perangkat lunak akan ditetapkan, dianalisis, dan diverifikasi
                    *   ...
                item_2:
                  subject: Penyelesaian rencana pelaksanaan BIM
                  description: Jenis ini secara hierarkis merupakan induk dari jenis &quot;Clash&quot; dan &quot;Request&quot;, sehingga mewakili catatan umum.
            item_2:
              subject: Akhir dari fase persiapan
              description: Jenis ini secara hierarkis merupakan induk dari jenis &quot;Clash&quot; dan &quot;Request&quot;, sehingga mewakili catatan umum.
            item_3:
              subject: Pembuatan model awal BIM
              description: Jenis ini secara hierarkis merupakan induk dari jenis &quot;Clash&quot; dan &quot;Request&quot;, sehingga mewakili catatan umum.
              children:
                item_0:
                  subject: Modeling initial BIM model
                  description: |-
                    # Goal

                    *   Modeling the initial BIM model
                    *   Creating a BIM model for the whole project team

                    # Description

                    *   According to the gathered data from the customer, the initial model will be modeled
                    *   The model shall be modeled according to the LOD Matrices and contain the information needed
                    *   ...
                item_1:
                  subject: Pemeriksaan model internal awal dan revisi
                  description: |-
                    # Tujuan

                    *   Mengirimkan model BIM sesuai dengan standar yang telah ditetapkan

                    # Deskripsi

                    *   Model harus diperiksa sesuai dengan standar yang telah ditetapkan (konvensi, LOD, ...) dan direvisi
                    *   ...
                item_2:
                  subject: Pengajuan model awal BIM
                  description: Jenis ini secara hierarkis merupakan induk dari jenis &quot;Clash&quot; dan &quot;Request&quot;, sehingga mewakili catatan umum.
            item_4:
              subject: Modeling, first cycle
              description: Jenis ini secara hierarkis merupakan induk dari jenis &quot;Clash&quot; dan &quot;Request&quot;, sehingga mewakili catatan umum.
              children:
                item_0:
                  subject: Pengacuan pada model BIM eksternal
                  description: |-
                    # Goal

                    *   Having a foundation for developing the internal model/ offering answers
                    *   Using the external model to develop the internal model

                    # Description

                    *   The external model will be referenced in the BIM platform, thus used for modeling the internal model
                    *   ...
                item_1:
                  subject: Modeling the BIM model
                  description: |-
                    # Tujuan

                    *   Membuat model BIM untuk proyek
                    *   Membuat model BIM untuk seluruh tim proyek

                    # Deskripsi

                    *   Model akan dibuat sesuai dengan rencana pelaksanaan BIM
                    *   ...
                item_2:
                  subject: Siklus Pertama, pemeriksaan model internal dan revisi
                  description: |-
                    # Tujuan

                    *   Mengajukan model BIM sesuai dengan standar yang telah ditetapkan

                    # Deskripsi

                    *   Model tersebut harus diperiksa sesuai dengan standar yang telah ditetapkan (konvensi, LOD, ...) dan direvisi.
                    *   ...
                item_3:
                  subject: Penyerahan model BIM
                  description: Jenis ini secara hierarkis merupakan induk dari jenis &quot;Clash&quot; dan &quot;Request&quot;, sehingga mewakili catatan umum.
            item_5:
              subject: Koordinasi, siklus pertama
              description: Jenis ini secara hierarkis merupakan induk dari jenis &quot;Clash&quot; dan &quot;Request&quot;, sehingga mewakili catatan umum.
              children:
                item_0:
                  subject: Penyelarasan berbagai model BIM
                  description: |-
                    # Tujuan

                    *   Menggabungkan berbagai model BIM dari seluruh tim proyek
                    *   Mengkoordinasikan masalah yang telah diidentifikasi

                    # Deskripsi

                    *   Berbagai model BIM akan digabungkan dan diperiksa
                    *   Masalah spesifik pada model yang telah diidentifikasi akan dikomunikasikan melalui berkas BCF
                    *   ...
                item_1:
                  subject: Pengelolaan masalah, siklus pertama
                item_2:
                  subject: Koordinasi penyelesaian, siklus pertama
                  description: Jenis ini secara hierarkis merupakan induk dari jenis &quot;Clash&quot; dan &quot;Request&quot;, sehingga mewakili catatan umum.
            item_6:
              subject: Modeling & coordinating, second cycle
              description: "## Tujuan\r\n\r\n*   ...\r\n\r\n## Deskripsi\r\n\r\n* \\  ..."
            item_7:
              subject: Modeling & coordinating, ... cycle
              description: Jenis ini secara hierarkis merupakan induk dari jenis &quot;Clash&quot; dan &quot;Request&quot;, sehingga mewakili catatan umum.
            item_8:
              subject: Modeling & coordinating, (n-th minus 1) cycle
              description: "## Tujuan\r\n\r\n*   ...\r\n\r\n## Deskripsi\r\n\r\n* \\  ..."
            item_9:
              subject: Modeling & coordinating n-th cycle
              description: Jenis ini secara hierarkis merupakan induk dari jenis &quot;Clash&quot; dan &quot;Request&quot;, sehingga mewakili catatan umum.
            item_10:
              subject: Finishing modeling & coordinating, n-th cycle
              description: Jenis ini secara hierarkis merupakan induk dari jenis &quot;Clash&quot; dan &quot;Request&quot;, sehingga mewakili catatan umum.
            item_11:
              subject: Gunakan model untuk fase konstruksi
              children:
                item_0:
                  subject: Model serah terima untuk tim konstruksi
                  description: |-
                    ## Tujuan

                    *   Semua orang memahami model dan tugas-tugasnya
                    *   Semua orang mendapatkan semua informasi yang relevan berdasarkan model
                    *   ...

                    ## Deskripsi

                    *   Kickoff di lokasi konstruksi mencakup pengenalan model
                    *   Semua objek harus memiliki informasi yang diperlukan untuk tugas yang ditugaskan. Jika tidak, perlu dilakukan pengayaan data model
                    *   ...
                item_1:
                  subject: Membangun gedung
                  description: |-
                    ## Tujuan

                    *   Masalah baru yang muncul di lokasi konstruksi akan ditangani berdasarkan model
                    *   Masalah akan didokumentasikan menggunakan berkas BCF dan model BIM

                    ## Deskripsi

                    *   Masalah baru akan didokumentasikan menggunakan berkas BCF sebagai catatan tempel untuk model
                    *   Berkas BCF akan digunakan untuk mengidentifikasi, melacak, dan memperbaiki masalah
                    *   ...
                item_2:
                  subject: Menyelesaikan konstruksi
            item_12:
              subject: Pengelolaan masalah, fase konstruksi
            item_13:
              subject: Serah terima untuk Manajemen Fasilitas
              description: |-
                ## Tujuan

                *   Model BIM akan digunakan untuk Manajemen Fasilitas
                *   Model ini menyediakan semua informasi yang relevan untuk komisioning dan pengoperasian bangunan
                *   ...

                ## Deskripsi

                *   Model ini mengandung informasi yang relevan untuk manajer fasilitas
                *   Model ini dapat digunakan untuk sistem pengoperasian bangunan
                *   ...
            item_14:
              subject: Manajemen Aset
              description: Silakan menikmati bangunan Anda :)
