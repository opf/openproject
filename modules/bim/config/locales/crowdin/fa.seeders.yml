        demo-bim-project:
          name: پروژهٔ BIM (نمایشی)
          status_explanation: همهٔ وظایف و زیرپروژه‌ها طبق برنامه پیش می‌روند. افراد درگیر وظایف خود را می‌دانند و سامانه به‌طور کامل راه‌اندازی شده است.
          description: این متن خلاصه‌ای کوتاه از اهداف این پروژهٔ نمایشی BIM است.
          news:
            item_0:
              title: به پروژهٔ نمایشی خود خوش آمدید
              summary: |
                خوشحالیم که به ما پیوستید.
                در این ماژول می‌توانید اخبار پروژه را با اعضای تیم خود به اشتراک بگذارید.
              description: متن خبر
          categories:
            item_0: دسته‌بندی ۱ (در تنظیمات پروژه تغییر دهید)
          queries:
            item_0:
              name: برنامهٔ پروژه
            item_1:
              name: نقاط عطف
            item_2:
              name: وظایف
            item_3:
              name: برنامه‌ریز تیم
          project-overview:
            widgets:
              item_0:
                options:
                  name: خوش آمدید
              item_1:
                options:
                  name: شروع کار
                  text: |
                    خوشحالیم که به ما پیوستید! پیشنهاد می‌کنیم برای شروع چند مورد را در اوپن‌پروجکت امتحان کنید.

                    این پروژهٔ نمایشی نقش‌ها، گردش‌کارها و بسته‌های کاری تخصصی BIM را ارائه می‌کند.

                    _مراحل زیر را امتحان کنید:_

                    1.  _اعضای جدید را به پروژه دعوت کنید:_ → در پیمایش پروژه به [اعضا]({{opSetting:base_url}}/projects/demo-bim-project/members) بروید.
                    2.  _مدل‌های سه‌بعدی با فرمت IFC را بارگذاری و مشاهده کنید:_ → در پیمایش پروژه به [BCF]({{opSetting:base_url}}/projects/demo-bim-project/bcf) بروید.
                    3.  _Issueهای BCF را که مستقیماً به مدل IFC متصل‌اند ایجاد و مدیریت کنید:_ → به [BCF]({{opSetting:base_url}}/projects/demo-bim-project/bcf) → ایجاد بروید.
                    4.  _کارهای پروژه‌ها را مشاهده کنید:_ → در پیمایش پروژه به [بسته‌های کاری]({{opSetting:base_url}}/projects/demo-bim-project/work_packages?query_props=%7B%22c%22%3A%5B%22type%22%2C%22id%22%2C%22subject%22%2C%22status%22%2C%22assignee%22%2C%22priority%22%5D%2C%22hl%22%3A%22priority%22%2C%22hi%22%3Atrue%2C%22g%22%3A%22%22%2C%22t%22%3A%22startDate%3Aasc%22%2C%22f%22%3A%5B%7B%22n%22%3A%22bcfIssueAssociated%22%2C%22o%22%3A%22%3D%22%2C%22v%22%3A%5B%22f%22%5D%7D%5D%2C%22pa%22%3A1%2C%22pp%22%3A100%2C%22dr%22%3A%22list%22%7D) بروید.
                    5.  _یک بستهٔ کاری جدید ایجاد کنید:_ → به [بسته‌های کاری → ایجاد]({{opSetting:base_url}}/projects/demo-bim-project/work_packages/new?query_props=%7B%22c%22%3A%5B%22type%22%2C%22id%22%2C%22subject%22%2C%22status%22%2C%22assignee%22%2C%22priority%22%5D%2C%22hl%22%3A%22priority%22%2C%22hi%22%3Atrue%2C%22g%22%3A%22%22%2C%22t%22%3A%22startDate%3Aasc%22%2C%22f%22%3A%5B%7B%22n%22%3A%22bcfIssueAssociated%22%2C%22o%22%3A%22%3D%22%2C%22v%22%3A%5B%22f%22%5D%7D%5D%2C%22pa%22%3A1%2C%22pp%22%3A100%2C%22dr%22%3A%22list%22%7D&type=11) بروید.
                    6.  _نمودار گانت را ایجاد و به‌روزرسانی کنید:_ → به [نمودار گانت]({{opSetting:base_url}}/projects/demo-bim-project/work_packages?query_props=%7B%22c%22%3A%5B%22type%22%2C%22id%22%2C%22subject%22%2C%22assignee%22%2C%22responsible%22%5D%2C%22tv%22%3Atrue%2C%22tzl%22%3A%22weeks%22%2C%22hl%22%3A%22priority%22%2C%22hi%22%3Atrue%2C%22g%22%3A%22%22%2C%22t%22%3A%22startDate%3Aasc%22%2C%22f%22%3A%5B%5D%2C%22pa%22%3A1%2C%22pp%22%3A100%2C%22dr%22%3A%22list%22%7D) بروید.
                    7.  _ماژول‌های بیشتری فعال کنید:_ → به [تنظیمات پروژه → ماژول‌ها]({{opSetting:base_url}}/projects/demo-bim-project/settings/modules) بروید.
                    8.  _برای مرور Issueهای BCF نمای کاشی را ببینید:_ → به [بسته‌های کاری]({{opSetting:base_url}}/projects/demo-bim-project/work_packages?query_props=%7B%22c%22%3A%5B%22type%22%2C%22id%22%2C%22subject%22%2C%22status%22%2C%22assignee%22%2C%22priority%22%5D%2C%22hl%22%3A%22priority%22%2C%22hi%22%3Atrue%2C%22g%22%3A%22%22%2C%22t%22%3A%22id%3Aasc%22%2C%22f%22%3A%5B%5D%2C%22pa%22%3A1%2C%22pp%22%3A100%2C%22dr%22%3A%22card%22%7D) بروید.
                    9.  _به‌صورت Agile کار می‌کنید؟ یک برد جدید ایجاد کنید:_ → به [بردها]({{opSetting:base_url}}/projects/demo-bim-project/boards) بروید.

                    [راهنماهای کاربر](https://www.openproject.org/docs/user-guide/) را اینجا می‌توانید پیدا کنید.
                    اگر سؤال دارید یا به پشتیبانی نیاز دارید، با ما تماس بگیرید: [support\[at\]openproject.com](mailto:support@openproject.com).
