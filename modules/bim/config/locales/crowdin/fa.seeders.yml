      welcome:
        title: به نسخه BIM OpenProject خوش آمدید!
        text: |
          برای شروع و آشنایی با چند نمونه، پروژه‌های نمایشی را بررسی کنید.

          * [(نمایشی) پروژهٔ ساخت‌وساز]({{opSetting:base_url}}/projects/demo-construction-project): برنامه‌ریزی، فرایند BIM، مدیریت BCF و اجرا، همه در یک نگاه.
              * [(نمایشی) برنامه‌ریزی و اجرا]({{opSetting:base_url}}/projects/demo-planning-constructing-project): برنامه‌ریزی کلاسیک و مدیریت ساخت.
              * [(نمایشی) پروژهٔ BIM]({{opSetting:base_url}}/projects/demo-bim-project): فرایند BIM و هماهنگی.
                  * [(نمایشی) مدیریت BCF]({{opSetting:base_url}}/projects/demo-bcf-management-project): مدیریت BCF.

          همچنین می‌توانید یک [پروژهٔ جدید]({{opSetting:base_url}}/projects/new) خالی ایجاد کنید.

          همکاری را متوقف نکنید؛ با متن‌باز و ذهنی باز.

          می‌توانید این متن خوش‌آمدگویی را [اینجا]({{opSetting:base_url}}/admin/settings/general) تغییر دهید.
