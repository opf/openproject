                options:
                  name: شروع کار
                  text: |
                    خوشحالیم که به ما پیوستید! پیشنهاد می‌کنیم برای شروع چند مورد را در اوپن‌پروجکت امتحان کنید.

                    پیش از شروع، توجه داشته باشید این پروژهٔ نمونه به دو پروژهٔ جدا تقسیم شده است:

                    1.  [پروژهٔ ساخت‌وساز]({{opSetting:base_url}}/projects/demo-planning-constructing-project): در اینجا نقش‌های کلاسیک، چند گردش‌کار و بسته‌های کاری پروژهٔ ساخت‌وساز را خواهید یافت.
                    2.  [ایجاد مدل BIM]({{opSetting:base_url}}/projects/demo-bim-project): این پروژه نیز نقش‌ها، گردش‌کارها و بسته‌های کاری ارائه می‌کند، اما با تمرکز ویژه بر BIM.

                    _مراحل زیر را امتحان کنید:_

                    1.  _اعضای جدید را به پروژه دعوت کنید_: → در پیمایش پروژه به [اعضا]({{opSetting:base_url}}/projects/demo-construction-project/members) بروید.
                    2.  _کارهای پروژه‌ها را مشاهده کنید_: → در پیمایش پروژه به [بسته‌های کاری]({{opSetting:base_url}}/projects/demo-construction-project/work_packages?query_props=%7B%22c%22%3A%5B%22type%22%2C%22id%22%2C%22subject%22%2C%22status%22%2C%22assignee%22%2C%22priority%22%5D%2C%22hl%22%3A%22priority%22%2C%22hi%22%3Atrue%2C%22g%22%3A%22%22%2C%22t%22%3A%22startDate%3Aasc%22%2C%22f%22%3A%5B%7B%22n%22%3A%22bcfIssueAssociated%22%2C%22o%22%3A%22%3D%22%2C%22v%22%3A%5B%22f%22%5D%7D%5D%2C%22pa%22%3A1%2C%22pp%22%3A100%2C%22dr%22%3A%22list%22%7D) بروید.
                    3.  _یک بستهٔ کاری جدید ایجاد کنید_: → به [بسته‌های کاری → ایجاد]({{opSetting:base_url}}/projects/demo-construction-project/work_packages/new?query_props=%7B%22c%22%3A%5B%22type%22%2C%22id%22%2C%22subject%22%2C%22status%22%2C%22assignee%22%2C%22priority%22%5D%2C%22hl%22%3A%22priority%22%2C%22hi%22%3Atrue%2C%22g%22%3A%22%22%2C%22t%22%3A%22startDate%3Aasc%22%2C%22f%22%3A%5B%7B%22n%22%3A%22bcfIssueAssociated%22%2C%22o%22%3A%22%3D%22%2C%22v%22%3A%5B%22f%22%5D%7D%5D%2C%22pa%22%3A1%2C%22pp%22%3A100%2C%22dr%22%3A%22list%22%7D&type=11) بروید.
                    4.  _نمودار گانت را ایجاد و به‌روزرسانی کنید_: → در پیمایش پروژه به [نمودار گانت]({{opSetting:base_url}}/projects/demo-construction-project/work_packages?query_props=%7B%22c%22%3A%5B%22type%22%2C%22id%22%2C%22subject%22%2C%22assignee%22%2C%22responsible%22%5D%2C%22tv%22%3Atrue%2C%22tzl%22%3A%22weeks%22%2C%22hl%22%3A%22priority%22%2C%22hi%22%3Atrue%2C%22g%22%3A%22%22%2C%22t%22%3A%22startDate%3Aasc%22%2C%22f%22%3A%5B%5D%2C%22pa%22%3A1%2C%22pp%22%3A100%2C%22dr%22%3A%22list%22%7D) بروید.
                    5.  _ماژول‌های بیشتری فعال کنید_: → به [تنظیمات پروژه → ماژول‌ها]({{opSetting:base_url}}/projects/demo-construction-project/settings/modules) بروید.
                    6.  _برای مرور Issueهای BCF نمای کاشی را ببینید_: → به [بسته‌های کاری]({{opSetting:base_url}}/projects/demo-construction-project/work_packages?query_props=%7B%22c%22%3A%5B%22type%22%2C%22id%22%2C%22subject%22%2C%22status%22%2C%22assignee%22%2C%22priority%22%5D%2C%22hl%22%3A%22priority%22%2C%22hi%22%3Atrue%2C%22g%22%3A%22%22%2C%22t%22%3A%22id%3Aasc%22%2C%22f%22%3A%5B%5D%2C%22pa%22%3A1%2C%22pp%22%3A100%2C%22dr%22%3A%22card%22%7D) بروید.
                    7.  _به‌صورت Agile کار می‌کنید؟ بردهای جدید را امتحان کنید_: → به [بردها]({{opSetting:base_url}}/projects/demo-construction-project/boards) بروید.

