              item_1:
                options:
                  name: شروع کار
                  text: |
                    خوشحالیم که به ما پیوستید! برای شروع کار با OpenProject پیشنهاد می‌کنیم چند مورد را امتحان کنید.

                    این پروژهٔ نمایشی قابلیت‌های مدیریت BCF را نشان می‌دهد.

                    _مراحل پیشنهادی:_

                    1.  _اعضای جدید را به پروژه دعوت کنید:_ → در ناوبری پروژه به [اعضا]({{opSetting:base_url}}/projects/demo-bcf-management-project/members?show_add_members=true) بروید.
                    2.  _مدل‌های سه‌بعدی با فرمت IFC را بارگذاری و مشاهده کنید:_ → در ناوبری پروژه به [BCF]({{opSetting:base_url}}/projects/demo-bim-project/bcf) بروید.
                    3.  _Issueهای BCF متصل مستقیم به مدل IFC را ایجاد و مدیریت کنید:_ → به [BCF]({{opSetting:base_url}}/projects/demo-bim-project/bcf) → ایجاد بروید.
                    4.  _فایل‌های BCF پروژه را ببینید:_ → در ناوبری پروژه به [BCF]({{opSetting:base_url}}/projects/demo-bcf-management-project/work_packages?query_props=%7B%22c%22%3A%5B%22type%22%2C%22id%22%2C%22subject%22%2C%22status%22%2C%22assignee%22%2C%22priority%22%5D%2C%22hl%22%3A%22status%22%2C%22hi%22%3Atrue%2C%22g%22%3A%22%22%2C%22t%22%3A%22id%3Aasc%22%2C%22f%22%3A%5B%5D%2C%22pa%22%3A1%2C%22pp%22%3A100%2C%22dr%22%3A%22card%22%7D) بروید.
                    5.  _فایل‌های BCF را بارگذاری کنید:_ → به [BCF → Import.]({{opSetting:base_url}}/projects/demo-bcf-management-project/issues/upload) بروید.
                    6.  _نمودار گانت را ایجاد و به‌روزرسانی کنید:_ → در ناوبری پروژه به [نمودار گانت]({{opSetting:base_url}}/projects/demo-bcf-management-project/work_packages?query_props=%7B%22c%22%3A%5B%22id%22%2C%22subject%22%2C%22startDate%22%2C%22dueDate%22%5D%2C%22tv%22%3Atrue%2C%22tzl%22%3A%22days%22%2C%22hi%22%3Atrue%2C%22g%22%3A%22%22%2C%22t%22%3A%22startDate%3Aasc%22%2C%22f%22%3A%5B%7B%22n%22%3A%22status%22%2C%22o%22%3A%22o%22%2C%22v%22%3A%5B%5D%7D%5D%2C%22pa%22%3A1%2C%22pp%22%3A100%7D) بروید.
                    7.  _ماژول‌های بیشتری فعال کنید:_ → به [تنظیمات پروژه → ماژول‌ها.]({{opSetting:base_url}}/projects/demo-bcf-management-project/settings/modules) بروید.
                    8.  _روش Agile را دوست دارید؟ یک برد بسازید:_ → به [بردها]({{opSetting:base_url}}/projects/demo-bcf-management-project/boards) بروید.

                    [راهنمای کاربران](https://www.openproject.org/docs/user-guide/) را اینجا خواهید یافت.
                    اگر پرسش یا نیاز به پشتیبانی دارید با ما تماس بگیرید: [support\[at\]openproject.com](mailto:support@openproject.com).
