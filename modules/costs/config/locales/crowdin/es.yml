  setting_time_entries_prohibit_logging_for_past_months_caption: Restringe la adición, modificación y eliminación de entradas de tiempo al mes actual. El tiempo registrado en meses anteriores ya no se podrá modificar.
  setting_time_entries_prohibit_logging_on_non_working_days: No permitir el registro de tiempo en días no laborables
