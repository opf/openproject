  setting_time_entries_max_hours_per_day: Maximum number of hours per day
  setting_time_entries_max_hours_per_day_caption: Limits the total number of hours a user can log in a single day. A value of 0 means there are no restrictions.
  setting_time_entries_max_hours_per_entry: Maximum number of hours per time entry
  setting_time_entries_max_hours_per_entry_caption: Limits how many hours a single time entry can be. A value of 0 means there are no restrictions.
  setting_time_entries_past_month_grace_days: Grace period for past months
  setting_time_entries_past_month_grace_days_caption: Define the number of days a user has when a new month starts to log time entries for the past month. A value of 5 lets users log time for the previous month till the 5th of the current month. A value of 0 represents no grace period at all.
  setting_time_entries_prohibit_logging_for_past_months: Do not allow logging for past months
  setting_time_entries_prohibit_logging_for_past_months_caption: Restricts adding, changing and deleting time entries to the current month. Time that is logged in past months can no longer be modified.
  setting_time_entries_prohibit_logging_on_non_working_days: Do not allow logging time on non-working days
