  label_resource_management: Керування ресурсами
  permission_allocate_user_resources: Призначати ресурси користувачів
  permission_allocate_user_resources_explanation: Дозволяє користувачам створювати, оновлювати й видаляти виділення ресурсів у планувальнику ресурсів. Це, зокрема, стосується призначення користувачів (або фільтрів користувачів) планувальнику й коригування виділеного часу й діапазону дат.
  permission_assign_users_to_generic_allocations: Призначити користувачів для загальних виділень ресурсів
  permission_assign_users_to_generic_allocations_explanation: Дає змогу використовувати подання «Забезпечення кадрами», щоб призначати реальних користувачів для загальних (на основі фільтрів) виділень ресурсів, яким ще не призначено користувачів. Ця функція не дозволяє створювати або редагувати виділення.
  permission_manage_public_resource_planners: Керувати загальнодоступними планувальниками ресурсів
  permission_manage_public_resource_planners_explanation: Дає змогу користувачам створювати загальнодоступні планувальники ресурсів і керувати ними. Дозволяє їм переглядати, створювати й публікувати власні планувальники ресурсів, а також керувати ними. Не дозволяє переглядати планувальники ресурсів інших користувачів, які не є загальнодоступними.
  permission_view_resource_planners: Переглядати планувальники ресурсів
  permission_view_resource_planners_explanation: Дає змогу користувачам отримувати доступ до планувальників ресурсів. Дозволяє їм створювати власні планувальники ресурсів і керувати ними, а також переглядати загальнодоступні. Не дозволяє переглядати планувальники ресурсів інших користувачів, які не є загальнодоступними.
