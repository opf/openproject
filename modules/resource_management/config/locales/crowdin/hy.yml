  permission_allocate_user_resources_explanation: Թույլ է տալիս օգտատերերին ստեղծել, թարմացնել և ջնջել ռեսուրսների հատկացումները ռեսուրսների պլանավորիչի ներսում։ Սա ներառում է օգտատերերի (կամ օգտատերերի զտիչների) նշանակումը պլանավորիչին և հատկացված ժամանակի ու ամսաթվերի միջակայքի ճշգրտումը։
  permission_assign_users_to_generic_allocations: Նշանակել օգտատերերին ընդհանրական հատկացումներին
  permission_assign_users_to_generic_allocations_explanation: Թույլ է տալիս օգտատերերին օգտագործել Կադրերի համալրման տեսքը՝ իրական օգտատերերին նշանակելու այն ընդհանրական (զտիչի վրա հիմնված) ռեսուրսների հատկացումներին, որոնք դեռ օգտատեր չունեն։ Այն թույլ չի տալիս ստեղծել կամ խմբագրել հատկացումներ։
  permission_manage_public_resource_planners: Կառավարել հանրային ռեսուրսների պլանավորիչները
  permission_manage_public_resource_planners_explanation: Թույլ է տալիս օգտատերերին ստեղծել և կառավարել հանրային ռեսուրսների պլանավորիչներ։ Այն թույլ է տալիս նրանց դիտել, ստեղծել, կառավարել և հրապարակել իրենց սեփական ռեսուրսների պլանավորիչները։ Այն թույլ չի տալիս օգտատերերին դիտել այլ օգտատերերի ստեղծած ռեսուրսների պլանավորիչները, որոնք հանրորեն համօգտագործված չեն։
  permission_view_resource_planners: Դիտել ռեսուրսների պլանավորիչները
  permission_view_resource_planners_explanation: Թույլ է տալիս օգտատերերին հասանելիություն ունենալ ռեսուրսների պլանավորիչներին։ Այն թույլ է տալիս նրանց ստեղծել և կառավարել իրենց սեփական ռեսուրսների պլանավորիչները և դիտել հանրային ռեսուրսների պլանավորիչները։ Այն թույլ չի տալիս օգտատերերին դիտել այլ օգտատերերի ստեղծած ռեսուրսների պլանավորիչները, որոնք հանրորեն համօգտագործված չեն։
