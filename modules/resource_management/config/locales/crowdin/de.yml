        description: Planen und verteilen Sie die Arbeitsverteilung Ihres Teams mithilfe von Ressourcenplanern. Weisen Sie Mitarbeitern Arbeitspakete zu, verfolgen Sie die Kapazitäten im Zeitverlauf und erkennen Sie Über- und Unterauslastung auf einen Blick.
