  permission_assign_users_to_generic_allocations: 將使用者指派至通用配額
  permission_assign_users_to_generic_allocations_explanation: 允許使用者透過「人力配置」檢視，將實際使用者指派至尚未分配使用者的通用（基於篩選條件）資源配置。此功能不允許建立或編輯資源配置。
  permission_manage_public_resource_planners: 管理公共資源規劃人員
  permission_manage_public_resource_planners_explanation: 允許使用者建立和管理公開的資源規劃表。使用者可檢視、建立、管理及發佈自己的資源規劃表。但使用者無法檢視其他使用者建立且未公開分享的資源規劃表。
  permission_view_resource_planners: View resource planners
  permission_view_resource_planners_explanation: Allows users to access resource planners. It allows them to create and manage their own resource planners and view public resource planners. It does not allow users to view resource planners created by other users that are not shared publicly.
