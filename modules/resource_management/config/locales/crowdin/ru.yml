  label_resource_management: Управление ресурсами
  permission_allocate_user_resources: Распределение пользовательских ресурсов
  permission_allocate_user_resources_explanation: Позволяет пользователям создавать, обновлять и удалять распределение ресурсов в планировщике ресурсов. Сюда входит назначение пользователей (или фильтров) на планировщик и корректировка выделенного времени и диапазона дат.
  permission_assign_users_to_generic_allocations: Назначить пользователей общим распределением
  permission_assign_users_to_generic_allocations_explanation: Позволяет пользователям использовать режим штатного расписания для назначения реальных пользователей общим (основанным на фильтрах) распределением ресурсов, которые еще не имеют пользователя. Он не позволяет создавать или редактировать назначения.
  permission_manage_public_resource_planners: Управление общедоступными планировщиками ресурсов
  permission_manage_public_resource_planners_explanation: Позволяет пользователям создавать и управлять общедоступными планировщиками ресурсов. Это позволяет просматривать, создавать, управлять и публиковать свои собственные планировщики ресурсов. Он не позволяет пользователям просматривать планировщики ресурсов, созданные другими пользователями, которые не являются общедоступными.
  permission_view_resource_planners: Просмотр планировщиков ресурсов
  permission_view_resource_planners_explanation: Позволяет пользователям получить доступ к планировщику ресурсов. Это позволяет создавать и управлять своими собственными планировщиками ресурсов и просматривать общедоступные планировщики ресурсов. Он не позволяет пользователям просматривать планировщики ресурсов, созданные другими пользователями, которые не являются общедоступными.
