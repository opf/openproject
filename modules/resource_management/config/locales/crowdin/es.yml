        description: Planifica y equilibra la carga de trabajo de tu equipo con herramientas de planificación de recursos. Asigna personal a los paquetes de trabajo, haz un seguimiento de la capacidad a lo largo del tiempo y detecta de un vistazo si hay exceso o falta de asignación.
