    instructions:
      allowed_clock_drift: 'Допуск у секундах, що застосовується для перевірки часових міток у відповіді постачальника ідентифікаційних даних. Можна вказувати значення, менші за секунду. Застосовуйте цей параметр, лише якщо відомо, що годинники OpenProject і постачальника ідентифікаційних даних не синхронізовано. При цьому слід використовувати якомога менше значення (за умовчанням указано «0»).

        '
      authn_requests_signed: 'Якщо вибрано, OpenProject підписуватиме запити SAML AuthnRequest. Вам потрібно буде надати сертифікат підпису й закритий ключ за допомогою полів нижче.

        '
      certificate: 'Введіть сертифікат X509 у форматі PEM, за допомогою якого OpenProject підписує запити SAML.

        '
      digest_method: 'Виберіть алгоритм зведення, який використовуватиметься для підпису запиту X509, що виконується в OpenProject (за замовчуванням: %{default_option}).

        '
