        '
      request_uid: 'Χαρακτηριστικό SAML που θα ζητηθεί για το εσωτερικό ID χρήστη. Από προεπιλογή, θα χρησιμοποιηθεί το name_id για αυτό το πεδίο.

        '
      requested_attributes: 'Αυτά τα χαρακτηριστικά προστίθενται στο XML αιτήματος SAML για να επικοινωνήσουν στον πάροχο ταυτότητας ποια χαρακτηριστικά απαιτεί το OpenProject.

        '
      requested_format: 'Η μορφή του ζητούμενου χαρακτηριστικού. Χρησιμοποιείται για τον καθορισμό της μορφής του χαρακτηριστικού στο αίτημα SAML. Παρακαλούμε δείτε την [τεκμηρίωση σχετικά με τη διαμόρφωση ζητούμενων χαρακτηριστικών](docs_url) για περισσότερες πληροφορίες.

        '
      signature_method: 'Επιλέξτε τον αλγόριθμο υπογραφής που θα χρησιμοποιείται για την υπογραφή αιτημάτων SAML από το OpenProject (Προεπιλογή: %{default_option}).

        '
      sp_entity_id: 'Το ID οντότητας του παρόχου υπηρεσίας (SP). Μερικές φορές αναφέρεται και ως Audience. Αυτό είναι το μοναδικό αναγνωριστικό πελάτη της εγκατάστασης του OpenProject.

        '
      sp_metadata_endpoint: 'Αυτή είναι η διεύθυνση URL όπου είναι διαθέσιμα τα μεταδεδομένα SAML του OpenProject. Προαιρετικά, χρησιμοποιήστε την για να ρυθμίσετε τον πάροχο ταυτότητάς σας.

        '
      want_assertions_encrypted: 'Εάν ενεργοποιηθεί, απαιτείται από τον πάροχο ταυτότητας να κρυπτογραφεί την απόκριση ισχυρισμού χρησιμοποιώντας το ζεύγος πιστοποιητικών που παρέχετε.

        '
      want_assertions_signed: 'Εάν επιλεγεί, το OpenProject θα απαιτεί υπογεγραμμένες αποκρίσεις από τον πάροχο ταυτότητας χρησιμοποιώντας το δικό του ζεύγος κλειδιών-πιστοποιητικού. Το OpenProject θα επαληθεύει την υπογραφή με βάση το πιστοποιητικό από την ενότητα βασικής διαμόρφωσης.

        '
