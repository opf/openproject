  saml:
    delete_heading: Delete this SAML provider?
    delete_title: Διαγραφή παρόχου SAML
    info:
      description: 'Χρησιμοποιήστε αυτές τις παραμέτρους για να ρυθμίσετε τη σύνδεση του παρόχου ταυτότητας με το OpenProject.

        '
      title: Παράμετροι Διαμόρφωσης Πρωτοκόλλου SAML
    instructions:
      allowed_clock_drift: 'Tolerance in seconds applied when validating the timestamps of the identity provider response. Fractions of a second are accepted. Use this only if the clocks of OpenProject and the identity provider are known to be out of sync, and keep the value as low as possible (Default: 0).

        '
      authn_requests_signed: 'Εάν επιλεγεί, το OpenProject θα υπογράφει ψηφιακά το SAML AuthnRequest. Θα πρέπει να παρέχετε ένα πιστοποιητικό υπογραφής και ένα ιδιωτικό κλειδί χρησιμοποιώντας τα παρακάτω πεδία.

        '
      certificate: 'Εισαγάγετε το πιστοποιητικό X509 μορφής PEM που χρησιμοποιείται από το OpenProject για την υπογραφή αιτημάτων SAML.

        '
      digest_method: 'Επιλέξτε τον αλγόριθμο κατακερματισμού (digest) που θα χρησιμοποιείται για την υπογραφή αιτημάτων SAML από το OpenProject (Προεπιλογή: %{default_option}).

        '
      display_name: 'Το όνομα του παρόχου. Θα εμφανίζεται στο κουμπί σύνδεσης και στη λίστα παρόχων.

        '
      documentation_link: 'Παρακαλούμε ανατρέξτε στην [τεκμηρίωσή μας σχετικά με τη διαμόρφωση παρόχων SAML](docs_url) για περισσότερες πληροφορίες σχετικά με αυτές τις επιλογές.

        '
      icon: 'Προαιρετικά, παρέχετε ένα δημόσιο URL για ένα εικονίδιο που θα εμφανίζεται δίπλα στο όνομα του παρόχου.

        '
      idp_cert: 'Εισαγάγετε το δημόσιο πιστοποιητικό X509 μορφής PEM του παρόχου ταυτότητας. Μπορείτε να εισαγάγετε πολλαπλά πιστοποιητικά διαχωρίζοντάς τα με αλλαγή γραμμής.

        '
      idp_entity_id: 'Optional: Useful when the metadata URL points to a federation aggregate with a lot of entries. Enter the entity ID of your institution''s identity provider. Leave blank for single-entity metadata URLs.

        '
      idp_slo_service_url: 'Το URL του τερματικού σημείου αποσύνδεσης του παρόχου ταυτότητας.

        '
      idp_sso_service_url: 'Το URL του τερματικού σημείου σύνδεσης του παρόχου ταυτότητας.

        '
      limit_self_registration: 'Εάν ενεργοποιηθεί, οι χρήστες μπορούν να εγγραφούν μέσω αυτού του παρόχου μόνο εάν το επιτρέπουν οι ρυθμίσεις αυτο-εγγραφής.

        '
      mapping: 'Ρυθμίστε τη χαρτογράφηση μεταξύ της απόκρισης SAML και των χαρακτηριστικών χρήστη στο OpenProject. Μπορείτε να ορίσετε πολλαπλά ονόματα χαρακτηριστικών προς αναζήτηση. Το OpenProject θα επιλέξει το πρώτο διαθέσιμο χαρακτηριστικό από την απόκριση SAML.

        '
      mapping_firstname: 'Χαρακτηριστικά SAML από την απόκριση που χρησιμοποιούνται για το μικρό όνομα.

        '
