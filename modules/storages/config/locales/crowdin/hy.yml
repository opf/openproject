          nc_userless_access_denied: Կազմաձևված հավելվածի գաղտնաբառն անվավեր է։
          not_configured: Կապը չհաջողվեց վավերացնել։ Խնդրում ենք նախ ավարտել կազմաձևումը։
          od_client_cant_delete_folder: Հաճախորդը դժվարանում է պանակներ ջնջել։ Խնդրում ենք ստուգել Ձեր պահեստի կարգավորման փաստաթղթերը։
          od_client_write_permission_missing: Հաճախորդը, ըստ երևույթին, չունի գրառման թույլտվություններ։ Խնդրում ենք ստուգել Ձեր պահեստի կարգավորման փաստաթղթերը։
          od_drive_id_invalid: Կազմաձևված Drive ID-ն անվավեր է թվում։ Խնդրում ենք ստուգել կազմաձևումը։
          od_drive_id_not_found: Կազմաձևված Drive ID-ն չհաջողվեց գտնել։ Խնդրում ենք ստուգել կազմաձևումը։
          od_oauth_request_not_found: Ընթացիկ միացված օգտատիրոջը ստանալու վերջնակետը չի գտնվել։ Լրացուցիչ տեղեկությունների համար խնդրում ենք ստուգել սերվերի մատյանները։
          od_oauth_request_unauthorized: Ընթացիկ օգտատերը լիազորված չէ մուտք գործել հեռավոր նիշքերի պահեստ։ Լրացուցիչ տեղեկությունների համար խնդրում ենք ստուգել սերվերի մատյանները։
          od_oauth_token_missing: OpenProject-ը չի կարող ստուգել OneDrive-ի հետ օգտատիրոջ մակարդակի հաղորդակցությունը, քանի որ օգտատերը դեռ չի կապակցել իր Microsoft հաշիվը։
          od_tenant_id_wrong: Կազմաձևված Directory (tenant) ID-ն անվավեր է։ Խնդրում ենք ստուգել կազմաձևումը։
          od_test_folder_exists: Փորձարկման համար անհրաժեշտ %{folder_name} պանակն արդեն գոյություն ունի։ Խնդրում ենք ջնջել այն և կրկին փորձել։
          od_unexpected_content: Սկավառակում հայտնաբերվել է անսպասելի բովանդակություն։
          offline_access_scope_missing: Խորհուրդ է տրվում կազմաձևել OpenID Connect մատակարարը՝ offline_access շրջանակը հարցելու համար։ Ինտեգրացիան, այնուամենայնիվ, կարող է աշխատել, սակայն համոզվեք, որ թարմացման թոքենների ժամկետը չի լրանում։
          oidc_cant_refresh_token: Պահեստին Ձեր հասանելիությունը ստուգելիս սխալ առաջացավ։ Լրացուցիչ տեղեկությունների համար խնդրում ենք ստուգել սերվերի մատյանները։
          oidc_non_oidc_user: Ընթացիկ օգտատերը ստեղծված է, սակայն ոչ OpenID Connect (OIDC) ինքնության մատակարարի կողմից։ Խնդրում ենք կրկին գործարկել ստուգումը OIDC-ի կողմից ստեղծված օգտատիրոջ միջոցով։
          oidc_non_provisioned_user: Ընթացիկ օգտատերը ստեղծված չէ OpenID Connect ինքնության մատակարարի կողմից։ Խնդրում ենք կրկին գործարկել ստուգումը մատակարարի կողմից ստեղծված օգտատիրոջ միջոցով։
          oidc_provider_cant_exchange: OpenID Connect մատակարարը, ըստ երևույթին, չի աջակցում թոքենների փոխանակմանը, սակայն պահեստի համար կազմաձևվել է թոքենների փոխանակում։
          oidc_token_acquisition_failed: Ձեր OpenID Connect կարգավորումը չի տրամադրում անհրաժեշտ հասցեատերը, ինչպես նաև չունի թոքենների փոխանակման հնարավորություններ։ Լրացուցիչ տեղեկությունների համար խնդրում ենք դիտել մեր փաստաթղթերը։
          oidc_token_exchange_failed: Ձեր OpenID Connect մատակարարում Թոքենների փոխանակման կարգավորման հետ կապված, ըստ երևույթին, խնդիր կա։ Խնդրում ենք ստուգել դրա կազմաձևումը և կրկին փորձել։
          oidc_token_refresh_failed: Պահեստին Ձեր հասանելիությունը ստուգելիս սխալ առաջացավ։ Լրացուցիչ տեղեկությունների համար խնդրում ենք ստուգել սերվերի մատյանները։
          sp_client_cant_delete_folder: Հաճախորդը դժվարանում է SharePoint-ում պանակներ ջնջել։ Խնդրում ենք ստուգել Ձեր պահեստի կարգավորման փաստաթղթերը։
          sp_client_id_missing: SharePoint-ի համար կազմաձևված OAuth 2 հաճախորդի ID-ն բացակայում է։ Խնդրում ենք ստուգել կազմաձևումը։
          sp_client_secret_missing: SharePoint-ի համար կազմաձևված OAuth 2 հաճախորդի գաղտնիքը բացակայում է։ Խնդրում ենք ստուգել կազմաձևումը։
          sp_client_write_permission_missing: Հաճախորդը, ըստ երևույթին, SharePoint-ում չունի գրառման թույլտվություններ։ Խնդրում ենք ստուգել Ձեր պահեստի կարգավորման փաստաթղթերը։
          sp_existing_test_folder: Փորձարկման համար անհրաժեշտ %{folder_name} պանակն արդեն գոյություն ունի SharePoint-ում։ Խնդրում ենք ջնջել այն և կրկին փորձել։
          sp_oauth_request_error: Օգտատիրոջ անունից SharePoint-ին ուղղված հարցումը ձախողվեց։ Լրացուցիչ տեղեկությունների համար խնդրում ենք ստուգել սերվերի մատյանները։
