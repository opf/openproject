          nc_team_folder_not_found: پوشهٔ تیمی پیدا نشد.
          nc_unexpected_files: 'فایل‌های غیرمنتظره‌ای در پوشهٔ تیمی مدیریت‌شده پیدا شدند. برای نمونه: %{sample}'
          nc_unlinked_project_folders: هنوز همهٔ پوشه‌های پروژه ایجاد نشده‌اند (%{actual} / %{expected}). این وضعیت می‌تواند نشان‌دهندهٔ خطا در همگام‌سازی پس‌زمینهٔ AMPF باشد.
          nc_userless_access_denied: گذرواژهٔ برنامهٔ پیکربندی‌شده نامعتبر است.
          not_configured: اتصال قابل اعتبارسنجی نیست. لطفاً ابتدا پیکربندی را تکمیل کنید.
          od_client_cant_delete_folder: کلاینت در حذف پوشه‌ها مشکل دارد. لطفاً مستندات راه‌اندازی فضای ذخیره‌سازی را بررسی کنید.
          od_client_write_permission_missing: به نظر می‌رسد کلاینت مجوز نوشتن لازم را ندارد. لطفاً مستندات راه‌اندازی فضای ذخیره‌سازی را بررسی کنید.
          od_drive_id_invalid: شناسهٔ درایو پیکربندی‌شده نامعتبر به نظر می‌رسد. لطفاً پیکربندی را بررسی کنید.
          od_drive_id_not_found: شناسهٔ درایو پیکربندی‌شده پیدا نشد. لطفاً پیکربندی را بررسی کنید.
          od_oauth_request_not_found: نقطهٔ پایانی دریافت کاربر متصل فعلی پیدا نشد. برای اطلاعات بیشتر، گزارش‌های سرور را بررسی کنید.
          od_oauth_request_unauthorized: کاربر فعلی مجاز به دسترسی به فضای ذخیره‌سازی فایل راه‌دور نیست. برای اطلاعات بیشتر، گزارش‌های سرور را بررسی کنید.
          od_oauth_token_missing: اوپن‌پروجکت نمی‌تواند ارتباط در سطح کاربر با OneDrive را آزمایش کند، زیرا کاربر هنوز حساب Microsoft خود را متصل نکرده است.
          od_tenant_id_wrong: شناسهٔ Directory (tenant) پیکربندی‌شده نامعتبر است. لطفاً پیکربندی را بررسی کنید.
          od_test_folder_exists: پوشهٔ %{folder_name} که برای آزمایش لازم است از قبل وجود دارد. لطفاً آن را حذف کرده و دوباره تلاش کنید.
          od_unexpected_content: محتوای غیرمنتظره‌ای در درایو پیدا شد.
          offline_access_scope_missing: توصیه می‌شود ارائه‌دهندهٔ OpenID Connect را طوری پیکربندی کنید که scope مربوط به offline_access را درخواست کند. این یکپارچه‌سازی ممکن است همچنان کار کند، اما مطمئن شوید refresh tokenها منقضی نمی‌شوند.
          oidc_cant_refresh_token: هنگام بررسی دسترسی شما به فضای ذخیره‌سازی خطایی رخ داد. برای اطلاعات بیشتر، گزارش‌های سرور را بررسی کنید.
          oidc_non_oidc_user: کاربر فعلی با وجود provisionشدن، توسط یک ارائه‌دهندهٔ هویت OpenID Connect (OIDC) provision نشده است. بررسی را با یک کاربر provisionشده از طریق OIDC دوباره اجرا کنید.
          oidc_non_provisioned_user: کاربر فعلی توسط یک ارائه‌دهندهٔ هویت OpenID Connect ارائه نشده است. بررسی را با کاربری که از این طریق provision شده دوباره اجرا کنید.
          oidc_provider_cant_exchange: به نظر می‌رسد ارائه‌دهندهٔ OpenID Connect از مبادلهٔ توکن پشتیبانی نمی‌کند، اما برای فضای ذخیره‌سازی Token Exchange پیکربندی شده است.
          oidc_token_acquisition_failed: پیکربندی OpenID Connect شما audience لازم را ارائه نمی‌کند و قابلیت Token Exchange نیز ندارد. برای اطلاعات بیشتر، مستندات ما را بررسی کنید.
          oidc_token_exchange_failed: به نظر می‌رسد پیکربندی Token Exchange در ارائه‌دهندهٔ OpenID Connect مشکل دارد. لطفاً پیکربندی آن را بررسی کرده و دوباره تلاش کنید.
          oidc_token_refresh_failed: هنگام بررسی دسترسی شما به فضای ذخیره‌سازی خطایی رخ داد. برای اطلاعات بیشتر، گزارش‌های سرور را بررسی کنید.
          sp_client_cant_delete_folder: کلاینت در حذف پوشه‌ها در SharePoint مشکل دارد. لطفاً مستندات راه‌اندازی فضای ذخیره‌سازی را بررسی کنید.
          sp_client_id_missing: شناسهٔ کلاینت OAuth 2 برای SharePoint پیکربندی نشده است. لطفاً پیکربندی را بررسی کنید.
          sp_client_secret_missing: رمز کلاینت OAuth 2 برای SharePoint پیکربندی نشده است. لطفاً پیکربندی را بررسی کنید.
          sp_client_write_permission_missing: به نظر می‌رسد کلاینت مجوز نوشتن لازم را در SharePoint ندارد. لطفاً مستندات راه‌اندازی فضای ذخیره‌سازی را بررسی کنید.
          sp_existing_test_folder: پوشهٔ %{folder_name} که برای آزمایش لازم است از قبل در SharePoint وجود دارد. لطفاً آن را حذف کرده و دوباره تلاش کنید.
          sp_oauth_request_error: درخواست وابسته به کاربر به SharePoint ناموفق بود. برای اطلاعات بیشتر، گزارش‌های سرور را بررسی کنید.
          sp_oauth_request_unauthorized: کاربر فعلی مجاز به دسترسی به فضای ذخیره‌سازی فایل راه‌دور نیست. برای اطلاعات بیشتر، گزارش‌های سرور را بررسی کنید.
          sp_oauth_token_missing: اوپن‌پروجکت نمی‌تواند ارتباط در سطح کاربر با SharePoint را آزمایش کند، زیرا کاربر هنوز حساب SharePoint خود را متصل نکرده است.
          sp_tenant_id_missing: شناسهٔ Directory (tenant) برای SharePoint پیکربندی نشده است. لطفاً پیکربندی را بررسی کنید.
          sp_unexpected_content: محتوای غیرمنتظره‌ای در Document Library مربوط به SharePoint پیدا شد.
          unknown_error: اتصال قابل اعتبارسنجی نیست. خطای ناشناخته‌ای رخ داده است. برای اطلاعات بیشتر، گزارش‌های سرور را بررسی کنید.
