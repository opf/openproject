        URL Shortener.","content":"The sandbox is a part of your wiki that you can
        freely modify. It''s meant to let you practice editing. You will discover
        how page editing works and create new pages. Simply click on **Edit** to get
        started!\n\n{{info}}\nDon''t worry about overwriting or losing stuff when
        editing the page, you can always roll back to the first version of the page
        from the \"History\" tab at the bottom of the page.\n{{/info}}\n\nIf you want
        to give a look to the underlying [[XWiki Syntax>>XWiki.XWikiSyntax]], you
        can click on \"Wiki code\" in the \"Show\" menu or click on the \"Source\"
        tab when editing the page.\n\nHere are a number of test pages you can play
        with:\n\n* [[Sandbox Test Page 1>>Sandbox.TestPage1]]\n* [[Sandbox Test Page
        2>>Sandbox.TestPage2]]\n* [[Sandbox Test Page 3>>Sandbox.TestPage3]]\n\nBelow
        is a demonstration of the [[XWiki Syntax>>XWiki.XWikiSyntax]] you can use
        in wiki pages (headings, images, tables).\n\n== Headings ==\n\nXWiki offers
        6 levels of headings. You can use them to structure your pages.\n\n== Level
        2 Heading ==\n\n=== Level 3 Heading ===\n\n==== Level 4 Heading 4 ====\n\n=====
        Level 5 Heading 5 =====\n\n====== Level 6 Heading 6 ======\n\n{{info title=\"Accessibility
        recommendation\"}}\nIn order to provide the best experience for assistive
        technology users on your wiki, you should avoid using the first level of heading
        in page content.\n{{/info}}\n\n== Styles ==\n\nBasic styles are supported
        in XWiki:\n\n* **Text in Bold**\n* //Text in Italics//\n* __Text in Underline__\n*
        --Text in Strikethrough--\n* Text in ,,subscript,,\n* Text in ^^superscript^^\n\n==
        Lists ==\n\nYou can create various types of lists in your wiki pages:\n\n===
        Unordered list ===\n\n* Level 1\n** Level 2\n*** Level 3\n** Level 2\n* Level
        1\n\n=== Numbered list ===\n\n1. Item\n11. Subitem\n111. Item\n1. Subitem\n\n===
        Mixed list ===\n\n1. Item 1\n11. Item 2\n11*. Item 3\n11*. Item 4\n1. Item
        5\n\n== Tables ==\n\nYou can create tables right into wiki pages:\n\n=== Table
        with headers in the top row ===\n\n|= table header |= table header |= table
        header\n| cell | cell | cell\n| cell | cell | cell\n\n=== Table with headers
        in the top row and left column ===\n\n|= table header |= table header |= table
        header\n|= table header | cell | cell\n|= table header | cell | cell\n\n==
        Links ==\n\nXWiki allows you to create links to other pages in your wiki or
        on the web:\n\n* [[WebHome]] -> links to the homepage of the current space\n*
        [[Sandbox Home>>WebHome]] -> links can have labels\n* [[Wiki Home>>Main.WebHome]]
        -> a link can use the SpaceName.PageName format to link to a page located
        in another space\n* [[http://www.xwiki.org]] -> you can link to wiki pages
        or to external websites\n* [[XWiki.org Website>>http://www.xwiki.org]] ->
        link labels work for exernal links too\n\nYou can also create links to attachments:\n\nattach:XWikiLogo.png\n\n==
        Images ==\n\nYou can insert images in your wiki pages:\n\nimage:XWikiLogo.png\n\n==
        Macros ==\n\nMacros allow you to make wiki content look better and to add
        additional features to your wiki. Here are 2 examples of how macros can be
        used in wiki pages:\n\n=== Warning Macro ===\n\nThis macro allows you to draw
        users'' attention to a specific piece of information:\n\n{{warning}}\nHello
        World\n{{/warning}}\n\n=== Table of Contents ===\n\nThis macro automatically
